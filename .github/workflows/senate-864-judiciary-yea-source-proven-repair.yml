name: Issue 864 one Judiciary YEA source-proven correction
on:
  pull_request:
    paths:
      - .github/workflows/senate-864-judiciary-yea-source-proven-repair.yml
      - src/evidence/senate-864-judiciary-yea-repair.ts
      - scripts/deploy-senate-864-judiciary-yea.ts
      - scripts/verify-senate-864-judiciary-yea-originals.ts
      - tests/senate-864-judiciary-yea-repair.test.ts
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-864-judiciary-yea-source-proven-repair.yml
      - src/evidence/senate-864-judiciary-yea-repair.ts
      - scripts/deploy-senate-864-judiciary-yea.ts
      - scripts/verify-senate-864-judiciary-yea-originals.ts
      - tests/senate-864-judiciary-yea-repair.test.ts
permissions:
  contents: read
concurrency:
  group: senate864-exact-judiciary-yea-${{ github.sha }}
  cancel-in-progress: false
jobs:
  independent-keyless-verification:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: votepredict
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d votepredict"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/votepredict
      VOTEPREDICT_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/votepredict
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run db:migrate
      - run: npm run check
      - run: node --import tsx --test tests/senate-864-judiciary-yea-repair.test.ts
      - run: npm audit --omit=dev --audit-level=high
      - name: Independently reauthenticate exact Minutes, adopted office, 2024 name register and LRL full alias before credentials
        run: node --import tsx scripts/verify-senate-864-judiciary-yea-originals.ts
  protected-bounded-correction:
    needs: independent-keyless-verification
    if: >-
      needs.independent-keyless-verification.result == 'success' &&
      github.repository == 'killjoy00/votepredict' && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      github.event.repository.full_name == 'killjoy00/votepredict' &&
      github.event.after == github.sha && github.event.head_commit.id == github.sha &&
      github.event.forced != true && github.event.deleted != true &&
      contains(github.event.head_commit.message, 'SENATE864_JUDICIARY_ONE_YEA_REPAIR_20261019_V1')
    environment: evidence-readonly-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VOTEPREDICT_NEON_PROJECT_ID: ${{ vars.VOTEPREDICT_NEON_PROJECT_ID }}
      VOTEPREDICT_MEDIA_EXISTING_DATABASE: ${{ vars.VOTEPREDICT_MEDIA_EXISTING_DATABASE }}
      SENATE864_INDEPENDENT_MAIN: ${{ needs.independent-keyless-verification.result == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact independently verified main SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Fresh read-only preflight, bounded source-proven transaction, independent post-commit rollback/read-back
        run: node --import tsx scripts/deploy-senate-864-judiciary-yea.ts
