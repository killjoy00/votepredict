name: Patch analogue validation copy

on:
  push:
    branches:
      - eval/passage-validation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update measured analogue language
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = 'src/app/dashboard/forecast-workspace.tsx';
          let value = fs.readFileSync(path, 'utf8');
          const from = 'Quick mode combines historical member tendencies with direct member votes on as-of-safe historical analogues. Historical validation has not yet shown analogue lift.';
          const to = 'Quick mode combines historical member tendencies with direct member votes on as-of-safe historical analogues. Historical backtesting shows a small member-level lift from the analogue layer, but not validated passage-odds skill.';
          if (!value.includes(from)) throw new Error('Expected Quick-mode copy not found');
          value = value.replace(from, to);
          fs.writeFileSync(path, value);
          JS
      - name: Commit product copy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/dashboard/forecast-workspace.tsx
          git commit -m "ui: describe measured analogue lift accurately"
          git push origin HEAD:eval/passage-validation
