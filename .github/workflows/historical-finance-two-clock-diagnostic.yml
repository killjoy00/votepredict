name: "#514 historical finance two-clock diagnostic"

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: historical-finance-two-clock-diagnostic-514
  cancel-in-progress: true

jobs:
  diagnostic:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.number == 514 &&
        github.event.comment.user.login == 'killjoy00' &&
        startsWith(github.event.comment.body, '[historical-finance-two-clock-diagnostic]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j

    steps:
      - uses: actions/checkout@v7

      - name: Verify frozen two-clock plan and committee lineage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          plan='data/evaluation/historical-finance-two-clock-diagnostic-plan-v1.json'
          lineage='data/evaluation/quick-evidence-committee-rollcall-candidate-lineage-v1.json'

          test "$(jq -r '.schemaVersion' "$plan")" = 'historical-finance-two-clock-diagnostic-plan-v1'
          test "$(jq -r '.protocol.ridgeLambda' "$plan")" = '20'
          test "$(jq -r '.protocol.retuneAfterValidation' "$plan")" = 'false'
          test "$(jq -r '.clocks.publicAvailability.use' "$plan")" = 'strict historical as-of replay and claims about what a model could have known at the time'
          test "$(jq -r '.clocks.underlyingActivity.doesNotEstablishHistoricalObservability' "$plan")" = 'true'
          test "$(jq -r '.interpretation.strictLaneCanSupportHistoricalReplayClaims' "$plan")" = 'true'
          test "$(jq -r '.interpretation.retrospectiveActivityLaneCanSupportHistoricalReplayClaims' "$plan")" = 'false'
          test "$(jq -r '.interpretation.productionAction' "$plan")" = 'none'
          test "$(jq -r '.interpretation.evidenceWrites' "$plan")" = 'false'

          test "$(jq -r '.schemaVersion' "$lineage")" = 'quick-evidence-committee-rollcall-candidate-lineage-v1'
          run_id="$(jq -r '.extractionRunId' "$lineage")"
          artifact_name="$(jq -r '.candidateArtifact.name' "$lineage")"
          artifact_id="$(jq -r '.candidateArtifact.id' "$lineage")"
          expected_digest="$(jq -r '.candidateArtifact.digest' "$lineage")"
          expected_sha="$(jq -r '.extractionHeadSha' "$lineage")"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "$RUNNER_TEMP/committee-run.json"
          test "$(jq -r '.head_sha' "$RUNNER_TEMP/committee-run.json")" = "$expected_sha"
          test "$(jq -r '.conclusion' "$RUNNER_TEMP/committee-run.json")" = 'success'
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > "$RUNNER_TEMP/committee-artifacts.json"
          actual="$(jq -c --argjson id "$artifact_id" '.artifacts[] | select(.id == $id)' "$RUNNER_TEMP/committee-artifacts.json")"
          test -n "$actual"
          test "$(printf '%s' "$actual" | jq -r '.name')" = "$artifact_name"
          test "$(printf '%s' "$actual" | jq -r '.digest')" = "$expected_digest"
          test "$(printf '%s' "$actual" | jq -r '.expired')" = 'false'

          echo "committee_run_id=$run_id" >> "$GITHUB_ENV"
          echo "committee_artifact_name=$artifact_name" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-fund --no-audit

      - name: Run two-clock unit tests
        run: node --import tsx --test tests/historical-evidence-two-clock.test.ts

      - name: Download frozen committee feature corpus
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.committee_artifact_name }}
          path: inputs/committee
          github-token: ${{ github.token }}
          run-id: ${{ env.committee_run_id }}

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Run read-only two-clock finance diagnostic
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/evaluate-historical-finance-two-clock.ts             --committee-candidates inputs/committee/quick-evidence-committee-rollcall-candidates-v1.json             --committee-lineage data/evaluation/quick-evidence-committee-rollcall-candidate-lineage-v1.json             --output artifacts/historical-finance-two-clock/historical-finance-two-clock-diagnostic-v1.json

      - name: Verify two-clock artifact contract
        shell: bash
        run: |
          set -euo pipefail
          artifact='artifacts/historical-finance-two-clock/historical-finance-two-clock-diagnostic-v1.json'
          test -s "$artifact"
          test "$(jq -r '.schemaVersion' "$artifact")" = 'historical-finance-two-clock-diagnostic-v1'
          test "$(jq -r '.twoClockVersion' "$artifact")" = 'historical-evidence-two-clock-v1'
          test "$(jq -r '.clocks.strictAsOf.supportsHistoricalReplayClaims' "$artifact")" = 'true'
          test "$(jq -r '.clocks.retrospectiveActivity.supportsHistoricalReplayClaims' "$artifact")" = 'false'
          test "$(jq -r '.clocks.retrospectiveActivity.supportsRetrospectiveSignalLearning' "$artifact")" = 'true'
          test "$(jq -r '.productionAction' "$artifact")" = 'none'
          test "$(jq -r '.servingChanged' "$artifact")" = 'false'
          test "$(jq -r '.evidenceWrites' "$artifact")" = 'false'

      - name: Upload immutable two-clock diagnostic
        uses: actions/upload-artifact@v7
        with:
          name: historical-finance-two-clock-diagnostic-${{ github.sha }}
          path: artifacts/historical-finance-two-clock/historical-finance-two-clock-diagnostic-v1.json
          if-no-files-found: error
          retention-days: 90

      - name: Post completion marker
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 514 --repo "$GITHUB_REPOSITORY" --body "[historical-finance-two-clock-diagnostic-complete] Read-only two-clock diagnostic completed on $GITHUB_SHA. Strict public-as-of replay remains separate from retrospective transaction-date signal learning; canonical #459 and serving remain unchanged. Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Remove temporary credentials and lookups
        if: always()
        shell: bash
        run: |
          rm -f             "$RUNNER_TEMP/votepredict-production.env"             "$RUNNER_TEMP/vercel-pull.log"             "$RUNNER_TEMP/committee-run.json"             "$RUNNER_TEMP/committee-artifacts.json"
