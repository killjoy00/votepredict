name: Senate former-member archive backfill

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.event.issue.number == 514 && github.event.comment.user.login == 'killjoy00' && startsWith(github.event.comment.body, '[senate-former-member-archive-backfill]') && 'senate-former-member-archive-backfill' || format('senate-former-member-archive-backfill-skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  backfill:
    if: >-
      github.event.issue.number == 514 &&
      github.event.comment.user.login == 'killjoy00' &&
      startsWith(github.event.comment.body, '[senate-former-member-archive-backfill]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit
      - name: Resolve exact bounded Senate membership ids
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          ids="$(printf '%s\n' "$COMMENT_BODY" | sed -nE 's/.*membership-ids=([^[:space:]]+).*/\1/p' | head -n 1)"
          if [[ -z "$ids" ]]; then
            echo "membership-ids= is required" >&2
            exit 1
          fi
          IFS=',' read -r -a parts <<< "$ids"
          if (( ${#parts[@]} < 1 || ${#parts[@]} > 8 )); then
            echo "Provide one through eight exact membership UUIDs" >&2
            exit 1
          fi
          uuid_re='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          declare -A seen=()
          for id in "${parts[@]}"; do
            if [[ ! "$id" =~ $uuid_re ]]; then
              echo "Invalid membership UUID syntax" >&2
              exit 1
            fi
            lower="${id,,}"
            if [[ -n "${seen[$lower]:-}" ]]; then
              echo "Duplicate membership UUID" >&2
              exit 1
            fi
            seen[$lower]=1
          done
          echo "VOTEPREDICT_SENATE_FORMER_MEMBER_IDS=$ids" >> "$GITHUB_ENV"
      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1
      - name: Persist strictly verified former-member archive profiles
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/backfill-senate-former-member-archive.ts
      - name: Remove temporary credentials and logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env','vercel-pull.log']:
              Path(os.environ['RUNNER_TEMP'],name).unlink(missing_ok=True)
          PYTHON
