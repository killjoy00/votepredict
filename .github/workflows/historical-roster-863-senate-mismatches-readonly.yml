name: '#863 Senate 50 stored-tally mismatches (protected READ ONLY)'
on:
  pull_request:
    paths:
      - src/evaluation/historical-roster-863-senate-mismatches.ts
      - scripts/audit-historical-roster-863-senate-mismatches-readonly.ts
      - tests/historical-roster-863-senate-mismatches.test.ts
      - .github/workflows/historical-roster-863-senate-mismatches-readonly.yml
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: historical-roster-863-senate50-${{ github.sha }}
  cancel-in-progress: false
jobs:
  keyless-review:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict') ||
      (github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.run_attempt == 1 &&
        contains(github.event.head_commit.message, 'ROSTER_863_SENATE_50_ORIGINAL_AUDIT_V1_20261018')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Test read-only SQL bounds and sanitized source/tally categories
        run: |
          node --import tsx --test tests/historical-roster-863-senate-mismatches.test.ts
          node --import tsx scripts/audit-historical-roster-863-senate-mismatches-readonly.ts --preflight
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
  protected-readonly:
    needs: [keyless-review]
    if: >-
      needs.keyless-review.result == 'success' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, 'ROSTER_863_SENATE_50_ORIGINAL_AUDIT_V1_20261018')
    environment: evidence-readonly-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VOTEPREDICT_NEON_PROJECT_ID: ${{ vars.VOTEPREDICT_NEON_PROJECT_ID }}
      VOTEPREDICT_MEDIA_EXISTING_DATABASE: ${{ vars.VOTEPREDICT_MEDIA_EXISTING_DATABASE }}
      SENATE863_APPROVAL: 50_PUBLIC_SENATE_VOTE_TALLIES_READ_ONLY
      SENATE863_MAIN_CI_PASSED: ${{ needs.keyless-review.result == 'success' && 'true' || 'false' }}
      SENATE863_MARKER_PRESENT: ${{ contains(github.event.head_commit.message, 'ROSTER_863_SENATE_50_ORIGINAL_AUDIT_V1_20261018') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact reviewed main commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Query 50 Senate events from EXISTING Neon read-only and rollback
        run: node --import tsx scripts/audit-historical-roster-863-senate-mismatches-readonly.ts --protected
