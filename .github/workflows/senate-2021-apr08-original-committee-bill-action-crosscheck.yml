name: 2021 April 8 Senate committee bill-level action original source crosscheck

# Historical public source only: original Senate bill-log pages, SHA metadata.
# 2021 print minutes and individual motion dates remain unproved.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2021-apr08-original-committee-bill-action-crosscheck.yml

permissions:
  contents: read

jobs:
  authenticate-apr08-2021-committee-bill-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Acquire two real official 2021 Senate bill-log pages and crosscheck April 8 action
        run: |
          node --import tsx scripts/probe-senate-2021-apr08-official-bill-actions.ts \
            --output artifacts/2021-senate-apr08-committee-bill-actions/source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2021-apr08-bill-action-original-source-metadata
          path: artifacts/2021-senate-apr08-committee-bill-actions/source.json
          retention-days: 30
          if-no-files-found: error
