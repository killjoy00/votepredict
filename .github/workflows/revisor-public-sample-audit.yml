name: Revisor public sample audit
on:
  push:
    branches: [main, audit/revisor-public-samples]
    paths:
      - .github/workflows/revisor-public-sample-audit.yml
      - scripts/audit-revisor-public-samples.ts
      - scripts/probe-revisor-action-search.ts
      - src/sources/minnesota/revisor-actions.ts
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Probe Revisor action-search form values
        run: node --import tsx scripts/probe-revisor-action-search.ts
      - name: Audit official Revisor XML samples directly
        run: node --import tsx scripts/audit-revisor-public-samples.ts
