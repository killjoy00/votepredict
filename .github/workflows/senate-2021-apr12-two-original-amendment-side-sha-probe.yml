name: One-time original April12 SF1159 SF970 amendment side SHA discovery

# Original PDF, separately bounded. Side hashes are PROVISIONAL until an independently
# expected side SHA is literal-pinned and validated by a different strict original source job.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2021-apr12-two-original-amendment-side-sha-probe.yml

permissions:
  contents: read

jobs:
  two-original-april12-amendment-side-sha-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Independently fetch original 11MB PDF and verify distinct SF1159 4-6 and SF970 3-6 motions
        run: |
          node --import tsx scripts/probe-senate-2021-apr12-original-two-amendment-sides.ts \
            --output artifacts/senate-2021-apr12-original-two-amendments/provisional-sha.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2021-apr12-two-amendments-original-provisional-side-shas
          path: artifacts/senate-2021-apr12-original-two-amendments/provisional-sha.json
          retention-days: 30
          if-no-files-found: error
