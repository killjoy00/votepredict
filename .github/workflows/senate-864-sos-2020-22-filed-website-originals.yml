name: MN SoS historical 2020 and 2022 filed candidate website original export recovery
on:
  pull_request:
    paths:
      - data/evaluation/senate-864-official-sos-historical-filed-website-export-recovery-targets-v1.json
      - scripts/probe-senate-864-sos-historical-filing-export-originals.mjs
      - .github/workflows/senate-864-sos-2020-22-filed-website-originals.yml
permissions:
  contents: read
  actions: read
jobs:
  find-original-official-sos-filed-candidate-websites:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict' &&
      github.event.pull_request.head.ref == 'research/864-historical-sos-candidate-website-originals-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        election_year: [2020, 2022]
    name: Original SOS filing website col16 and 67 district winners — ${{ matrix.election_year }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: node --check scripts/probe-senate-864-sos-historical-filing-export-originals.mjs
      - run: npm ci --no-fund --no-audit
      - name: Independently reopen original actual-serving Senate directory and oath records
        uses: actions/download-artifact@v4
        with:
          run-id: 38094976711
          name: senate-2021-25-ever-served-only-source-coverage-v2
          github-token: ${{ github.token }}
          path: original/lrl
      - name: Independently reopen complete original 2020 and 2022 Secretary of State general result files
        uses: actions/download-artifact@v4
        with:
          run-id: 38089571113
          name: senate-2020-22-public-candidate-original-source-acquisition
          github-token: ${{ github.token }}
          path: original/sos
      - name: Probe official current candidate filing download paths and strict historical indexed originals
        shell: bash
        run: |
          set -euo pipefail
          gov="$(find original/lrl -type f -name mn-lrl-official-senate-service-directory.html -print -quit)"
          receipt="$(find original/lrl -type f -name mn-lrl-official-senate-service-directory-audit.json -print -quit)"
          swear="$(find original/lrl -type f -name mn-lrl-official-senate-special-swearing-history.html -print -quit)"
          sos2020="$(find original/sos -type f -name 2020-sos-general-stsenate.response -print -quit)"
          test -n "$gov" && test -n "$receipt" && test -n "$swear" && test -n "$sos2020"
          node --import tsx scripts/probe-senate-864-sos-historical-filing-export-originals.mjs \
            --election-year "${{ matrix.election_year }}" \
            --official-html "$gov" \
            --official-receipt "$receipt" \
            --official-special-swearing-html "$swear" \
            --sos-original-dir "$(dirname "$sos2020")" \
            --out-dir research/sanitized
      - name: Retain only sanitized original proof and candidate website metadata, NEVER raw address/phone/email filing files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: senate-864-sos-historical-website-export-${{ matrix.election_year }}-sanitized-v1
          path: research/sanitized/
          if-no-files-found: warn
          retention-days: 30
