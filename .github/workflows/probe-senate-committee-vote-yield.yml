name: Probe Senate committee vote yield

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.event.issue.number == 477 &&
      github.event.comment.user.login == 'killjoy00' &&
      startsWith(github.event.comment.body, '[senator-committee-vote-yield-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VOTEPREDICT_SENATE_COMMITTEE_PROBE_PER_YEAR: '8'
      VOTEPREDICT_SENATE_COMMITTEE_OCR: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit
      - name: Ensure OCR tools for scanned Senate minutes
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftoppm >/dev/null || ! command -v tesseract >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr
          fi
      - name: Probe vote-language and parser yield
        run: node --import tsx scripts/probe-senate-committee-vote-yield.ts
