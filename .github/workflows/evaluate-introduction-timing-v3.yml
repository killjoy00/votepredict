name: Deploy promoted v4 production once

on:
  push:
    branches: [ops/deploy-v4-production-once]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
    steps:
      - name: Checkout exact green main commit
        uses: actions/checkout@v7
        with:
          ref: f5d855bf669ac74a844b343ec248a6866b0f60bc
      - name: Require Vercel credentials
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN is unavailable. No deployment was attempted.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Deploy exact green commit with remote Vercel build
        shell: bash
        run: |
          url="$(npx --yes vercel@59.13.1 deploy --prod --yes --token "$VERCEL_TOKEN")"
          echo "Production deployment: $url"
