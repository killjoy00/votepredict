name: "#514 bounded CFB candidate-finance repair"

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      batch:
        description: Historical target batch to validate and repair
        required: true
        type: choice
        options:
          - historical-high-volume-1
          - historical-high-volume-2
          - historical-high-volume-3
          - historical-high-volume-4
          - historical-high-volume-5
          - historical-high-volume-6
          - historical-high-volume-7
          - historical-high-volume-8
          - historical-high-volume-9
          - historical-high-volume-10

permissions:
  contents: read

concurrency:
  group: cfb-candidate-finance-bounded-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 514 &&
        github.event.comment.user.login == 'killjoy00' &&
        startsWith(github.event.comment.body, '[cfb-candidate-finance-bounded-repair]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      VOTEPREDICT_CFB_CANDIDATE_FINANCE_BATCH_SIZE: '100'
      VOTEPREDICT_CFB_CANDIDATE_FINANCE_BATCH_REQUEST: ${{ github.event_name == 'workflow_dispatch' && format('batch={0}', inputs.batch) || github.event.comment.body }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit
      - name: Validate exact official covering-report proofs
        run: node --import tsx scripts/validate-cfb-candidate-report-history.ts
      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1
      - name: Repair only the validated requested batch
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/backfill-cfb-candidate-finance.ts
      - name: Remove temporary credentials and logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env','vercel-pull.log']:
              Path(os.environ['RUNNER_TEMP'],name).unlink(missing_ok=True)
          PYTHON
