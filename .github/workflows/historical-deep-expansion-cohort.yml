name: Historical Deep expansion cohort

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-deep-expansion-cohort
  cancel-in-progress: false

jobs:
  cohort:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      VOTEPREDICT_DEEP_EXPANSION_OUTPUT: artifacts/historical-deep-expansion-cohort.json
    steps:
      - uses: actions/checkout@v7
      - name: Require the existing Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'VERCEL_TOKEN is unavailable. No historical Deep expansion cohort was attempted.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Wait for this exact main SHA to be live in production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            http_code="$(curl \
              --silent \
              --show-error \
              --output "$RUNNER_TEMP/vercel-deployments.json" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=20&teamId=${VERCEL_ORG_ID}")"
            if [ "$http_code" != "200" ]; then
              echo "Vercel deployment lookup returned HTTP ${http_code}."
              exit 1
            fi
            match="$(jq -c --arg sha "$GITHUB_SHA" '[.deployments[]? | select(.target == "production" and .meta.githubCommitSha == $sha)] | first // empty' "$RUNNER_TEMP/vercel-deployments.json")"
            if [ -n "$match" ]; then
              state="$(printf '%s' "$match" | jq -r '.state // "UNKNOWN"')"
              if [ "$state" = "READY" ]; then
                echo "Exact main SHA ${GITHUB_SHA} is READY in production."
                exit 0
              fi
              if [ "$state" = "ERROR" ] || [ "$state" = "CANCELED" ]; then
                echo "Production deployment for ${GITHUB_SHA} entered ${state}."
                exit 1
              fi
            fi
            sleep 5
          done
          echo "Exact main SHA ${GITHUB_SHA} did not become READY before the cohort deadline."
          exit 1
      - name: Read production operation secret privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1; then
            echo 'Could not read the VotePredict production environment. No expansion cohort was run.'
            exit 1
          fi
      - name: Freeze outcome-blind archive expansion cohort
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/run-production-historical-deep-expansion-cohort.ts
      - name: Upload historical Deep expansion cohort
        uses: actions/upload-artifact@v4
        with:
          name: historical-deep-expansion-cohort-${{ github.sha }}
          path: artifacts/historical-deep-expansion-cohort.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary credentials and lookup files
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env', 'vercel-pull.log', 'vercel-deployments.json']:
              Path(os.environ['RUNNER_TEMP'], name).unlink(missing_ok=True)
          PYTHON
