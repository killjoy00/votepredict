name: Probe Senate floor caption attribution

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.event.issue.number == 477 &&
      github.event.comment.user.login == 'killjoy00' &&
      startsWith(github.event.comment.body, '[senator-floor-caption-attribution-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit
      - name: Probe floor-session caption attribution cues
        run: node --import tsx scripts/probe-senate-floor-caption-attribution.ts
