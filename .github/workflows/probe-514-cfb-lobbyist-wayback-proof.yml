name: "Probe #514 CFB lobbyist Wayback proof"

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'issue_comment' && (github.event.issue.number != 514 || github.event.comment.user.login != 'killjoy00' || !startsWith(github.event.comment.body, '[cfb-lobbyist-wayback-proof-probe]')) && format('probe-514-cfb-lobbyist-wayback-proof-skip-{0}', github.run_id) || 'probe-514-cfb-lobbyist-wayback-proof' }}
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 514 &&
        github.event.comment.user.login == 'killjoy00' &&
        startsWith(github.event.comment.body, '[cfb-lobbyist-wayback-proof-probe]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit
      - name: Probe exact archive captures for official lobbyist reports
        run: node --import tsx scripts/probe-cfb-lobbyist-wayback-proof.ts
