name: Issue 864 candidate website text as-of research validation
on:
  pull_request:
    paths:
      - .github/workflows/senate-864-campaign-website-asof-minimal.yml
      - src/evidence/senate-864-historical-site-excerpt-asof.mjs
      - src/evidence/senate-864-website-signal-neon.mjs
      - src/evidence/senate-864-website-signal-readback.mjs
      - scripts/ingest-senate-864-website-asof-neon.mjs
      - scripts/audit-senate-864-website-person-resolution.mjs
      - docs/evaluation/source-proof/senate-864-website-person-resolution-20261019.json
      - tests/senate-864-historical-site-excerpt-asof.test.mjs
      - tests/senate-864-website-signal-neon.test.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-864-campaign-website-asof-minimal.yml
      - src/evidence/senate-864-historical-site-excerpt-asof.mjs
      - src/evidence/senate-864-website-signal-neon.mjs
      - src/evidence/senate-864-website-signal-readback.mjs
      - scripts/ingest-senate-864-website-asof-neon.mjs
      - scripts/audit-senate-864-website-person-resolution.mjs
      - docs/evaluation/source-proof/senate-864-website-person-resolution-20261019.json
      - tests/senate-864-historical-site-excerpt-asof.test.mjs
      - tests/senate-864-website-signal-neon.test.mjs
permissions:
  contents: read
  actions: read
concurrency:
  group: senate-864-website-asof-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  keyless-research:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --check src/evidence/senate-864-historical-site-excerpt-asof.mjs
      - run: node --check src/evidence/senate-864-website-signal-neon.mjs
      - run: node --check scripts/ingest-senate-864-website-asof-neon.mjs
      - run: node --test tests/senate-864-historical-site-excerpt-asof.test.mjs tests/senate-864-website-signal-neon.test.mjs
      - run: node scripts/audit-senate-864-website-person-resolution.mjs --check
  # The completed fixed-v1 writer is opt-in on a reviewed main commit. Name
  # extraction fixes must not re-run archive acquisition or gain database access.
  independently-verified-main:
    needs: [keyless-research]
    if: >-
      needs.keyless-research.result == 'success' &&
      github.event_name == 'push' &&
      github.repository == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.repository.full_name == 'killjoy00/votepredict' &&
      github.event.after == github.sha &&
      github.event.head_commit.id == github.sha &&
      github.event.deleted != true &&
      github.event.forced != true &&
      contains(github.event.head_commit.message, 'SENATE_864_616_LITERAL_INGEST_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact approved main commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run check
      - name: Rehash all 72 original candidate pages and their independent CDX before any Neon secret
        run: node scripts/preflight-senate-864-72-original-pages-neon.mjs
  protected-neon-website-text:
    needs: [keyless-research, independently-verified-main]
    if: >-
      needs.keyless-research.result == 'success' &&
      needs.independently-verified-main.result == 'success' &&
      github.event_name == 'push' &&
      github.repository == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.repository.full_name == 'killjoy00/votepredict' &&
      github.event.after == github.sha &&
      github.event.head_commit.id == github.sha &&
      github.event.deleted != true &&
      github.event.forced != true &&
      contains(github.event.head_commit.message, 'SENATE_864_616_LITERAL_INGEST_V1')
    environment: evidence-readonly-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VOTEPREDICT_NEON_PROJECT_ID: ${{ vars.VOTEPREDICT_NEON_PROJECT_ID }}
      VOTEPREDICT_MEDIA_EXISTING_DATABASE: ${{ vars.VOTEPREDICT_MEDIA_EXISTING_DATABASE }}
      VOTEPREDICT_864_72_INDEPENDENT_CI: ${{ needs.independently-verified-main.result == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify approved main commit in secret-bearing runner
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Save dated literal website text to existing VotePredict Neon and read it back
        run: node --import tsx scripts/ingest-senate-864-website-asof-neon.mjs
