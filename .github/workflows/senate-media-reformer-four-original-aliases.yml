name: Public Senate media four Reformer original alias pairs

# #946 PUBLIC original 2021-25 HTML only. No raw publisher HTML/audio persisted.
on:
  pull_request:
    paths:
      - .github/workflows/senate-media-reformer-four-original-aliases.yml
      - src/evidence/senate-media-reformer-four-original-url-alias-proof.ts
      - scripts/audit-senate-media-reformer-four-historic-alias-pairs.ts
      - tests/senate-media-reformer-four-original-url-alias-proof.test.ts
      - docs/evaluation/senate-media-reformer-four-historical-brief-dated-alias-queue-20261011.json
      - docs/evaluation/senate-media-public-article-discovery-2021-25.json
      - docs/evaluation/senate-media-2021-25-exact-public-replay-receipts-20261010.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: senate-media-reformer-four-historic-public-url-aliases
  cancel-in-progress: false
jobs:
  exact-public-url-pair-archives:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict' &&
          github.event.pull_request.head.ref == 'research/media-historic-multiple-speakers-and-reformer-aliases-20261011')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Require BOTH exact public original URL historical bodies before path alias signal
        run: |
          node --import tsx scripts/audit-senate-media-reformer-four-historic-alias-pairs.ts \
            --output artifacts/senate-media-four-reformer-original-alias-pairs.json
      - name: Save URL and original indexed SHA metadata only
        uses: actions/upload-artifact@v6
        with:
          name: senate-media-four-reformer-historic-url-alias-proof
          path: artifacts/senate-media-four-reformer-original-alias-pairs.json
          if-no-files-found: error
          retention-days: 7
