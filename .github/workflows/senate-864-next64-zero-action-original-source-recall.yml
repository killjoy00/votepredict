name: '#864 next 64 zero-action originals: disjoint 96-document full SHA recall'
on:
  pull_request:
    paths:
      - src/evidence/senate-864-568-zero-action-original-triage.ts
      - scripts/audit-senate-864-568-zero-action-originals-sample.ts
      - tests/senate-864-568-zero-action-original-triage.test.ts
      - .github/workflows/senate-864-next64-zero-action-original-source-recall.yml
permissions:
  contents: read
  actions: read
jobs:
  original_sha_recall_after_first_32:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict'
    strategy:
      fail-fast: false
      matrix:
        year: [2022, 2023, 2024, 2025]
        mode: [ocr, embedded]
    runs-on: ubuntu-latest
    timeout-minutes: 27
    env:
      VOTEPREDICT_SENATE_COMMITTEE_OCR: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Prove 568 zero-action denominator, old 32 and new 64 samples disjoint
        run: |
          npx tsc --noEmit
          node --import tsx --test tests/senate-864-568-zero-action-original-triage.test.ts
      - name: Source-only OCR available for 207 initially low-text original PDF bodies
        run: |
          if ! command -v pdftoppm >/dev/null || ! command -v tesseract >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr
          fi
      - name: Independent 1592 meeting source-index original artifact byte SHA and immutable ZIP digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digest=$(gh api repos/killjoy00/votepredict/actions/artifacts/11776560365 --jq '.digest')
          test "$digest" = "sha256:f801aac6a68f6d57d12ea544548860a3f6f2e57b858035f8468068fce6007fe5"
      - name: Acquire independently authenticated 1592 original indexed Senate source SHA and parser ledger
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '11776560365'
          repository: killjoy00/votepredict
          run-id: 38314080633
          github-token: ${{ github.token }}
          path: artifacts/original
          merge-multiple: true
      - name: Recheck eight NEVER-BEFORE-REVIEWED original government PDFs; no source person or stored Neon access
        run: |
          node --import tsx scripts/audit-senate-864-568-zero-action-originals-sample.ts \
            --year ${{ matrix.year }} \
            --index-ledger artifacts/original/1592-official-meetings-to-source-action-candidates.json \
            --output artifacts/next64-original-motion-recall-${{ matrix.year }}-${{ matrix.mode }}.json \
            --mode ${{ matrix.mode }}
      - name: Save source byte SHA and original motion/roll/voice source candidate recall
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senate-864-next64-original-motion-recall-${{ matrix.year }}-${{ matrix.mode }}
          path: artifacts/next64-original-motion-recall-${{ matrix.year }}-${{ matrix.mode }}.json
          if-no-files-found: ignore
          retention-days: 30
