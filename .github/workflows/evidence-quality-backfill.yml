name: Evidence Quality v1 backfill

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum source documents to annotate
        required: false
        default: '12'
      source_kinds:
        description: Optional comma-separated Evidence Quality v1 source kinds
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: evidence-quality-v1-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 579 &&
        github.event.comment.user.login == 'killjoy00' &&
        (
          startsWith(github.event.comment.body, '[evidence-quality-backfill]') ||
          startsWith(github.event.comment.body, '[evidence-quality-canary]')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit
      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1
      - name: Require exact production migration ledger
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_REQUIRE_MIGRATION_LEDGER: '1'
        run: node --import tsx scripts/check-production-migration-drift.ts
      - name: Annotate bounded textual evidence batch
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_EVIDENCE_QUALITY_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || startsWith(github.event.comment.body, '[evidence-quality-canary]') && '1' || '12' }}
          VOTEPREDICT_EVIDENCE_QUALITY_SOURCE_KINDS: ${{ github.event_name == 'workflow_dispatch' && inputs.source_kinds || startsWith(github.event.comment.body, '[evidence-quality-canary]') && 'wayback_local_trade_news' || '' }}
        run: node --import tsx scripts/backfill-evidence-quality.ts
      - name: Remove temporary credentials and logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env','vercel-pull.log']:
              Path(os.environ['RUNNER_TEMP'],name).unlink(missing_ok=True)
          PYTHON
