name: Deploy prebuilt to Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-prebuilt-vercel.yml

permissions:
  contents: read

concurrency:
  group: prebuilt-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
    steps:
      - uses: actions/checkout@v7

      - name: Require Vercel deployment credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN is unavailable. No production deployment was attempted.'
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-fund --no-audit

      - name: Pull production configuration
        shell: bash
        run: |
          umask 077
          npx --yes vercel@59.13.1 pull --yes --environment=production --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Build production locally
        shell: bash
        run: npx --yes vercel@59.13.1 build --prod --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt production
        shell: bash
        run: |
          url=$(npx --yes vercel@59.13.1 deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "Production deployment: $url"

      - name: Remove pulled environment files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/vercel-pull.log"
          rm -f .vercel/.env.production.local
