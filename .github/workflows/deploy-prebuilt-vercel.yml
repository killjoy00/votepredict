name: Deploy prebuilt to Vercel

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/deploy-prebuilt-vercel.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-prebuilt-vercel.yml

permissions:
  contents: read

concurrency:
  group: prebuilt-vercel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Require Vercel deployment credentials
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo 'Required Vercel deployment credentials are unavailable.'
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-fund --no-audit

      - name: Pull preview configuration
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          umask 077
          npx --yes vercel@59.13.1 pull --yes --environment=preview --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Build preview locally
        if: github.event_name == 'pull_request'
        shell: bash
        run: npx --yes vercel@59.13.1 build --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt preview
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          url=$(npx --yes vercel@59.13.1 deploy --prebuilt --token "$VERCEL_TOKEN")
          echo "Preview deployment: $url"

      - name: Pull production configuration
        if: github.event_name == 'push'
        shell: bash
        run: |
          umask 077
          npx --yes vercel@59.13.1 pull --yes --environment=production --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Build production locally
        if: github.event_name == 'push'
        shell: bash
        run: npx --yes vercel@59.13.1 build --prod --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt production
        if: github.event_name == 'push'
        shell: bash
        run: |
          url=$(npx --yes vercel@59.13.1 deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "Production deployment: $url"

      - name: Remove pulled environment files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/vercel-pull.log"
          rm -f .vercel/.env.preview.local .vercel/.env.production.local
