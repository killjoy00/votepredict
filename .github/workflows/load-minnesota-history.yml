name: Evaluate historical baselines via loader identity

on:
  push:
    branches: [build/evaluation-harness]
    paths:
      - '.github/workflows/load-minnesota-history.yml'

permissions:
  contents: read
  id-token: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Lease primary Neon connection
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl --fail --show-error --silent --retry 3 --retry-all-errors \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=votepredict-neon-loader" | jq -r .value)"
          DATABASE_URL="$(curl --fail --show-error --silent --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            https://br-billowing-wave-aecfbwky-dblease.compute.c-2.us-east-2.aws.neon.tech/)"
          test -n "$DATABASE_URL"
          echo "::add-mask::$DATABASE_URL"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
      - name: Verify historical truth layer
        run: npm run data:history:audit -- --strict
      - name: Run baseline scorecard
        run: npm run --silent eval:baselines | tee baseline-results.json
      - name: Preserve scorecard artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseline-evaluation-loader-identity-${{ github.run_id }}
          path: baseline-results.json
          retention-days: 90
