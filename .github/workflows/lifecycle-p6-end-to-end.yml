name: Lifecycle P6 end-to-end

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifecycle-p6-end-to-end
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 310 &&
        github.event.comment.user.login == 'killjoy00' &&
        startsWith(github.event.comment.body, '[lifecycle-p6-end-to-end]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-fund --no-audit

      - name: Read production database environment privately
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo '::error::VERCEL_TOKEN is unavailable. Production database credentials were not read.'
            exit 1
          fi
          umask 077
          if ! npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1; then
            echo '::error::Could not read VotePredict production environment. No P6 evaluation was run.'
            exit 1
          fi

      - name: Evaluate lifecycle P6 end-to-end
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_P6_OUTPUT_DIR: artifacts/lifecycle-p6-end-to-end-v1
        run: node --import tsx scripts/evaluate-lifecycle-p6-end-to-end.ts

      - name: Upload lifecycle P6 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-p6-end-to-end-v1-${{ github.sha }}
          path: artifacts/lifecycle-p6-end-to-end-v1
          if-no-files-found: warn

      - name: Remove temporary credentials and logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env', 'vercel-pull.log']:
              Path(os.environ['RUNNER_TEMP'], name).unlink(missing_ok=True)
          PYTHON
