name: Issue 864 exact retained website metadata recovery
on:
  pull_request:
    paths: ['.github/workflows/senate-864-metadata-recovery.yml', 'src/evidence/senate-864-website-metadata-recovery.mjs', 'scripts/verify-senate-864-metadata-recovery.mjs', 'tests/senate-864-website-metadata-recovery.test.mjs', 'src/evidence/senate-864-website-recovered-plan.mjs', 'scripts/ingest-senate-864-recovered-websites.mjs', 'tests/senate-864-website-recovered-plan.test.mjs']
  push:
    branches: [main]
    paths: ['.github/workflows/senate-864-metadata-recovery.yml', 'src/evidence/senate-864-website-metadata-recovery.mjs', 'scripts/verify-senate-864-metadata-recovery.mjs', 'tests/senate-864-website-metadata-recovery.test.mjs', 'src/evidence/senate-864-website-recovered-plan.mjs', 'scripts/ingest-senate-864-recovered-websites.mjs', 'tests/senate-864-website-recovered-plan.test.mjs']
permissions:
  contents: read
  actions: read
jobs:
  independent-original-verification:
    outputs:
      receipt_sha: ${{ steps.receipt.outputs.sha }}
    if: github.repository == 'killjoy00/votepredict' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: node --import tsx --test tests/senate-864-website-metadata-recovery.test.mjs tests/senate-864-website-recovered-plan.test.mjs tests/senate-864-website-signal-neon.test.mjs
      - run: node scripts/verify-senate-864-metadata-recovery.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - id: receipt
        name: Commit exact independently verified public source receipt
        run: node --input-type=module -e "import{readFileSync,appendFileSync}from'node:fs';import{recoverySha,bindRecoveredPlan}from'./src/evidence/senate-864-website-recovered-plan.mjs';const b=readFileSync('artifacts/senate864-website-metadata-recovery.json');bindRecoveredPlan(JSON.parse(b),process.env.GITHUB_SHA);appendFileSync(process.env.GITHUB_OUTPUT,'sha='+recoverySha(b)+'\n');"
      - uses: actions/upload-artifact@v4
        with:
          name: senate864-website-metadata-recovery
          path: artifacts/senate864-website-metadata-recovery.json
          if-no-files-found: error
          retention-days: 14
  protected-bounded-append:
    needs: independent-original-verification
    if: >-
      needs.independent-original-verification.result == 'success' &&
      github.repository == 'killjoy00/votepredict' && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      github.event.repository.full_name == 'killjoy00/votepredict' &&
      github.event.after == github.sha && github.event.head_commit.id == github.sha &&
      github.event.forced != true && github.event.deleted != true &&
      contains(github.event.head_commit.message, 'SENATE864_WEBSITE_526_RETAINED_METADATA_APPEND_V1')
    environment: evidence-readonly-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VOTEPREDICT_NEON_PROJECT_ID: ${{ vars.VOTEPREDICT_NEON_PROJECT_ID }}
      VOTEPREDICT_MEDIA_EXISTING_DATABASE: ${{ vars.VOTEPREDICT_MEDIA_EXISTING_DATABASE }}
      SENATE864_INDEPENDENT_MAIN: ${{ needs.independent-original-verification.result == 'success' && 'true' || 'false' }}
      SENATE864_SOURCE_RECEIPT_SHA: ${{ needs.independent-original-verification.outputs.receipt_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact independently verified main commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - uses: actions/download-artifact@v4
        with:
          name: senate864-website-metadata-recovery
          path: artifacts
      - run: node --import tsx scripts/ingest-senate-864-recovered-websites.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: senate864-website526-executed
          path: artifacts/senate864-website526-executed.json
          if-no-files-found: error
          retention-days: 14
