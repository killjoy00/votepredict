name: Historical Deep expansion actionability audit

on:
  pull_request:
    paths:
      - .github/workflows/historical-deep-expansion-actionability-audit.yml
      - data/evaluation/historical-deep-expansion-actionability-audit-lineage-v1.json
      - scripts/audit-historical-deep-expansion-actionability.ts
      - src/evaluation/historical-deep-expansion-actionability-audit.ts
      - tests/historical-deep-expansion-actionability-audit.test.ts
  push:
    branches: [main]
    paths:
      - .github/workflows/historical-deep-expansion-actionability-audit.yml
      - data/evaluation/historical-deep-expansion-actionability-audit-lineage-v1.json
      - scripts/audit-historical-deep-expansion-actionability.ts
      - src/evaluation/historical-deep-expansion-actionability-audit.ts
      - tests/historical-deep-expansion-actionability-audit.test.ts
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: historical-deep-expansion-actionability-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Verify immutable upstream artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lineage='data/evaluation/historical-deep-expansion-actionability-audit-lineage-v1.json'
          for key in impactReplayArtifact mechanicsTaxonomyArtifact; do
            id="$(jq -r ".${key}.artifactId" "$lineage")"
            expected="sha256:$(jq -r ".${key}.artifactSha256" "$lineage")"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" > "$RUNNER_TEMP/${key}.json"
            test "$(jq -r '.expired' "$RUNNER_TEMP/${key}.json")" = 'false'
            test "$(jq -r '.digest' "$RUNNER_TEMP/${key}.json")" = "$expected"
          done
          echo "replay_run_id=$(jq -r '.impactReplayArtifact.workflowRunId' "$lineage")" >> "$GITHUB_ENV"
          echo "replay_name=$(jq -r '.impactReplayArtifact.artifactName' "$lineage")" >> "$GITHUB_ENV"
          echo "taxonomy_run_id=$(jq -r '.mechanicsTaxonomyArtifact.workflowRunId' "$lineage")" >> "$GITHUB_ENV"
          echo "taxonomy_name=$(jq -r '.mechanicsTaxonomyArtifact.artifactName' "$lineage")" >> "$GITHUB_ENV"
      - name: Download frozen parser-v2 impact replay
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.replay_run_id }}
          name: ${{ env.replay_name }}
          path: artifacts/frozen/replay
      - name: Download frozen outcome-blind mechanics taxonomy
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.taxonomy_run_id }}
          name: ${{ env.taxonomy_name }}
          path: artifacts/frozen/taxonomy
      - name: Verify safety boundary inputs
        shell: bash
        run: |
          set -euo pipefail
          replay='artifacts/frozen/replay/historical-deep-expansion-impact-replay-v2.json'
          taxonomy='artifacts/frozen/taxonomy/historical-deep-procedural-mechanics-v1.json'
          test "$(jq -r '.schemaVersion' "$replay")" = 'historical-deep-expansion-impact-replay-v2'
          test "$(jq -r '.metadata.candidateParser' "$replay")" = 'deterministic-house-committee-roll-call-v2'
          test "$(jq -r '.input.candidateObservations' "$replay")" = '212'
          test "$(jq -r '.input.decisiveMemberOutcomes' "$replay")" = '3133'
          test "$(jq -r '.schemaVersion' "$taxonomy")" = 'historical-deep-procedural-mechanics-v1'
          test "$(jq -r '.metadata.policy' "$taxonomy")" = 'mn-house-procedural-mechanics-v1'
          test "$(jq -r '.metadata.outcomeUse' "$taxonomy")" = 'none'
          test "$(jq -r '.metadata.probabilityAction' "$taxonomy")" = 'none'
          test "$(jq -r '.summary.observations' "$taxonomy")" = '212'
          test "$(jq '[.observations[] | select(.mechanicallyActionable != false or .finalPassageInference != "none")] | length' "$taxonomy")" = '0'
          test "$(jq '[.pairs[] | select(.mechanicallyActionable != false or .finalPassageInference != "none")] | length' "$taxonomy")" = '0'
      - name: Apply frozen actionability gate
        run: |
          node --import tsx scripts/audit-historical-deep-expansion-actionability.ts \
            artifacts/frozen/replay/historical-deep-expansion-impact-replay-v2.json \
            artifacts/frozen/taxonomy/historical-deep-procedural-mechanics-v1.json \
            artifacts/historical-deep-expansion-actionability-audit-v1.json
      - name: Verify gated result
        shell: bash
        run: |
          set -euo pipefail
          file='artifacts/historical-deep-expansion-actionability-audit-v1.json'
          test "$(jq -r '.schemaVersion' "$file")" = 'historical-deep-expansion-actionability-audit-v1'
          test "$(jq -r '.metadata.gatePolicy' "$file")" = 'frozen-mechanics-actionability-v1'
          test "$(jq -r '.summary.mechanicallyActionableObservations' "$file")" = '0'
          test "$(jq -r '.summary.blockedObservations' "$file")" = '212'
          test "$(jq -r '.summary.productionChange' "$file")" = 'false'
          test "$(jq -r '.scenarios["current-targets"].legacy.appliedEvidenceItems' "$file")" = '9'
          test "$(jq -r '.scenarios["need-only-targets"].legacy.appliedEvidenceItems' "$file")" = '8'
          test "$(jq -r '.scenarios["discovery-all"].legacy.appliedEvidenceItems' "$file")" = '103'
          for scenario in current-targets need-only-targets discovery-all; do
            test "$(jq -r ".scenarios[\"${scenario}\"].gated.appliedEvidenceItems" "$file")" = '0'
            test "$(jq -r ".scenarios[\"${scenario}\"].gated.changedMembers" "$file")" = '0'
            test "$(jq -r ".scenarios[\"${scenario}\"].gated.delta.brier" "$file")" = '0'
            test "$(jq -r ".scenarios[\"${scenario}\"].gated.delta.logLoss" "$file")" = '0'
          done
      - name: Upload immutable actionability audit
        uses: actions/upload-artifact@v4
        with:
          name: historical-deep-expansion-actionability-audit-v1-${{ github.sha }}
          path: artifacts/historical-deep-expansion-actionability-audit-v1.json
          if-no-files-found: error
          retention-days: 30
