name: Inventory 2021-22 P2 historical-density recovery

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  actions: read

concurrency:
  group: >-
    ${{ startsWith(github.event.comment.body, '[historical-density-p2-recovery-inventory]')
        && 'historical-density-p2-recovery-inventory'
        || format('historical-density-p2-recovery-inventory-skip-{0}', github.event.comment.id) }}
  cancel-in-progress: false

jobs:
  inventory:
    if: >-
      github.event.issue.number == 718 &&
      github.event.comment.user.login == 'killjoy00' &&
      startsWith(github.event.comment.body, '[historical-density-p2-recovery-inventory]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Materialize immutable historical target universe
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11252079484/zip > "$RUNNER_TEMP/historical-closeout.zip"
          echo "22e8944cffc6fda553b05ea6ad5e92400d35fc01d83177efdd5d1204dd3c5a6f  $RUNNER_TEMP/historical-closeout.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/historical-closeout"
          unzip -q "$RUNNER_TEMP/historical-closeout.zip" historical-as-of-matrix-v1.ndjson.gz -d "$RUNNER_TEMP/historical-closeout"
          python - <<'PYTHON'
          import gzip,json,os
          src=os.path.join(os.environ['RUNNER_TEMP'],'historical-closeout','historical-as-of-matrix-v1.ndjson.gz')
          dst=os.path.join(os.environ['RUNNER_TEMP'],'evidence-quality-target-universe-v1.ndjson')
          with gzip.open(src,'rt',encoding='utf-8') as fh, open(dst,'w',encoding='utf-8') as out:
              for line in fh:
                  row=json.loads(line)
                  target={k:row[k] for k in ['voteEventId','membershipId','session','chamber','occurredOn','billId','identifier']}
                  out.write(json.dumps(target,separators=(',',':'))+'\n')
          PYTHON

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Build read-only P2 recovery inventory
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_EQ_TARGET_UNIVERSE_PATH: ${{ runner.temp }}/evidence-quality-target-universe-v1.ndjson
          VOTEPREDICT_HISTORICAL_DENSITY_P2_OUTPUT_DIR: ${{ runner.temp }}/historical-density-p2-recovery-inventory
        run: node --import tsx scripts/audit-historical-density-p2-recovery-inventory.ts

      - name: Upload inventory artifact
        uses: actions/upload-artifact@v7
        with:
          name: historical-density-p2-recovery-inventory-v1
          path: ${{ runner.temp }}/historical-density-p2-recovery-inventory/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary credentials and frozen inputs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/votepredict-production.env" "$RUNNER_TEMP/vercel-pull.log" "$RUNNER_TEMP/historical-closeout.zip"
