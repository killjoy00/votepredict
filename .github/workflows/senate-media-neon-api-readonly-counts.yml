name: Senate media Neon one-key historical counts (protected read-only)

# #912: The owner's previous manual approvals were repeatedly blocked by
# integration bugs and a cancelled shared CI run. Preserve the manual fallback
# but execute exactly one specially marked main-branch revision using dedicated
# NON-CANCELLING verification, then the SAME protected READ ONLY count.
# No new roles, credentials, databases, Neon branches or raw-source artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_bounded_counts:
        description: Approve protected VotePredict default-branch READ ONLY SQL aggregate (no source export)
        required: true
        type: boolean
        default: false
      approval_phrase:
        description: Type VERIFY_SENATE_MEDIA_READONLY
        required: true
        type: string
        default: ''

permissions:
  contents: read

# This is deliberately distinct from the general CI concurrency group.
# Normal CI may be cancelled by later merges, but not this review's gate.
concurrency:
  group: senate-media-neon-protected-one-shot-${{ github.sha }}
  cancel-in-progress: false

jobs:
  one-shot-verify:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, 'SENATE_MEDIA_DEDICATED_ONE_SHOT_20261010_V2')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: votepredict
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d votepredict"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/votepredict
      VOTEPREDICT_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/votepredict
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Verify migrations from a clean disposable PostgreSQL database
        run: npm run db:migrate
      - name: Run the full repository check suite on this exact revision
        run: npm run check
      - run: npm audit --omit=dev --audit-level=high

  one-shot-readonly:
    needs: [one-shot-verify]
    if: >-
      needs.one-shot-verify.result == 'success' &&
      github.repository == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, 'SENATE_MEDIA_DEDICATED_ONE_SHOT_20261010_V2')
    environment: evidence-readonly-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VOTEPREDICT_NEON_PROJECT_ID: ${{ vars.VOTEPREDICT_NEON_PROJECT_ID }}
      VOTEPREDICT_MEDIA_EXISTING_DATABASE: ${{ vars.VOTEPREDICT_MEDIA_EXISTING_DATABASE }}
      VOTEPREDICT_MEDIA_APPROVAL: VERIFY_SENATE_MEDIA_READONLY
      VOTEPREDICT_MEDIA_AGGREGATE_APPROVAL: BOUNDED_AGGREGATE_ONLY
      VOTEPREDICT_MEDIA_DEDICATED_VERIFY_SUCCEEDED: ${{ needs.one-shot-verify.result == 'success' && 'true' || 'false' }}
      VOTEPREDICT_MEDIA_DEDICATED_ONE_SHOT_MARKER_MATCHED: ${{ contains(github.event.head_commit.message, 'SENATE_MEDIA_DEDICATED_ONE_SHOT_20261010_V2') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact verified commit, not a moving main ref
        env:
          REVIEWED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Only existing-project GETs and one PostgreSQL READ ONLY aggregate
        run: node --import tsx scripts/check-senate-media-neon-api-readonly.ts

  manual-readonly:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_bounded_counts == true &&
      inputs.approval_phrase == 'VERIFY_SENATE_MEDIA_READONLY'
    environment: evidence-readonly-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VOTEPREDICT_NEON_PROJECT_ID: ${{ vars.VOTEPREDICT_NEON_PROJECT_ID }}
      VOTEPREDICT_MEDIA_EXISTING_DATABASE: ${{ vars.VOTEPREDICT_MEDIA_EXISTING_DATABASE }}
      VOTEPREDICT_MEDIA_APPROVAL: ${{ inputs.approval_phrase }}
      VOTEPREDICT_MEDIA_AGGREGATE_APPROVAL: BOUNDED_AGGREGATE_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Only existing-project GETs and one PostgreSQL READ ONLY aggregate
        run: node --import tsx scripts/check-senate-media-neon-api-readonly.ts
