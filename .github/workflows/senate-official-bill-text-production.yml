name: Collect official Minnesota Senate raw bill-version and amendment text
run-name: "Official text raw ${{ github.event_name }} run #${{ github.run_number }}"

on:
  pull_request:
    paths:
      - migrations/0027_senate_official_bill_text_raw.sql
      - src/operations/senate-official-bill-text.ts
      - scripts/deploy-senate-official-bill-text-neon.ts
      - tests/senate-official-bill-text.test.ts
      - tests/senate-official-bill-text-migration-ledger.test.ts
      - src/operations/senate-official-bill-text-migration-ledger.ts
      - .github/workflows/senate-official-bill-text-production.yml
      - .github/workflows/senate-official-bill-text-watchdog.yml
      - scripts/senate-official-bill-text-watchdog.mjs
      - tests/senate-official-bill-text-watchdog.test.mjs
  push:
    branches: [main]
    paths:
      - migrations/0027_senate_official_bill_text_raw.sql
      - src/operations/senate-official-bill-text.ts
      - scripts/deploy-senate-official-bill-text-neon.ts
      - tests/senate-official-bill-text.test.ts
      - tests/senate-official-bill-text-migration-ledger.test.ts
      - src/operations/senate-official-bill-text-migration-ledger.ts
      - .github/workflows/senate-official-bill-text-production.yml
  # Incremental hourly backfill; independent watchdog recovers missed runs.
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Cancel only superseded, keyless PR checks. Protected main/Neon runs remain
# serialized and can never be cancelled by PR activity or a new main push.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('senate-official-bill-text-pr-{0}', github.event.pull_request.number) || 'senate-official-bill-text-neon-primary' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  keyless-review:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      github.event.repository.full_name == 'killjoy00/votepredict' &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'schedule' && github.event.schedule == '37 * * * *') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.event.after == github.sha &&
          github.event.head_commit.id == github.sha &&
          github.event.deleted != true &&
          github.event.forced != true &&
          contains(github.event.head_commit.message, 'SENATE_OFFICIAL_TEXT_RAW_20261016')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 85
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: votepredict
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d votepredict"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
      VOTEPREDICT_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact reviewed SHA
        env:
          CHECKED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CHECKED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Diagnose public Revisor access from keyless runner
        run: |
          node --import tsx --input-type=module <<'NODE'
          const url = 'https://www.revisor.mn.gov/bills/94/2025/0/SF/1/';
          try {
            const response = await fetch(url, {
              headers: {
                'User-Agent': 'VotePredict/2.0 official Senate raw bill text research',
                Accept: 'text/html,application/xhtml+xml;q=0.9',
              },
              signal: AbortSignal.timeout(20000),
            });
            const html = await response.text();
            let parsedLeadCount = null;
            let parserError = null;
            if (response.ok) {
              try {
                const { discoverOfficialVersionLeads } = await import('./src/operations/senate-official-bill-text.js');
                parsedLeadCount = discoverOfficialVersionLeads(html, response.url).length;
              } catch (error) {
                parserError = error instanceof Error ? error.message.slice(0,90) : 'unknown';
              }
            }
            const listingMarker = html.search(/\bBill\s+Text\s+Versions\b/i);
            const versionAnchorSummary = parserError ? [...html.matchAll(/<a\b([^>]*)>([\s\S]*?)<\/a>/gi)]
              .map(match => {
                const href = match[1].match(/\bhref\s*=\s*(["'])(.*?)\1/i)?.[2] ?? '';
                let locator = '';
                try {
                  const pathname = new URL(href, url).pathname;
                  locator = pathname.match(/(versions\/(?:\d+|ue\/\d+|ccr\/[a-z0-9]+)\/)$/i)?.[1] ?? '';
                } catch { /* non-URL link */ }
                return {
                  afterListing: (match.index ?? 0) >= listingMarker,
                  locator,
                  label: match[2].replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,55),
                };
              }).filter(item => item.locator).slice(0,12) : [];
            const result = {
              status: response.status,
              listingMarkerFound: listingMarker >= 0,
              versionAnchorSummary,
              finalHost: new URL(response.url).hostname,
              bytes: Buffer.byteLength(html),
              hasVersionHeading: /Bill Text Versions/i.test(html),
              parsedLeadCount,
              parserError,
              versionAnchorCount: (html.match(/href\s*=\s*["'][^"']*versions\/(?:\d+|ue\/\d+|ccr\/[a-z0-9]+)\//gi) ?? []).length,
              contentType: response.headers.get('content-type')?.slice(0,60) ?? null,
            };
            console.log('SENATE_REVISOR_PUBLIC_PROBE=' + JSON.stringify(result));
          } catch (error) {
            console.log('SENATE_REVISOR_PUBLIC_PROBE=' + JSON.stringify({
              failure: error instanceof Error ? error.name : 'unknown',
            }));
          }
          NODE
      - name: Apply all migrations to disposable Postgres
        run: npm run db:migrate
      - name: Check migration ledger on disposable Postgres
        run: node --import tsx scripts/check-production-migration-drift.ts
      - name: Run focused raw source and schema regressions
        run: |
          node --import tsx --test tests/senate-official-bill-text.test.ts
          node --import tsx --test tests/senate-official-bill-text-migration-ledger.test.ts
          node --test tests/senate-official-bill-text-watchdog.test.mjs
      - name: Typecheck, full tests and build
        run: npm run check
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  protected-neon:
    needs: [keyless-review]
    if: >-
      needs.keyless-review.result == 'success' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event.repository.full_name == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      (
        (github.event_name == 'schedule' && github.event.schedule == '37 * * * *') ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          github.event.after == github.sha &&
          github.event.head_commit.id == github.sha &&
          github.event.deleted != true &&
          github.event.forced != true &&
          contains(github.event.head_commit.message, 'SENATE_OFFICIAL_TEXT_RAW_20261016')
        )
      )
    environment: evidence-readonly-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 160
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VOTEPREDICT_NEON_PROJECT_ID: ${{ vars.VOTEPREDICT_NEON_PROJECT_ID }}
      VOTEPREDICT_MEDIA_EXISTING_DATABASE: ${{ vars.VOTEPREDICT_MEDIA_EXISTING_DATABASE }}
      VOTEPREDICT_SENATE_TEXT_INDEPENDENT_CI: ${{ needs.keyless-review.result == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact independently checked main SHA
        env:
          CHECKED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CHECKED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Apply bounded additive migration and collect resumable raw Senate text
        run: node --import tsx scripts/deploy-senate-official-bill-text-neon.ts
