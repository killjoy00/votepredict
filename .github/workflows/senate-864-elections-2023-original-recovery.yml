name: Issue 864 2023 Elections original Minutes guarded recovery
on:
  pull_request:
    paths:
      - .github/workflows/senate-864-elections-2023-original-recovery.yml
      - src/evidence/senate-864-elections-2023-original-recovery.mjs
      - scripts/deploy-senate-864-elections-2023-original-recovery.mjs
      - tests/senate-864-elections-2023-original-recovery.test.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-864-elections-2023-original-recovery.yml
      - src/evidence/senate-864-elections-2023-original-recovery.mjs
      - scripts/deploy-senate-864-elections-2023-original-recovery.mjs
      - tests/senate-864-elections-2023-original-recovery.test.mjs
permissions:
  contents: read
concurrency:
  group: senate864-elections-2023-original-${{ github.sha }}
  cancel-in-progress: false
jobs:
  independent-originals-and-tests:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: votepredict
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d votepredict" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/votepredict
      VOTEPREDICT_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/votepredict
      VOTEPREDICT_SENATE_COMMITTEE_OCR: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # These seven previously SHA-audited 2023 PDFs have embedded text; fail closed if OCR is unexpectedly required.
      - run: npm ci --no-fund --no-audit
      - run: npm run db:migrate
      - name: Refetch all seven SHA-pinned original 2023 Elections Minutes and verify eight selected motion-specific named rolls
        run: node --import tsx scripts/deploy-senate-864-elections-2023-original-recovery.mjs --source-only
      - run: npm run check
      - run: node --import tsx --test tests/senate-864-elections-2023-original-recovery.test.mjs
      - run: npm audit --omit=dev --audit-level=high
  protected-original-committee-correction:
    needs: independent-originals-and-tests
    if: >-
      needs.independent-originals-and-tests.result == 'success' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 && github.event.repository.full_name == 'killjoy00/votepredict' &&
      github.event.after == github.sha && github.event.head_commit.id == github.sha &&
      github.event.forced != true && github.event.deleted != true &&
      contains(github.event.head_commit.message, 'SENATE864_ELECTIONS_2023_ORIGINAL_GUARDED_V1')
    environment: evidence-readonly-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VOTEPREDICT_NEON_PROJECT_ID: ${{ vars.VOTEPREDICT_NEON_PROJECT_ID }}
      VOTEPREDICT_MEDIA_EXISTING_DATABASE: ${{ vars.VOTEPREDICT_MEDIA_EXISTING_DATABASE }}
      SENATE864_INDEPENDENT_MAIN: ${{ needs.independent-originals-and-tests.result == 'success' && 'true' || 'false' }}
      VOTEPREDICT_SENATE_COMMITTEE_OCR: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact reviewed main SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr
      - run: npm ci --no-fund --no-audit
      - name: Guarded source/database exact identity correction and independent post-write read-back
        run: node --import tsx scripts/deploy-senate-864-elections-2023-original-recovery.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: senate864-elections-2023-original-production-verified
          path: artifacts/senate864-elections-2023-production-readback.json
          if-no-files-found: error
          retention-days: 14
