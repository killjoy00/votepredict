name: Second original April12 SF1159 SF970 source-side SHA discovery after exact text hash correction

# First original acquisition #38172259470 stays a genuine failure (one SHA typo).
# Successful provisional side hashes are NOT final independently authenticated votes.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2021-apr12-two-original-amendment-side-sha-retry.yml

permissions:
  contents: read

jobs:
  genuine-second-april12-original-side-digest-run:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Fetch original April12 Senate Journal PDF and provisionally commit distinct original amendment named-side SHAs
        run: |
          node --import tsx scripts/probe-senate-2021-apr12-original-two-amendment-sides.ts \
            --output artifacts/senate-2021-apr12-original-two-amendments-retry/provisional-sha.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2021-apr12-two-amendments-original-provisional-side-shas-retry
          path: artifacts/senate-2021-apr12-original-two-amendments-retry/provisional-sha.json
          retention-days: 30
          if-no-files-found: error
