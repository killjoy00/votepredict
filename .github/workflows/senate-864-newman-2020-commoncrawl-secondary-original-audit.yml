name: Independently rehash 2020 Newman original Common Crawl WARC and prior Wayback campaign
on:
  pull_request:
    paths:
      - data/evaluation/senate-864-newman-2020-authenticated-original-commoncrawl-secondary-WARC-receipt-v1.json
      - scripts/audit-senate-864-newman-2020-original-commoncrawl-independent.mjs
      - .github/workflows/senate-864-newman-2020-commoncrawl-secondary-original-audit.yml
permissions:
  contents: read
  actions: read
jobs:
  independent-original-source-audit:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict' &&
      github.event.pull_request.head.ref == 'research/864-pre2020-22-commoncrawl-sos-original-crosscheck-20261012'
    name: Reopen exact Common Crawl raw WARC & CDXJ versus prior Wayback and 67 Senate SOS winners
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: node --check scripts/audit-senate-864-newman-2020-original-commoncrawl-independent.mjs
      - run: npm ci --no-fund --no-audit
      - name: Reopen original verified full LRL Senate service directory and special swearing
        uses: actions/download-artifact@v4
        with:
          run-id: 38094976711
          name: senate-2021-25-ever-served-only-source-coverage-v2
          github-token: ${{ github.token }}
          path: independent/official
      - name: Reopen exact official original 2020 Senate result and candidate lookup
        uses: actions/download-artifact@v4
        with:
          run-id: 38089571113
          name: senate-2020-22-public-candidate-original-source-acquisition
          github-token: ${{ github.token }}
          path: independent/sos
      - name: Reopen original all 95 serving Senators and 1285 selected website short quotes baseline
        uses: actions/download-artifact@v4
        with:
          run-id: 38261292249
          name: senate-864-five-thin-13-actual-2022-originals-1285-senator-site-excerpts-v1
          github-token: ${{ github.token }}
          path: independent/baseline
      - name: Reopen independently indexed actual 2020 Scott Newman original WARC gzip HTML and full CDXJ
        uses: actions/download-artifact@v4
        with:
          run-id: 38275506880
          name: senate-864-2020-22-commoncrawl-original-sos-newman-v1
          github-token: ${{ github.token }}
          path: independent/newman
      - name: Independent whole WARC/HTTP/CDXJ SHA1 and SHA256 source-date, official SOS/LRL and prior Wayback quote audit
        shell: bash
        run: |
          set -euo pipefail
          gov="$(find independent/official -type f -name mn-lrl-official-senate-service-directory.html -print -quit)"
          receipt="$(find independent/official -type f -name mn-lrl-official-senate-service-directory-audit.json -print -quit)"
          swear="$(find independent/official -type f -name mn-lrl-official-senate-special-swearing-history.html -print -quit)"
          sos2020="$(find independent/sos -type f -name 2020-sos-general-stsenate.response -print -quit)"
          base="$(find independent/baseline -type f -name senate-864-95-person-historical-candidate-issue-depth-1285.json -print -quit)"
          test -n "$gov" && test -n "$receipt" && test -n "$swear" && test -n "$sos2020" && test -n "$base"
          node --import tsx scripts/audit-senate-864-newman-2020-original-commoncrawl-independent.mjs \
            --official-html "$gov" \
            --official-receipt "$receipt" \
            --official-special-swearing-html "$swear" \
            --sos-original-dir "$(dirname "$sos2020")" \
            --1285-matrix-json "$base" \
            --newman-original-dir independent/newman \
            --out-dir verified
      - name: Retain compact independent proofs only; no copyrighted original source body
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: senate-864-newman-2020-cross-provider-complete-original-source-audit-v1
          path: verified/
          if-no-files-found: warn
          retention-days: 30
