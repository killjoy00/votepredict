name: One-time original 2021 Senate Journal SF910 committee roll retry (after p715 parser repair)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2021-rule1210-sf910-original-retry.yml

permissions:
  contents: read

jobs:
  authenticate-original-march8-sf910-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Genuine independent SF910 source retry - do not rewrite first source failure
        run: |
          node --import tsx scripts/review-senate-2021-rule1210-sf910-original-journal-committee.ts \
            --output artifacts/2021-senate-sf910-retry/original-sf910-committee-named-roll-retry.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2021-original-sf910-rule1210-retry
          path: artifacts/2021-senate-sf910-retry/original-sf910-committee-named-roll-retry.json
          retention-days: 30
          if-no-files-found: error
