name: Freeze reviewed 2025 House applicability

on:
  pull_request:
    paths:
      - data/evaluation/evidence-quality/historical-density-2025-house-applicability-decisions-v1.json
      - scripts/freeze-historical-density-2025-house-applicability-review.ts
      - tests/historical-density-2025-house-applicability-review.test.ts
      - .github/workflows/historical-density-2025-house-applicability-review.yml
  push:
    branches: [main]
    paths:
      - data/evaluation/evidence-quality/historical-density-2025-house-applicability-decisions-v1.json
      - scripts/freeze-historical-density-2025-house-applicability-review.ts
      - tests/historical-density-2025-house-applicability-review.test.ts
      - .github/workflows/historical-density-2025-house-applicability-review.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-2025-house-applicability-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Test checked-in applicability decision gate
        run: node --import tsx --test tests/historical-density-2025-house-applicability-review.test.ts

      - name: Materialize immutable candidate audit
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11450382467/zip > "$RUNNER_TEMP/candidate-audit.zip"
          echo "90c6b0eb156412e74ef6181d55c1c91690660ded4fbc8b281195078b2427118d  $RUNNER_TEMP/candidate-audit.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/candidate-audit"
          unzip -q "$RUNNER_TEMP/candidate-audit.zip" historical-density-2025-house-applicability-candidate-audit-v1.json -d "$RUNNER_TEMP/candidate-audit"

      - name: Freeze reviewed applicability gate
        env:
          VOTEPREDICT_2025_HOUSE_APPLICABILITY_AUDIT_PATH: ${{ runner.temp }}/candidate-audit/historical-density-2025-house-applicability-candidate-audit-v1.json
          VOTEPREDICT_2025_HOUSE_APPLICABILITY_DECISIONS_PATH: data/evaluation/evidence-quality/historical-density-2025-house-applicability-decisions-v1.json
          VOTEPREDICT_2025_HOUSE_APPLICABILITY_REVIEW_OUTPUT: ${{ runner.temp }}/applicability-review/historical-density-2025-house-applicability-review-v1.json
        run: node --import tsx scripts/freeze-historical-density-2025-house-applicability-review.ts

      - name: Verify reviewed boundary
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/applicability-review/historical-density-2025-house-applicability-review-v1.json"
          test "$(jq -r '.schemaVersion' "$f")" = historical-density-2025-house-applicability-review-v1
          test "$(jq -r '.issue' "$f")" = 718
          test "$(jq -r '.session' "$f")" = 2025-2026
          test "$(jq -r '.review.candidatePairs' "$f")" = 47
          test "$(jq -r '.review.candidateSemanticGroups' "$f")" = 19
          test "$(jq -r '.review.decisions.applicable' "$f")" = 0
          test "$(jq -r '.review.decisions.ambiguous_fail_closed' "$f")" = 0
          test "$(jq -r '.review.decisions.not_applicable' "$f")" = 47
          test "$(jq -r '.review.decisions.pending_review' "$f")" = 0
          test "$(jq -r '.review.finalPairStatusCounts.applicable' "$f")" = 0
          test "$(jq -r '.review.finalPairStatusCounts.ambiguous_fail_closed' "$f")" = 81
          test "$(jq -r '.review.finalPairStatusCounts.not_applicable' "$f")" = 964
          test "$(jq -r '.review.finalPairStatusCounts.pending_review' "$f")" = 0
          test "$(jq -r '.review.applicableRows' "$f")" = 0
          test "$(jq -r '.frozenInput.reviewKeySha256' "$f")" = 9e4b9247306c6e7314fe0105cbb741ea0977e25c4d4b347bf228f4cca75ff535
          test "$(jq -r '.policy.outcomeUse' "$f")" = none
          test "$(jq -r '.policy.targetVoteOutcomesRead' "$f")" = false
          test "$(jq -r '.policy.productionDatabaseQueried' "$f")" = false
          test "$(jq -r '.policy.productionWrites' "$f")" = false
          test "$(jq -r '.policy.vercelUsed' "$f")" = false
          test "$(jq -r '.policy.internalMembershipIdentityResolved' "$f")" = false
          test "$(jq -r '.policy.featureRowsWritten' "$f")" = false
          test "$(jq -r '.policy.modelFitting' "$f")" = none
          test "$(jq -r '.policy.servingChanged' "$f")" = false
          {
            echo '## 2025-26 House reviewed applicability'
            echo
            echo '- Candidate pairs reviewed: **47**'
            echo '- Applicable: **0**'
            echo '- Ambiguous/fail-closed among reviewed candidates: **0**'
            echo '- Not applicable: **47**'
            echo '- Full eligible-pair accounting: **0 applicable / 81 fail-closed / 964 not-applicable / 0 pending**'
            echo '- Feature rows added: **0**'
            echo '- Outcomes used: **none**'
            echo '- Production DB queried: **no**'
            echo '- Vercel used: **no**'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: historical-density-2025-house-applicability-review-v1
          path: ${{ runner.temp }}/applicability-review/*
          if-no-files-found: error
          retention-days: 90
