name: 2027 preseason public source checkpoint
on:
  pull_request:
    paths:
      - 'scripts/probe-2027-preseason-sources.ts'
      - '.github/workflows/2027-preseason-public-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'killjoy00/votepredict' && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/2027-preseason-public-probe')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Probe seven public source endpoints without credentials
        run: node --import tsx scripts/probe-2027-preseason-sources.ts
