name: Public MPR Hauschild later original transcript version provenance
on:
  pull_request:
    paths:
      - .github/workflows/senate-media-mpr-hauschild-later-originals.yml
      - scripts/probe-senate-media-mpr-episode-embeds.mjs
      - scripts/run-senate-media-mpr-hauschild-later-originals.mjs
      - tests/senate-media-mpr-hauschild-later-originals.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: senate-media-mpr-hauschild-later-originals
  cancel-in-progress: false

jobs:
  two-later-original-captures:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict' &&
          github.event.pull_request.head.ref == 'research/media-mpr-episode-original-embeds-20261011')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Offline later original page version tests
        run: node --test tests/senate-media-mpr-hauschild-later-originals.test.mjs
      - name: Exact CDX four version selection and at most next two post-earliest original HTTP replays
        run: |
          node scripts/run-senate-media-mpr-hauschild-later-originals.mjs \
            --output artifacts/senate-media-mpr-hauschild-later-historic-originals.json
      - name: Upload source digest timestamp and brief phrase statuses only
        uses: actions/upload-artifact@v6
        with:
          name: senate-media-mpr-hauschild-later-archived-original-version-cues
          path: artifacts/senate-media-mpr-hauschild-later-historic-originals.json
          if-no-files-found: error
          retention-days: 7