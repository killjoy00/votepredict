name: 2027 protected preseason evidence archive
on:
  pull_request:
    paths:
      - 'docs/evaluation/source-proof/2027-education-questionnaire-leads-20261127.json'
      - 'src/evidence/public-http.ts'
      - 'src/operations/2027-preseason*'
      - 'scripts/run-2027-preseason*'
      - 'tests/2027-preseason*'
      - '.github/workflows/2027-preseason-evidence-archive.yml'
  push:
    branches: [main]
    paths:
      - 'docs/evaluation/2027-preseason-archive-batch-requests.md'
      - 'docs/evaluation/source-proof/2027-education-questionnaire-leads-20261127.json'
      - 'src/evidence/public-http.ts'
      - 'src/operations/2027-preseason*'
      - 'scripts/run-2027-preseason*'
      - 'tests/2027-preseason*'
      - '.github/workflows/2027-preseason-evidence-archive.yml'
  workflow_dispatch:
    inputs:
      archive:
        description: Run one explicitly approved archive batch (default plan only)
        required: true
        type: boolean
        default: false
      archive_batch:
        description: Select exactly one reviewed 29-source tranche
        type: choice
        required: true
        default: initial
        options: [initial, pilot-1, pilot-2, pilot-3, education-1, education-2]
permissions:
  contents: read
  actions: read
concurrency:
  group: votepredict-2027-preseason-archive
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'killjoy00/votepredict'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: votepredict
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d votepredict"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
      VOTEPREDICT_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run db:migrate
      - run: npm run check
      - run: node --import tsx scripts/run-2027-preseason-existing-neon-archive.ts --plan
  archive:
    needs: verify
    if: >-
      needs.verify.result == 'success' && github.repository == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      ((github.event_name == 'workflow_dispatch' && inputs.archive == true) ||
      (github.event_name == 'push' && github.event.after == github.sha &&
      github.event.head_commit.id == github.sha && github.event.forced != true &&
      github.event.deleted != true &&
      contains(github.event.head_commit.message, 'VOTEPREDICT_PRESEASON_ORIGINAL_ARCHIVE_20261126')))
    environment: evidence-readonly-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Use existing protected Neon authentication for bounded archive-only writes
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          VOTEPREDICT_NEON_PROJECT_ID: ${{ vars.VOTEPREDICT_NEON_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          VOTEPREDICT_2027_PRESEASON_CI_VERIFIED: 'true'
        run: node --import tsx scripts/run-2027-preseason-existing-neon-archive.ts --archive
