name: Evaluate 2025 House replay gap 15 overlay

on:
  pull_request:
    paths:
      - scripts/evaluate-historical-density-2025-house-replay-gap15-overlay.ts
      - src/evaluation/historical-quick-replay.ts
      - .github/workflows/historical-density-2025-house-replay-gap15-overlay.yml
  push:
    branches: [main]
    paths:
      - scripts/evaluate-historical-density-2025-house-replay-gap15-overlay.ts
      - src/evaluation/historical-quick-replay.ts
      - .github/workflows/historical-density-2025-house-replay-gap15-overlay.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-2025-house-replay-gap15-overlay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-fund --no-audit

      - name: Materialize canonical Quick support
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11486621043/zip > "$RUNNER_TEMP/support.zip"
          echo "9c21df92e9ee8644570e90cd2586cc16c1e14bc0e0bae94a527a320516a21553  $RUNNER_TEMP/support.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/support"
          unzip -q "$RUNNER_TEMP/support.zip"             historical-density-2025-house-replay-gap16-support-manifest-v1.json             historical-density-2025-house-replay-gap16-support-snapshot-v1.json.gz             -d "$RUNNER_TEMP/support"

      - name: Materialize canonical historical matrix
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11252079484/zip > "$RUNNER_TEMP/historical-as-of.zip"
          echo "22e8944cffc6fda553b05ea6ad5e92400d35fc01d83177efdd5d1204dd3c5a6f  $RUNNER_TEMP/historical-as-of.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/historical-as-of"
          unzip -q "$RUNNER_TEMP/historical-as-of.zip" \
            historical-as-of-matrix-v1-manifest.json \
            historical-as-of-matrix-v1.ndjson.gz \
            -d "$RUNNER_TEMP/historical-as-of"

      - name: Materialize canonical explicit outcomes
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11483367972/zip > "$RUNNER_TEMP/outcomes.zip"
          echo "2415268dd0f3a0fb5cea4e03eb22e6e74ee1f1efdaa8ce4dd8b8ea743e8659ba  $RUNNER_TEMP/outcomes.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/outcomes"
          unzip -q "$RUNNER_TEMP/outcomes.zip"             historical-density-2025-house-replay-gap16-outcomes-v1.json             -d "$RUNNER_TEMP/outcomes"

      - name: Evaluate frozen 15-event overlay
        env:
          VOTEPREDICT_GAP16_SUPPORT_MANIFEST_PATH: ${{ runner.temp }}/support/historical-density-2025-house-replay-gap16-support-manifest-v1.json
          VOTEPREDICT_GAP16_SUPPORT_SNAPSHOT_PATH: ${{ runner.temp }}/support/historical-density-2025-house-replay-gap16-support-snapshot-v1.json.gz
          VOTEPREDICT_GAP16_OUTCOMES_PATH: ${{ runner.temp }}/outcomes/historical-density-2025-house-replay-gap16-outcomes-v1.json
          VOTEPREDICT_HISTORICAL_AS_OF_MANIFEST_PATH: ${{ runner.temp }}/historical-as-of/historical-as-of-matrix-v1-manifest.json
          VOTEPREDICT_HISTORICAL_AS_OF_MATRIX_PATH: ${{ runner.temp }}/historical-as-of/historical-as-of-matrix-v1.ndjson.gz
          VOTEPREDICT_GAP15_OVERLAY_OUTPUT: ${{ runner.temp }}/overlay/historical-density-2025-house-replay-gap15-overlay-v2.json
        run: node --import tsx scripts/evaluate-historical-density-2025-house-replay-gap15-overlay.ts

      - name: Verify overlay boundary
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/overlay/historical-density-2025-house-replay-gap15-overlay-v2.json"

          test "$(jq -r '.schemaVersion' "$f")" = historical-density-2025-house-replay-gap15-overlay-v2
          test "$(jq -r '.issue' "$f")" = 718
          test "$(jq -r '.replay.version' "$f")" = historical-quick-replay-v2
          test "$(jq -r '.replay.memberHistoryHalfLifeDays' "$f")" = 180

          test "$(jq -r '.frozenInputs.support.runId' "$f")" = 37631304120
          test "$(jq -r '.frozenInputs.support.artifactId' "$f")" = 11486621043
          test "$(jq -r '.frozenInputs.outcomes.runId' "$f")" = 37625127437
          test "$(jq -r '.frozenInputs.outcomes.artifactId' "$f")" = 11483367972

          test "$(jq -r '.reconstruction.supportTargetVersions' "$f")" = 1377
          test "$(jq -r '.reconstruction.supportAnalogueEvents' "$f")" = 1374
          test "$(jq -r '.reconstruction.frozenSupportSelectionsExact' "$f")" = true
          test "$(jq -r '.reconstruction.canonicalTargetsRebuilt' "$f")" = 1339
          test "$(jq -r '.reconstruction.canonicalTargetsChanged' "$f")" = false
          test "$(jq -r '.reconstruction.canonicalRowsWithOverlayPresent.canonicalRows' "$f")" = 135457
          test "$(jq -r '.reconstruction.canonicalRowsWithOverlayPresent.currentRows' "$f")" = 135457
          test "$(jq -r '.reconstruction.canonicalRowsWithOverlayPresent.canonicalRowKeySha256' "$f")" = 3aa47101f9e4a848e293fdaa89ef853919d49826b68ae90960370c5c19e9df72
          test "$(jq -r '.reconstruction.canonicalRowsWithOverlayPresent.currentRowKeySha256' "$f")" = 3aa47101f9e4a848e293fdaa89ef853919d49826b68ae90960370c5c19e9df72
          test "$(jq -r '.reconstruction.canonicalRowsWithOverlayPresent.missingRows' "$f")" = 0
          test "$(jq -r '.reconstruction.canonicalRowsWithOverlayPresent.extraRows' "$f")" = 0
          test "$(jq -r '.reconstruction.canonicalRowsWithOverlayPresent.fieldMismatches' "$f")" = 0

          test "$(jq -r '.overlay.frozenGapEvents' "$f")" = 16
          test "$(jq -r '.overlay.outcomeCompleteTargets' "$f")" = 15
          test "$(jq -r '.overlay.excludedFailClosed | join(",")' "$f")" = 'HF2354|2026-05-17'
          test "$(jq -r '.overlay.underlyingLoaderPassedWasNullForAllTargets' "$f")" = true
          test "$(jq -r '.overlay.targetVersionCoverage' "$f")" = 15
          test "$(jq -r '.overlay.analogueSupportCoverage' "$f")" = 15
          test "$(jq -r '.overlay.results' "$f")" = 15
          test "$(jq -r '.overlay.events | length' "$f")" = 15
          test "$(jq -r '.overlay.statusCounts.replayable' "$f")" = 15
          test "$(jq -r '.overlay.statusCounts | length' "$f")" = 1
          test "$(jq -r '.overlay.resultProofSha256' "$f")" = a89de23656cc3c2cfde31999703d54f60cbe86ab8bdee93962f8081d3331f2b4
          test "$(jq -r '.overlay.memberPredictionProofSha256' "$f")" = caf50b9ae2f07c2cfd0361554bb5440f11dec7b0b495c9b92768189b7cf41848
          test "$(jq -r '[.overlay.events[].memberPredictions | length] | add' "$f")" = 1990
          test "$(jq -r '[.overlay.events[].decisiveVoteRows | length] | add' "$f")" = 1991
          test "$(jq -r '.overlay.decisiveVoteRows' "$f")" = 1991
          test "$(jq -r '.overlay.decisiveVoteRowsWithoutPrediction' "$f")" = 1
          test "$(jq -r '.overlay.decisiveVotePredictionGapProofSha256' "$f")" = da18129bb7840d074681243601484797e7a45a74d20add3d4399b1fa6adc0b74
          test "$(jq -r '[.overlay.events[].decisiveVoteRowsWithoutPrediction | length] | add' "$f")" = 1
          test "$(jq -r '[.overlay.events[] | (.analogueSupport.selectedAnalogueIds | length) == .analogueSupport.selected] | all' "$f")" = true
          test "$(jq -r '[.overlay.events[] | (.analogueSupport.selectedAnalogues | length) == .analogueSupport.selected] | all' "$f")" = true
          test "$(jq -r '[.overlay.events[] | (.targetVersion.rawTextSha256 | length) == 64] | all' "$f")" = true
          test "$(jq -r '.comparison.existing2025HouseReplayCohort.events > 0' "$f")" = true
          test "$(jq -r '.scorecard.overall.memberObservations' "$f")" = 1990
          test "$(jq -r '.scorecard.overall.memberPredictions' "$f")" = 1990
          test "$(jq -r '.scorecard.overall.memberCoverage' "$f")" = 1
          test "$(jq -r '.scorecard.overall.memberAccuracy' "$f")" = 0.9698492462311558
          test "$(jq -r '.scorecard.overall.memberBrier' "$f")" = 0.03725407295423199
          test "$(jq -r '.scorecard.overall.memberLogLoss' "$f")" = 0.16242195623689934
          test "$(jq -r '.scorecard.overall.memberExpectedCalibrationError' "$f")" = 0.080291699115617
          test "$(jq -r '.scorecard.overall.chamberMeanAbsoluteYesError' "$f")" = 13.715526534958565

          test "$(jq -r '.policy.productionDatabaseQueried' "$f")" = false
          test "$(jq -r '.policy.productionWrites' "$f")" = false
          test "$(jq -r '.policy.vercelUsed' "$f")" = false
          test "$(jq -r '.policy.canonicalTargetSetMutated' "$f")" = false
          test "$(jq -r '.policy.canonicalRowsComparedToImmutableMatrix' "$f")" = true
          test "$(jq -r '.policy.canonicalRowsUnchangedWithOverlayPresent' "$f")" = true
          test "$(jq -r '.policy.frozenSupportOnly' "$f")" = true
          test "$(jq -r '.policy.frozenOutcomeLabelsOnly' "$f")" = true
          test "$(jq -r '.policy.unresolvedOutcomeExcluded' "$f")" = 'HF2354|2026-05-17'
          test "$(jq -r '.policy.modelFitting' "$f")" = none
          test "$(jq -r '.policy.featureRowsWritten' "$f")" = false
          test "$(jq -r '.policy.servingChanged' "$f")" = false

          {
            echo '## 2025-26 House replay-gap offline overlay'
            echo
            echo '- Frozen support reconstruction: **exact**'
            echo '- Canonical targets rebuilt: **1,339**'
            echo '- Canonical targets mutated: **no**'
            echo '- Canonical 135,457 rows changed with overlay present: **no**'
            echo '- Overlay targets: **15**'
            echo '- Fail-closed excluded: **HF2354 · 2026-05-17**'
            echo '- Replay status counts: `{"replayable":15}`'
            echo '- Member observations / predictions: **1,990 / 1,990**'
            echo '- Raw decisive vote rows: **1,991**'
            echo '- Raw decisive rows outside strict pre-vote membership cohort: **1**'
            echo '- Member coverage: **1.0**'
            echo '- Member accuracy: **0.9698492462311558**'
            echo '- Member Brier: **0.03725407295423199**'
            echo '- Member log loss: **0.16242195623689934**'
            echo '- Member ECE: **0.080291699115617**'
            echo '- Chamber mean absolute yes error: **13.715526534958565**'
            echo '- Passage Brier: **0.0006427345051755174**'
            echo '- Event result proof SHA: `a89de23656cc3c2cfde31999703d54f60cbe86ab8bdee93962f8081d3331f2b4`'
            echo '- Member prediction proof SHA: `caf50b9ae2f07c2cfd0361554bb5440f11dec7b0b495c9b92768189b7cf41848`'
            echo '- Production DB queried: **no**'
            echo '- Model fitting / serving changes: **none**'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: historical-density-2025-house-replay-gap15-overlay-v2
          path: ${{ runner.temp }}/overlay/*
          if-no-files-found: warn
          retention-days: 90
