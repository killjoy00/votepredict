name: Publish read-only Minnesota Senate evidence index view

on:
  pull_request:
    paths:
      - migrations/0032_senate_evidence_v.sql
      - tests/senate-evidence-view.test.ts
      - scripts/deploy-senate-evidence-view-neon.ts
      - docs/sources/senate-evidence-index.md
      - .github/workflows/senate-evidence-view-production.yml
  push:
    branches: [main]
    paths:
      - migrations/0032_senate_evidence_v.sql
      - tests/senate-evidence-view.test.ts
      - scripts/deploy-senate-evidence-view-neon.ts
      - docs/sources/senate-evidence-index.md
      - .github/workflows/senate-evidence-view-production.yml

permissions:
  contents: read

concurrency:
  group: senate-evidence-view-neon-production
  cancel-in-progress: false

jobs:
  pr-keyless:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: votepredict
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d votepredict"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
      VOTEPREDICT_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Apply all migrations to disposable Postgres and verify drift gate
        run: |
          npm run db:migrate
          node --import tsx scripts/check-production-migration-drift.ts
      - name: Focused evidence-view integration and guard tests
        run: node --import tsx --test tests/senate-evidence-view.test.ts
      - name: Full typecheck, tests and production build
        run: npm run check
      - name: Explicit full test suite a second time on the same database
        run: npm test

  independent-main:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event.repository.full_name == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.after == github.sha &&
      github.event.head_commit.id == github.sha &&
      github.event.deleted != true &&
      github.event.forced != true &&
      contains(github.event.head_commit.message, 'SENATE_EVIDENCE_VIEW_PRODUCTION')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: votepredict
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d votepredict"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
      VOTEPREDICT_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Match exact independently reviewed main SHA
        env:
          REVIEWED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Apply all migrations to disposable Postgres
        run: npm run db:migrate
      - name: Test exact migration drift gate
        run: node --import tsx scripts/check-production-migration-drift.ts
      - name: Full typecheck, tests and production build
        run: npm run check
      - name: Repeat complete test suite on same database
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  protected-production-neon:
    needs: [independent-main]
    if: >-
      needs.independent-main.result == 'success' &&
      github.event_name == 'push' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event.repository.full_name == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.after == github.sha &&
      github.event.head_commit.id == github.sha &&
      github.event.deleted != true &&
      github.event.forced != true &&
      contains(github.event.head_commit.message, 'SENATE_EVIDENCE_VIEW_PRODUCTION')
    environment: evidence-readonly-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VOTEPREDICT_NEON_PROJECT_ID: ${{ vars.VOTEPREDICT_NEON_PROJECT_ID }}
      VOTEPREDICT_MEDIA_EXISTING_DATABASE: ${{ vars.VOTEPREDICT_MEDIA_EXISTING_DATABASE }}
      VOTEPREDICT_SENATE_EVIDENCE_VIEW_INDEPENDENT_CI: ${{ needs.independent-main.result == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm exact marker-bearing main SHA
        env:
          REVIEWED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Preflight, ledger migration, drift gate, read-only evidence-count readback
        run: node --import tsx scripts/deploy-senate-evidence-view-neon.ts
