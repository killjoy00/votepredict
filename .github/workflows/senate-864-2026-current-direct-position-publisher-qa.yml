name: Senate 2026 current first-person bill evidence source verification
on:
  pull_request:
    paths:
      - data/evaluation/senate-864-2026-current-legislative-statements-v1.json
      - data/evidence/senate-864-2026-verified-direct-positions-v1.json
      - src/evidence/senate-864-2026-verified-positions.mjs
      - scripts/reconcile-senate-864-2026-verified-positions.mjs
      - tests/senate-864-2026-verified-direct-positions.test.mjs
      - tests/senate-864-2026-verified-direct-positions-regression.test.ts
      - data/evaluation/senate-864-2026-current-nonnominee-legislative-position-leads-v1.json
      - data/evaluation/senate-864-2026-current-publisher-whole-html-observation-receipts-v1.json
      - data/evaluation/senate-864-current-67-senator-public-position-coverage-v1.json
      - scripts/audit-senate-864-2026-current-direct-position-leads.mjs
      - scripts/audit-senate-864-2026-nonnominee-direct-position-leads.mjs
      - tests/senate-864-2026-nonnominee-direct-position-leads.test.mjs
      - tests/senate-864-2026-nonnominee-direct-position-regression.test.ts
      - tests/senate-864-2026-current-direct-position-leads.test.mjs
      - tests/senate-864-2026-current-direct-position-regression.test.ts
      - .github/workflows/senate-864-2026-current-direct-position-publisher-qa.yml
permissions:
  contents: read
jobs:
  original-publisher:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict' &&
      github.event.pull_request.head.ref == 'research/864-current-senator-specific-remarks-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Offline 67-person, 15-position, speaker attribution, and bill-number guards
        run: |
          node --check scripts/audit-senate-864-2026-current-direct-position-leads.mjs
          node --test tests/senate-864-2026-current-direct-position-leads.test.mjs
      - name: Offline 13 first-party original verifications, Oct 14 public-by and source-to-store dry-run guards
        run: |
          node --check src/evidence/senate-864-2026-verified-positions.mjs
          node --check scripts/reconcile-senate-864-2026-verified-positions.mjs
          node --test tests/senate-864-2026-verified-direct-positions.test.mjs
      - name: Public original publisher whole-HTML bytes and individually bounded quote presence
        run: |
          node scripts/audit-senate-864-2026-current-direct-position-leads.mjs \
            --out research/2026-current-speaker-publisher-source-receipts.json
      - name: Offline nonnominee 18-person search-coverage, personally attributed quote and chronology guards
        run: |
          node --check scripts/audit-senate-864-2026-nonnominee-direct-position-leads.mjs
          node --test tests/senate-864-2026-nonnominee-direct-position-leads.test.mjs
      - name: Strict public original publisher check for 15 personally attributed nonnominee senator leads
        run: |
          node scripts/audit-senate-864-2026-nonnominee-direct-position-leads.mjs \
            --out research/2026-current-nonnominee-quote-source-receipts.json
      - name: Keep only exact current source-byte hashes and categorical provenance checks
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: senate-864-current-2026-public-direct-source-qa
          path: |
            research/2026-current-speaker-publisher-source-receipts.json
            research/2026-current-nonnominee-quote-source-receipts.json
          if-no-files-found: warn
          retention-days: 14
