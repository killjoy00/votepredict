name: Historical Deep House Journal holdout score

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/historical-deep-house-journal-holdout-score.yml
      - data/evaluation/historical-deep-house-journal-holdout-score-lineage-v1.json
      - data/evaluation/historical-deep-house-journal-holdout-plan-v1.json
      - scripts/run-production-historical-deep-house-journal-holdout-score.ts
      - src/app/api/operations/historical-deep-house-journal-holdout-score/route.ts
      - src/evaluation/historical-deep-house-journal-holdout-score.ts
      - src/evaluation/historical-deep-house-journal-holdout-cohort.ts
      - src/evaluation/historical-deep-house-journal-holdout-mechanics.ts
      - src/evaluation/historical-deep-expansion-discovery.ts
      - tests/historical-deep-house-journal-holdout-score.test.ts

permissions:
  actions: read
  contents: read

concurrency:
  group: historical-deep-house-journal-holdout-score-v1
  cancel-in-progress: false

jobs:
  score:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      VOTEPREDICT_HOUSE_JOURNAL_HOLDOUT_SCORE_COHORT: artifacts/frozen/holdout-cohort/historical-deep-house-journal-holdout-cohort-v1.json
      VOTEPREDICT_HOUSE_JOURNAL_HOLDOUT_SCORE_MECHANICS: artifacts/frozen/holdout-mechanics/historical-deep-house-journal-holdout-mechanics-v1.json
      VOTEPREDICT_HOUSE_JOURNAL_HOLDOUT_SCORE_PLAN: data/evaluation/historical-deep-house-journal-holdout-plan-v1.json
      VOTEPREDICT_HOUSE_JOURNAL_HOLDOUT_SCORE_LINEAGE: data/evaluation/historical-deep-house-journal-holdout-score-lineage-v1.json
      VOTEPREDICT_HOUSE_JOURNAL_HOLDOUT_SCORE_OUTPUT: artifacts/historical-deep-house-journal-holdout-score-v1.json
    steps:
      - uses: actions/checkout@v7
      - name: Verify frozen pre-reveal lineage and run-once boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lineage='data/evaluation/historical-deep-house-journal-holdout-score-lineage-v1.json'
          test "$(jq -r '.schemaVersion' "$lineage")" = 'historical-deep-house-journal-holdout-score-lineage-v1'
          test "$(jq -r '.policy.evaluation' "$lineage")" = 'predeclared-house-journal-holdout-replication-v1'
          test "$(jq -r '.policy.outcomeUse' "$lineage")" = 'single-post-freeze-holdout-reveal'
          test "$(jq -r '.policy.probabilityAction' "$lineage")" = 'none'
          test "$(jq -r '.policy.actionabilityDecision' "$lineage")" = 'none'

          plan_file="$(jq -r '.holdoutPlan.sourceFile' "$lineage")"
          expected_plan_blob="$(jq -r '.holdoutPlan.sourceFileBlobSha' "$lineage")"
          test "$(git rev-parse "HEAD:${plan_file}")" = "$expected_plan_blob"
          test "$(jq -r '.schemaVersion' "$plan_file")" = 'historical-deep-house-journal-holdout-plan-v1'
          test "$(jq -r '.primaryHypotheses | length' "$plan_file")" = '3'
          test "$(jq -r '.primaryHypotheses[0].id' "$plan_file")" = 'H1-final-passage-stage-positive-residual'
          test "$(jq -r '.primaryHypotheses[1].id' "$plan_file")" = 'H2-calendar-designation-negative-residual'
          test "$(jq -r '.primaryHypotheses[2].id' "$plan_file")" = 'H3-companion-substitution-positive-residual'
          test "$(jq '[.primaryHypotheses[] | select(.replicationMinimumCases != 5 or .replicationMinimumDecisiveMemberOutcomes != 400 or .minimumAbsoluteMemberWeightedResidual != 0.02)] | length' "$plan_file")" = '0'

          existing="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and (.name | startswith("historical-deep-house-journal-holdout-score-v1-")))] | length')"
          if [ "$existing" != '0' ]; then
            echo "A frozen holdout-score artifact already exists; refusing a second outcome reveal."
            exit 1
          fi

          for kind in cohort mechanics; do
            artifact_id="$(jq -r ".${kind}Artifact.artifactId" "$lineage")"
            expected="sha256:$(jq -r ".${kind}Artifact.artifactSha256" "$lineage")"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" > "$RUNNER_TEMP/${kind}-artifact.json"
            test "$(jq -r '.expired' "$RUNNER_TEMP/${kind}-artifact.json")" = 'false'
            test "$(jq -r '.digest' "$RUNNER_TEMP/${kind}-artifact.json")" = "$expected"
            echo "${kind}_run_id=$(jq -r ".${kind}Artifact.workflowRunId" "$lineage")" >> "$GITHUB_ENV"
            echo "${kind}_artifact_name=$(jq -r ".${kind}Artifact.artifactName" "$lineage")" >> "$GITHUB_ENV"
          done
      - name: Download immutable holdout cohort
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.cohort_run_id }}
          name: ${{ env.cohort_artifact_name }}
          path: artifacts/frozen/holdout-cohort
      - name: Download immutable holdout mechanics
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.mechanics_run_id }}
          name: ${{ env.mechanics_artifact_name }}
          path: artifacts/frozen/holdout-mechanics
      - name: Verify outcome-blind inputs before reveal
        shell: bash
        run: |
          set -euo pipefail
          cohort="$VOTEPREDICT_HOUSE_JOURNAL_HOLDOUT_SCORE_COHORT"
          mechanics="$VOTEPREDICT_HOUSE_JOURNAL_HOLDOUT_SCORE_MECHANICS"
          test "$(jq -r '.schemaVersion' "$cohort")" = 'historical-deep-house-journal-holdout-cohort-v1'
          test "$(jq '.cases | length' "$cohort")" = '24'
          test "$(jq -r '.schemaVersion' "$mechanics")" = 'historical-deep-house-journal-holdout-mechanics-v1'
          test "$(jq '.cases | length' "$mechanics")" = '24'
          test "$(jq -r '.summary.observations' "$mechanics")" = '71'
          test "$(jq '[.observations[] | select(.mechanicallyActionable != false or .finalPassageInference != "none")] | length' "$mechanics")" = '0'
          test "$(jq '[.cases[] | select(.mechanics | index("reaches_final_passage_stage"))] | length' "$mechanics")" = '1'
          test "$(jq '[.cases[] | select(.mechanics | index("calendar_designation"))] | length' "$mechanics")" = '3'
          test "$(jq '[.cases[] | select(.mechanics | index("companion_substitution"))] | length' "$mechanics")" = '5'
          if jq -e '.. | objects | select(has("actualOutcome") or has("actualYes") or has("actualNo") or has("passed"))' "$cohort" >/dev/null; then
            echo 'Frozen cohort unexpectedly contains outcomes.'
            exit 1
          fi
          if jq -e '.. | objects | select(has("actualOutcome") or has("actualYes") or has("actualNo") or has("passed"))' "$mechanics" >/dev/null; then
            echo 'Frozen mechanics unexpectedly contains outcomes.'
            exit 1
          fi
      - name: Require the existing Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'VERCEL_TOKEN is unavailable. No holdout outcome reveal was attempted.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Wait for this exact main SHA to be live in production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            http_code="$(curl \
              --silent \
              --show-error \
              --output "$RUNNER_TEMP/vercel-deployments.json" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=20&teamId=${VERCEL_ORG_ID}")"
            if [ "$http_code" != "200" ]; then
              echo "Vercel deployment lookup returned HTTP ${http_code}."
              exit 1
            fi
            match="$(jq -c --arg sha "$GITHUB_SHA" '[.deployments[]? | select(.target == "production" and .meta.githubCommitSha == $sha)] | first // empty' "$RUNNER_TEMP/vercel-deployments.json")"
            if [ -n "$match" ]; then
              state="$(printf '%s' "$match" | jq -r '.state // "UNKNOWN"')"
              if [ "$state" = "READY" ]; then
                echo "Exact main SHA ${GITHUB_SHA} is READY in production."
                exit 0
              fi
              if [ "$state" = "ERROR" ] || [ "$state" = "CANCELED" ]; then
                echo "Production deployment for ${GITHUB_SHA} entered ${state}."
                exit 1
              fi
            fi
            sleep 5
          done
          echo "Exact main SHA ${GITHUB_SHA} did not become READY before the holdout-score deadline."
          exit 1
      - name: Read production operation secret privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1; then
            echo 'Could not read the VotePredict production environment. No holdout outcome reveal was attempted.'
            exit 1
          fi
      - name: Reveal outcomes once and score the predeclared holdout
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/run-production-historical-deep-house-journal-holdout-score.ts
      - name: Verify holdout score and no-action boundary
        shell: bash
        run: |
          set -euo pipefail
          file="$VOTEPREDICT_HOUSE_JOURNAL_HOLDOUT_SCORE_OUTPUT"
          test "$(jq -r '.schemaVersion' "$file")" = 'historical-deep-house-journal-holdout-score-v1'
          test "$(jq -r '.metadata.runtimeCodeSha' "$file")" = "$GITHUB_SHA"
          test "$(jq -r '.metadata.evaluationPolicy' "$file")" = 'predeclared-house-journal-holdout-replication-v1'
          test "$(jq -r '.metadata.outcomeUse' "$file")" = 'single-post-freeze-holdout-reveal'
          test "$(jq -r '.metadata.probabilityAction' "$file")" = 'none'
          test "$(jq -r '.metadata.actionabilityDecision' "$file")" = 'none'
          test "$(jq -r '.input.frozenCases' "$file")" = '24'
          test "$(jq -r '.input.mechanicsObservations' "$file")" = '71'
          test "$(jq '.cases | length' "$file")" = '24'
          test "$(jq '[.cases[].stableKey] | unique | length' "$file")" = '24'
          test "$(jq -r '.summary.primaryHypotheses | length' "$file")" = '3'
          test "$(jq -r '.summary.primaryHypotheses[0].id' "$file")" = 'H1-final-passage-stage-positive-residual'
          test "$(jq -r '.summary.primaryHypotheses[0].holdout.cases' "$file")" = '1'
          test "$(jq -r '.summary.primaryHypotheses[0].status' "$file")" = 'inconclusive'
          test "$(jq -r '.summary.primaryHypotheses[1].id' "$file")" = 'H2-calendar-designation-negative-residual'
          test "$(jq -r '.summary.primaryHypotheses[1].holdout.cases' "$file")" = '3'
          test "$(jq -r '.summary.primaryHypotheses[1].status' "$file")" = 'inconclusive'
          test "$(jq -r '.summary.primaryHypotheses[2].id' "$file")" = 'H3-companion-substitution-positive-residual'
          test "$(jq -r '.summary.primaryHypotheses[2].holdout.cases' "$file")" = '5'
          test "$(jq '[.summary.primaryHypotheses[] | select(.status != "replicates" and .status != "does_not_replicate" and .status != "inconclusive")] | length' "$file")" = '0'
          test "$(jq '[.summary.primaryHypotheses[] | select(.thresholds.minimumCases != 5 or .thresholds.minimumDecisiveMemberOutcomes != 400 or .thresholds.minimumAbsoluteMemberWeightedResidual != 0.02)] | length' "$file")" = '0'
          test "$(jq '.summary.negativeControls | length' "$file")" = '1'
          test "$(jq -r '.summary.negativeControls[0].mechanic' "$file")" = 'author_added'
          test "$(jq -r '.input.quickMemberCasePairs' "$file")" -gt 0
          test "$(jq -r '.input.decisiveMemberOutcomes' "$file")" -gt 0
          if jq -e '.. | objects | select(has("probabilityAfter") or has("mechanicallyActionable") or has("evidenceWeight") or has("targetPolicyChange"))' "$file" >/dev/null; then
            echo 'Holdout score artifact contains a forbidden production-action field.'
            exit 1
          fi
      - name: Upload immutable House Journal holdout score
        uses: actions/upload-artifact@v4
        with:
          name: historical-deep-house-journal-holdout-score-v1-${{ github.sha }}
          path: artifacts/historical-deep-house-journal-holdout-score-v1.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary credentials and lookup files
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env', 'vercel-pull.log', 'vercel-deployments.json', 'cohort-artifact.json', 'mechanics-artifact.json']:
              Path(os.environ['RUNNER_TEMP'], name).unlink(missing_ok=True)
          PYTHON
