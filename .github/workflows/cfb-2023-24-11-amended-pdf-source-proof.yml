name: Eleven 2023-24 real senator amended CFB original PDFs
on:
  pull_request:
    paths:
      - .github/workflows/cfb-2023-24-11-amended-pdf-source-proof.yml
      - src/evidence/cfb-2023-24-eight-served-eleven-amendments.ts
      - scripts/capture-cfb-2023-24-eight-served-eleven-amendment-pdfs.ts
      - tests/cfb-2023-24-eight-served-eleven-amendments.test.ts
permissions:
  contents: read
jobs:
  original-cfb-finance-source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: node --import tsx --test tests/cfb-2023-24-eight-served-eleven-amendments.test.ts
      - run: node --import tsx scripts/capture-cfb-2023-24-eight-served-eleven-amendment-pdfs.ts --output artifacts/cfb-2023-24-eight-served-eleven-amendments.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-2023-24-11-amendments-authenticated-parent-source-metadata
          path: artifacts/cfb-2023-24-eight-served-eleven-amendments.json
          if-no-files-found: warn
          retention-days: 30
