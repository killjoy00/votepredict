name: One-time original 2021 Senate Journal Rule 12.10 committee named rolls

# Source-only 2021 committee reports; not any Senate floor division.
# Only new workflow insertion to main triggers this exact two-PDF source job.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2021-rule1210-two-original-committee-rolls.yml

permissions:
  contents: read

jobs:
  authenticate-two-original-2021-rule1210-committee-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Reverify exact official Journal PDFs and named committee vote divisions
        run: |
          node --import tsx scripts/review-senate-2021-rule1210-two-original-journal-committee-rolls.ts \
            --output artifacts/2021-senate-rule1210/official-sf173-sf1470-committee-report-rolls.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2021-original-rule1210-sf173-sf1470-committee-reports
          path: artifacts/2021-senate-rule1210/official-sf173-sf1470-committee-report-rolls.json
          retention-days: 30
          if-no-files-found: error
