name: Senate media 2022 Bigham and Eken exact two speaker originals

# PUBLIC original HTTP HTML only, no original audio, private source, vote data.
on:
  pull_request:
    paths:
      - .github/workflows/senate-media-bigham-eken-2022-original-cues.yml
      - src/evidence/senate-media-bigham-eken-2022-original-speaker-audit.ts
      - scripts/audit-senate-media-bigham-eken-2022-phrases.ts
      - tests/senate-media-bigham-eken-2022-original-speaker-audit.test.ts
      - docs/evaluation/senate-media-2022-bigham-eken-historical-original-speaker-queue.json
      - docs/evaluation/senate-media-2021-25-broader-25-original-public-archive-receipts-20261011.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: senate-media-bigham-eken-2022-exact-public-original-words
  cancel-in-progress: false

jobs:
  original-two-speakers:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict' &&
         github.event.pull_request.head.ref == 'research/media-25-original-captures-quote-bridge-20261011')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Reverify 2 exact archived raw HTTP bodies and Bigham vs Eken short speaker cues
        run: |
          node --import tsx scripts/audit-senate-media-bigham-eken-2022-phrases.ts \
            --output artifacts/senate-media-bigham-eken-2022-original-phrase-proof.json
      - name: Persist ONLY raw hash receipts and short phrase status metadata
        uses: actions/upload-artifact@v6
        with:
          name: senate-media-bigham-eken-2022-original-phrase-proof
          path: artifacts/senate-media-bigham-eken-2022-original-phrase-proof.json
          if-no-files-found: error
          retention-days: 7
