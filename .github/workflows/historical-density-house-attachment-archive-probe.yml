name: Probe 2021-22 House attachment historical archive availability

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  actions: read

concurrency:
  group: >-
    ${{ startsWith(github.event.comment.body, '[historical-density-house-attachment-archive-probe]')
        && 'historical-density-house-attachment-archive-probe'
        || format('historical-density-house-attachment-archive-probe-skip-{0}', github.event.comment.id) }}
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event.issue.number == 718 &&
      github.event.comment.user.login == 'killjoy00' &&
      startsWith(github.event.comment.body, '[historical-density-house-attachment-archive-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Materialize frozen 24-PDF selector artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11381216160/zip > "$RUNNER_TEMP/house-attachment-selector.zip"
          echo "e6f795c501db56ec9e009ee14afad54e172604d052914eafbe50778d3f6cec20  $RUNNER_TEMP/house-attachment-selector.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/house-attachment-selector"
          unzip -q "$RUNNER_TEMP/house-attachment-selector.zip" historical-density-house-attachment-selector-v1.json -d "$RUNNER_TEMP/house-attachment-selector"

      - name: Materialize immutable historical target universe
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11252079484/zip > "$RUNNER_TEMP/historical-closeout.zip"
          echo "22e8944cffc6fda553b05ea6ad5e92400d35fc01d83177efdd5d1204dd3c5a6f  $RUNNER_TEMP/historical-closeout.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/historical-closeout"
          unzip -q "$RUNNER_TEMP/historical-closeout.zip" historical-as-of-matrix-v1.ndjson.gz -d "$RUNNER_TEMP/historical-closeout"
          python - <<'PYTHON'
          import gzip,json,os
          src=os.path.join(os.environ['RUNNER_TEMP'],'historical-closeout','historical-as-of-matrix-v1.ndjson.gz')
          dst=os.path.join(os.environ['RUNNER_TEMP'],'evidence-quality-target-universe-v1.ndjson')
          with gzip.open(src,'rt',encoding='utf-8') as fh, open(dst,'w',encoding='utf-8') as out:
              for line in fh:
                  row=json.loads(line)
                  target={k:row[k] for k in ['voteEventId','membershipId','session','chamber','occurredOn','billId','identifier']}
                  out.write(json.dumps(target,separators=(',',':'))+'\n')
          PYTHON

      - name: Materialize authoritative v1.5 Evidence Quality matrix
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11380755983/zip > "$RUNNER_TEMP/evidence-quality-v1-5.zip"
          echo "fe2254fc9d2ed0ea00712feab384958e4942cf387e442c29515b3a75183692d7  $RUNNER_TEMP/evidence-quality-v1-5.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/evidence-quality-v1-5"
          unzip -q "$RUNNER_TEMP/evidence-quality-v1-5.zip" evidence-quality-historical-feature-matrix-v1.5.ndjson.gz -d "$RUNNER_TEMP/evidence-quality-v1-5"

      - name: Probe exact archived PDF availability for the frozen pilot
        env:
          VOTEPREDICT_HOUSE_ATTACHMENT_SELECTOR_PATH: ${{ runner.temp }}/house-attachment-selector/historical-density-house-attachment-selector-v1.json
          VOTEPREDICT_EQ_TARGET_UNIVERSE_PATH: ${{ runner.temp }}/evidence-quality-target-universe-v1.ndjson
          VOTEPREDICT_EQ_CURRENT_MATRIX_PATH: ${{ runner.temp }}/evidence-quality-v1-5/evidence-quality-historical-feature-matrix-v1.5.ndjson.gz
          VOTEPREDICT_HOUSE_ATTACHMENT_ARCHIVE_PROBE_OUTPUT_DIR: ${{ runner.temp }}/historical-density-house-attachment-archive-probe
        run: node --import tsx scripts/probe-house-attachment-historical-density-archive.ts

      - name: Upload read-only archive probe artifact
        uses: actions/upload-artifact@v7
        with:
          name: historical-density-house-attachment-archive-probe-v1
          path: ${{ runner.temp }}/historical-density-house-attachment-archive-probe/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove frozen input artifacts
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/house-attachment-selector.zip" "$RUNNER_TEMP/historical-closeout.zip" "$RUNNER_TEMP/evidence-quality-v1-5.zip"
