name: Third original April12 SF1159 SF970 SHA discovery with own committee heading

# Preserves original failed runs 38172259470 and 38172682467 as genuine failures.
# A successful output remains PROVISIONAL until independent literal-side-hash authentication.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2021-apr12-two-original-amendments-sha-third-run.yml

permissions:
  contents: read

jobs:
  april12-original-two-amendments-provisional-sha-third-run:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Third exact original PDF source run - each motion must be immediately under its own committee heading
        run: |
          node --import tsx scripts/probe-senate-2021-apr12-original-two-amendment-sides.ts \
            --output artifacts/senate-apr12-two-rule1210-original-third-run/provisional-shas.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2021-apr12-two-rule1210-original-third-run
          path: artifacts/senate-apr12-two-rule1210-original-third-run/provisional-shas.json
          retention-days: 30
          if-no-files-found: error
