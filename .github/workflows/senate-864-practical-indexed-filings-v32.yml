name: 'Senate #864 practical 445 official filing versions, 95 senators, scanned and alias sources V32'
on:
  pull_request:
    paths:
      - 'scripts/audit-cfb-864-practical-official-filing-inventory-v32.mjs'
      - 'src/evidence/cfb-historical-official-filings.ts'
      - 'data/cfb-senate-official-filings-2021-25-v32.json'
      - 'docs/evaluation/source-proof/cfb-2021-25-95-senators-445-official-filing-version-inventory-v32.psv'
      - 'docs/evaluation/source-proof/cfb-2021-22-five-senator-name-variants-ten-official-yearend-originals-v32.psv'
      - 'src/legislators/profile.ts'
      - 'src/app/dashboard/legislators/[legislatorId]/page.tsx'
      - 'tests/cfb-864-practical-indexed-filings-v32.test.mjs'
      - '.github/workflows/senate-864-practical-indexed-filings-v32.yml'
permissions:
  contents: read
jobs:
  accept-official-cfb-indexed-reports-independent-of-pdf-text:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --no-fund --no-audit
      - name: Verify original 435 full PDF SHA source proofs and practical inclusion of all 445 indexed reports/95 serving senators
        run: node --import tsx --test tests/cfb-864-practical-indexed-filings-v32.test.mjs
      - name: Reconstruct all 445 official CFB indexed records without using OCR or missing publication dates as exclusion
        run: node --import tsx scripts/audit-cfb-864-practical-official-filing-inventory-v32.mjs
