name: Audit CFB availability-proof debt

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

concurrency:
  group: cfb-availability-debt-audit
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 678 &&
        github.event.comment.user.login == 'killjoy00' &&
        startsWith(github.event.comment.body, '[cfb-availability-debt-audit]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Audit remaining candidate-finance and IE availability debt
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: |
          node --import tsx scripts/audit-cfb-availability-debt.ts \
            --output artifacts/cfb-availability-debt-audit-v1.json

      - name: Upload debt audit artifact
        uses: actions/upload-artifact@v6
        with:
          name: cfb-availability-debt-audit-v1
          path: artifacts/cfb-availability-debt-audit-v1.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary credentials and logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env','vercel-pull.log']:
              Path(os.environ['RUNNER_TEMP'],name).unlink(missing_ok=True)
          PYTHON
