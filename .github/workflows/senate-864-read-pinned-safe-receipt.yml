name: Read pinned sanitized issue 864 receipt
on:
  pull_request:
    paths: [.github/workflows/senate-864-read-pinned-safe-receipt.yml]
permissions:
  contents: read
  actions: read
jobs:
  read-sanitized-receipt:
    if: github.repository == 'killjoy00/votepredict' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: senate864-authoritative-completion-readback
          run-id: 39275444868
          github-token: ${{ github.token }}
          path: safe-receipt
      - name: Verify fixed public aggregate contract and return receipt
        shell: python
        run: |
          import json, pathlib, re
          files=list(pathlib.Path('safe-receipt').glob('**/*'))
          files=[p for p in files if p.is_file()]
          assert len(files)==1 and files[0].name=='senate864-completion-readback.json'
          body=files[0].read_text()
          assert len(body)<400000
          assert not re.search(r'postgres(?:ql)?://|"(?:membershipId|legislatorId|sourceSha|excerpt|rawBody|password|sourceDocumentId)"\s*:',body,re.I)
          r=json.loads(body)
          assert r['reviewedCommit']=='a606969debe0ebd9ec41aa57d9372771c41f4182'
          assert r['verifiedRepeatableReadReadOnly'] and r['explicitRollback'] and r['noWritesOrOutcomeTesting']
          assert r['website']['matched']==616
          assert set(r)==set(['version','auditedAt','reviewedCommit','protocolSha256','verifiedRepeatableReadReadOnly','explicitRollback','noWritesOrOutcomeTesting','website','websiteHoldReasons','preparedCohort','finance','committee','education','media'])
          print('SENATE864_PINNED_SAFE_RECEIPT='+json.dumps(r,separators=(',',':')))
