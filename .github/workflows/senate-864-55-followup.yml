name: Issue 864 remaining 55 OCR originals and three parser misses
on:
  pull_request:
    paths:
      - .github/workflows/senate-864-55-followup.yml
      - scripts/acquire-senate-864-55-followup.py
      - scripts/publish-senate-864-55-followup.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-864-55-followup.yml
      - scripts/acquire-senate-864-55-followup.py
      - scripts/publish-senate-864-55-followup.mjs
permissions:
  contents: read
concurrency:
  group: senate864-55-followup-${{ github.sha }}
  cancel-in-progress: false
jobs:
  source-scope-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python -m pip install Pillow
      - run: python -m py_compile scripts/acquire-senate-864-55-followup.py
      - run: python scripts/acquire-senate-864-55-followup.py --scope-only
      - run: node --check scripts/publish-senate-864-55-followup.mjs
  public-originals:
    needs: source-scope-check
    if: >-
      needs.source-scope-check.result == 'success' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 && github.event.repository.full_name == 'killjoy00/votepredict' &&
      github.event.after == github.sha && github.event.head_commit.id == github.sha &&
      github.event.forced != true && github.event.deleted != true &&
      contains(github.event.head_commit.message, 'SENATE864_55_OCR_FOLLOWUP_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact reviewed main
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - run: python -m pip install Pillow
      - name: Authenticate 58 originals and render every page for source-only review
        run: python scripts/acquire-senate-864-55-followup.py
      - uses: actions/upload-artifact@v4
        with:
          name: senate864-55-followup-public-originals
          path: artifacts/senate864-55-followup/
          if-no-files-found: error
          retention-days: 14
  public-review-branch:
    needs: public-originals
    if: >-
      needs.public-originals.result == 'success' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: senate864-55-followup-public-originals
          path: artifacts/senate864-55-followup/
      - name: Validate public files and preserve source review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-senate-864-55-followup.mjs
