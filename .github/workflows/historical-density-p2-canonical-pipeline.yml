name: Historical density P2 canonical pipeline

on:
  push:
    branches: [main]
    paths:
      - src/evidence/historical-density-p2-applicability.ts
      - src/evidence/historical-density-p2-canonical.ts
      - scripts/audit-historical-density-p2-applicability.ts
      - scripts/freeze-historical-density-p2-applicability-canonical.ts
      - scripts/build-evidence-quality-historical-feature-matrix-v1-6.ts
      - scripts/audit-evidence-quality-historical-feature-coverage-v1-6.ts
      - tests/historical-density-p2-applicability.test.ts
      - tests/historical-density-p2-canonical.test.ts
      - data/evaluation/evidence-quality/historical-density-p2-applicability-decisions-v1.json
      - .github/workflows/historical-density-p2-canonical-pipeline.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-p2-canonical-pipeline
  cancel-in-progress: false

jobs:
  candidate:
    name: Candidate audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Test candidate and canonical feature rules
        run: |
          node --import tsx --test tests/historical-density-p2-applicability.test.ts
          node --import tsx --test tests/historical-density-p2-canonical.test.ts

      - name: Materialize immutable outcome-blind inputs
        shell: bash
        run: |
          set -euo pipefail

          gh api /repos/${{ github.repository }}/actions/artifacts/11252079484/zip > "$RUNNER_TEMP/historical-closeout.zip"
          echo "22e8944cffc6fda553b05ea6ad5e92400d35fc01d83177efdd5d1204dd3c5a6f  $RUNNER_TEMP/historical-closeout.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/historical-closeout"
          unzip -q "$RUNNER_TEMP/historical-closeout.zip" historical-as-of-matrix-v1.ndjson.gz -d "$RUNNER_TEMP/historical-closeout"

          gh api /repos/${{ github.repository }}/actions/artifacts/11383404277/zip > "$RUNNER_TEMP/p2-review.zip"
          echo "bc0c274ecc7705a47dda26f97d2f2c0a09643ac77b0a585ed63e0402ee4bd51c  $RUNNER_TEMP/p2-review.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/p2-review"
          unzip -q "$RUNNER_TEMP/p2-review.zip" historical-density-p2-semantic-review-cohort-v1.json -d "$RUNNER_TEMP/p2-review"

          python - <<'PYTHON'
          import gzip,json,os
          cohort_path=os.path.join(os.environ['RUNNER_TEMP'],'p2-review','historical-density-p2-semantic-review-cohort-v1.json')
          matrix_path=os.path.join(os.environ['RUNNER_TEMP'],'historical-closeout','historical-as-of-matrix-v1.ndjson.gz')
          target_path=os.path.join(os.environ['RUNNER_TEMP'],'p2-outcome-blind-targets.ndjson')
          cohort=json.load(open(cohort_path,encoding='utf-8'))
          memberships={row['membershipId'] for row in cohort['documents']}
          allowed=['voteEventId','membershipId','legislatorId','session','chamber','occurredOn','billId','identifier']
          count=0
          with gzip.open(matrix_path,'rt',encoding='utf-8') as src, open(target_path,'w',encoding='utf-8') as out:
              for line in src:
                  row=json.loads(line)
                  if row['session']!='2021-2022' or row['membershipId'] not in memberships:
                      continue
                  out.write(json.dumps({key:row[key] for key in allowed},separators=(',',':'))+'\n')
                  count+=1
          if count != 3924:
              raise SystemExit(f'expected 3924 raw member-event rows, got {count}')
          print(json.dumps({'rawOutcomeBlindMemberEventRows':count,'memberships':len(memberships)}))
          PYTHON

      - name: Build strict-pre-vote applicability candidates
        env:
          VOTEPREDICT_P2_REVIEW_COHORT_PATH: ${{ runner.temp }}/p2-review/historical-density-p2-semantic-review-cohort-v1.json
          VOTEPREDICT_P2_OUTCOME_BLIND_TARGET_PATH: ${{ runner.temp }}/p2-outcome-blind-targets.ndjson
          VOTEPREDICT_P2_APPLICABILITY_OUTPUT_DIR: ${{ runner.temp }}/p2-candidates
        run: node --import tsx scripts/audit-historical-density-p2-applicability.ts

      - name: Verify candidate boundary
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/p2-candidates/historical-density-p2-applicability-candidate-audit-v1.json"
          test "$(jq -r '.cohort.eligibleMemberEventRows' "$file")" = '3923'
          test "$(jq -r '.candidateScreen.candidateMemberEvents' "$file")" = '105'
          test "$(jq -r '.candidateScreen.candidateClaimPairs' "$file")" = '105'
          test "$(jq -r '.candidateScreen.automaticApplicableRows' "$file")" = '0'
          test "$(jq -r '.candidateScreen.automaticAlignmentRows' "$file")" = '0'
          test "$(jq -r '.policy.outcomeUse' "$file")" = 'none'
          test "$(jq -r '.policy.productionDatabaseQueried' "$file")" = 'false'
          test "$(jq -r '.policy.vercelUsed' "$file")" = 'false'
          test "$(jq -r '.policy.servingChanged' "$file")" = 'false'

      - uses: actions/upload-artifact@v7
        with:
          name: historical-density-p2-candidate-current
          path: ${{ runner.temp }}/p2-candidates/*
          if-no-files-found: error
          retention-days: 30

  review:
    name: Decision gate
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - uses: actions/download-artifact@v8
        with:
          name: historical-density-p2-candidate-current
          path: ${{ runner.temp }}/p2-candidates

      - name: Freeze canonical reviewed applicability
        env:
          VOTEPREDICT_P2_APPLICABILITY_CANDIDATE_PATH: ${{ runner.temp }}/p2-candidates/historical-density-p2-applicability-candidate-audit-v1.json
          VOTEPREDICT_P2_APPLICABILITY_DECISION_PATH: data/evaluation/evidence-quality/historical-density-p2-applicability-decisions-v1.json
          VOTEPREDICT_P2_CANONICAL_REVIEW_OUTPUT_DIR: ${{ runner.temp }}/p2-canonical
        run: node --import tsx scripts/freeze-historical-density-p2-applicability-canonical.ts

      - name: Verify fail-closed decision accounting
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/p2-canonical/historical-density-p2-applicability-canonical-v1.json"
          test "$(jq -r '.summary.candidateGroups' "$file")" = '74'
          test "$(jq -r '.summary.candidatePairs' "$file")" = '105'
          test "$(jq -r '.summary.explicitlyReviewedGroups' "$file")" = '65'
          test "$(jq -r '.summary.pendingReviewGroups' "$file")" = '9'
          test "$(jq -r '.summary.finalStatusCounts.applicable' "$file")" = '2'
          test "$(jq -r '.summary.finalStatusCounts.ambiguous_fail_closed' "$file")" = '38'
          test "$(jq -r '.summary.finalStatusCounts.pending_review' "$file")" = '21'
          test "$(jq -r '.summary.finalStatusCounts.not_applicable' "$file")" = '3862'
          test "$(jq -r '.summary.applicableRows' "$file")" = '2'
          test "$(jq -r '.policy.outcomeUse' "$file")" = 'none'
          test "$(jq -r '.policy.onlyApplicableRowsMayReachMatrixOverlay' "$file")" = 'true'
          test "$(jq -r '.policy.productionDatabaseQueried' "$file")" = 'false'
          test "$(jq -r '.policy.vercelUsed' "$file")" = 'false'
          jq -e '.summary.applicableReviewKeys == ["gas_tax|HF1684|2021-04-22","school_choice_parental_control|SF2575|2022-03-03"]' "$file" >/dev/null
          jq -e '.summary.disputedFailClosedKeys == ["long_term_care_protections|SF443|2021-04-21"]' "$file" >/dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: historical-density-p2-canonical-review-v1
          path: ${{ runner.temp }}/p2-canonical/*
          if-no-files-found: error
          retention-days: 30

  matrix:
    name: Matrix v1.6
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - uses: actions/download-artifact@v8
        with:
          name: historical-density-p2-canonical-review-v1
          path: ${{ runner.temp }}/p2-canonical

      - name: Materialize immutable v1.5 baseline
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11380755983/zip > "$RUNNER_TEMP/v15.zip"
          echo "fe2254fc9d2ed0ea00712feab384958e4942cf387e442c29515b3a75183692d7  $RUNNER_TEMP/v15.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/v15"
          unzip -q "$RUNNER_TEMP/v15.zip"             evidence-quality-historical-feature-matrix-v1.5.ndjson.gz             evidence-quality-historical-feature-matrix-v1.5-manifest.json             -d "$RUNNER_TEMP/v15"

      - name: Build strictly additive v1.6 matrix
        env:
          VOTEPREDICT_P2_CANONICAL_REVIEW_PATH: ${{ runner.temp }}/p2-canonical/historical-density-p2-applicability-canonical-v1.json
          VOTEPREDICT_EQ_V15_MATRIX_PATH: ${{ runner.temp }}/v15/evidence-quality-historical-feature-matrix-v1.5.ndjson.gz
          VOTEPREDICT_EQ_V15_MANIFEST_PATH: ${{ runner.temp }}/v15/evidence-quality-historical-feature-matrix-v1.5-manifest.json
          VOTEPREDICT_EQ_V16_OUTPUT_DIR: ${{ runner.temp }}/v16
        run: node --import tsx scripts/build-evidence-quality-historical-feature-matrix-v1-6.ts

      - name: Verify matrix v1.6 boundary
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/v16/evidence-quality-historical-feature-matrix-v1.6-manifest.json"
          test "$(jq -r '.coverage.matrixRows' "$file")" = '135457'
          test "$(jq -r '.coverage.exactNonzeroRows' "$file")" = '38'
          test "$(jq -r '.coverage.reviewedApplicabilityNonzeroRows' "$file")" = '2'
          test "$(jq -r '.coverage.combinedNonzeroRows' "$file")" = '40'
          test "$(jq -r '.coverage.bySession["2021-2022"].exactNonzeroRows' "$file")" = '3'
          test "$(jq -r '.coverage.bySession["2021-2022"].reviewedApplicabilityNonzeroRows' "$file")" = '2'
          test "$(jq -r '.coverage.bySession["2021-2022"].combinedNonzeroRows' "$file")" = '5'
          test "$(jq -r '.featureFamilies.exactBill.semanticsChangedFromV15' "$file")" = 'false'
          test "$(jq -r '.policy.pendingOrAmbiguousApplicabilityIncluded' "$file")" = 'false'
          test "$(jq -r '.policy.outcomeUseDuringFeatureConstruction' "$file")" = 'none'
          test "$(jq -r '.policy.vercelUsed' "$file")" = 'false'
          test "$(jq -r '.policy.servingChanged' "$file")" = 'false'

      - uses: actions/upload-artifact@v7
        with:
          name: evidence-quality-historical-feature-freeze-v1-6
          path: ${{ runner.temp }}/v16/*
          if-no-files-found: error
          retention-days: 30

  coverage:
    name: Coverage audit
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - uses: actions/download-artifact@v8
        with:
          name: evidence-quality-historical-feature-freeze-v1-6
          path: ${{ runner.temp }}/v16

      - name: Audit realized coverage and v1.5 -> v1.6 diff
        env:
          VOTEPREDICT_EQ_V16_MATRIX_PATH: ${{ runner.temp }}/v16/evidence-quality-historical-feature-matrix-v1.6.ndjson.gz
          VOTEPREDICT_EQ_V16_MANIFEST_PATH: ${{ runner.temp }}/v16/evidence-quality-historical-feature-matrix-v1.6-manifest.json
          VOTEPREDICT_EQ_V16_COVERAGE_OUTPUT_DIR: ${{ runner.temp }}/coverage
        run: node --import tsx scripts/audit-evidence-quality-historical-feature-coverage-v1-6.ts

      - name: Verify coverage result and publish summary
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/coverage/evidence-quality-historical-feature-coverage-v1.6.json"
          test "$(jq -r '.summary.exactNonzeroRows' "$file")" = '38'
          test "$(jq -r '.summary.reviewedApplicabilityNonzeroRows' "$file")" = '2'
          test "$(jq -r '.summary.combinedNonzeroRows' "$file")" = '40'
          test "$(jq -r '.summary.netAddedCombinedRowsVsV15' "$file")" = '2'
          test "$(jq -r '.training2021_2022.exactNonzeroRowsV15' "$file")" = '3'
          test "$(jq -r '.training2021_2022.combinedNonzeroRowsV16' "$file")" = '5'
          test "$(jq -r '.unresolvedApplicability.includedInMatrix' "$file")" = '0'
          test "$(jq -r '.policy.outcomeUse' "$file")" = 'none'
          test "$(jq -r '.policy.vercelUsed' "$file")" = 'false'
          test "$(jq -r '.policy.modelFitting' "$file")" = 'none'

          {
            echo "## Historical Evidence v1.6"
            echo
            echo "- Exact-bill covered rows: **38** (unchanged)"
            echo "- Reviewed-applicability rows added: **2**"
            echo "- Combined covered rows: **40**"
            echo "- 2021-22 training rows: **3 -> 5**"
            echo "- Ambiguous rows included: **0**"
            echo "- Pending-review rows included: **0**"
            echo "- Outcomes used: **none**"
            echo "- Vercel used: **no**"
            echo "- Model fitting: **none**"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: evidence-quality-historical-feature-coverage-v1-6
          path: ${{ runner.temp }}/coverage/*
          if-no-files-found: error
          retention-days: 30
