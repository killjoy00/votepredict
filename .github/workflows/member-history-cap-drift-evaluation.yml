name: Member history cap drift evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: member-history-cap-drift-evaluation-v1
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      VOTEPREDICT_MEMBER_HISTORY_CAP_DRIFT_RAW_OUTPUT: artifacts/member-history-cap-drift-raw-v1.json
    steps:
      - uses: actions/checkout@v7
      - name: Verify frozen cap grid and selection plan
        shell: bash
        run: |
          set -euo pipefail
          plan='data/evaluation/member-history-cap-drift-plan-v1.json'
          test "$(jq -r '.schemaVersion' "$plan")" = 'member-history-cap-drift-plan-v1'
          evaluator="$(jq -r '.existingEvaluator.sourceFile' "$plan")"
          expected_blob="$(jq -r '.existingEvaluator.sourceFileBlobSha' "$plan")"
          test "$(git rev-parse "HEAD:${evaluator}")" = "$expected_blob"
          test "$(jq -r '.existingEvaluator.candidateCaps | map(tostring) | join(",")' "$plan")" = '5,10,20,40,80,uncapped'
          test "$(jq -r '.selectionRule.baseline' "$plan")" = 'uncapped'
          test "$(jq -r '.selectionRule.primarySlice' "$plan")" = '2025-2026/house'
          test "$(jq -r '.guardrails.probabilityAction' "$plan")" = 'none'
          test "$(jq -r '.guardrails.runtimeDefaultChange' "$plan")" = 'false'
          test "$(jq -r '.guardrails.modelVersionChange' "$plan")" = 'false'
      - name: Require production environment access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Wait for this exact main SHA to be live in production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            http_code="$(curl \
              --silent \
              --show-error \
              --output "$RUNNER_TEMP/vercel-deployments.json" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=20&teamId=${VERCEL_ORG_ID}")"
            if [ "$http_code" != "200" ]; then
              echo "Vercel deployment lookup returned HTTP ${http_code}."
              exit 1
            fi
            match="$(jq -c --arg sha "$GITHUB_SHA" '[.deployments[]? | select(.target == "production" and .meta.githubCommitSha == $sha)] | first // empty' "$RUNNER_TEMP/vercel-deployments.json")"
            if [ -n "$match" ]; then
              state="$(printf '%s' "$match" | jq -r '.state // "UNKNOWN"')"
              if [ "$state" = "READY" ]; then
                echo "Exact main SHA ${GITHUB_SHA} is READY in production."
                exit 0
              fi
              if [ "$state" = "ERROR" ] || [ "$state" = "CANCELED" ]; then
                echo "Production deployment for ${GITHUB_SHA} entered ${state}."
                exit 1
              fi
            fi
            sleep 5
          done
          echo "Exact main SHA ${GITHUB_SHA} did not become READY before the cap-evaluation deadline."
          exit 1
      - name: Read production operation secret privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1
      - name: Run pre-existing cap grid inside production runtime
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/run-production-member-history-cap-drift-evaluation.ts
      - name: Verify raw grid lineage
        shell: bash
        run: |
          set -euo pipefail
          raw="$VOTEPREDICT_MEMBER_HISTORY_CAP_DRIFT_RAW_OUTPUT"
          test "$(jq -r '.metadata.codeSha' "$raw")" = "$GITHUB_SHA"
          test "$(jq -r '[.candidates[].cap] | join(",")' "$raw")" = '5,10,20,40,80,uncapped'
          test "$(jq -r '.metadata.warning' "$raw")" = 'This is retrospective/shadow evaluation on already inspected sessions. It does not qualify a candidate for production promotion by itself.'
          test "$(jq -r '.metadata.scope' "$raw")" = 'Member vote component only. It does not solve selection bias from conditioning on bills that reached a final-passage vote.'
      - name: Apply frozen candidate-selection rule
        run: |
          node --import tsx scripts/select-member-history-cap-drift.ts \
            artifacts/member-history-cap-drift-raw-v1.json \
            data/evaluation/member-history-cap-drift-plan-v1.json \
            artifacts/member-history-cap-drift-evaluation-v1.json
      - name: Verify shadow-only result
        shell: bash
        run: |
          set -euo pipefail
          file='artifacts/member-history-cap-drift-evaluation-v1.json'
          test "$(jq -r '.schemaVersion' "$file")" = 'member-history-cap-drift-evaluation-v1'
          test "$(jq -r '.metadata.runtimeCodeSha' "$file")" = "$GITHUB_SHA"
          test "$(jq -r '.metadata.analysisStatus' "$file")" = 'retrospective-shadow-only'
          test "$(jq -r '.metadata.probabilityAction' "$file")" = 'none'
          test "$(jq -r '.metadata.runtimeDefaultChange' "$file")" = 'false'
          test "$(jq -r '.metadata.modelVersionChange' "$file")" = 'false'
          test "$(jq -r '.baseline.cap' "$file")" = 'uncapped'
          test "$(jq '.candidates | length' "$file")" = '5'
          test "$(jq -r '.decision.productionAction' "$file")" = 'none'
          test "$(jq -r '[.candidates[].cap] | join(",")' "$file")" = '5,10,20,40,80'
          if jq -e '.. | objects | select(has("probabilityAfter") or has("productionWeight") or has("mechanicallyActionable"))' "$file" >/dev/null; then
            echo 'Cap evaluation artifact contains a forbidden production-action field.'
            exit 1
          fi
      - name: Upload immutable cap-drift evaluation
        uses: actions/upload-artifact@v4
        with:
          name: member-history-cap-drift-evaluation-v1-${{ github.sha }}
          path: |
            artifacts/member-history-cap-drift-raw-v1.json
            artifacts/member-history-cap-drift-evaluation-v1.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary production files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/votepredict-production.env" "$RUNNER_TEMP/vercel-pull.log" "$RUNNER_TEMP/vercel-deployments.json"
