name: Import Session Daily Evidence Quality semantic reviews

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

concurrency:
  group: >-
    ${{
      (startsWith(github.event.comment.body, '[evidence-quality-session-daily-semantic-import-dry-run]')
       || startsWith(github.event.comment.body, '[evidence-quality-session-daily-semantic-import-apply]'))
      && 'evidence-quality-session-daily-semantic-import'
      || format('evidence-quality-session-daily-semantic-import-skip-{0}', github.event.comment.id)
    }}
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.event.issue.number == 579 &&
      github.event.comment.user.login == 'killjoy00' &&
      (
        startsWith(github.event.comment.body, '[evidence-quality-session-daily-semantic-import-dry-run]') ||
        (
          startsWith(github.event.comment.body, '[evidence-quality-session-daily-semantic-import-apply]') &&
          contains(github.event.comment.body, 'APPLY_SESSION_DAILY_REVIEWS_37')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Run guarded Session Daily semantic import
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_EQ_SESSION_DAILY_SEMANTIC_IMPORT_DIR: ${{ runner.temp }}/evidence-quality-session-daily-semantic-import
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ startsWith(github.event.comment.body, '[evidence-quality-session-daily-semantic-import-apply]') }}" == "true" ]]; then
            node --import tsx scripts/import-evidence-quality-session-daily-semantic-reviews.ts --apply
          else
            node --import tsx scripts/import-evidence-quality-session-daily-semantic-reviews.ts
          fi

      - name: Upload semantic import audit
        uses: actions/upload-artifact@v7
        with:
          name: ${{ startsWith(github.event.comment.body, '[evidence-quality-session-daily-semantic-import-apply]') && 'evidence-quality-session-daily-semantic-import-apply-v1' || 'evidence-quality-session-daily-semantic-import-dry-run-v1' }}
          path: ${{ runner.temp }}/evidence-quality-session-daily-semantic-import/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/votepredict-production.env" "$RUNNER_TEMP/vercel-pull.log"
