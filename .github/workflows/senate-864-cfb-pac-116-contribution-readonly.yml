name: "Senate #864 PAC 116 campaign contribution original-report provenance READ ONLY"
on:
  pull_request:
    paths:
      - "src/evidence/cfb-pac-contribution-provenance-v1.mjs"
      - "scripts/audit-cfb-pac-116-contribution-provenance-readonly.mjs"
      - "tests/cfb-pac-contribution-provenance-v1.test.mjs"
      - "src/evidence/cfb-pac116-original-multicolumn-shadow-v2.mjs"
      - "scripts/audit-cfb-pac116-original-multicolumn-readonly.mjs"
      - "tests/cfb-pac116-original-multicolumn-shadow-v2.test.mjs"
      - ".github/workflows/senate-864-cfb-pac-116-contribution-readonly.yml"
  push:
    branches: [main]
    paths:
      - "src/evidence/cfb-pac-contribution-provenance-v1.mjs"
      - "scripts/audit-cfb-pac-116-contribution-provenance-readonly.mjs"
      - "tests/cfb-pac-contribution-provenance-v1.test.mjs"
      - "src/evidence/cfb-pac116-original-multicolumn-shadow-v2.mjs"
      - "scripts/audit-cfb-pac116-original-multicolumn-readonly.mjs"
      - "tests/cfb-pac116-original-multicolumn-shadow-v2.test.mjs"
      - ".github/workflows/senate-864-cfb-pac-116-contribution-readonly.yml"
permissions:
  contents: read
concurrency:
  group: "cfb-864-pac-116-finance-original-readonly-${{ github.sha }}"
  cancel-in-progress: false
jobs:
  pr-keyless-finance-provenance-tests:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-fund --no-audit
      - name: Verify campaign-finance provenance contracts and no sensitive output
        run: |
          node --check src/evidence/cfb-pac-contribution-provenance-v1.mjs
          node --check scripts/audit-cfb-pac-116-contribution-provenance-readonly.mjs
          node --check src/evidence/cfb-pac116-original-multicolumn-shadow-v2.mjs
          node --check scripts/audit-cfb-pac116-original-multicolumn-readonly.mjs
          node --import tsx --test tests/cfb-pac-contribution-provenance-v1.test.mjs tests/cfb-pac116-original-multicolumn-shadow-v2.test.mjs
          npm run check
  reviewed-main-presecret:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.after == github.sha &&
      github.event.head_commit.id == github.sha &&
      github.event.deleted != true &&
      github.event.forced != true &&
      contains(github.event.head_commit.message, 'SENATE_864_CFB_PAC_116_FINANCE_READONLY_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed main commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-fund --no-audit
      - name: Independent source and finance checks without Neon credentials
        run: |
          node --check src/evidence/cfb-pac-contribution-provenance-v1.mjs
          node --check scripts/audit-cfb-pac-116-contribution-provenance-readonly.mjs
          node --check src/evidence/cfb-pac116-original-multicolumn-shadow-v2.mjs
          node --check scripts/audit-cfb-pac116-original-multicolumn-readonly.mjs
          node --import tsx --test tests/cfb-pac-contribution-provenance-v1.test.mjs tests/cfb-pac116-original-multicolumn-shadow-v2.test.mjs
          npm run check
          npm audit --omit=dev --audit-level=high
  existing-neon-pac116-finance-readonly:
    needs: [reviewed-main-presecret]
    if: >-
      needs.reviewed-main-presecret.result == 'success' &&
      github.event_name == 'push' &&
      github.repository == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.after == github.sha &&
      github.event.head_commit.id == github.sha &&
      github.event.deleted != true &&
      github.event.forced != true &&
      contains(github.event.head_commit.message, 'SENATE_864_CFB_PAC_116_FINANCE_READONLY_V1')
    environment: evidence-readonly-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VOTEPREDICT_NEON_PROJECT_ID: ${{ vars.VOTEPREDICT_NEON_PROJECT_ID }}
      VOTEPREDICT_MEDIA_EXISTING_DATABASE: ${{ vars.VOTEPREDICT_MEDIA_EXISTING_DATABASE }}
      VOTEPREDICT_PAC_116_KEYLESS_PASSED: ${{ needs.reviewed-main-presecret.result == 'success' && 'true' || 'false' }}
      VOTEPREDICT_PAC_116_COMMIT_MARKER: ${{ contains(github.event.head_commit.message, 'SENATE_864_CFB_PAC_116_FINANCE_READONLY_V1') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify tested main head matches protected run
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-fund --no-audit
      - name: Audit 116 source-attested PAC donor contribution records to official original reports; READ ONLY
        run: node --import tsx scripts/audit-cfb-pac-116-contribution-provenance-readonly.mjs
      - name: Reconcile original CFB multicolumn PDF candidate spans across all receiving-committee contributions; READ ONLY
        run: node --import tsx scripts/audit-cfb-pac116-original-multicolumn-readonly.mjs
