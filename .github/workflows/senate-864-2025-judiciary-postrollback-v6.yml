name: One-shot #864 2025 Judiciary post-ROLLBACK numeric parity read-only V6
on:
  pull_request:
    paths:
      - scripts/senate-864-2025-judiciary-full-source-proof-v5.ts
      - scripts/audit-senate-864-2025-judiciary-full-source-neon-v5.ts
      - tests/senate-864-2025-judiciary-full-source-neon-v5.test.ts
      - tests/senate-864-2025-judiciary-v5-workflow-syntax.test.ts
      - .github/workflows/senate-864-2025-judiciary-postrollback-v6.yml
      - docs/evaluation/senate-864-2025-judiciary-8-choice-original-full-source-v5.md
      - scripts/audit-senate-864-2025-judiciary-postrollback-v6.ts
      - tests/senate-864-2025-judiciary-postrollback-v6.test.ts
      - tests/senate-864-2025-judiciary-v6-workflow-syntax.test.ts
      - docs/evaluation/senate-864-2025-judiciary-postrollback-numeric-v6.md
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: senate-864-2025-judiciary-v6-${{ github.sha }}
  cancel-in-progress: false
jobs:
  pr-synthetic-tests:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Offline V5 2025 source bridge and read-only receipt tests
        run: |
          node --import tsx --test tests/senate-864-2025-judiciary-full-source-neon-v5.test.ts
          node --import tsx --test tests/senate-864-2025-judiciary-v5-workflow-syntax.test.ts
          node --import tsx --test tests/senate-864-2025-judiciary-postrollback-v6.test.ts
          node --import tsx --test tests/senate-864-2025-judiciary-v6-workflow-syntax.test.ts
          node --import tsx --test tests/senate-864-protected-source-db-parity.test.ts
  pr-disposable-sql:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: votepredict
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d votepredict"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/votepredict
      VOTEPREDICT_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/votepredict
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run db:migrate
      - name: EXPLAIN unchanged three SELECTs without ANALYZE on disposable PostgreSQL
        run: node --import tsx scripts/verify-senate-864-source-db-sql-local.ts
  pinned-source-preflight:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict') ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.run_attempt == 1 &&
        contains(github.event.head_commit.message, 'SENATE_864_JUDICIARY_2025_POSTROLLBACK_NUMERIC_ONESHOT_20261012_V6')))
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Pin existing original government source artifact 1 of 20
        uses: actions/download-artifact@v4
        with:
          name: senate-committee-2022-original-action-source-metadata
          repository: killjoy00/votepredict
          run-id: 38066441841
          github-token: ${{ github.token }}
          path: artifacts
      - name: Pin existing original government source artifact 2 of 20
        uses: actions/download-artifact@v4
        with:
          name: senate-committee-2023-original-action-source-metadata
          repository: killjoy00/votepredict
          run-id: 38066441841
          github-token: ${{ github.token }}
          path: artifacts
      - name: Pin existing original government source artifact 3 of 20
        uses: actions/download-artifact@v4
        with:
          name: senate-committee-2024-original-action-source-metadata
          repository: killjoy00/votepredict
          run-id: 38066441841
          github-token: ${{ github.token }}
          path: artifacts
      - name: Pin existing original government source artifact 4 of 20
        uses: actions/download-artifact@v4
        with:
