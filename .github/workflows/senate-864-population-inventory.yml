name: Issue 864 population original inventory and public report branch
on:
  pull_request:
    paths:
      - .github/workflows/senate-864-population-inventory.yml
      - scripts/inventory-senate-864-population.mjs
      - scripts/publish-senate-864-population-reports.mjs
      - tests/senate-864-population-inventory.test.mjs
      - docs/evaluation/source-proof/senate-864-population-prior-inventory.json
      - docs/evaluation/source-proof/senate-864-population-acquired-cache-20261022.json.gz
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-864-population-inventory.yml
      - scripts/inventory-senate-864-population.mjs
      - scripts/publish-senate-864-population-reports.mjs
      - tests/senate-864-population-inventory.test.mjs
      - docs/evaluation/source-proof/senate-864-population-prior-inventory.json
      - docs/evaluation/source-proof/senate-864-population-acquired-cache-20261022.json.gz
permissions:
  contents: read
concurrency:
  group: senate864-population-inventory-${{ github.sha }}
  cancel-in-progress: false
jobs:
  independent-tests:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: votepredict
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d votepredict" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/votepredict
      VOTEPREDICT_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/votepredict
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run db:migrate
      - run: node --check scripts/inventory-senate-864-population.mjs
      - run: node --check scripts/publish-senate-864-population-reports.mjs
      - run: npm run check
      - run: node --import tsx --test tests/senate-864-population-inventory.test.mjs tests/senate-864-population-named-rolls.test.mjs tests/senate-864-population-complete-rows.test.mjs tests/senate-864-population-explicit-labels.test.mjs tests/senate-864-population-renewed-question.test.mjs
      - run: npm audit --omit=dev --audit-level=high
  protected-readonly-population-inventory:
    needs: independent-tests
    if: >-
      needs.independent-tests.result == 'success' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 && github.event.repository.full_name == 'killjoy00/votepredict' &&
      github.event.after == github.sha && github.event.head_commit.id == github.sha &&
      github.event.forced != true && github.event.deleted != true &&
      contains(github.event.head_commit.message, 'SENATE864_POPULATION_INVENTORY_V1')
    environment: evidence-readonly-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SENATE864_INVENTORY_REUSE_PUBLIC: ${{ contains(github.event.head_commit.message, 'SENATE864_POPULATION_INVENTORY_RECONCILE_V1') && 'true' || 'false' }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VOTEPREDICT_NEON_PROJECT_ID: ${{ vars.VOTEPREDICT_NEON_PROJECT_ID }}
      VOTEPREDICT_MEDIA_EXISTING_DATABASE: ${{ vars.VOTEPREDICT_MEDIA_EXISTING_DATABASE }}
      SENATE864_INDEPENDENT_MAIN: ${{ needs.independent-tests.result == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed main SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Install official PDF extraction prerequisites
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Authenticate population originals and compare source questions with READ ONLY production
        run: node --import tsx scripts/inventory-senate-864-population.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: senate864-public-population-reports
          path: |
            artifacts/senate864-population/senate-864-population-*.json
            artifacts/senate864-population/senate-864-population-*.csv
          if-no-files-found: error
          retention-days: 14
  public-report-review-branch:
    needs: protected-readonly-population-inventory
    if: >-
      needs.protected-readonly-population-inventory.result == 'success' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: senate864-public-population-reports
          path: public-reports
      - name: Validate fixed public reports and publish only to a new review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-senate-864-population-reports.mjs
