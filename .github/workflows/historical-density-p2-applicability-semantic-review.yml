name: Freeze 2021-22 P2 applicability semantic review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/evidence/historical-density-p2-applicability-semantic-review.ts
      - scripts/freeze-historical-density-p2-applicability-semantic-review.ts
      - tests/historical-density-p2-applicability-semantic-review.test.ts
      - .github/workflows/historical-density-p2-applicability-semantic-review.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-p2-applicability-semantic-review
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Run semantic-review unit tests
        run: node --import tsx --test tests/historical-density-p2-applicability-semantic-review.test.ts

      - name: Materialize immutable candidate audit
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11390705696/zip > "$RUNNER_TEMP/p2-applicability-candidate-audit.zip"
          echo "25fccbdac56f4f0598541e347a7af19e2c27ae3be7b89959f9e578087e370698  $RUNNER_TEMP/p2-applicability-candidate-audit.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/p2-applicability-candidate-audit"
          unzip -q "$RUNNER_TEMP/p2-applicability-candidate-audit.zip" historical-density-p2-applicability-candidate-audit-v1.json -d "$RUNNER_TEMP/p2-applicability-candidate-audit"

      - name: Freeze reviewed applicability decisions
        env:
          VOTEPREDICT_P2_APPLICABILITY_CANDIDATE_AUDIT_PATH: ${{ runner.temp }}/p2-applicability-candidate-audit/historical-density-p2-applicability-candidate-audit-v1.json
          VOTEPREDICT_P2_APPLICABILITY_SEMANTIC_REVIEW_OUTPUT_DIR: ${{ runner.temp }}/historical-density-p2-applicability-semantic-review
        run: node --import tsx scripts/freeze-historical-density-p2-applicability-semantic-review.ts

      - name: Verify frozen review boundary
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/historical-density-p2-applicability-semantic-review/historical-density-p2-applicability-semantic-review-v1.json"
          test "$(jq -r '.schemaVersion' "$file")" = 'historical-density-p2-applicability-semantic-review-v1'
          test "$(jq -r '.summary.candidateGroups' "$file")" = '65'
          test "$(jq -r '.summary.candidatePairs' "$file")" = '105'
          test "$(jq -r '.summary.decisions.applicable.groups' "$file")" = '2'
          test "$(jq -r '.summary.decisions.applicable.pairs' "$file")" = '2'
          test "$(jq -r '.summary.decisions.ambiguous_fail_closed.groups' "$file")" = '7'
          test "$(jq -r '.summary.decisions.ambiguous_fail_closed.pairs' "$file")" = '9'
          test "$(jq -r '.summary.decisions.not_applicable.groups' "$file")" = '56'
          test "$(jq -r '.summary.decisions.not_applicable.pairs' "$file")" = '94'
          test "$(jq -r '.summary.applicableRows' "$file")" = '2'
          test "$(jq -r '.policy.outcomeUse' "$file")" = 'none'
          test "$(jq -r '.policy.inputContainsVoteOutcomes' "$file")" = 'false'
          test "$(jq -r '.policy.sameDayVersionEligible' "$file")" = 'false'
          test "$(jq -r '.policy.productionDatabaseQueried' "$file")" = 'false'
          test "$(jq -r '.policy.vercelUsed' "$file")" = 'false'
          test "$(jq -r '.policy.mechanicallyActionable' "$file")" = 'false'
          test "$(jq -r '.policy.modelWeight' "$file")" = '0'
          test "$(jq -r '.policy.servingChanged' "$file")" = 'false'
          jq -e '.summary.applicableReviewKeys == ["gas_tax|HF1684|2021-04-22","school_choice_parental_control|SF2575|2022-03-03"]' "$file" >/dev/null

      - name: Upload immutable semantic-review artifact
        uses: actions/upload-artifact@v7
        with:
          name: historical-density-p2-applicability-semantic-review-v1
          path: ${{ runner.temp }}/historical-density-p2-applicability-semantic-review/*
          if-no-files-found: error
          retention-days: 30
