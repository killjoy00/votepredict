name: Public Senate media 3 reporter original quote variants

on:
  pull_request:
    paths:
      - .github/workflows/senate-media-3-reporter-original-quote-cues.yml
      - src/evidence/senate-media-three-reporter-original-quote-audit.ts
      - scripts/audit-senate-media-three-reporter-original-quote-cues.ts
      - tests/senate-media-three-reporter-original-quote-audit.test.ts
      - docs/evaluation/senate-media-three-independent-newsroom-historical-multi-speaker-queue-20261011.json
      - docs/evaluation/senate-media-2021-25-further-independent-reporting-15-leads.json
      - docs/evaluation/senate-media-2021-25-independent-reporter-15-historical-original-receipts-20261011.json
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: senate-media-three-reporter-historical-original-quotes
  cancel-in-progress: false

jobs:
  public-reporter-originals:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict' &&
          github.event.pull_request.head.ref == 'research/media-historic-multiple-speakers-and-reformer-aliases-20261011')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Verify exact original indexed SHA1 and pinned raw SHA256 on 6 historic newsroom captures
        run: |
          node --import tsx scripts/audit-senate-media-three-reporter-original-quote-cues.ts \
            --output artifacts/senate-media-three-reporter-original-quote-cues.json
      - name: Save digest receipt and 16 short historic phrase statuses, not full news text
        uses: actions/upload-artifact@v6
        with:
          name: senate-media-three-reporter-original-quote-cues
          path: artifacts/senate-media-three-reporter-original-quote-cues.json
          if-no-files-found: error
          retention-days: 7
