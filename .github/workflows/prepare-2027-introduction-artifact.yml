name: Prepare 2027 introduction artifact

on:
  workflow_dispatch:
    inputs:
      run_vercel:
        description: Explicitly allow this workflow to contact Vercel
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    if: inputs.run_vercel == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
    steps:
      - uses: actions/checkout@v7
      - name: Require production credential access
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN is unavailable. No 2027 artifact was prepared.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Read production authentication privately
        shell: bash
        run: |
          umask 077
          if ! npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1; then
            echo 'Could not read VotePredict production authentication. No 2027 artifact was prepared.'
            exit 1
          fi
      - name: Prepare frozen 2027-2028 introduction candidate
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/prepare-2027-introduction-serving-artifact.ts
      - name: Upload 2027-2028 candidate and integrity summary
        uses: actions/upload-artifact@v7
        with:
          name: introduction-v4-2027-2028-candidate
          path: |
            artifacts/introduction-v4-2027-2028.json
            artifacts/introduction-v4-2027-2028-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary credentials and Vercel logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env', 'vercel-pull.log']:
              Path(os.environ['RUNNER_TEMP'], name).unlink(missing_ok=True)
          PYTHON
