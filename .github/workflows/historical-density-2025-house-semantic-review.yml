name: Freeze 2025 House semantic review

on:
  pull_request:
    paths:
      - data/evaluation/evidence-quality/historical-density-2025-house-semantic-decisions-v1/**
      - scripts/freeze-historical-density-2025-house-semantic-review.ts
      - tests/historical-density-2025-house-semantic-review.test.ts
      - .github/workflows/historical-density-2025-house-semantic-review.yml
  push:
    branches: [main]
    paths:
      - data/evaluation/evidence-quality/historical-density-2025-house-semantic-decisions-v1/**
      - scripts/freeze-historical-density-2025-house-semantic-review.ts
      - tests/historical-density-2025-house-semantic-review.test.ts
      - .github/workflows/historical-density-2025-house-semantic-review.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-2025-house-semantic-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Test checked-in semantic decision gate
        run: node --import tsx --test tests/historical-density-2025-house-semantic-review.test.ts

      - name: Materialize immutable 2025 House semantic cohort
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11442499885/zip > "$RUNNER_TEMP/semantic-cohort.zip"
          echo "c8551e3690cb8d4a8a9cee2c0cc5b006a5b87d1e6c0baa6a7f6755aae2ee1662  $RUNNER_TEMP/semantic-cohort.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/semantic-cohort"
          unzip -q "$RUNNER_TEMP/semantic-cohort.zip" historical-density-2025-house-semantic-review-cohort-v1.json -d "$RUNNER_TEMP/semantic-cohort"

      - name: Freeze reviewed member-issue semantics
        env:
          VOTEPREDICT_2025_HOUSE_SEMANTIC_COHORT_PATH: ${{ runner.temp }}/semantic-cohort/historical-density-2025-house-semantic-review-cohort-v1.json
          VOTEPREDICT_2025_HOUSE_SEMANTIC_DECISION_DIR: data/evaluation/evidence-quality/historical-density-2025-house-semantic-decisions-v1
          VOTEPREDICT_2025_HOUSE_SEMANTIC_REVIEW_OUTPUT: ${{ runner.temp }}/historical-density-2025-house-semantic-review-v1.json
        run: node --import tsx scripts/freeze-historical-density-2025-house-semantic-review.ts

      - name: Verify semantic-review boundary
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/historical-density-2025-house-semantic-review-v1.json"
          test "$(jq -r '.schemaVersion' "$f")" = historical-density-2025-house-semantic-review-v1
          test "$(jq -r '.batchId' "$f")" = EQV1-HISTORICAL-DENSITY-2025-HOUSE-001
          test "$(jq -r '.summary.documents' "$f")" = 50
          test "$(jq -r '.summary.directionalDocuments' "$f")" = 46
          test "$(jq -r '.summary.nonDirectionalDocuments' "$f")" = 4
          test "$(jq -r '.summary.uniqueSemanticGroups' "$f")" = 46
          test "$(jq -r '.summary.novelSemanticGroups' "$f")" = 46
          test "$(jq -r '.summary.crossBatchDuplicateSemanticGroups' "$f")" = 0
          test "$(jq -r '.summary.candidateBillIdentifiers' "$f")" = 0
          test "$(jq -r '.summary.internalMembershipIdentitiesResolved' "$f")" = 0
          jq -e '[.semanticGroups[].candidateBillIdentifiers | length] | add == 0' "$f" >/dev/null
          jq -e '[.semanticGroups[].novelForApplicabilityScreen] | all(. == true)' "$f" >/dev/null
          jq -e '[.semanticGroups[].internalMembershipIdentityResolved] | all(. == false)' "$f" >/dev/null
          test "$(jq -r '.policy.outcomeUse' "$f")" = none
          test "$(jq -r '.policy.billInference' "$f")" = false
          test "$(jq -r '.policy.targetBillApplicabilityInferred' "$f")" = false
          test "$(jq -r '.policy.internalMembershipIdentityResolved' "$f")" = false
          test "$(jq -r '.policy.internalIdentityResolutionRequiredBeforeFeatureIntegration' "$f")" = true
          test "$(jq -r '.policy.productionDatabaseQueried' "$f")" = false
          test "$(jq -r '.policy.vercelUsed' "$f")" = false
          test "$(jq -r '.policy.modelFitting' "$f")" = none
          test "$(jq -r '.policy.servingChanged' "$f")" = false
          {
            echo '## 2025-26 House semantic review'
            echo
            echo '- Frozen documents: **50**'
            echo '- Directional: **46**'
            echo '- Non-directional/fail-closed: **4**'
            echo '- Novel semantic groups: **46**'
            echo '- Candidate bill identifiers: **0**'
            echo '- Internal membership IDs resolved: **0**'
            echo '- Outcomes used: **none**'
            echo '- Production DB queried: **no**'
            echo '- Vercel used: **no**'
            echo '- Model fitting: **none**'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: historical-density-2025-house-semantic-review-v1
          path: ${{ runner.temp }}/historical-density-2025-house-semantic-review-v1.json
          if-no-files-found: error
          retention-days: 90
