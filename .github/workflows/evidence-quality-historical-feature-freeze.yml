name: Freeze Evidence Quality historical feature matrix

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  actions: read

concurrency:
  group: >-
    ${{ startsWith(github.event.comment.body, '[evidence-quality-feature-matrix-freeze]')
        && 'evidence-quality-feature-matrix-freeze'
        || format('evidence-quality-feature-matrix-freeze-skip-{0}', github.event.comment.id) }}
  cancel-in-progress: false

jobs:
  freeze:
    if: >-
      github.event.issue.number == 579 &&
      github.event.comment.user.login == 'killjoy00' &&
      startsWith(github.event.comment.body, '[evidence-quality-feature-matrix-freeze]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Materialize immutable historical target universe without outcomes
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11252079484/zip > "$RUNNER_TEMP/historical-closeout.zip"
          echo "22e8944cffc6fda553b05ea6ad5e92400d35fc01d83177efdd5d1204dd3c5a6f  $RUNNER_TEMP/historical-closeout.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/historical-closeout"
          unzip -q "$RUNNER_TEMP/historical-closeout.zip" historical-as-of-matrix-v1.ndjson.gz -d "$RUNNER_TEMP/historical-closeout"
          echo "d8a9735a514f427508a7a37303ba312dcac3f929a51aa05a1aba32a76b384637  $RUNNER_TEMP/historical-closeout/historical-as-of-matrix-v1.ndjson.gz" | sha256sum -c -
          python - <<'PYTHON'
          import gzip, hashlib, json, os
          src=os.path.join(os.environ['RUNNER_TEMP'],'historical-closeout','historical-as-of-matrix-v1.ndjson.gz')
          dst=os.path.join(os.environ['RUNNER_TEMP'],'evidence-quality-target-universe-v1.ndjson')
          keys=[]
          count=0
          with gzip.open(src,'rt',encoding='utf-8') as fh, open(dst,'w',encoding='utf-8') as out:
              for line in fh:
                  row=json.loads(line)
                  target={k:row[k] for k in ['voteEventId','membershipId','legislatorId','session','chamber','occurredOn','billId','identifier','eventStatus']}
                  out.write(json.dumps(target,separators=(',',':'))+'\n')
                  keys.append(row['voteEventId']+'|'+row['membershipId'])
                  count+=1
          digest=hashlib.sha256(('\n'.join(sorted(keys))+'\n').encode()).hexdigest()
          if count != 135457: raise SystemExit(f'row count mismatch: {count}')
          if digest != '3aa47101f9e4a848e293fdaa89ef853919d49826b68ae90960370c5c19e9df72':
              raise SystemExit(f'row-key digest mismatch: {digest}')
          print(json.dumps({'targetRows':count,'rowKeySha256':digest}))
          PYTHON

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Require exact Evidence Quality migration state
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/apply-evidence-quality-migration.ts

      - name: Freeze outcome-blind Evidence Quality features
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_EQ_TARGET_UNIVERSE_PATH: ${{ runner.temp }}/evidence-quality-target-universe-v1.ndjson
          VOTEPREDICT_EQ_MATRIX_OUTPUT_DIR: ${{ runner.temp }}/evidence-quality-historical-feature-freeze
        run: node --import tsx scripts/freeze-evidence-quality-historical-features.ts

      - name: Upload frozen feature artifact
        uses: actions/upload-artifact@v7
        with:
          name: evidence-quality-historical-feature-freeze-v1
          path: ${{ runner.temp }}/evidence-quality-historical-feature-freeze/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary credentials and source artifact
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/votepredict-production.env" "$RUNNER_TEMP/vercel-pull.log" "$RUNNER_TEMP/historical-closeout.zip"
