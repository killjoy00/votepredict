name: Freeze 2023-24 Senate top-20 semantic review tranche 10

on:
  pull_request:
    paths:
      - data/evaluation/evidence-quality/historical-density-2023-24-senate-top20-semantic-review-tranche-10-decisions-v1.json
      - scripts/freeze-historical-density-2023-24-senate-top20-semantic-review-tranche-10.mjs
      - tests/historical-density-2023-24-senate-top20-semantic-review-tranche-10.test.ts
      - .github/workflows/historical-density-2023-24-senate-top20-semantic-review-tranche-10.yml
  push:
    branches: [main]
    paths:
      - data/evaluation/evidence-quality/historical-density-2023-24-senate-top20-semantic-review-tranche-10-decisions-v1.json
      - scripts/freeze-historical-density-2023-24-senate-top20-semantic-review-tranche-10.mjs
      - tests/historical-density-2023-24-senate-top20-semantic-review-tranche-10.test.ts
      - .github/workflows/historical-density-2023-24-senate-top20-semantic-review-tranche-10.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-2023-24-senate-top20-semantic-review-tranche-10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Test checked-in outcome-blind decisions
        run: node --import tsx --test tests/historical-density-2023-24-senate-top20-semantic-review-tranche-10.test.ts

      - name: Materialize canonical 2023-24 Senate overlap
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11501649286/zip > "$RUNNER_TEMP/overlap.zip"
          echo "c5ed67e03a2aabb7b41df147beb2d4e814b6db834055387efaf716e3b6ac3f42  $RUNNER_TEMP/overlap.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/overlap"
          unzip -q "$RUNNER_TEMP/overlap.zip" historical-density-2023-24-senate-electronic-minute-target-overlap-v1.json -d "$RUNNER_TEMP/overlap"

      - name: Materialize canonical top-20 source metadata
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11502134219/zip > "$RUNNER_TEMP/source.zip"
          echo "bb6318582f5fb01e9078fbaa6c2b67c43274ca4b4f8f6ced95aa7f9625975d50  $RUNNER_TEMP/source.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q "$RUNNER_TEMP/source.zip" historical-density-2023-24-senate-electronic-minute-top20-freeze-v1.json -d "$RUNNER_TEMP/source"

      - name: Materialize canonical #792 frozen text
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11502902302/zip > "$RUNNER_TEMP/text.zip"
          echo "c73031633618f4a599a8e1ae1147eb9cd2b429db229335dccef14961a3aa835c  $RUNNER_TEMP/text.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/text"
          unzip -q "$RUNNER_TEMP/text.zip" \
            historical-density-2023-24-senate-top20-text-extraction-v1.json \
            texts/5cbc8cdcce8b29fd795bc7a615e401f2bcf78cc17ba80fa5bd08cb9f7734d067.txt \
            -d "$RUNNER_TEMP/text"

      - name: Freeze semantic review tranche 10
        env:
          VOTEPREDICT_SENATE_2023_24_OVERLAP_PATH: ${{ runner.temp }}/overlap/historical-density-2023-24-senate-electronic-minute-target-overlap-v1.json
          VOTEPREDICT_SENATE_2023_24_TOP20_FREEZE_PATH: ${{ runner.temp }}/source/historical-density-2023-24-senate-electronic-minute-top20-freeze-v1.json
          VOTEPREDICT_SENATE_2023_24_TOP20_TEXT_EXTRACTION_PATH: ${{ runner.temp }}/text/historical-density-2023-24-senate-top20-text-extraction-v1.json
          VOTEPREDICT_SENATE_2023_24_TOP20_SEMANTIC_DECISIONS_PATH: data/evaluation/evidence-quality/historical-density-2023-24-senate-top20-semantic-review-tranche-10-decisions-v1.json
          VOTEPREDICT_SENATE_2023_24_TOP20_SEMANTIC_OUTPUT_DIR: ${{ runner.temp }}/review
        run: node scripts/freeze-historical-density-2023-24-senate-top20-semantic-review-tranche-10.mjs

      - name: Verify frozen semantic-review boundary
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/review/historical-density-2023-24-senate-top20-semantic-review-tranche-10-packet-v1.json"
          review="$RUNNER_TEMP/review/historical-density-2023-24-senate-top20-semantic-review-tranche-10-v1.json"
          test "$(jq -r '.schemaVersion' "$packet")" = historical-density-2023-24-senate-top20-semantic-review-tranche-10-packet-v1
          test "$(jq -r '.scope.documents' "$packet")" = 1
          test "$(jq -r '.scope.reviewRows' "$packet")" = 3
          test "$(jq -r '.scope.candidateBills' "$packet")" = 3
          test "$(jq -r '.reviewKeySha256' "$packet")" = 72ba18a2907dd6fc9e4b6777913edcedd2844fa7c3d33b6115d6a554291725dc
          test "$(jq -r '.reviewPacketProofSha256' "$packet")" = f830d00ddc67deefb736685c9633c5698a969e0fda65364c445b7e32f4d9b832
          test "$(jq -r '.schemaVersion' "$review")" = historical-density-2023-24-senate-top20-semantic-review-tranche-10-v1
          test "$(jq -r '.summary.decisions.not_applicable_to_candidate_bill' "$review")" = 3
          test "$(jq -r '.summary.decisions.bill_context_only_no_member_direction' "$review")" = 0
          test "$(jq -r '.summary.decisions.directional_member_statement' "$review")" = 0
          test "$(jq -r '.summary.decisions.ambiguous_fail_closed' "$review")" = 0
          test "$(jq -r '.summary.mechanicallyActionableRows' "$review")" = 0
          test "$(jq -r '.reviewedRowProofSha256' "$review")" = 914502c90a46f5604d4d63e23c71f0f3fa3e75c4d654a76f1a4d89942e5484dd
          test "$(jq -r '.reviewProofSha256' "$review")" = 6b339ec6c866b7f4db02b6747d6baf8b2bfa0c8cae9c139c11076f32e4b90626
          test "$(jq -r '.policy.targetVoteOutcomesRead' "$review")" = false
          test "$(jq -r '.policy.proceduralActionUsedAsDirectionalStance' "$review")" = false
          test "$(jq -r '.policy.productionDatabaseQueried' "$review")" = false
          test "$(jq -r '.policy.featureRowsWritten' "$review")" = false
          test "$(jq -r '.policy.modelFitting' "$review")" = none
          test "$(jq -r '.policy.servingChanged' "$review")" = false
          test "$(jq -r '.policy.vercelUsed' "$review")" = false
          test "$(jq -r '.policy.mechanicallyActionable' "$review")" = false
          {
            echo '## 2023-24 Senate top-20 semantic review — tranche 10'
            echo
            echo '- Canonical documents reviewed: **1** (rank 10)'
            echo '- Candidate target events reviewed: **3** across **3** bills'
            echo '- Not applicable to candidate bill: **3**'
            echo '- Bill context only / no member direction: **0**'
            echo '- Directional member statements: **0**'
            echo '- Ambiguous / fail-closed: **0**'
            echo '- Mechanically actionable rows: **0**'
            echo '- Outcome use: **none**'
            echo '- Production DB / feature writes / model / serving changes: **none**'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: historical-density-2023-24-senate-top20-semantic-review-tranche-10-v1
          path: ${{ runner.temp }}/review/*
          if-no-files-found: error
          retention-days: 90
