name: Historical source smoke

on:
  push:
    branches: [fix/history-live-load]
    paths:
      - '.github/workflows/history-source-smoke.yml'
      - 'src/sources/minnesota/senate-journals.ts'
      - 'src/sources/minnesota/revisor.ts'
      - 'scripts/ingest-senate-history.ts'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-fund --no-audit
      - id: senate302
        name: Smoke Senate 2025-26
        continue-on-error: true
        run: npm run data:senate:ingest -- --dry-run --session 302 --limit 1 --delay-ms 1
      - id: senate300
        name: Smoke Senate 2023-24
        if: always()
        continue-on-error: true
        run: npm run data:senate:ingest -- --dry-run --session 300 --limit 1 --delay-ms 1
      - id: senate257
        name: Smoke Senate 2021-22
        if: always()
        continue-on-error: true
        run: npm run data:senate:ingest -- --dry-run --session 257 --limit 1 --delay-ms 1
      - id: senatepassage
        name: Smoke known Senate passage journals
        if: always()
        continue-on-error: true
        run: |
          npx tsx -e "import { fetchSenateJournal, parseSenateJournalText } from './src/sources/minnesota/senate-journals.ts'; void (async () => { const checks = [ {key:'302',date:'2026-04-13',url:'https://www.senate.mn/journals/2025-2026/20260413056.pdf'}, {key:'300',date:'2024-04-08',url:'https://www.senate.mn/journals/2023-2024/20240408099.pdf'}, {key:'257',date:'2021-04-27',url:'https://www.senate.mn/journals/2021-2022/20210427047.pdf',knownMemberNames:['Fateh','Kunesh','McEwen','Murphy','Torres Ray']} ]; for (const check of checks) { const doc = await fetchSenateJournal(check.url); const events = parseSenateJournalText({ text: doc.text, sessionKey: check.key, sourceUrl: check.url, occurredOn: check.date, knownMemberNames: check.knownMemberNames }); if (events.length < 1) throw new Error('no passage events parsed from '+check.url); console.log(check.key, events.length, events[0].billIdentifier, events[0].yeaCount+'-'+events[0].nayCount); } })();"
      - id: revisor
        name: Smoke Revisor across target sessions
        if: always()
        continue-on-error: true
        run: |
          npx tsx -e "import { fetchRevisorBill } from './src/sources/minnesota/revisor.ts'; void (async () => { for (const key of ['302','300','257']) { const result = await fetchRevisorBill(key, 'HF1', false); if (!result.sourceUrl) throw new Error('missing Revisor source for '+key); console.log(key, result.sourceUrl, result.currentVersion ?? 'no-version'); } })();"
      - name: Require all source smokes
        if: always()
        shell: bash
        run: |
          test '${{ steps.senate302.outcome }}' = success
          test '${{ steps.senate300.outcome }}' = success
          test '${{ steps.senate257.outcome }}' = success
          test '${{ steps.senatepassage.outcome }}' = success
          test '${{ steps.revisor.outcome }}' = success
