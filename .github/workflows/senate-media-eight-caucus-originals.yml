name: Public 2021-25 eight individual first-party Senate original statement proofs

# Issue #987. Selected first-party publisher sources and exact independently
# indexed historical HTML originals. No licensed full articles, transcripts,
# private source_docs, database rows, original media or production code writes.
on:
  pull_request:
    paths:
      - .github/workflows/senate-media-eight-caucus-originals.yml
      - scripts/probe-senate-media-eight-caucus-originals.mjs
      - tests/senate-media-eight-caucus-originals.test.mjs
      - tests/senate-media-eight-caucus-real-receipts.test.mjs
      - docs/evaluation/senate-media-eight-caucus-originals-20261011.json
      - docs/evaluation/senate-media-eight-caucus-originals-20261011.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: senate-media-eight-caucus-originals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  eight-first-party-historical-originals:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict' &&
          github.event.pull_request.head.ref == 'research/media-eight-first-party-originals-2021-25-20261012')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Offline exact URLs, named individual senator identities, index SHA, redirects and false global absence
        run: node --test tests/senate-media-eight-caucus-originals.test.mjs tests/senate-media-eight-caucus-real-receipts.test.mjs
      - name: Bounded current public first-party and original Wayback plus selected Common Crawl indexed historical HTML
        run: node scripts/probe-senate-media-eight-caucus-originals.mjs --output artifacts/senate-media-eight-original-sources.json
      - name: Upload only capture UTC, original SHA/bytes and named short-cue attribution flags
        uses: actions/upload-artifact@v6
        with:
          name: senate-media-eight-caucus-public-originals
          path: artifacts/senate-media-eight-original-sources.json
          retention-days: 7
          if-no-files-found: error
