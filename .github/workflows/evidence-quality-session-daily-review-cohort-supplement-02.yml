name: Export supplemental Session Daily semantic review cohort

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  actions: read

concurrency:
  group: >-
    ${{ startsWith(github.event.comment.body, '[evidence-quality-session-daily-review-cohort-supplement-02]')
        && 'evidence-quality-session-daily-review-cohort-supplement-02'
        || format('evidence-quality-session-daily-review-cohort-supplement-02-skip-{0}', github.event.comment.id) }}
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.event.issue.number == 579 &&
      github.event.comment.user.login == 'killjoy00' &&
      startsWith(github.event.comment.body, '[evidence-quality-session-daily-review-cohort-supplement-02]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Materialize final canonical archive proof v2
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11316021651/zip > "$RUNNER_TEMP/archive-canonical-v2.zip"
          echo "05aaeca085fa1d48a85a3226565eaad627bce8d33c248c055ac4e9963fffdc44  $RUNNER_TEMP/archive-canonical-v2.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/archive-canonical-v2"
          unzip -q "$RUNNER_TEMP/archive-canonical-v2.zip" -d "$RUNNER_TEMP/archive-canonical-v2"

      - name: Materialize prior Session Daily review cohort
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11314817215/zip > "$RUNNER_TEMP/session-daily-review-001.zip"
          echo "203e98ddf610af528cac0fd7d697737983ee1a6affa45437d2a688c83ca7ee46  $RUNNER_TEMP/session-daily-review-001.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/session-daily-review-001"
          unzip -q "$RUNNER_TEMP/session-daily-review-001.zip" -d "$RUNNER_TEMP/session-daily-review-001"

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Export read-only supplemental semantic review cohort
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_EQ_ARCHIVE_PROOF_CANONICAL_V2_PATH: ${{ runner.temp }}/archive-canonical-v2/evidence-quality-pre-vote-archive-proof-canonical-v2.json
          VOTEPREDICT_EQ_ARCHIVE_PROOF_ARTIFACT_ID: "11316021651"
          VOTEPREDICT_EQ_ARCHIVE_PROOF_ARTIFACT_DIGEST: "sha256:05aaeca085fa1d48a85a3226565eaad627bce8d33c248c055ac4e9963fffdc44"
          VOTEPREDICT_EQ_ARCHIVE_PROOF_RUN_ID: "37236630590"
          VOTEPREDICT_EQ_SESSION_DAILY_PRIOR_COHORT_PATH: ${{ runner.temp }}/session-daily-review-001/evidence-quality-session-daily-review-cohort-v1.json
          VOTEPREDICT_EQ_SESSION_DAILY_PRIOR_COHORT_ARTIFACT_ID: "11314817215"
          VOTEPREDICT_EQ_SESSION_DAILY_PRIOR_COHORT_ARTIFACT_DIGEST: "sha256:203e98ddf610af528cac0fd7d697737983ee1a6affa45437d2a688c83ca7ee46"
          VOTEPREDICT_EQ_SESSION_DAILY_PRIOR_COHORT_RUN_ID: "37233894771"
          VOTEPREDICT_EQ_SESSION_DAILY_SUPPLEMENTAL_REVIEW_DIR: ${{ runner.temp }}/evidence-quality-session-daily-review-cohort-supplement-02
        run: node --import tsx scripts/export-evidence-quality-session-daily-review-cohort-supplement-02.ts

      - name: Upload frozen supplemental review cohort
        uses: actions/upload-artifact@v7
        with:
          name: evidence-quality-session-daily-review-cohort-supplement-02
          path: ${{ runner.temp }}/evidence-quality-session-daily-review-cohort-supplement-02/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary credentials and input artifacts
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/votepredict-production.env" "$RUNNER_TEMP/vercel-pull.log" "$RUNNER_TEMP/archive-canonical-v2.zip" "$RUNNER_TEMP/session-daily-review-001.zip"
