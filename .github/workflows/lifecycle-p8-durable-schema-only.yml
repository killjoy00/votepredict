name: '#310 P8 durable capture ledger schema-only installation'
on:
  pull_request:
    paths:
      - migrations/0036_lifecycle_p8_durable_daily_capture.sql
      - src/evaluation/lifecycle-p8-capture-health.ts
      - src/evaluation/lifecycle-p8-durable-store.ts
      - scripts/deploy-lifecycle-p8-durable-schema-neon.ts
      - tests/lifecycle-p8-durable-store.test.ts
      - .github/workflows/lifecycle-p8-durable-schema-only.yml
  push:
    branches: [main]
    paths:
      - migrations/0036_lifecycle_p8_durable_daily_capture.sql
      - scripts/deploy-lifecycle-p8-durable-schema-neon.ts
      - .github/workflows/lifecycle-p8-durable-schema-only.yml
permissions:
  contents: read
concurrency:
  group: lifecycle-p8-durable-schema-only-${{ github.sha }
  cancel-in-progress: false
jobs:
  keyless-pr:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: votepredict
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d votepredict"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
      VOTEPREDICT_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Apply all migrations to disposable local PostgreSQL
        run: npm run db:migrate
      - name: Authenticate exact schema ledger on local PostgreSQL
        run: node --import tsx scripts/check-production-migration-drift.ts
      - name: Verify real append-only concurrency / alerts and guarded schema script
        run: node --import tsx --test tests/lifecycle-p8-durable-store.test.ts
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
  independent-main:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.repository.full_name == 'killjoy00/votepredict' &&
      github.event.after == github.sha &&
      github.event.head_commit.id == github.sha &&
      github.event.deleted != true &&
      github.event.forced != true &&
      contains(github.event.head_commit.message, 'LIFECYCLE_P8_DURABLE_SCHEMA_ONLY_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 28
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: votepredict
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d votepredict"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
      VOTEPREDICT_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }
          persist-credentials: false
      - name: Require reviewed merge commit
        env:
          EXPECTED_SHA: ${{ github.sha }
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run db:migrate
      - run: node --import tsx scripts/check-production-migration-drift.ts
      - run: node --import tsx --test tests/lifecycle-p8-durable-store.test.ts
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
  protected-existing-neon-schema-only:
    needs: independent-main
    if: >-
      needs.independent-main.result == 'success' &&
      github.event_name == 'push' &&
      github.repository == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.repository.full_name == 'killjoy00/votepredict' &&
      github.event.after == github.sha &&
      github.event.head_commit.id == github.sha &&
      github.event.deleted != true &&
      github.event.forced != true &&
      contains(github.event.head_commit.message, 'LIFECYCLE_P8_DURABLE_SCHEMA_ONLY_V1')
    environment: evidence-readonly-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }
      VOTEPREDICT_NEON_PROJECT_ID: ${{ vars.VOTEPREDICT_NEON_PROJECT_ID }
      VOTEPREDICT_MEDIA_EXISTING_DATABASE: ${{ vars.VOTEPREDICT_MEDIA_EXISTING_DATABASE }
      VOTEPREDICT_P8_SCHEMA_INDEPENDENT_CI: ${{ needs.independent-main.result == 'success' && 'true' || 'false' }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }
          persist-credentials: false
      - name: Confirm exact accepted marker-bearing main SHA
        env:
          EXPECTED_SHA: ${{ github.sha }
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Install exact additive P8 schema only and verify empty immutable ledger
        run: node --import tsx scripts/deploy-lifecycle-p8-durable-schema-neon.ts
