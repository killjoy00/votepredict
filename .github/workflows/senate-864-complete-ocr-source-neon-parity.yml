                'original_named_choices_mismatch','unresolved_persisted_member_identity',
                'persisted_vote_event_not_matched_to_source'];
              if(!r.mismatchDocumentCountsByCategory
                ||JSON.stringify(Object.keys(r.mismatchDocumentCountsByCategory).sort())!==JSON.stringify(names.sort()))
                throw Error('Untrusted mismatch classifier keys');
              lines.push('','**Parser-scoped PDF mismatch categories (non-additive; key-only original can appear as unrecognized persisted event):**');
