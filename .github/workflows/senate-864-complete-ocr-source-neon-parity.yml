name: One-shot #864 ALL 1452 original Minnesota Senate PDF SHA vs protected Neon
on:
  pull_request:
    paths:
      - scripts/merge-senate-864-ocr-207-original-proof-metadata.ts
      - scripts/audit-senate-864-protected-source-db-parity-v2.ts
      - scripts/audit-senate-864-protected-source-db-parity.ts
      - src/evidence/senate-864-source-db-sanitized-compare.ts
      - tests/senate-864-ocr-complete-source-parity.test.ts
      - tests/senate-864-ocr-choice-discrepancy.test.ts
      - docs/evaluation/source-proof/senate-864-v1-protected-committee-source-db-parity-receipt.json
      - .github/workflows/senate-864-complete-ocr-source-neon-parity.yml
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: senate-864-original-207-ocr-neon-parity-${{ github.sha }}
  cancel-in-progress: false
jobs:
  pr-safety-tests:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Pure source provenance, protected comparator and vote hold tests only
        run: |
          node --import tsx --test tests/senate-864-ocr-complete-source-parity.test.ts
          node --import tsx --test tests/senate-864-ocr-choice-discrepancy.test.ts
          node --import tsx --test tests/senate-864-protected-source-db-parity.test.ts
          node --import tsx --test tests/senate-864-v5-protected-baseline.test.ts
  pr-disposable-sql:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: votepredict
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d votepredict"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/votepredict
      VOTEPREDICT_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/votepredict
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run db:migrate
      - name: EXPLAIN immutable source/event/member SELECTs, never ANALYZE or Neon
        run: node --import tsx scripts/verify-senate-864-source-db-sql-local.ts
