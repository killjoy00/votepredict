      issues: write
    env:
      VERIFY_RESULT: ${{ needs.main-presecret-independent-proof.result }}
      PROTECTED_RESULT: ${{ needs.protected-existing-neon-readonly.result }}
      SAFE_RESULT: ${{ needs.protected-existing-neon-readonly.outputs.public_full_ocr_parity_b64 }}
      SAFE_PHASE: ${{ needs.protected-existing-neon-readonly.outputs.safe_failure_phase }}
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const header=[
              '## #864 — Full 1,452 independent original Senate committee PDF SHA-to-Neon V2 audit',
              '**Main SHA:** '+process.env.GITHUB_SHA,
              '**Protected run:** https://github.com/killjoy00/votepredict/actions/runs/'+process.env.GITHUB_RUN_ID,
              '**Immutable original provenance:** 4 original embedded PDF artifacts plus all 16 OCR metadata artifacts; SHA verified before any Neon key.',
            ];
            let body;
            if(process.env.VERIFY_RESULT==='failure'){
              body=[...header,'','**PRE-SECRET HOLD:** Original manifest SHA, full check, source comparator or disposable SQL plan failed. Protected Neon key was NOT accessed. No source/DB match claim.'].join('\n');
            }else if(process.env.PROTECTED_RESULT==='failure'){
              const stage=process.env.SAFE_PHASE||'not_reported';
              if(!/^[a-z_]{1,80}$/.test(stage))throw Error('unsafe stage');
              body=[...header,'','**PROTECTED AUDIT FAILED CLOSED:** phase '+stage+'. No new match claim and no database repair authorized.'].join('\n');
            }else if(process.env.PROTECTED_RESULT==='success'){
              const enc=process.env.SAFE_RESULT||'';
              if(!/^[A-Za-z0-9+/=]+$/.test(enc)||enc.length>40000)
                throw Error('unsafe result length/encoding');
              const r=JSON.parse(Buffer.from(enc,'base64').toString('utf8'));
              const n=v=>{
                if(typeof v!=='number'||!Number.isSafeInteger(v)||v<0||v>100000000)
                  throw Error('invalid sanitized metric');
                return v;
              };
              if(r.schemaVersion!=='mn-864-senate-committee-all-1452-original-sha-ocr-neon-parity-v2'
                ||r.issue!==864||r.status!=='verified_default_neon_branch_original_to_stored_source_audit'
                ||r.pinnedOfficialOriginalSourceRun!==38066441841
                ||r.transactionRollbackCompleted!==true
                ||r.noDatabaseMutations!==true
                ||r.protectedTransactionReadOnly!==true
                ||r.authenticatedNeonDefaultBranch!==true
                ||r.deployedProductionBindingIndependentlyVerified!==false
                ||r.noPrivateRawRowExports!==true
                ||r.noRawDatabaseRowsOrSourceNamesEmitted!==true
                ||r.sourceContextActionsReconciled!==false
                ||r.fullHistoricalReconciliationCertified!==false
                ||r.neverEligibleForPredictionFromThisAudit!==true
                ||r.noHistoricalAvailabilityOrAsOfPredictionCertification!==true
                ||r.one2025OriginalRollRemainsKeyOnlyNoTallyOrNamedDigest!==true
                ||JSON.stringify(r.scopeYears)!=='[2022,2023,2024,2025]'
                ||n(r.sourceOriginalPdfUrlReferences)!==1452
                ||n(r.originalPdfsWithIndependentRawPdfSha)!==1452
                ||n(r.originalPdfsWithoutIndependentRawPdfSha)!==0
                ||n(r.sourceCandidateRollCallEvents)!==152
                ||n(r.sourceCandidateNamedChoiceTokens)!==981)
                throw Error('Original cohort/provenance or protected transaction scope not verified');
              const o=r.originalSourceAndOcrScope,k=r.keyOnlyOriginalEventVerification,
                d=r.originalVsPersistedNamedChoiceDigestDiscrepancy;
              if(!o||!k||!d
                ||n(o.originalLowTextPdfsWithOcrPdfHashesRecovered)!==207
                ||n(o.metadataArtifactCount)!==16
                ||n(o.allOriginalCandidateRollsIncludingKeyOnly)!==153
                ||n(o.totalSourceNamedChoiceTokens)!==989
                ||n(k.sourceRecognizedButOriginalTallyOrNameDigestsUnavailable)!==1
                ||n(k.sourceKeyOnlyNamedChoiceTokens)!==8
                ||o.originalPdfSourceParserNotAnOfficialAllMotionsDenominator!==true)
                throw Error('OCR supplemental original source identity cannot be proven');
              const lines=[...header,'',
                '**Protected outcome:** reviewed exact-main read-only Neon default branch, source comparison in memory, repeatable-read transaction explicitly ROLLED BACK. Zero private row exports or database writes.',
                '**Scope holds:** deployed production binding, 2021 print minutes, 2022 print/electronic reconciliation, 141 electronic meetings with no linked minutes, all official motions, context-only evidence items, membership service dates and other source families NOT certified.',
                '',
                '- Authenticated electronic original PDF references: '+n(r.sourceOriginalPdfUrlReferences),
                '- Original raw PDF SHA independently known including all 207 OCR recovery sources: '+n(r.originalPdfsWithIndependentRawPdfSha),
                '- Original URL identities with exactly one stored source row: '+n(r.sourceExactUrlOneToOne),
                '- Matching original PDF raw byte SHA and stored document hash: '+n(r.sourceParsedRawPdfShaMatches),
                '- Original PDF raw SHA mismatches: '+n(r.sourceParsedRawPdfShaMismatches),
                '- Original URLs absent from stored documents: '+n(r.originalUrlsAbsentFromStoredRecords),
                '- Duplicate persisted source URLs: '+n(r.duplicateStoredUrlsForOriginals),
                '- Stored original-minutes rows outside authenticated source cohort: '+n(r.storedRowsOutsideOriginalUrlSet),
                '',
                '- Fully comparable candidate recorded rolls with source tally/name SHA proofs: '+n(r.sourceCandidateRollCallEvents),
                '- Fully matching candidate rolls: '+n(r.matchedCandidateRollCallEvents),
                '- Original named-choice tokens on fully detailed candidate rolls: '+n(r.sourceCandidateNamedChoiceTokens),
                '- Original named-choice tokens on fully matching rolls: '+n(r.matchingCandidateNamedChoiceTokensWithNonNullMembership),
                '- Original candidate rolls with ONLY original external-key/count, no original tally or name digests: '+n(k.sourceRecognizedButOriginalTallyOrNameDigestsUnavailable),
                '- Key-only original rolls whose stored event key, source URL/hash and day match: '+n(k.persistedExactKeyAndHearingDateMatches),
                '- Key-only original rolls with matched stored choice row COUNT (identities NOT authenticated): '+n(k.persistedKeyDateAndChoiceCountMatches),
                '- Key-only original named choice tokens excluded from identity verification: '+n(k.sourceKeyOnlyNamedChoiceTokens),
                '- Total candidate rolls including key-only original: '+n(o.allOriginalCandidateRollsIncludingKeyOnly),
                '- Total source named-choice tokens including key-only original: '+n(o.totalSourceNamedChoiceTokens),
                '- Persisted committee vote events: '+n(r.persistedCommitteeVoteEvents),
                '- Persisted committee member vote rows: '+n(r.persistedCommitteeMemberVoteRows),
                '',
                '**Named-choice mismatch decomposition for source-tally-verified rolls:**',
                '- Rolls with choice digest mismatch: '+n(d.sourceRollEventsWithNamedChoiceMismatch),
                '- Original named choice tokens on those rolls: '+n(d.originalNamedTokensInThoseRolls),
                '- Persisted choice tokens on those rolls: '+n(d.persistedNamedTokensInThoseRolls),
                '- Exact digest intersection tokens: '+n(d.exactChoiceDigestIntersectionTokensInThoseRolls),
                '- Original tokens absent from stored SHA multiset: '+n(d.originalNamedChoiceTokensAbsentFromPersistedDigestSet),
                '- Stored SHA tokens absent from original multiset: '+n(d.storedNamedChoiceTokensNotInOriginalDigestSet),
                '',
                '**Per-year source/DB numerical comparison:**'];
              const fields=['originalPdfUrls','exactUrlOneToOne','parsedOriginalPdfs','originalParsedRawShaMatches','originalParsedRawShaMismatches',
                'parsedMetadataMatches','parsedMetadataMismatches','missingOriginalUrls','duplicateStoredOriginalUrls',
                'recognizedOriginalRollCalls','matchedRecognizedRollCalls','originalNamedChoiceTokens','matchedNamedChoiceTokens',
                'storedCommitteeEvents','storedCommitteeMemberChoices'];
              if(!Array.isArray(r.byYear)||r.byYear.length!==4)throw Error('Missing by-year results');
              for(let i=0;i<4;i++){
                const y=r.byYear[i];
                if(y.year!==2022+i)throw Error('Wrong year');
                lines.push('- '+y.year+': '+fields.map(f=>f+'='+n(y[f])).join('; '));
              }
              const names=['official_original_pdf_not_retrieved','original_source_not_in_export',
                'original_pdf_hash_mismatch','duplicate_persisted_source','source_meeting_or_committee_mismatch',
