name: Vercel Fallback Bridge

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: vercel-fallback-bridge
  cancel-in-progress: false

jobs:
  vercel-ops:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[vercel-ops] ')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_SLUG: killjoy00s-projects
      VERCEL_PROJECT_SLUG: votepredict
      VERCEL_CLI_VERSION: 59.11.7

    steps:
      - name: Validate Vercel secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not available to this repository. Add it as a repository Actions secret."
            exit 1
          fi

      - name: Parse request
        id: request
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          action="${ISSUE_TITLE#\[vercel-ops\] }"

          case "$action" in
            auth-check|status|errors|logs|deploy-production)
              ;;
            *)
              echo "::error::Unsupported Vercel operation: $action"
              exit 2
              ;;
          esac

          if [ "$action" = "deploy-production" ]; then
            if ! printf '%s\n' "$ISSUE_BODY" | grep -Fxq 'CONFIRM PRODUCTION DEPLOY'; then
              echo "::error::Production deploy requires an issue-body line containing exactly: CONFIRM PRODUCTION DEPLOY"
              exit 3
            fi
          fi

          printf 'action=%s\n' "$action" >> "$GITHUB_OUTPUT"

      - name: Verify Vercel authentication and project access
        id: access
        shell: bash
        run: |
          set -euo pipefail

          http_code="$(curl \
            --silent \
            --show-error \
            --output /tmp/vercel-project.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_SLUG}?slug=${VERCEL_TEAM_SLUG}")"

          if [ "$http_code" != "200" ]; then
            echo "::error::Vercel project lookup failed with HTTP ${http_code}. The token may be invalid or not scoped to ${VERCEL_TEAM_SLUG}/${VERCEL_PROJECT_SLUG}."
            exit 4
          fi

          project_id="$(jq -r '.id // empty' /tmp/vercel-project.json)"
          if [ -z "$project_id" ]; then
            echo "::error::Vercel project lookup succeeded but returned no project ID."
            exit 5
          fi

          printf 'project_id=%s\n' "$project_id" >> "$GITHUB_OUTPUT"
          echo "Vercel token can access ${VERCEL_TEAM_SLUG}/${VERCEL_PROJECT_SLUG}."

      - name: Show recent production deployments
        if: steps.request.outputs.action == 'status'
        shell: bash
        env:
          PROJECT_ID: ${{ steps.access.outputs.project_id }}
        run: |
          set -euo pipefail

          http_code="$(curl \
            --silent \
            --show-error \
            --output /tmp/vercel-deployments.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v6/deployments?projectId=${PROJECT_ID}&target=production&limit=10&slug=${VERCEL_TEAM_SLUG}")"

          if [ "$http_code" != "200" ]; then
            echo "::error::Vercel deployment lookup failed with HTTP ${http_code}."
            exit 6
          fi

          echo "Recent production deployments:"
          jq -r '.deployments[]? | "- \(.state // "UNKNOWN")  \(.url // "(no URL)")  \(((.created // 0) / 1000) | strftime("%Y-%m-%d %H:%M:%S UTC"))"' \
            /tmp/vercel-deployments.json

      - name: Set up Node
        if: steps.request.outputs.action == 'errors' || steps.request.outputs.action == 'logs' || steps.request.outputs.action == 'deploy-production'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pinned Vercel CLI
        if: steps.request.outputs.action == 'errors' || steps.request.outputs.action == 'logs' || steps.request.outputs.action == 'deploy-production'
        shell: bash
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Summarize production 5xx errors
        if: steps.request.outputs.action == 'errors'
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/vercel-errors.jsonl"
          stderr_file="$RUNNER_TEMP/vercel-errors.stderr"
          summary="$RUNNER_TEMP/vercel-summary.txt"

          if ! vercel logs \
            --project "$VERCEL_PROJECT_SLUG" \
            --environment production \
            --no-branch \
            --status-code 5xx \
            --since 24h \
            --limit 200 \
            --json \
            --scope "$VERCEL_TEAM_SLUG" \
            --token "$VERCEL_TOKEN" \
            >"$raw" 2>"$stderr_file"; then
            echo "::error::Vercel production error query failed. Raw CLI output was withheld because this is a public repository."
            exit 8
          fi

          RAW_FILE="$raw" SUMMARY_FILE="$summary" WINDOW_LABEL="Production 5xx summary - last 24h" node <<'NODE'
          const fs = require('fs');
          const rawPath = process.env.RAW_FILE;
          const summaryPath = process.env.SUMMARY_FILE;
          const label = process.env.WINDOW_LABEL;

          const lines = fs.existsSync(rawPath)
            ? fs.readFileSync(rawPath, 'utf8').split(/\r?\n/).filter(Boolean)
            : [];
          const rows = [];
          for (const line of lines) {
            try {
              const value = JSON.parse(line);
              if (value && typeof value === 'object' && !Array.isArray(value)) rows.push(value);
            } catch {
              // Ignore non-JSON CLI noise without printing it.
            }
          }

          function safePath(value) {
            const base = String(value || '(unknown)').split('?')[0];
            return base.split('/').map((segment) => {
              if (!segment) return segment;
              if (segment.includes('@')) return ':redacted';
              if (/^\d{4,}$/.test(segment)) return ':id';
              if (/^[0-9a-f-]{20,}$/i.test(segment)) return ':id';
              if (/^[A-Za-z0-9_-]{32,}$/.test(segment)) return ':id';
              return segment;
            }).join('/');
          }

          function route(row) {
            return safePath(row.path ?? row.requestPath ?? row.route ?? '(unknown)');
          }
          function status(row) {
            return String(row.statusCode ?? row.status ?? '(none)');
          }
          function level(row) {
            return String(row.level ?? 'unknown');
          }
          function source(row) {
            const value = row.source;
            return typeof value === 'string' ? value : 'unknown';
          }
          function counts(values) {
            const map = new Map();
            for (const value of values) map.set(value, (map.get(value) || 0) + 1);
            return [...map.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
          }

          const routeStatus = counts(rows.map((row) => `${status(row)} ${route(row)}`)).slice(0, 15);
          const levels = counts(rows.map(level));
          const sources = counts(rows.map(source));
          const out = [
            label,
            `Entries sampled: ${rows.length} (cap 200)`,
            `Levels: ${levels.length ? levels.map(([k, v]) => `${k}=${v}`).join(', ') : 'none'}`,
            `Sources: ${sources.length ? sources.map(([k, v]) => `${k}=${v}`).join(', ') : 'none'}`,
            'Top route/status groups:',
            ...(routeStatus.length ? routeStatus.map(([k, v]) => `- ${v}x ${k}`) : ['- none']),
            '',
            'Raw Vercel messages are intentionally withheld from this public repository.'
          ];
          fs.writeFileSync(summaryPath, `${out.join('\n')}\n`);
          console.log(out.join('\n'));
          NODE

      - name: Summarize recent production runtime logs
        if: steps.request.outputs.action == 'logs'
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/vercel-runtime.jsonl"
          stderr_file="$RUNNER_TEMP/vercel-runtime.stderr"
          summary="$RUNNER_TEMP/vercel-summary.txt"

          if ! vercel logs \
            --project "$VERCEL_PROJECT_SLUG" \
            --environment production \
            --no-branch \
            --since 1h \
            --limit 200 \
            --json \
            --scope "$VERCEL_TEAM_SLUG" \
            --token "$VERCEL_TOKEN" \
            >"$raw" 2>"$stderr_file"; then
            echo "::error::Vercel runtime-log query failed. Raw CLI output was withheld because this is a public repository."
            exit 9
          fi

          RAW_FILE="$raw" SUMMARY_FILE="$summary" WINDOW_LABEL="Production runtime summary - last 1h" node <<'NODE'
          const fs = require('fs');
          const rawPath = process.env.RAW_FILE;
          const summaryPath = process.env.SUMMARY_FILE;
          const label = process.env.WINDOW_LABEL;

          const lines = fs.existsSync(rawPath)
            ? fs.readFileSync(rawPath, 'utf8').split(/\r?\n/).filter(Boolean)
            : [];
          const rows = [];
          for (const line of lines) {
            try {
              const value = JSON.parse(line);
              if (value && typeof value === 'object' && !Array.isArray(value)) rows.push(value);
            } catch {
              // Ignore non-JSON CLI noise without printing it.
            }
          }

          function safePath(value) {
            const base = String(value || '(unknown)').split('?')[0];
            return base.split('/').map((segment) => {
              if (!segment) return segment;
              if (segment.includes('@')) return ':redacted';
              if (/^\d{4,}$/.test(segment)) return ':id';
              if (/^[0-9a-f-]{20,}$/i.test(segment)) return ':id';
              if (/^[A-Za-z0-9_-]{32,}$/.test(segment)) return ':id';
              return segment;
            }).join('/');
          }

          function route(row) {
            return safePath(row.path ?? row.requestPath ?? row.route ?? '(unknown)');
          }
          function status(row) {
            return String(row.statusCode ?? row.status ?? '(none)');
          }
          function level(row) {
            return String(row.level ?? 'unknown');
          }
          function source(row) {
            const value = row.source;
            return typeof value === 'string' ? value : 'unknown';
          }
          function counts(values) {
            const map = new Map();
            for (const value of values) map.set(value, (map.get(value) || 0) + 1);
            return [...map.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
          }

          const routeStatus = counts(rows.map((row) => `${status(row)} ${route(row)}`)).slice(0, 15);
          const levels = counts(rows.map(level));
          const sources = counts(rows.map(source));
          const out = [
            label,
            `Entries sampled: ${rows.length} (cap 200)`,
            `Levels: ${levels.length ? levels.map(([k, v]) => `${k}=${v}`).join(', ') : 'none'}`,
            `Sources: ${sources.length ? sources.map(([k, v]) => `${k}=${v}`).join(', ') : 'none'}`,
            'Top route/status groups:',
            ...(routeStatus.length ? routeStatus.map(([k, v]) => `- ${v}x ${k}`) : ['- none']),
            '',
            'Raw Vercel messages are intentionally withheld from this public repository.'
          ];
          fs.writeFileSync(summaryPath, `${out.join('\n')}\n`);
          console.log(out.join('\n'));
          NODE

      - name: Check out protected main
        if: steps.request.outputs.action == 'deploy-production'
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Link exact Vercel project
        if: steps.request.outputs.action == 'deploy-production'
        shell: bash
        run: |
          set -euo pipefail
          vercel link \
            --yes \
            --project "$VERCEL_PROJECT_SLUG" \
            --scope "$VERCEL_TEAM_SLUG" \
            --token "$VERCEL_TOKEN"
          vercel project inspect --non-interactive --token "$VERCEL_TOKEN" >/dev/null

      - name: Deploy main to production
        if: steps.request.outputs.action == 'deploy-production'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_output="$(vercel deploy \
            --prod \
            --yes \
            --scope "$VERCEL_TEAM_SLUG" \
            --token "$VERCEL_TOKEN")"

          deployment_url="$(printf '%s\n' "$deployment_output" | grep -E '^https://[^ ]+$' | tail -n 1 || true)"
          if [ -z "$deployment_url" ]; then
            echo "::error::Vercel completed without returning a recognizable deployment URL."
            exit 7
          fi

          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Production deployment created: $deployment_url"

      - name: Report result on issue
        if: always()
        uses: actions/github-script@v7
        env:
          REQUESTED_ACTION: ${{ steps.request.outputs.action }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const action = process.env.REQUESTED_ACTION || 'unknown';
            const status = process.env.JOB_STATUS;
            const deploymentUrl = process.env.DEPLOYMENT_URL;
            const summaryPath = path.join(process.env.RUNNER_TEMP || '/tmp', 'vercel-summary.txt');
            const summary = fs.existsSync(summaryPath) ? fs.readFileSync(summaryPath, 'utf8').trim() : '';

            let body;
            if (status === 'success' && action === 'deploy-production' && deploymentUrl) {
              body = `Vercel fallback bridge succeeded for **${action}**.\n\nProduction deployment: ${deploymentUrl}`;
            } else if (status === 'success' && summary) {
              body = `Vercel fallback bridge succeeded for **${action}**.\n\n\`\`\`text\n${summary}\n\`\`\``;
            } else if (status === 'success') {
              body = `Vercel fallback bridge succeeded for **${action}**.`;
            } else {
              body = `Vercel fallback bridge failed for **${action}**. Check the Actions run for the failed step. Raw Vercel messages and the Vercel token are never printed by this workflow.`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
