name: Revisor introduction sharded production backfill

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/revisor-introduction-sharded-backfill.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: session-2021-senate
            scopes: 2021-2022/senate
          - shard: session-2023
            scopes: 2023-2024/house,2023-2024/senate
          - shard: session-2025
            scopes: 2025-2026/house,2025-2026/senate
    concurrency:
      group: revisor-introduction-${{ matrix.shard }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
    steps:
      - uses: actions/checkout@v7
      - name: Require the existing Vercel credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN is unavailable. No production action was taken.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Read production database environment privately
        shell: bash
        run: |
          umask 077
          if ! npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1; then
            echo 'Could not read the VotePredict production database environment. No introduction backfill was invoked.'
            exit 1
          fi
      - name: Backfill authoritative introduction metadata for shard
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_INTRODUCTION_BACKFILL_SCOPES: ${{ matrix.scopes }}
        run: node --import tsx scripts/run-direct-production-revisor-introduction-backfill.ts
      - name: Remove temporary credentials and Vercel logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env', 'vercel-pull.log']:
              Path(os.environ['RUNNER_TEMP'], name).unlink(missing_ok=True)
          PYTHON
