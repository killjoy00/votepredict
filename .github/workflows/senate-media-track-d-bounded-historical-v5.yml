name: '#946 / #987 isolated 22-version historical original capture V5'
on:
  pull_request:
    paths:
      - src/evaluation/senate-media-track-d-bounded-archive-capture.ts
      - scripts/replay-senate-media-track-d-bounded-historical.ts
      - tests/senate-media-track-d-bounded-archive-capture.test.ts
      - docs/evaluation/senate-media-track-d-946-987-bounded-capture-20261019.md
      - .github/workflows/senate-media-track-d-bounded-historical-v5.yml
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: senate-media-track-d-public-historical-v5-${{ github.sha }}
  cancel-in-progress: false
jobs:
  keyless-offline-review:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict') ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.run_attempt == 1 &&
        contains(github.event.head_commit.message, 'TRACK_D_946_987_BOUNDED_ARCHIVE_CAPTURE_V5_20261019')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Check 22 vetted archive snapshot inputs, quoted-text and membership holds, no writes
        run: |
          node --import tsx --test tests/senate-media-track-d-bounded-archive-capture.test.ts
          node --import tsx scripts/replay-senate-media-track-d-bounded-historical.ts --preview
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
  original-archive-capture:
    needs: [keyless-offline-review]
    if: >-
      needs.keyless-offline-review.result == 'success' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, 'TRACK_D_946_987_BOUNDED_ARCHIVE_CAPTURE_V5_20261019')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TRACK_D_V5_PUBLIC_KEYLESS_CHECKS_PASSED: ${{ needs.keyless-offline-review.result == 'success' && 'true' || 'false' }}
      TRACK_D_V5_REVIEWED_MAIN_MARKER_PRESENT: ${{ contains(github.event.head_commit.message, 'TRACK_D_946_987_BOUNDED_ARCHIVE_CAPTURE_V5_20261019') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact reviewed main commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Read-only historical original capture, 22 fixed Wayback requests maximum
        run: node --import tsx scripts/replay-senate-media-track-d-bounded-historical.ts --capture
      - name: Save bounded public metadata only; never original article bytes
        uses: actions/upload-artifact@v4
        with:
          name: senate-media-track-d-bounded-historical-public-metadata
          path: track-d-946-987-bounded-capture-metadata.json
          if-no-files-found: error
          retention-days: 30
