name: Freeze 2023-24 Senate top-20 semantic review tranche 11

on:
  pull_request:
    paths:
      - data/evaluation/evidence-quality/historical-density-2023-24-senate-top20-semantic-review-tranche-11-decisions-v1.json
      - scripts/freeze-historical-density-2023-24-senate-top20-semantic-review-tranche-11.mjs
      - tests/historical-density-2023-24-senate-top20-semantic-review-tranche-11.test.ts
      - .github/workflows/historical-density-2023-24-senate-top20-semantic-review-tranche-11.yml
  push:
    branches: [main]
    paths:
      - data/evaluation/evidence-quality/historical-density-2023-24-senate-top20-semantic-review-tranche-11-decisions-v1.json
      - scripts/freeze-historical-density-2023-24-senate-top20-semantic-review-tranche-11.mjs
      - tests/historical-density-2023-24-senate-top20-semantic-review-tranche-11.test.ts
      - .github/workflows/historical-density-2023-24-senate-top20-semantic-review-tranche-11.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-2023-24-senate-top20-semantic-review-tranche-11-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Test checked-in outcome-blind decisions
        run: node --import tsx --test tests/historical-density-2023-24-senate-top20-semantic-review-tranche-11.test.ts

      - name: Materialize canonical 2023-24 Senate overlap
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11501649286/zip > "$RUNNER_TEMP/overlap.zip"
          echo "c5ed67e03a2aabb7b41df147beb2d4e814b6db834055387efaf716e3b6ac3f42  $RUNNER_TEMP/overlap.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/overlap"
          unzip -q "$RUNNER_TEMP/overlap.zip" historical-density-2023-24-senate-electronic-minute-target-overlap-v1.json -d "$RUNNER_TEMP/overlap"

      - name: Materialize canonical top-20 source metadata
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11502134219/zip > "$RUNNER_TEMP/source.zip"
          echo "bb6318582f5fb01e9078fbaa6c2b67c43274ca4b4f8f6ced95aa7f9625975d50  $RUNNER_TEMP/source.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q "$RUNNER_TEMP/source.zip" historical-density-2023-24-senate-electronic-minute-top20-freeze-v1.json -d "$RUNNER_TEMP/source"

      - name: Materialize canonical #792 frozen text
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11502902302/zip > "$RUNNER_TEMP/text.zip"
          echo "c73031633618f4a599a8e1ae1147eb9cd2b429db229335dccef14961a3aa835c  $RUNNER_TEMP/text.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/text"
          unzip -q "$RUNNER_TEMP/text.zip" \
            historical-density-2023-24-senate-top20-text-extraction-v1.json \
            texts/a49f69ead3f3fb28f734cf7613b124dc54efe493fbfa37e796488dfd090ab5d5.txt \
            -d "$RUNNER_TEMP/text"

      - name: Freeze semantic review tranche 11
        env:
          VOTEPREDICT_SENATE_2023_24_OVERLAP_PATH: ${{ runner.temp }}/overlap/historical-density-2023-24-senate-electronic-minute-target-overlap-v1.json
          VOTEPREDICT_SENATE_2023_24_TOP20_FREEZE_PATH: ${{ runner.temp }}/source/historical-density-2023-24-senate-electronic-minute-top20-freeze-v1.json
          VOTEPREDICT_SENATE_2023_24_TOP20_TEXT_EXTRACTION_PATH: ${{ runner.temp }}/text/historical-density-2023-24-senate-top20-text-extraction-v1.json
          VOTEPREDICT_SENATE_2023_24_TOP20_SEMANTIC_DECISIONS_PATH: data/evaluation/evidence-quality/historical-density-2023-24-senate-top20-semantic-review-tranche-11-decisions-v1.json
          VOTEPREDICT_SENATE_2023_24_TOP20_SEMANTIC_OUTPUT_DIR: ${{ runner.temp }}/review
        run: node scripts/freeze-historical-density-2023-24-senate-top20-semantic-review-tranche-11.mjs

      - name: Verify frozen semantic-review boundary
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/review/historical-density-2023-24-senate-top20-semantic-review-tranche-11-packet-v1.json"
          review="$RUNNER_TEMP/review/historical-density-2023-24-senate-top20-semantic-review-tranche-11-v1.json"
          test "$(jq -r '.schemaVersion' "$packet")" = historical-density-2023-24-senate-top20-semantic-review-tranche-11-packet-v1
          test "$(jq -r '.scope.documents' "$packet")" = 1
          test "$(jq -r '.scope.reviewRows' "$packet")" = 10
          test "$(jq -r '.scope.candidateBills' "$packet")" = 6
          test "$(jq -r '.reviewKeySha256' "$packet")" = b5dbc4409912f2d6246fe9da2d0e7ab94457665b1d43634b66c2891a3aee57c9
          test "$(jq -r '.reviewPacketProofSha256' "$packet")" = 57e5c6b822b43ff4b6cceb9de4ea0931b16862a9361d630c269c4f6040fdf4fc
          test "$(jq -r '.schemaVersion' "$review")" = historical-density-2023-24-senate-top20-semantic-review-tranche-11-v1
          test "$(jq -r '.summary.decisions.not_applicable_to_candidate_bill' "$review")" = 10
          test "$(jq -r '.summary.decisions.bill_context_only_no_member_direction' "$review")" = 0
          test "$(jq -r '.summary.decisions.directional_member_statement' "$review")" = 0
          test "$(jq -r '.summary.decisions.ambiguous_fail_closed' "$review")" = 0
          test "$(jq -r '.summary.mechanicallyActionableRows' "$review")" = 0
          test "$(jq -r '.reviewedRowProofSha256' "$review")" = f1904e7a350dd9cecff2208adb37f2f31268da5810a413a90689138f07f3e38f
          test "$(jq -r '.reviewProofSha256' "$review")" = 6afec38272b5c6fd6eb2f3f89d21d83ea6f0dfe69cb76b43c6ddff7b0c89650d
          test "$(jq -r '.policy.targetVoteOutcomesRead' "$review")" = false
          test "$(jq -r '.policy.proceduralActionUsedAsDirectionalStance' "$review")" = false
          test "$(jq -r '.policy.productionDatabaseQueried' "$review")" = false
          test "$(jq -r '.policy.featureRowsWritten' "$review")" = false
          test "$(jq -r '.policy.modelFitting' "$review")" = none
          test "$(jq -r '.policy.servingChanged' "$review")" = false
          test "$(jq -r '.policy.vercelUsed' "$review")" = false
          test "$(jq -r '.policy.mechanicallyActionable' "$review")" = false
          {
            echo '## 2023-24 Senate top-20 semantic review — tranche 11'
            echo
            echo '- Canonical documents reviewed: **1** (rank 11)'
            echo '- Candidate target events reviewed: **10** across **6** bills'
            echo '- Not applicable to candidate bill: **10**'
            echo '- Bill context only / no member direction: **0**'
            echo '- Directional member statements: **0**'
            echo '- Ambiguous / fail-closed: **0**'
            echo '- Mechanically actionable rows: **0**'
            echo '- Outcome use: **none**'
            echo '- Production DB / feature writes / model / serving changes: **none**'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: historical-density-2023-24-senate-top20-semantic-review-tranche-11-v1
          path: ${{ runner.temp }}/review/*
          if-no-files-found: error
          retention-days: 90
