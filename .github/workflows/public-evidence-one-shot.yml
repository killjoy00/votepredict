name: Public evidence one-shot

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: votepredict-public-evidence-one-shot
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      VOTEPREDICT_PUBLIC_EVIDENCE_BATCH: '24'
      VOTEPREDICT_PUBLIC_EVIDENCE_SCREEN_OUTPUT: artifacts/public-evidence-quick-screen.json

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Require exact current main release
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          checked="$(git rev-parse HEAD)"
          current="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$checked" != "$RELEASE_SHA" ] || [ "$current" != "$RELEASE_SHA" ]; then
            echo "::error::Public evidence one-shot requires exact current deployed main SHA $RELEASE_SHA; checked=$checked current=$current"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-fund --no-audit

      - name: Require Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo '::error::VERCEL_TOKEN is unavailable. Public evidence pipeline was not attempted.'
            exit 1
          fi

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1; then
            echo '::error::Could not read the VotePredict production environment.'
            exit 1
          fi

      - name: Seed first production public-evidence batch
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/run-production-public-evidence-refresh.ts

      - name: Run leakage-safe finance-to-Quick screen
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/evaluate-public-evidence-quick-screen.ts

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-evidence-quick-screen-${{ github.sha }}
          path: artifacts/public-evidence-quick-screen.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize frozen decision
        shell: bash
        run: |
          file=artifacts/public-evidence-quick-screen.json
          {
            echo '## Public evidence Quick screen'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Training finance coverage: $(jq -r '.coverage.training.financeCoverage' "$file")"
            echo "- Validation finance coverage: $(jq -r '.coverage.validation.financeCoverage' "$file")"
            echo "- Selected ridge lambda: $(jq -r '.selected.lambda' "$file")"
            echo "- Validation member Brier delta: $(jq -r '.selected.deltaCandidateMinusBaseline.validation.memberBrier' "$file")"
            echo "- Validation passage Brier delta: $(jq -r '.selected.deltaCandidateMinusBaseline.validation.passageBrier' "$file")"
            echo "- Descriptive-test member Brier delta: $(jq -r '.selected.deltaCandidateMinusBaseline.descriptiveTest.memberBrier' "$file")"
            echo "- Prospective finance shadow nomination: $(jq -r '.conclusion.prospectiveShadowNomination' "$file")"
            echo '- Serving Quick probabilities changed: no'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary credentials and Vercel logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env', 'vercel-pull.log']:
              Path(os.environ['RUNNER_TEMP'], name).unlink(missing_ok=True)
          PYTHON
