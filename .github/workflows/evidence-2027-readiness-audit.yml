name: Audit 2027 evidence readiness

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ startsWith(github.event.comment.body, '[evidence-2027-readiness-audit]')
        && 'evidence-2027-readiness-audit-optimized-v1'
        || format('evidence-2027-readiness-audit-skip-{0}', github.event.comment.id) }}
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      (github.event.issue.number == 579 || github.event.issue.number == 287) &&
      github.event.comment.user.login == 'killjoy00' &&
      startsWith(github.event.comment.body, '[evidence-2027-readiness-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Run read-only 2027 evidence readiness audit
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_2027_EVIDENCE_READINESS_OUTPUT: ${{ runner.temp }}/evidence-2027-readiness-audit-v1.json
        run: node --import tsx scripts/audit-2027-evidence-readiness.ts

      - name: Upload audit artifact
        uses: actions/upload-artifact@v7
        with:
          name: evidence-2027-readiness-audit-v1
          path: ${{ runner.temp }}/evidence-2027-readiness-audit-v1.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/votepredict-production.env" "$RUNNER_TEMP/vercel-pull.log"
