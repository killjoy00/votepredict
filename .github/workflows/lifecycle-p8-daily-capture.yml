name: Lifecycle P8 daily capture

on:
  schedule:
    - cron: '35 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifecycle-p8-daily-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Read production database environment privately
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo '::error::VERCEL_TOKEN is unavailable. No P8 capture was attempted.'
            exit 1
          fi
          umask 077
          if ! npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1; then
            echo '::error::Could not read VotePredict production environment. No P8 capture was attempted.'
            exit 1
          fi

      - name: Capture immutable P8 lifecycle rows
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_P8_CAPTURE_OUTPUT_DIR: artifacts/lifecycle-p8-daily-capture-v1
        run: node --import tsx scripts/capture-lifecycle-p8-prospective.ts

      - name: Upload capture summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-p8-daily-capture-v1-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/lifecycle-p8-daily-capture-v1
          if-no-files-found: warn

      - name: Remove temporary credentials and logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env', 'vercel-pull.log']:
              Path(os.environ['RUNNER_TEMP'], name).unlink(missing_ok=True)
          PYTHON
