name: Production raw Senate committee testimony backfill

# One reviewed main merge triggers guarded write to the new raw-only table.
# No production secret or Neon endpoint is accessible on PRs or keyless CI.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-committee-testimony-production.yml
      - scripts/deploy-senate-committee-testimony-neon.ts
      - scripts/collect-senate-committee-testimony.ts
      - src/sources/minnesota/senate-committee-testimony.ts
      - migrations/0017_senate_committee_testimony_raw.sql

permissions:
  contents: read

concurrency:
  group: senate-committee-testimony-production-${{ github.sha }}
  cancel-in-progress: false

jobs:
  independent-main:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event.repository.full_name == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.after == github.sha &&
      github.event.head_commit.id == github.sha &&
      github.event.deleted != true &&
      github.event.forced != true &&
      contains(github.event.head_commit.message, 'SENATE_COMMITTEE_TESTIMONY_DEPLOY_20261015')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: votepredict
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d votepredict"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
      VOTEPREDICT_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact reviewed main SHA
        env:
          REVIEWED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Apply all migrations to disposable PostgreSQL
        run: npm run db:migrate
      - name: Full typecheck, tests and Next.js build
        run: npm run check
      - name: Check runtime dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Small official Senate public source smoke run without a production database
        run: |
          npm run data:senate:testimony -- --session 2025-2026 --from 2026-04-13 --to 2026-04-13 --no-pdf-lists --out "$RUNNER_TEMP/senate-smoke.jsonl"
          test -s "$RUNNER_TEMP/senate-smoke.jsonl"

  protected-production-neon:
    needs: [independent-main]
    if: >-
      needs.independent-main.result == 'success' &&
      github.event_name == 'push' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event.repository.full_name == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.after == github.sha &&
      github.event.head_commit.id == github.sha &&
      github.event.deleted != true &&
      github.event.forced != true &&
      contains(github.event.head_commit.message, 'SENATE_COMMITTEE_TESTIMONY_DEPLOY_20261015')
    # Reuse existing protected VotePredict Neon credential boundary.
    # Owner explicitly authorized this scoped migration and raw-data write.
    environment: evidence-readonly-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VOTEPREDICT_NEON_PROJECT_ID: ${{ vars.VOTEPREDICT_NEON_PROJECT_ID }}
      VOTEPREDICT_MEDIA_EXISTING_DATABASE: ${{ vars.VOTEPREDICT_MEDIA_EXISTING_DATABASE }}
      VOTEPREDICT_SENATE_TESTIMONY_VERIFIED: ${{ needs.independent-main.result == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact independently tested main SHA
        env:
          REVIEWED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Apply raw-only migration and backfill official Senate hearings with readback
        run: node --import tsx scripts/deploy-senate-committee-testimony-neon.ts
