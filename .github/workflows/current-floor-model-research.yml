name: Current floor model research

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-floor-model-research
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      VOTEPREDICT_CURRENT_FLOOR_RESEARCH_OUTPUT: artifacts/current-floor-model-research.json
    steps:
      - uses: actions/checkout@v7

      - name: Require Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo '::error::VERCEL_TOKEN is unavailable. Model research was not attempted.'
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-fund --no-audit

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1; then
            echo '::error::Could not read the VotePredict production environment. Model research was not run.'
            exit 1
          fi

      - name: Run leakage-safe current-floor research screen
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/evaluate-current-floor-research.ts

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: current-floor-model-research-${{ github.sha }}
          path: artifacts/current-floor-model-research.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize decision
        shell: bash
        run: |
          file=artifacts/current-floor-model-research.json
          {
            echo '## Current-floor model research'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Fixed historical target cohort: $(jq -r '.data.fixedResearchTargets' "$file")"
            echo "- Issue candidate: $(jq -r '.issueConditioning.selected.config.id' "$file")"
            echo "- Participation candidate: $(jq -r '.participation.selected.config.id' "$file")"
            echo "- Process candidate: $(jq -r '.processContext.selected.config.id' "$file")"
            echo "- Analogue candidate: $(jq -r '.analogues.selected.config.id' "$file")"
            echo "- Uncertainty bands: $(jq -r '.eventSpecificUncertainty.selected.bandCount' "$file")"
            echo "- Combined prospective shadow: $(jq -r '.decision.combinedProspectiveShadow' "$file")"
            echo "- Uncertainty prospective shadow: $(jq -r '.decision.uncertaintyProspectiveShadow' "$file")"
            echo '- Serving production probabilities changed: no'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary credentials and Vercel logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env', 'vercel-pull.log']:
              Path(os.environ['RUNNER_TEMP'], name).unlink(missing_ok=True)
          PYTHON
