name: Recover original frozen P8 archive
on:
  pull_request:
    paths:
      - '.github/workflows/preserve-frozen-p8-archive.yml'
permissions:
  contents: read
  actions: read
jobs:
  recover:
    if: github.repository == 'killjoy00/votepredict' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'archive/2027-frozen-p8-model'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recover and verify original archive (read-only GitHub token)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/killjoy00/votepredict/actions/artifacts/10772991611/zip > "$RUNNER_TEMP/p8-original.zip"
          echo "72a42063a028114b4f6cbd8a356e74940eb00bdcda28a83cadf884aaa346061e  $RUNNER_TEMP/p8-original.zip" | sha256sum -c -
          python3 - "$RUNNER_TEMP/p8-original.zip" <<'PY'
          import base64, hashlib, json, sys, zipfile
          from pathlib import Path
          raw = Path(sys.argv[1]).read_bytes()
          assert len(raw) == 42997
          with zipfile.ZipFile(sys.argv[1]) as archive:
              assert sorted(archive.namelist()) == ['model.json', 'summary.json']
              model = archive.read('model.json')
              summary = archive.read('summary.json')
          assert hashlib.sha256(model).hexdigest() == '850aa4344bfe1635622af95c8f0871a38cbc234dc23eb9ae50085da668fcfc76'
          assert hashlib.sha256(summary).hexdigest() == 'b25381b1cd705bce9b94f3a4a210ba8b4eddc2d4b34cc010c4672ea7795977c8'
          print('P8_ARCHIVE_RECOVERY_SUMMARY '+json.dumps({
              'sourceRunId': 35910925882, 'sourceArtifactId': 10772991611,
              'archiveSha256': hashlib.sha256(raw).hexdigest(), 'archiveBytes': len(raw),
              'rawModelJsonSha256': hashlib.sha256(model).hexdigest(), 'modelBytes': len(model),
              'rawSummaryJsonSha256': hashlib.sha256(summary).hexdigest(), 'summaryBytes': len(summary),
              'newFit': False, 'servingChanged': False, 'productionCaptureActivated': False,
          }, separators=(',',':')))
          encoded = base64.b64encode(raw).decode('ascii')
          for i in range(0,len(encoded),3000):
              print('P8_ARCHIVE_RECOVERY_CHUNK '+str(i//3000)+' '+encoded[i:i+3000])
          PY
