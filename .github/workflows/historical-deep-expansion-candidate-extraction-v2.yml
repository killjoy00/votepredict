name: Historical Deep expansion candidate extraction v2

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: historical-deep-expansion-candidate-extraction-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Verify pinned input artifact digests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lineage='data/evaluation/historical-deep-expansion-candidate-lineage-v2.json'
          verify_artifact() {
            local section="$1"
            local id expected actual expired
            id="$(jq -r ".${section}.artifactId" "$lineage")"
            expected="sha256:$(jq -r ".${section}.artifactSha256" "$lineage")"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" > "$RUNNER_TEMP/${section}.json"
            actual="$(jq -r '.digest // empty' "$RUNNER_TEMP/${section}.json")"
            expired="$(jq -r '.expired' "$RUNNER_TEMP/${section}.json")"
            test "$expired" = 'false'
            test "$actual" = "$expected"
            echo "${section}_run_id=$(jq -r ".${section}.workflowRunId" "$lineage")" >> "$GITHUB_ENV"
            echo "${section}_name=$(jq -r ".${section}.artifactName" "$lineage")" >> "$GITHUB_ENV"
          }
          verify_artifact discoveryManifest
          verify_artifact sourceBundle
      - name: Download frozen expansion discovery manifest
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.discoveryManifest_run_id }}
          name: ${{ env.discoveryManifest_name }}
          path: artifacts/frozen/discovery
      - name: Download frozen expansion source bundle
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.sourceBundle_run_id }}
          name: ${{ env.sourceBundle_name }}
          path: artifacts/frozen/sources
      - name: Extract deterministic procedural candidates with parser v2
        run: |
          node --import tsx scripts/extract-historical-deep-expansion-candidates-v2.ts \
            --discovery artifacts/frozen/discovery/historical-deep-expansion-discovery-manifest.json \
            --sources artifacts/frozen/sources/historical-deep-expansion-source-bundle.json \
            --output artifacts/historical-deep-expansion-discovery-candidates-v2.json
      - name: Verify outcome-free v2 candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          file='artifacts/historical-deep-expansion-discovery-candidates-v2.json'
          test "$(jq -r '.schemaVersion' "$file")" = 'historical-deep-expansion-discovery-candidates-v2'
          test "$(jq -r '.metadata.parser' "$file")" = 'deterministic-house-committee-roll-call-v2'
          test "$(jq -r '.metadata.baselineParser' "$file")" = 'deterministic-house-committee-roll-call-v1'
          test "$(jq -r '.metadata.outcomeUse' "$file")" = 'none'
          test "$(jq -r '.input.discoveryCases' "$file")" = '24'
          test "$(jq -r '.summary.v1BaselineCandidateCount' "$file")" = '24'
          test "$(jq -r '.summary.candidateCount' "$file")" -ge "$(jq -r '.summary.v1BaselineCandidateCount' "$file")"
          test "$(jq '[.. | objects | select(has("actualOutcome") or has("actualYes") or has("passed") or has("yeaCount") or has("nayCount"))] | length' "$file")" = '0'
      - name: Upload frozen expansion candidates v2
        uses: actions/upload-artifact@v4
        with:
          name: historical-deep-expansion-discovery-candidates-v2-${{ github.sha }}
          path: artifacts/historical-deep-expansion-discovery-candidates-v2.json
          if-no-files-found: error
          retention-days: 30
