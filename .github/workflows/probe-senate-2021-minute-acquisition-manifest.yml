name: Senate 2021 minute acquisition manifest

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'issue_comment' && (github.event.issue.number != 514 || github.event.comment.user.login != 'killjoy00' || !startsWith(github.event.comment.body, '[senate-2021-minute-acquisition-manifest]')) && format('senate-2021-minute-manifest-skip-{0}', github.run_id) || 'senate-2021-minute-acquisition-manifest' }}
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 514 &&
        github.event.comment.user.login == 'killjoy00' &&
        startsWith(github.event.comment.body, '[senate-2021-minute-acquisition-manifest]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit
      - name: Enumerate official 2021 Senate media events for minute acquisition scope
        run: node --import tsx scripts/probe-senate-2021-minute-acquisition-manifest.ts
