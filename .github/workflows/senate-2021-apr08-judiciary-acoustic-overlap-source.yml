name: 2021 Apr 8 original Judiciary MP3 acoustic overlap research (not vote proof)

# One-time after landing on main. Entire MP3 source bodies and decoded PCM are
# ephemeral. Only JSON of original hashes, sampled acoustic confidence and
# timecode leads is an artifact. No transcript, roster, models or database.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2021-apr08-judiciary-acoustic-overlap-source.yml

permissions:
  contents: read

jobs:
  compare-three-original-judiciary-audio-timelines:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run independent synthetic overlap/no-overlap/false-positive guards
        run: node --test tests/senate-2021-apr08-judiciary-acoustic-overlap.synthetic.test.mjs
      - name: Explicitly install ffmpeg and ffprobe for ephemeral media decode
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Third independent exact-SHA original acquisition and Judiciary first/a/b acoustic comparison
        run: |
          node scripts/audit-senate-2021-apr08-judiciary-acoustic-overlap.mjs \
            --output artifacts/2021-apr08-judiciary-acoustic-overlap/source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2021-apr08-judiciary-original-acoustic-overlap-metadata-only
          path: artifacts/2021-apr08-judiciary-acoustic-overlap/source.json
          retention-days: 30
          if-no-files-found: error
