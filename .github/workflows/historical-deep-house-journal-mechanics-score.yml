name: Historical Deep House Journal mechanics score

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: historical-deep-house-journal-mechanics-score-${{ github.ref }}
  cancel-in-progress: true

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Verify immutable scoring artifact digests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lineage='data/evaluation/historical-deep-house-journal-mechanics-score-lineage-v1.json'
          verify_artifact() {
            local section="$1"
            local id expected actual expired
            id="$(jq -r ".${section}.artifactId" "$lineage")"
            expected="sha256:$(jq -r ".${section}.artifactSha256" "$lineage")"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" > "$RUNNER_TEMP/${section}.json"
            actual="$(jq -r '.digest // empty' "$RUNNER_TEMP/${section}.json")"
            expired="$(jq -r '.expired' "$RUNNER_TEMP/${section}.json")"
            test "$expired" = 'false'
            test "$actual" = "$expected"
            echo "${section}_run_id=$(jq -r ".${section}.workflowRunId" "$lineage")" >> "$GITHUB_ENV"
            echo "${section}_name=$(jq -r ".${section}.artifactName" "$lineage")" >> "$GITHUB_ENV"
            echo "${section}_file=$(jq -r ".${section}.fileName" "$lineage")" >> "$GITHUB_ENV"
          }
          verify_artifact discoveryManifest
          verify_artifact mechanicsArtifact
          verify_artifact outcomeArtifact
      - name: Download frozen outcome-blind Quick manifest
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.discoveryManifest_run_id }}
          name: ${{ env.discoveryManifest_name }}
          path: artifacts/frozen/discovery
      - name: Download frozen House Journal mechanics
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.mechanicsArtifact_run_id }}
          name: ${{ env.mechanicsArtifact_name }}
          path: artifacts/frozen/mechanics
      - name: Download preexisting frozen development outcomes
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.outcomeArtifact_run_id }}
          name: ${{ env.outcomeArtifact_name }}
          path: artifacts/frozen/outcomes
      - name: Verify post-mechanics-freeze boundary
        shell: bash
        run: |
          set -euo pipefail
          lineage='data/evaluation/historical-deep-house-journal-mechanics-score-lineage-v1.json'
          discovery="artifacts/frozen/discovery/${discoveryManifest_file}"
          mechanics="artifacts/frozen/mechanics/${mechanicsArtifact_file}"
          outcomes="artifacts/frozen/outcomes/${outcomeArtifact_file}"
          test "$(jq -r '.schemaVersion' "$discovery")" = 'historical-deep-expansion-discovery-manifest-v1'
          test "$(jq -r '.metadata.cases' "$discovery")" = '24'
          test "$(jq -r '.metadata.memberCasePairs' "$discovery")" = '3216'
          test "$(jq -r '.metadata.candidateStrategy' "$discovery")" = 'need-only'
          test "$(jq -r '.cases | length' "$discovery")" = '24'
          test "$(jq '[.cases[].members[] | select(.yesProbability == null)] | length' "$discovery")" = '0'
          test "$(jq -r '.schemaVersion' "$mechanics")" = 'historical-deep-house-journal-mechanics-v1'
          test "$(jq -r '.metadata.parser' "$mechanics")" = 'deterministic-house-journal-mechanics-v1'
          test "$(jq -r '.metadata.outcomeUse' "$mechanics")" = 'none'
          test "$(jq -r '.metadata.holdoutUse' "$mechanics")" = 'none'
          test "$(jq -r '.metadata.probabilityAction' "$mechanics")" = 'none'
          test "$(jq -r '.summary.observations' "$mechanics")" = '107'
          test "$(jq -r '.summary.casesWithMechanics' "$mechanics")" = '24'
          test "$(jq '[.observations[] | select(.mechanicallyActionable != false or .finalPassageInference != "none")] | length' "$mechanics")" = '0'
          test "$(jq -r '.schemaVersion' "$outcomes")" = 'historical-deep-expansion-outcome-snapshot-v1'
          test "$(jq '.cases | length' "$outcomes")" = '24'
          test "$(jq '[.cases[].members[]] | length' "$outcomes")" = '3133'
          test "$(jq -r '.candidateArtifact.artifactId' "$outcomes")" = "$(jq -r '.outcomeArtifact.originCandidateArtifactId' "$lineage")"
          test "$(jq -r '.candidateArtifact.artifactSha256' "$outcomes")" = "$(jq -r '.outcomeArtifact.originCandidateArtifactSha256' "$lineage")"
      - name: Score frozen Journal mechanics against frozen development outcomes
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/score-historical-deep-house-journal-mechanics.ts \
            "artifacts/frozen/discovery/${discoveryManifest_file}" \
            "artifacts/frozen/mechanics/${mechanicsArtifact_file}" \
            "artifacts/frozen/outcomes/${outcomeArtifact_file}" \
            data/evaluation/historical-deep-house-journal-mechanics-score-lineage-v1.json \
            artifacts/historical-deep-house-journal-mechanics-score-v1.json
      - name: Verify descriptive-only score boundary
        shell: bash
        run: |
          set -euo pipefail
          file='artifacts/historical-deep-house-journal-mechanics-score-v1.json'
          test "$(jq -r '.schemaVersion' "$file")" = 'historical-deep-house-journal-mechanics-score-v1'
          test "$(jq -r '.metadata.evaluationPolicy' "$file")" = 'mechanic-conditioned-quick-residual-diagnostic-v1'
          test "$(jq -r '.metadata.outcomeUse' "$file")" = 'post-mechanics-freeze-development-scoring-only'
          test "$(jq -r '.metadata.probabilityAction' "$file")" = 'none'
          test "$(jq -r '.metadata.actionabilityDecision' "$file")" = 'none'
          test "$(jq -r '.input.discoveryCases' "$file")" = '24'
          test "$(jq -r '.input.discoveryMemberCasePairs' "$file")" = '3216'
          test "$(jq -r '.input.mechanicsCases' "$file")" = '24'
          test "$(jq -r '.input.mechanicsObservations' "$file")" = '107'
          test "$(jq -r '.input.outcomeCases' "$file")" = '24'
          test "$(jq -r '.input.decisiveMemberOutcomes' "$file")" = '3133'
          test "$(jq -r '.summary.mechanicallyActionableObservations' "$file")" = '0'
          test "$(jq -r '.summary.finalPassageInferenceObservations' "$file")" = '0'
          test "$(jq -r '.summary.cooccurrence | length' "$file")" = '78'
          jq -e '.summary.overall.quickBrier > 0.106 and .summary.overall.quickBrier < 0.107' "$file" >/dev/null
          jq -e '.summary.mechanics.reaches_final_passage_stage.withMechanic.cases == 5' "$file" >/dev/null
          jq -e '.summary.mechanics.reaches_final_passage_stage.withMechanic.memberWeightedSignedResidual > 0.06' "$file" >/dev/null
          jq -e '.summary.mechanics.laid_on_table.withMechanic.cases == 2' "$file" >/dev/null
          jq -e '.summary.mechanics.laid_on_table.withMechanic.memberWeightedSignedResidual < -0.20' "$file" >/dev/null
      - name: Upload frozen Journal mechanics development score
        uses: actions/upload-artifact@v4
        with:
          name: historical-deep-house-journal-mechanics-score-v1-${{ github.sha }}
          path: artifacts/historical-deep-house-journal-mechanics-score-v1.json
          if-no-files-found: error
          retention-days: 30
