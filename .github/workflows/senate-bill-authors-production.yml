name: Collect raw Minnesota Senate bill authors and House companions

on:
  pull_request:
    paths:
      - migrations/0025_senate_bill_authors.sql
      - src/operations/senate-bill-author-parser.ts
      - src/operations/senate-bill-authors.ts
      - scripts/deploy-senate-bill-authors-neon.ts
      - tests/senate-bill-authors.test.ts
      - docs/sources/senate-bill-authors.md
      - .github/workflows/senate-bill-authors-production.yml
  push:
    branches: [main]
    paths:
      - migrations/0025_senate_bill_authors.sql
      - src/operations/senate-bill-author-parser.ts
      - src/operations/senate-bill-authors.ts
      - scripts/deploy-senate-bill-authors-neon.ts
      - tests/senate-bill-authors.test.ts
      - docs/sources/senate-bill-authors.md
      - .github/workflows/senate-bill-authors-production.yml

permissions:
  contents: read

concurrency:
  group: senate-bill-authors-production
  cancel-in-progress: false

jobs:
  pr-keyless:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: votepredict
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d votepredict"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
      VOTEPREDICT_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: All migrations, including 0025, to disposable Postgres
        run: npm run db:migrate
      - name: Migration ledger drift gate
        run: node --import tsx scripts/check-production-migration-drift.ts
      - name: Raw authorship parser and twice-on-one-Postgres test
        run: node --import tsx --test tests/senate-bill-authors.test.ts
      - name: Complete project check
        run: npm run check
      - name: Explicit full test suite
        run: npm test

  independent-main:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event.repository.full_name == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.after == github.sha &&
      github.event.head_commit.id == github.sha &&
      github.event.deleted != true &&
      github.event.forced != true &&
      contains(github.event.head_commit.message, 'SENATE_BILL_AUTHORS_PRODUCTION')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: votepredict
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d votepredict"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
      VOTEPREDICT_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact reviewed main commit
        env:
          REVIEWED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run db:migrate
      - run: node --import tsx scripts/check-production-migration-drift.ts
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  protected-production-neon:
    needs: [independent-main]
    if: >-
      needs.independent-main.result == 'success' &&
      github.event_name == 'push' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event.repository.full_name == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.after == github.sha &&
      github.event.head_commit.id == github.sha &&
      github.event.deleted != true &&
      github.event.forced != true &&
      contains(github.event.head_commit.message, 'SENATE_BILL_AUTHORS_PRODUCTION')
    environment: evidence-readonly-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VOTEPREDICT_NEON_PROJECT_ID: ${{ vars.VOTEPREDICT_NEON_PROJECT_ID }}
      VOTEPREDICT_MEDIA_EXISTING_DATABASE: ${{ vars.VOTEPREDICT_MEDIA_EXISTING_DATABASE }}
      VOTEPREDICT_SENATE_BILL_AUTHORS_INDEPENDENT_CI: ${{ needs.independent-main.result == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm marker-bearing main SHA
        env:
          REVIEWED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Preflight, ledgered 0025, drift, bounded raw author collection and readback
        run: node --import tsx scripts/deploy-senate-bill-authors-neon.ts
