name: Senate first-party raw statements preview

on:
  pull_request:
    paths:
      - .github/workflows/senate-raw-statements-preview.yml
      - data/senate-press-sources.json
      - src/sources/minnesota/senate-press-raw.ts
      - src/operations/senate-press-raw-store.ts
      - scripts/collect-senate-press.ts
      - scripts/probe-senate-press-directories.ts
      - scripts/probe-senate-gop-recovery.ts
      - .github/workflows/senate-gop-press-production.yml
      - .github/workflows/senate-press-coverage-production.yml
      - migrations/0016_senate_raw_statements.sql
      - package.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Validate accessible GOP senator sources and exact 2023 missed publication
        run: node --import tsx scripts/probe-senate-gop-recovery.ts
      - name: Document publisher block on DFL historical source
        run: echo "DFL first-party automation is separately gated; its site currently returns HTTP 202 to automated public-archive requests."
