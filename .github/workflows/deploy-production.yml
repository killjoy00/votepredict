name: Deploy production

on:
  workflow_dispatch:
    inputs:
      run_vercel:
        description: Explicitly allow this workflow to contact Vercel
        required: true
        type: boolean
        default: false
      reason:
        description: Specific reason for this single read-only readiness canary
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.run_vercel == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout exact green main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify release SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$RELEASE_SHA" ]; then
            echo "::error::Checked out $actual but expected $RELEASE_SHA"
            exit 1
          fi

      - name: Check release is still current main
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$current" ]; then
            echo '::error::Could not resolve the current main SHA.'
            exit 1
          fi
          if [ "$current" = "$RELEASE_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo "Superseded release skipped: CI passed for $RELEASE_SHA but main is now $current"
          fi

      - uses: actions/setup-node@v7
        if: steps.freshness.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install release dependencies
        if: steps.freshness.outputs.deploy == 'true'
        run: npm ci --no-fund --no-audit

      - name: Require successful CI for this exact main commit
        if: steps.freshness.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/check-release-ci.ts

      - name: Stage exact green commit with forecasting paused and domains unassigned
        if: steps.freshness.outputs.deploy == 'true'
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CANARY_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ "${#CANARY_REASON}" -lt 15 ]; then
            echo '::error::Vercel credential and a specific canary reason are required.'
            exit 1
          fi
          current="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$current" != "$RELEASE_SHA" ]; then
            echo "::error::Main advanced to $current after the freshness gate; refusing to deploy stale $RELEASE_SHA."
            exit 1
          fi
          output="$(npx --yes vercel@59.13.1 deploy --prod --skip-domain --yes --build-env VOTEPREDICT_REQUIRE_MIGRATION_LEDGER=1 --env VOTEPREDICT_EXECUTION_MODE=readiness)"
          url="$(printf '%s\n' "$output" | grep -E '^https://[^ ]+$' | tail -n 1 || true)"
          if [ -z "$url" ]; then
            echo '::error::Vercel completed without returning a recognizable deployment URL.'
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url"

      - name: Record release
        if: steps.freshness.outputs.deploy == 'true'
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo '## VotePredict production deployment'
            echo
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Deployment: $DEPLOYMENT_URL"
            echo '- Migration ledger: exact repository match required inside the Vercel production build'
            echo '- Trigger: explicit manual Vercel run; reason retained in dispatch inputs'
            echo '- Mode: read-only readiness; forecasting, Deep, scheduling and 2027 capture paused'
            echo '- Domains: unassigned; verify one binding request before explicit promotion'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record superseded release
        if: steps.freshness.outputs.deploy != 'true'
        shell: bash
        run: |
          {
            echo '## VotePredict production deployment skipped'
            echo
            echo "- Green commit: \`$RELEASE_SHA\`"
            echo '- Reason: a newer commit is already on `main`.'
          } >> "$GITHUB_STEP_SUMMARY"
