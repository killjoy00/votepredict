name: Patch validation copy

on:
  push:
    branches:
      - eval/passage-validation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply honest validation labels
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');

          function replace(path, replacements) {
            let value = fs.readFileSync(path, 'utf8');
            for (const [from, to] of replacements) {
              if (!value.includes(from)) throw new Error(`Expected text not found in ${path}: ${from}`);
              value = value.replace(from, to);
            }
            fs.writeFileSync(path, value);
          }

          replace('src/app/dashboard/forecast-workspace.tsx', [
            ['<span className="outcome-label">Passage probability</span>', '<span className="outcome-label">Model passage estimate</span>'],
            ['<div><span>Central range</span><strong>{formatRange(forecastResult?.chamber.yesLow, forecastResult?.chamber.yesHigh)}</strong></div>', '<div><span>Vote range (uncalibrated)</span><strong>{formatRange(forecastResult?.chamber.yesLow, forecastResult?.chamber.yesHigh)}</strong></div>'],
            ['Quick mode uses the validated historical member model plus direct member votes on as-of-safe historical analogues.', 'Quick mode combines historical member tendencies with direct member votes on as-of-safe historical analogues. Historical validation has not yet shown analogue lift.'],
            ['return `${call} ${forecastResult.diagnostics.directAnalogueMembers} active members have direct votes on the selected historical analogues.`;', 'return `${call} ${forecastResult.diagnostics.directAnalogueMembers} active members have direct votes on the selected historical analogues. Treat the passage estimate as directional rather than calibrated odds on a close bill.`;'],
          ]);

          replace('src/app/share/[token]/page.tsx', [
            ['<span>Passage probability</span>', '<span>Model passage estimate</span>'],
            ['<div><span>Central range</span><strong>{shared.revision.yesLow === undefined || shared.revision.yesHigh === undefined ? \'—\' : `${shared.revision.yesLow}–${shared.revision.yesHigh}`}</strong></div>', '<div><span>Vote range (uncalibrated)</span><strong>{shared.revision.yesLow === undefined || shared.revision.yesHigh === undefined ? \'—\' : `${shared.revision.yesLow}–${shared.revision.yesHigh}`}</strong></div>'],
            ['<footer>This link exposes only this saved revision. It does not grant access to the private VotePredict workspace.</footer>', '<footer>This link exposes only this saved revision. It does not grant access to the private VotePredict workspace. The passage estimate is experimental and the vote range is not historically calibrated.</footer>'],
          ]);
          JS
      - name: Commit product copy
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/dashboard/forecast-workspace.tsx src/app/share/[token]/page.tsx
          git commit -m "ui: label unvalidated forecast outputs honestly"
          git push origin HEAD:eval/passage-validation
