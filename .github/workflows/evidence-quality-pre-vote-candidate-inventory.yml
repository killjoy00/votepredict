name: Inventory Evidence Quality pre-vote candidates

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  actions: read

concurrency:
  group: >-
    ${{ startsWith(github.event.comment.body, '[evidence-quality-pre-vote-candidate-inventory]')
        && 'evidence-quality-pre-vote-candidate-inventory'
        || format('evidence-quality-pre-vote-candidate-inventory-skip-{0}', github.event.comment.id) }}
  cancel-in-progress: false

jobs:
  inventory:
    if: >-
      github.event.issue.number == 718 &&
      github.event.comment.user.login == 'killjoy00' &&
      startsWith(github.event.comment.body, '[evidence-quality-pre-vote-candidate-inventory]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Materialize immutable historical target universe
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11252079484/zip > "$RUNNER_TEMP/historical-closeout.zip"
          echo "22e8944cffc6fda553b05ea6ad5e92400d35fc01d83177efdd5d1204dd3c5a6f  $RUNNER_TEMP/historical-closeout.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/historical-closeout"
          unzip -q "$RUNNER_TEMP/historical-closeout.zip" historical-as-of-matrix-v1.ndjson.gz -d "$RUNNER_TEMP/historical-closeout"
          python - <<'PYTHON'
          import gzip,json,os
          src=os.path.join(os.environ['RUNNER_TEMP'],'historical-closeout','historical-as-of-matrix-v1.ndjson.gz')
          dst=os.path.join(os.environ['RUNNER_TEMP'],'evidence-quality-target-universe-v1.ndjson')
          with gzip.open(src,'rt',encoding='utf-8') as fh, open(dst,'w',encoding='utf-8') as out:
              for line in fh:
                  row=json.loads(line)
                  target={k:row[k] for k in ['voteEventId','membershipId','session','chamber','occurredOn','billId','identifier']}
                  out.write(json.dumps(target,separators=(',',':'))+'\n')
          PYTHON

      - name: Materialize authoritative v1.5 Evidence Quality matrix
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11380755983/zip > "$RUNNER_TEMP/evidence-quality-v1-5.zip"
          echo "fe2254fc9d2ed0ea00712feab384958e4942cf387e442c29515b3a75183692d7  $RUNNER_TEMP/evidence-quality-v1-5.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/evidence-quality-v1-5"
          unzip -q "$RUNNER_TEMP/evidence-quality-v1-5.zip" evidence-quality-historical-feature-matrix-v1.5.ndjson.gz -d "$RUNNER_TEMP/evidence-quality-v1-5"

      - name: Materialize frozen v1.4 recovery inventory
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11317004477/zip > "$RUNNER_TEMP/evidence-quality-inventory-v1-4.zip"
          echo "f3ec4d6038ecb677c9b460a62a8d6aedba5cc2c80e15b83e8d85d0d7483a3da6  $RUNNER_TEMP/evidence-quality-inventory-v1-4.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/evidence-quality-inventory-v1-4"
          unzip -q "$RUNNER_TEMP/evidence-quality-inventory-v1-4.zip" evidence-quality-pre-vote-candidate-inventory-v1.4.json -d "$RUNNER_TEMP/evidence-quality-inventory-v1-4"

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Build read-only pre-vote candidate inventory
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_EQ_TARGET_UNIVERSE_PATH: ${{ runner.temp }}/evidence-quality-target-universe-v1.ndjson
          VOTEPREDICT_EQ_CURRENT_MATRIX_PATH: ${{ runner.temp }}/evidence-quality-v1-5/evidence-quality-historical-feature-matrix-v1.5.ndjson.gz
          VOTEPREDICT_EQ_V14_CANDIDATE_INVENTORY_PATH: ${{ runner.temp }}/evidence-quality-inventory-v1-4/evidence-quality-pre-vote-candidate-inventory-v1.4.json
          VOTEPREDICT_EQ_CANDIDATE_INVENTORY_DIR: ${{ runner.temp }}/evidence-quality-pre-vote-candidate-inventory
        run: node --import tsx scripts/inventory-evidence-quality-pre-vote-candidates.ts

      - name: Upload candidate inventory
        uses: actions/upload-artifact@v7
        with:
          name: evidence-quality-pre-vote-candidate-inventory-v1-5
          path: ${{ runner.temp }}/evidence-quality-pre-vote-candidate-inventory/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary credentials and source artifacts
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/votepredict-production.env" "$RUNNER_TEMP/vercel-pull.log" "$RUNNER_TEMP/historical-closeout.zip" "$RUNNER_TEMP/evidence-quality-v1-5.zip" "$RUNNER_TEMP/evidence-quality-inventory-v1-4.zip"
