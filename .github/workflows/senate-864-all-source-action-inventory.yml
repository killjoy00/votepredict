name: '#864 complete 2022-25 source action inventory, 1592 hearing days'
on:
  pull_request:
    paths:
      - src/evidence/senate-864-all-source-action-inventory.ts
      - scripts/build-senate-864-all-source-action-inventory.ts
      - tests/senate-864-all-original-source-action-inventory.test.ts
      - docs/evaluation/source-proof/senate-864-2022-25-eight-alternate-lrl-original-pdf-sha-receipts.json
      - src/evidence/senate-864-2022-25-official-original-minutes-overlay.ts
      - tests/senate-864-eight-alternate-original-lrl-minutes-overlay.test.ts
      - src/evidence/senate-864-verified-motion-addition-plan.ts
      - tests/senate-864-verified-motion-addition-plan.test.ts
      - docs/evaluation/source-proof/senate-864-2022-25-141-official-no-pdf-meeting-to-Clerk-crosswalk.json
      - docs/evaluation/source-proof/senate-864-2023-fifty-original-clerk-three-run-union-receipts.json
      - docs/evaluation/source-proof/senate-864-three-high-gap-2024-25-original-source-receipts-v2.json
      - .github/workflows/senate-864-all-source-action-inventory.yml
permissions:
  contents: read
  actions: read
jobs:
  independent-one-index-plus-all-original-sources:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Source identity, 2021 exclusion and 139 named source candidates tests
        run: |
          npx tsc --noEmit
          node --import tsx --test tests/senate-864-all-original-source-action-inventory.test.ts
          node --import tsx --test tests/senate-864-eight-alternate-original-lrl-minutes-overlay.test.ts
          node --import tsx --test tests/senate-864-verified-motion-addition-plan.test.ts
      - name: Independently verify immutable official 1592-day indexed/PDF source ledger artifact ZIP SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digest=$(gh api repos/killjoy00/votepredict/actions/artifacts/11776560365 --jq '.digest')
          test "$digest" = "sha256:f801aac6a68f6d57d12ea544548860a3f6f2e57b858035f8468068fce6007fe5"
      - name: Independently SHA-pin the extra eight government original PDFs source audit ZIP before using any new source proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digest=$(gh api repos/killjoy00/votepredict/actions/artifacts/11948425264 --jq '.digest')
          test "$digest" = "sha256:1e4fa7a20643e3b10d750cf991935a62af70956e03d63de18a4ba545362ca893"
      - name: Acquire immutable original SHA-pinned indexed 1592 meeting source ledger
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '11776560365'
          repository: killjoy00/votepredict
          run-id: 38314080633
          github-token: ${{ github.token }}
          path: artifacts/original
          merge-multiple: true
      - name: One-to-one join every original indexed PDF and all 111 Clerk sources and unlinked PDF without assuming all votes
        run: |
          node --import tsx scripts/build-senate-864-all-source-action-inventory.ts \
            --index-ledger artifacts/original/1592-official-meetings-to-source-action-candidates.json \
            --output artifacts/senate-864-all-known-2022-25-committee-actions.json
      - name: Preserve public evidence-only detailed action inventory as original source audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senate-864-2022-25-all-known-source-action-inventory
          path: artifacts/senate-864-all-known-2022-25-committee-actions.json
          if-no-files-found: ignore
          retention-days: 30
