name: Revisor action-history audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/revisor-action-audit.yml
      - scripts/audit-revisor-action-history.ts
      - src/app/api/operations/revisor-action-audit/route.ts
      - src/operations/revisor-action-audit.ts
      - src/sources/minnesota/revisor-actions.ts
      - tests/revisor-actions.test.ts
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
    steps:
      - uses: actions/checkout@v7
      - name: Require the existing Vercel credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN is unavailable. No production data was changed.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Deploy main before Revisor action audit
        shell: bash
        run: |
          if ! npx --yes vercel@59.13.1 deploy --prod --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-deploy.log" 2>&1; then
            echo 'Production deployment failed; no Revisor action audit was invoked.'
            exit 1
          fi
      - name: Read production authentication privately
        shell: bash
        run: |
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1
      - name: Audit official Revisor action history without writing labels
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/audit-revisor-action-history.ts
      - name: Remove temporary credentials and deployment logs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/votepredict-production.env" "$RUNNER_TEMP/vercel-pull.log" "$RUNNER_TEMP/vercel-deploy.log"
