name: Source expansion CFB candidate finance historical tranches

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'issue_comment' && (github.event.issue.number != 355 || github.event.comment.user.login != 'killjoy00' || !startsWith(github.event.comment.body, '[source-expansion-cfb-candidate-finance-historical-tranches]')) && format('source-expansion-cfb-candidate-finance-historical-tranches-skip-{0}', github.run_id) || 'source-expansion-cfb-candidate-finance-historical-tranches' }}
  cancel-in-progress: false

jobs:
  backfill:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 355 &&
        github.event.comment.user.login == 'killjoy00' &&
        startsWith(github.event.comment.body, '[source-expansion-cfb-candidate-finance-historical-tranches]')
      )
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch:
          - historical-high-volume-1
          - historical-high-volume-2
          - historical-high-volume-3
          - historical-high-volume-4
          - historical-high-volume-5
          - historical-high-volume-6
          - historical-high-volume-7
          - historical-high-volume-8
          - historical-high-volume-9
          - historical-high-volume-10
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      VOTEPREDICT_CFB_CANDIDATE_FINANCE_BATCH_SIZE: '100'
      VOTEPREDICT_CFB_CANDIDATE_FINANCE_BATCH_REQUEST: batch=${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit
      - name: Validate official covering-report proofs
        run: node --import tsx scripts/validate-cfb-candidate-report-history.ts
      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1
      - name: Backfill validated candidate finance rows
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/backfill-cfb-candidate-finance.ts
      - name: Remove temporary credentials and logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env','vercel-pull.log']:
              Path(os.environ['RUNNER_TEMP'],name).unlink(missing_ok=True)
          PYTHON
