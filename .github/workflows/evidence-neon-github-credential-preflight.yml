name: VotePredict Neon credential-name preflight (offline)

# One initial non-network check on merge, then manual reruns only.
# Does not enable Vercel, access Neon or reveal credential values.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/evidence-neon-github-credential-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-names-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VOTEPREDICT_HAS_NEON_API_KEY: ${{ secrets.NEON_API_KEY != '' }}
      VOTEPREDICT_HAS_NEON_PROJECT_ID: ${{ vars.VOTEPREDICT_NEON_PROJECT_ID != '' }}
      VOTEPREDICT_HAS_REPO_SANDBOX_URL: ${{ secrets.EVIDENCE_READONLY_SANDBOX_URL != '' }}
      VOTEPREDICT_HAS_LEGACY_DB_URL: ${{ secrets.DATABASE_URL_UNPOOLED != '' }}
    steps:
      - name: Checkout trusted repository code only
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Report boolean availability only (never resolve secret values)
        run: node scripts/check-github-neon-credential-presence.mjs
