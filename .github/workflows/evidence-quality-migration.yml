name: Evidence Quality v1 migration

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  id-token: write

concurrency:
  group: evidence-quality-v1-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.event.issue.number == 579 &&
      github.event.comment.user.login == 'killjoy00' &&
      startsWith(github.event.comment.body, '[evidence-quality-migration]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Lease VotePredict primary Neon connection
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl --fail --show-error --silent --retry 3 --retry-all-errors             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=votepredict-neon-loader" | jq -r .value)"
          DATABASE_URL="$(curl --fail --show-error --silent --retry 3 --retry-all-errors             -H "Authorization: Bearer $OIDC_TOKEN"             https://br-billowing-wave-aecfbwky-dblease.compute.c-2.us-east-2.aws.neon.tech/)"
          test -n "$DATABASE_URL"
          echo "::add-mask::$DATABASE_URL"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"

      - name: Read-only production preflight
        run: node --import tsx scripts/preflight-evidence-quality-migration.ts

      - name: Apply migration 0013
        if: >-
          startsWith(github.event.comment.body, '[evidence-quality-migration] apply')
        run: npm run db:migrate

      - name: Verify exact production migration ledger
        if: >-
          startsWith(github.event.comment.body, '[evidence-quality-migration] apply')
        env:
          VOTEPREDICT_REQUIRE_MIGRATION_LEDGER: '1'
        run: node --import tsx scripts/check-production-migration-drift.ts

      - name: Verify Evidence Quality tables
        if: >-
          startsWith(github.event.comment.body, '[evidence-quality-migration] apply')
        run: node --import tsx scripts/preflight-evidence-quality-migration.ts
