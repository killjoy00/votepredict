name: Probe 2021-22 historical density single source

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  actions: read

concurrency:
  group: >-
    ${{ startsWith(github.event.comment.body, '[historical-density-2021-single-source-probe]')
        && 'historical-density-2021-single-source-probe'
        || format('historical-density-2021-single-source-probe-skip-{0}', github.event.comment.id) }}
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event.issue.number == 718 &&
      github.event.comment.user.login == 'killjoy00' &&
      startsWith(github.event.comment.body, '[historical-density-2021-single-source-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Materialize frozen v1.4 candidate inventory
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11317004477/zip > "$RUNNER_TEMP/eq-inventory-v1-4.zip"
          echo "f3ec4d6038ecb677c9b460a62a8d6aedba5cc2c80e15b83e8d85d0d7483a3da6  $RUNNER_TEMP/eq-inventory-v1-4.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/eq-inventory-v1-4"
          unzip -q "$RUNNER_TEMP/eq-inventory-v1-4.zip" -d "$RUNNER_TEMP/eq-inventory-v1-4"

      - name: Materialize frozen v1.4 feature matrix
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11318046136/zip > "$RUNNER_TEMP/eq-feature-v1-4.zip"
          echo "e563a8f5623818af3eed1ea6182ad210009709095add5fc48398c5a6370ea648  $RUNNER_TEMP/eq-feature-v1-4.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/eq-feature-v1-4"
          unzip -q "$RUNNER_TEMP/eq-feature-v1-4.zip" evidence-quality-historical-feature-matrix-v1.4.ndjson.gz -d "$RUNNER_TEMP/eq-feature-v1-4"

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Probe exact 2021-22 ordinary source recovery
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_EQ_PRE_VOTE_INVENTORY_PATH: ${{ runner.temp }}/eq-inventory-v1-4/evidence-quality-pre-vote-candidate-inventory-v1.4.json
          VOTEPREDICT_EQ_V14_MATRIX_PATH: ${{ runner.temp }}/eq-feature-v1-4/evidence-quality-historical-feature-matrix-v1.4.ndjson.gz
          VOTEPREDICT_HISTORICAL_DENSITY_SINGLE_SOURCE_OUTPUT_DIR: ${{ runner.temp }}/historical-density-single-source
        run: node --import tsx scripts/probe-historical-density-2021-single-source.ts

      - name: Upload read-only probe artifact
        uses: actions/upload-artifact@v7
        with:
          name: historical-density-2021-single-source-probe-v1
          path: ${{ runner.temp }}/historical-density-single-source/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary credentials and frozen inputs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/votepredict-production.env" "$RUNNER_TEMP/vercel-pull.log" "$RUNNER_TEMP/eq-inventory-v1-4.zip" "$RUNNER_TEMP/eq-feature-v1-4.zip"
