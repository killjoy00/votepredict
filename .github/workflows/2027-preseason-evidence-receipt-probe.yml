name: 2027 targeted preseason source receipt probe
on:
  pull_request:
    paths:
      - '.github/workflows/2027-preseason-evidence-receipt-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'killjoy00/votepredict' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/2027-protected-preseason-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: node --import tsx --test tests/2027-preseason-evidence-archive.test.ts
      - run: node --import tsx scripts/run-2027-preseason-evidence-archive.ts --probe
