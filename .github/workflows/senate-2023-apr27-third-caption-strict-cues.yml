name: One-time 2023 Apr27 Taxes third SHA-verified auto-caption procedural cues

# One historical official caption text/html source, no AV, member choices, DB.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2023-apr27-third-caption-strict-cues.yml

permissions:
  contents: read
  actions: read

jobs:
  verify-original-third-caption:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Restore independent 2023 indexed Taxes official media ID source
        uses: actions/download-artifact@v4
        with:
          name: senate-2023-dated-media-href-review
          run-id: 38079233118
          github-token: ${{ github.token }}
          path: artifacts/2023-original-hrefs
      - name: Restore exact original 2023 Taxes media page HTML SHA
        uses: actions/download-artifact@v4
        with:
          name: senate-2023-official-media-record-html-proof
          run-id: 38081463362
          github-token: ${{ github.token }}
          path: artifacts/2023-original-html
      - name: Restore first original source partial, preserving only first two original Apr27 caption SHAs
        uses: actions/download-artifact@v4
        with:
          name: senate-2023-original-caption-surface-metadata
          run-id: 38103766440
          github-token: ${{ github.token }}
          path: artifacts/2023-first-caption-metadata
      - name: Restore separately original-source authenticated third Apr27 body SHA
        uses: actions/download-artifact@v4
        with:
          name: senate-2023-apr27-third-original-caption-source
          run-id: 38110655145
          github-token: ${{ github.token }}
          path: artifacts/2023-third-caption-metadata
      - name: Re-fetch and independently SHA-verify exactly third original caption and strict motion cues
        run: |
          node --import tsx scripts/review-senate-2023-apr27-third-caption-strict-cues.ts \
            --hrefs artifacts/2023-original-hrefs/senate-2023-media-hrefs.json \
            --original-html artifacts/2023-original-html/senate-2023-media-record-html.json \
            --first-caption artifacts/2023-first-caption-metadata/senate-2023-caption-surface.json \
            --third-source artifacts/2023-third-caption-metadata/senate-2023-apr27-third-original-caption-source.json \
            --output artifacts/2023-third-strict-cues/senate-2023-apr27-third-strict-caption-cues.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2023-apr27-third-original-caption-strict-cues
          path: artifacts/2023-third-strict-cues/senate-2023-apr27-third-strict-caption-cues.json
          retention-days: 30
          if-no-files-found: error
