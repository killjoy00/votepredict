name: Probe Senate caption speaker markers

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.event.issue.number == 477 &&
      github.event.comment.user.login == 'killjoy00' &&
      startsWith(github.event.comment.body, '[senator-caption-speaker-marker-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit
      - name: Probe explicit speaker markers in official Senate captions
        run: node --import tsx scripts/probe-senate-caption-speaker-markers.ts
