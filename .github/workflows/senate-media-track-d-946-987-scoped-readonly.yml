name: '#946 / #987 scoped original media source coverage READ ONLY'
on:
  pull_request:
    paths:
      - src/evaluation/senate-media-track-d-scoped-coverage.ts
      - scripts/audit-senate-media-track-d-scoped-coverage-readonly.ts
      - tests/senate-media-track-d-scoped-coverage.test.ts
      - .github/workflows/senate-media-track-d-946-987-scoped-readonly.yml
      - docs/evaluation/senate-media-track-d-946-987-readonly-crosswalk.md
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: senate-media-track-d-946-987-${{ github.sha }}
  cancel-in-progress: false
jobs:
  keyless-review:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        github.run_attempt == 1 &&
        contains(github.event.head_commit.message, 'TRACK_D_946_987_SCOPED_READONLY_COVERAGE_V1_20261018')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Check original-source SHA set, private aggregate bounds and defensive ROLLBACK
        run: |
          node --import tsx --test tests/senate-media-track-d-scoped-coverage.test.ts
          node --import tsx scripts/audit-senate-media-track-d-scoped-coverage-readonly.ts --preflight
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
  protected-original-coverage:
    needs: [keyless-review]
    if: >-
      needs.keyless-review.result == 'success' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, 'TRACK_D_946_987_SCOPED_READONLY_COVERAGE_V1_20261018')
    environment: evidence-readonly-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VOTEPREDICT_NEON_PROJECT_ID: ${{ vars.VOTEPREDICT_NEON_PROJECT_ID }}
      VOTEPREDICT_MEDIA_EXISTING_DATABASE: ${{ vars.VOTEPREDICT_MEDIA_EXISTING_DATABASE }}
      TRACK_D_READ_ONLY_APPROVAL: PUBLIC_ORIGINALS_TO_AGGREGATE_MEDIA_COVERAGE
      TRACK_D_MAIN_CI_PASSED: ${{ needs.keyless-review.result == 'success' && 'true' || 'false' }}
      TRACK_D_MAIN_MARKER_PRESENT: ${{ contains(github.event.head_commit.message, 'TRACK_D_946_987_SCOPED_READONLY_COVERAGE_V1_20261018') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm exact reviewed main commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Compare public SHA-captured originals to private scoped media context aggregate only
        run: node --import tsx scripts/audit-senate-media-track-d-scoped-coverage-readonly.ts --protected
