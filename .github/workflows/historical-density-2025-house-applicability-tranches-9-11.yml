name: Audit final 2025 House applicability tranches 9-11

on:
  pull_request:
    paths:
      - scripts/freeze-historical-density-2025-house-target-tranche-final.mjs
      - scripts/audit-historical-density-2025-house-applicability-final.ts
      - .github/workflows/historical-density-2025-house-applicability-tranches-9-11.yml
  push:
    branches: [main]
    paths:
      - scripts/freeze-historical-density-2025-house-target-tranche-final.mjs
      - scripts/audit-historical-density-2025-house-applicability-final.ts
      - .github/workflows/historical-density-2025-house-applicability-tranches-9-11.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-2025-house-applicability-tranches-9-11-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: tranche-${{ matrix.tranche }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - tranche: 9
            rank_start: 201
            rank_end: 225
            event_count: 25
            event_sha: ee804ad6c0d65f64848a96c716e000146ca09e74ac00e31ca4a2be9d08896c3e
            min_date: '2026-05-12'
            max_date: '2026-05-16'
            final_partial: 'false'
          - tranche: 10
            rank_start: 226
            rank_end: 250
            event_count: 25
            event_sha: 87cfaaec13743d7c7d97f2ea3b69f5f2cfb389320e356a4893991827ba023848
            min_date: '2025-02-20'
            max_date: '2026-05-17'
            final_partial: 'false'
          - tranche: 11
            rank_start: 251
            rank_end: 264
            event_count: 14
            event_sha: 3d4d83276928f170726e2a499c2422eac2ede373f711bcdcfdca29c542e95242
            min_date: '2025-03-03'
            max_date: '2026-04-20'
            final_partial: 'true'
    env:
      GH_TOKEN: ${{ github.token }}
      VOTEPREDICT_2025_HOUSE_TARGET_TRANCHE_INDEX: ${{ matrix.tranche }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Materialize immutable v1.7 matrix
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11436413885/zip > "$RUNNER_TEMP/v17.zip"
          echo "fc1d77ccc51bc33f3e3f1c0dd6622c0f2a9797d62a8d54bcb65906de30228e44  $RUNNER_TEMP/v17.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/v17"
          unzip -q "$RUNNER_TEMP/v17.zip"             evidence-quality-historical-feature-matrix-v1.7-manifest.json             evidence-quality-historical-feature-matrix-v1.7.ndjson.gz             -d "$RUNNER_TEMP/v17"

      - name: Freeze target-event tranche ${{ matrix.tranche }}
        env:
          VOTEPREDICT_EQ_V17_MANIFEST_PATH: ${{ runner.temp }}/v17/evidence-quality-historical-feature-matrix-v1.7-manifest.json
          VOTEPREDICT_EQ_V17_MATRIX_PATH: ${{ runner.temp }}/v17/evidence-quality-historical-feature-matrix-v1.7.ndjson.gz
          VOTEPREDICT_2025_HOUSE_TARGET_TRANCHE_OUTPUT_DIR: ${{ runner.temp }}/target-tranche
        run: node scripts/freeze-historical-density-2025-house-target-tranche-final.mjs

      - name: Verify target-event tranche
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/target-tranche/historical-density-2025-house-target-tranche-${{ matrix.tranche }}-v1.json"
          test "$(jq -r '.schemaVersion' "$f")" = historical-density-2025-house-target-tranche-v1
          test "$(jq -r '.issue' "$f")" = 718
          test "$(jq -r '.session' "$f")" = 2025-2026
          test "$(jq -r '.ranking.totalUncoveredHouseEvents' "$f")" = 264
          test "$(jq -r '.ranking.trancheIndex' "$f")" = ${{ matrix.tranche }}
          test "$(jq -r '.ranking.rankStart' "$f")" = ${{ matrix.rank_start }}
          test "$(jq -r '.ranking.rankEnd' "$f")" = ${{ matrix.rank_end }}
          test "$(jq -r '.ranking.eventCount' "$f")" = ${{ matrix.event_count }}
          test "$(jq -r '.ranking.eventKeySha256' "$f")" = ${{ matrix.event_sha }}
          test "$(jq -r '.ranking.finalPartialTranche' "$f")" = ${{ matrix.final_partial }}
          test "$(jq -r '.minTargetDate' "$f")" = ${{ matrix.min_date }}
          test "$(jq -r '.maxTargetDate' "$f")" = ${{ matrix.max_date }}
          test "$(jq -r '.policy.targetVoteOutcomesRead' "$f")" = false
          test "$(jq -r '.policy.outcomeUse' "$f")" = none
          test "$(jq -r '.policy.productionDatabaseQueried' "$f")" = false
          test "$(jq -r '.policy.productionWrites' "$f")" = false
          test "$(jq -r '.policy.vercelUsed' "$f")" = false
          test "$(jq -r '.policy.featureRowsWritten' "$f")" = false
          test "$(jq -r '.policy.modelFitting' "$f")" = none
          test "$(jq -r '.policy.servingChanged' "$f")" = false

      - name: Materialize canonical main semantic review
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11445241994/zip > "$RUNNER_TEMP/semantic-review.zip"
          echo "80429ab79b4ab973d76fdd2fbdec5e8c55091a5c7873c96dad066a004a22cfce  $RUNNER_TEMP/semantic-review.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/semantic-review"
          unzip -q "$RUNNER_TEMP/semantic-review.zip" historical-density-2025-house-semantic-review-v1.json -d "$RUNNER_TEMP/semantic-review"

      - name: Audit strict-pre-vote bill-policy candidates
        env:
          VOTEPREDICT_2025_HOUSE_SEMANTIC_REVIEW_PATH: ${{ runner.temp }}/semantic-review/historical-density-2025-house-semantic-review-v1.json
          VOTEPREDICT_2025_HOUSE_TARGET_TRANCHE_PATH: ${{ runner.temp }}/target-tranche/historical-density-2025-house-target-tranche-${{ matrix.tranche }}-v1.json
          VOTEPREDICT_2025_HOUSE_APPLICABILITY_OUTPUT_DIR: ${{ runner.temp }}/applicability-audit
        run: node --import tsx scripts/audit-historical-density-2025-house-applicability-final.ts

      - name: Verify candidate-audit boundary
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/applicability-audit/historical-density-2025-house-applicability-candidate-audit-tranche-${{ matrix.tranche }}-v1.json"
          test "$(jq -r '.schemaVersion' "$f")" = historical-density-2025-house-applicability-candidate-audit-tranche-v1
          test "$(jq -r '.issue' "$f")" = 718
          test "$(jq -r '.session' "$f")" = 2025-2026
          test "$(jq -r '.cohort.novelSemanticGroups' "$f")" = 46
          test "$(jq -r '.cohort.targetEvents' "$f")" = ${{ matrix.event_count }}
          test "$(jq -r '.frozenInputs.targetTrancheIndex' "$f")" = ${{ matrix.tranche }}
          test "$(jq -r '.frozenInputs.targetRankStart' "$f")" = ${{ matrix.rank_start }}
          test "$(jq -r '.frozenInputs.targetRankEnd' "$f")" = ${{ matrix.rank_end }}
          test "$(jq -r '.frozenInputs.targetEventKeySha256' "$f")" = ${{ matrix.event_sha }}
          test "$(jq -r '.sourceVerification.events' "$f")" = ${{ matrix.event_count }}
          jq -e '.sourceVerification.statusCounts | to_entries | all(.key == "verified" or .key == "no_strict_prevote_version")' "$f" >/dev/null
          jq -e '.candidateScreen.candidateClaimPairs == (.candidateClaims | length)' "$f" >/dev/null
          jq -e '.candidateScreen.candidateReviewGroups == (.candidateClaims | map(.reviewKey) | unique | length)' "$f" >/dev/null
          test "$(jq -r '.candidateScreen.automaticApplicableRows' "$f")" = 0
          test "$(jq -r '.candidateScreen.automaticAlignmentRows' "$f")" = 0
          jq -e '[.candidateClaims[].applicabilityDecision] | all(. == "pending_semantic_review")' "$f" >/dev/null
          jq -e '[.candidateClaims[].internalMembershipIdentityResolved] | all(. == false)' "$f" >/dev/null
          jq -e '[.candidateClaims[].versionProof.strictlyBeforeVoteDate] | all(. == true)' "$f" >/dev/null
          test "$(jq -r '.policy.outcomeUse' "$f")" = none
          test "$(jq -r '.policy.targetVoteOutcomesRead' "$f")" = false
          test "$(jq -r '.policy.productionDatabaseQueried' "$f")" = false
          test "$(jq -r '.policy.productionWrites' "$f")" = false
          test "$(jq -r '.policy.vercelUsed' "$f")" = false
          test "$(jq -r '.policy.internalMembershipIdentityResolved' "$f")" = false
          test "$(jq -r '.policy.deterministicScreenCanDeclareApplicability' "$f")" = false
          test "$(jq -r '.policy.semanticReviewRequiredForApplicability' "$f")" = true
          test "$(jq -r '.policy.featureRowsWritten' "$f")" = false
          test "$(jq -r '.policy.modelFitting' "$f")" = none
          test "$(jq -r '.policy.servingChanged' "$f")" = false
          {
            echo "## 2025-26 House applicability — tranche ${{ matrix.tranche }}"
            echo
            echo "- Target ranks: **${{ matrix.rank_start }}-${{ matrix.rank_end }}**"
            echo "- Frozen target events: **${{ matrix.event_count }}**"
            echo "- Eligible claim-event pairs: **$(jq -r '.cohort.eligibleClaimEventPairs' "$f")**"
            echo "- Candidate claim pairs: **$(jq -r '.candidateScreen.candidateClaimPairs' "$f")**"
            echo "- Candidate bills: **$(jq -r '.candidateScreen.candidateBills' "$f")**"
            echo "- Candidate public members: **$(jq -r '.candidateScreen.candidatePublicMembers' "$f")**"
            echo "- Candidate semantic groups: **$(jq -r '.candidateScreen.candidateSemanticGroups' "$f")**"
            echo '- Automatic applicable rows: **0**'
            echo '- Outcomes used: **none**'
            echo '- Production DB queried: **no**'
            echo '- Vercel used: **no**'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: historical-density-2025-house-applicability-tranche-${{ matrix.tranche }}-v1
          path: |
            ${{ runner.temp }}/target-tranche/*
            ${{ runner.temp }}/applicability-audit/*
          if-no-files-found: error
          retention-days: 90
