name: One-shot public-source review of 41 bill authorship exceptions

on:
  pull_request:
    paths:
      - scripts/audit-senate-bill-authors-41-source-readonly.ts
      - tests/senate-bill-authors-41-source-readonly.test.ts
      - .github/workflows/senate-bill-authors-41-source-review.yml
  push:
    branches: [main]
    paths:
      - scripts/audit-senate-bill-authors-41-source-readonly.ts
      - tests/senate-bill-authors-41-source-readonly.test.ts
      - .github/workflows/senate-bill-authors-41-source-review.yml

permissions:
  contents: read

concurrency:
  group: senate-bill-authors-41-public-source-review
  cancel-in-progress: false

jobs:
  pr-keyless:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run check
      - run: npm test

  independent-main:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.repository.full_name == 'killjoy00/votepredict' &&
      github.event.repository.default_branch == 'main' &&
      github.event.after == github.sha &&
      github.event.head_commit.id == github.sha &&
      github.event.deleted != true &&
      github.event.forced != true &&
      contains(github.event.head_commit.message, 'SENATE_BILL_AUTHORS_41_PUBLIC_SOURCE_REVIEW')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  public-revisor-source-review:
    needs: [independent-main]
    if: >-
      needs.independent-main.result == 'success' &&
      github.event_name == 'push' &&
      github.repository == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.repository.default_branch == 'main' &&
      github.event.after == github.sha &&
      github.event.head_commit.id == github.sha &&
      github.event.deleted != true &&
      github.event.forced != true &&
      contains(github.event.head_commit.message, 'SENATE_BILL_AUTHORS_41_PUBLIC_SOURCE_REVIEW')
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      VOTEPREDICT_AUTHORS_41_SOURCE_REVIEW_CI: ${{ needs.independent-main.result == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Inspect frozen 41-case official API and HTML metadata without data writes
        run: node --import tsx scripts/audit-senate-bill-authors-41-source-readonly.ts
