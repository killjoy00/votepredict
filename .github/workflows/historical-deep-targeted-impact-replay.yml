name: Historical Deep targeted impact replay

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: historical-deep-targeted-impact-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Verify pinned frozen artifact digests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lineage='data/evaluation/historical-deep-targeted-impact-replay-lineage-v1.json'
          verify_artifact() {
            local section="$1"
            local id expected actual expired
            id="$(jq -r ".${section}.artifactId" "$lineage")"
            expected="sha256:$(jq -r ".${section}.artifactSha256" "$lineage")"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" > "$RUNNER_TEMP/${section}.json"
            actual="$(jq -r '.digest // empty' "$RUNNER_TEMP/${section}.json")"
            expired="$(jq -r '.expired' "$RUNNER_TEMP/${section}.json")"
            test "$expired" = "false"
            test "$actual" = "$expected"
            echo "${section}_run_id=$(jq -r ".${section}.workflowRunId" "$lineage")" >> "$GITHUB_ENV"
            echo "${section}_name=$(jq -r ".${section}.artifactName" "$lineage")" >> "$GITHUB_ENV"
          }
          verify_artifact targetStrategyBakeoff
          verify_artifact discoveryManifest
          verify_artifact sourceBundle
          verify_artifact candidateArtifact
          verify_artifact outcomeArtifact
      - name: Download frozen target-strategy bakeoff
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.targetStrategyBakeoff_run_id }}
          name: ${{ env.targetStrategyBakeoff_name }}
          path: artifacts/frozen/strategies
      - name: Download frozen chamber-wide Quick discovery manifest
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.discoveryManifest_run_id }}
          name: ${{ env.discoveryManifest_name }}
          path: artifacts/frozen/discovery
      - name: Download frozen official source bundle
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.sourceBundle_run_id }}
          name: ${{ env.sourceBundle_name }}
          path: artifacts/frozen/sources
      - name: Download frozen discovery candidates
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.candidateArtifact_run_id }}
          name: ${{ env.candidateArtifact_name }}
          path: artifacts/frozen/candidates
      - name: Download frozen post-discovery outcomes
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.outcomeArtifact_run_id }}
          name: ${{ env.outcomeArtifact_name }}
          path: artifacts/frozen/outcomes
      - name: Replay need-only targeting through unchanged production impact
        run: |
          node --import tsx scripts/evaluate-historical-deep-targeted-impact-replay.ts \
            artifacts/frozen/strategies/historical-deep-target-strategies.json \
            artifacts/frozen/discovery/historical-deep-discovery-manifest.json \
            artifacts/frozen/candidates/historical-deep-discovery-candidates.json \
            artifacts/frozen/sources/historical-deep-pilot-source-bundle.json \
            artifacts/frozen/outcomes/historical-deep-outcome-snapshot.json \
            artifacts/historical-deep-targeted-impact-replay.json
      - name: Upload targeted historical Deep replay
        uses: actions/upload-artifact@v4
        with:
          name: historical-deep-targeted-impact-replay-${{ github.sha }}
          path: artifacts/historical-deep-targeted-impact-replay.json
          if-no-files-found: error
          retention-days: 30
