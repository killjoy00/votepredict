name: Historical Deep expansion impact replay v2

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: historical-deep-expansion-impact-replay-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Verify all immutable replay artifact digests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lineage='data/evaluation/historical-deep-expansion-impact-lineage-v2.json'
          verify_artifact() {
            local section="$1"
            local id expected actual expired
            id="$(jq -r ".${section}.artifactId" "$lineage")"
            expected="sha256:$(jq -r ".${section}.artifactSha256" "$lineage")"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" > "$RUNNER_TEMP/${section}.json"
            actual="$(jq -r '.digest // empty' "$RUNNER_TEMP/${section}.json")"
            expired="$(jq -r '.expired' "$RUNNER_TEMP/${section}.json")"
            test "$expired" = 'false'
            test "$actual" = "$expected"
            echo "${section}_run_id=$(jq -r ".${section}.workflowRunId" "$lineage")" >> "$GITHUB_ENV"
            echo "${section}_name=$(jq -r ".${section}.artifactName" "$lineage")" >> "$GITHUB_ENV"
          }
          verify_artifact discoveryManifest
          verify_artifact sourceBundle
          verify_artifact candidateArtifact
          verify_artifact outcomeArtifact
          verify_artifact scoreArtifact
      - name: Download frozen expansion discovery manifest
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.discoveryManifest_run_id }}
          name: ${{ env.discoveryManifest_name }}
          path: artifacts/frozen/discovery
      - name: Download frozen official expansion source bundle
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.sourceBundle_run_id }}
          name: ${{ env.sourceBundle_name }}
          path: artifacts/frozen/sources
      - name: Download frozen guarded parser-v2 candidates
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.candidateArtifact_run_id }}
          name: ${{ env.candidateArtifact_name }}
          path: artifacts/frozen/candidates-v2
      - name: Download preexisting frozen expansion outcomes
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.outcomeArtifact_run_id }}
          name: ${{ env.outcomeArtifact_name }}
          path: artifacts/frozen/outcomes
      - name: Download frozen parser-v2 score
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.scoreArtifact_run_id }}
          name: ${{ env.scoreArtifact_name }}
          path: artifacts/frozen/score-v2
      - name: Verify replay boundary
        shell: bash
        run: |
          set -euo pipefail
          lineage='data/evaluation/historical-deep-expansion-impact-lineage-v2.json'
          discovery='artifacts/frozen/discovery/historical-deep-expansion-discovery-manifest.json'
          sources='artifacts/frozen/sources/historical-deep-expansion-source-bundle.json'
          candidates='artifacts/frozen/candidates-v2/historical-deep-expansion-discovery-candidates-v2.json'
          outcomes='artifacts/frozen/outcomes/historical-deep-expansion-outcome-snapshot.json'
          score='artifacts/frozen/score-v2/historical-deep-expansion-discovery-score-v2.json'
          test "$(jq -r '.schemaVersion' "$discovery")" = 'historical-deep-expansion-discovery-manifest-v1'
          test "$(jq -r '.schemaVersion' "$sources")" = 'historical-deep-expansion-source-bundle-v1'
          test "$(jq -r '.schemaVersion' "$candidates")" = 'historical-deep-expansion-discovery-candidates-v2'
          test "$(jq -r '.metadata.parser' "$candidates")" = 'deterministic-house-committee-roll-call-v2'
          test "$(jq -r '.metadata.outcomeUse' "$candidates")" = 'none'
          test "$(jq -r '.summary.candidateCount' "$candidates")" = '212'
          test "$(jq -r '.summary.memberCasePairsWithCandidates' "$candidates")" = '190'
          test "$(jq '[.. | objects | select(has("actualOutcome") or has("actualYes") or has("passed") or has("yeaCount") or has("nayCount"))] | length' "$candidates")" = '0'
          test "$(jq -r '.schemaVersion' "$outcomes")" = 'historical-deep-expansion-outcome-snapshot-v1'
          test "$(jq -r '.candidateArtifact.artifactId' "$outcomes")" = "$(jq -r '.outcomeArtifact.originCandidateArtifactId' "$lineage")"
          test "$(jq -r '.candidateArtifact.artifactSha256' "$outcomes")" = "$(jq -r '.outcomeArtifact.originCandidateArtifactSha256' "$lineage")"
          test "$(jq -r '.schemaVersion' "$score")" = 'historical-deep-expansion-discovery-score-v2'
          test "$(jq -r '.metadata.signalClassifier' "$score")" = 'historical-deep-outcome-scorer-v1-unchanged'
          test "$(jq -r '.summary.candidateObservations' "$score")" = '212'
          test "$(jq -r '.summary.memberCasePairs' "$score")" = '190'
          test "$(jq -r '.summary.directionalPairs' "$score")" = '73'
          test "$(jq -r '.summary.conflictingPairs' "$score")" = '12'
          test "$(jq -r '.summary.ambiguousOnlyPairs' "$score")" = '105'
      - name: Replay frozen parser-v2 evidence through unchanged production impact
        run: |
          node --import tsx scripts/evaluate-historical-deep-expansion-impact-replay-v2.ts \
            artifacts/frozen/discovery/historical-deep-expansion-discovery-manifest.json \
            artifacts/frozen/candidates-v2/historical-deep-expansion-discovery-candidates-v2.json \
            artifacts/frozen/sources/historical-deep-expansion-source-bundle.json \
            artifacts/frozen/outcomes/historical-deep-expansion-outcome-snapshot.json \
            artifacts/frozen/score-v2/historical-deep-expansion-discovery-score-v2.json \
            artifacts/historical-deep-expansion-impact-replay-v2.json
      - name: Verify unchanged impact policy and scenario budget
        shell: bash
        run: |
          set -euo pipefail
          file='artifacts/historical-deep-expansion-impact-replay-v2.json'
          test "$(jq -r '.schemaVersion' "$file")" = 'historical-deep-expansion-impact-replay-v2'
          test "$(jq -r '.metadata.impactVersion' "$file")" = 'logit-evidence-v1'
          test "$(jq -r '.metadata.candidateStrategy' "$file")" = 'need-only'
          test "$(jq -r '.metadata.targetLimit' "$file")" = '12'
          test "$(jq -r '.metadata.candidateParser' "$file")" = 'deterministic-house-committee-roll-call-v2'
          test "$(jq -r '.metadata.signalClassifier' "$file")" = 'historical-deep-outcome-scorer-v1-unchanged'
          test "$(jq -r '.input.discoveryCases' "$file")" = '24'
          test "$(jq -r '.input.candidateObservations' "$file")" = '212'
          test "$(jq -r '.scenarios["current-targets"].requestedTargets' "$file")" = '288'
          test "$(jq -r '.scenarios["need-only-targets"].requestedTargets' "$file")" = '288'
      - name: Upload parser-v2 expansion impact replay
        uses: actions/upload-artifact@v4
        with:
          name: historical-deep-expansion-impact-replay-v2-${{ github.sha }}
          path: artifacts/historical-deep-expansion-impact-replay-v2.json
          if-no-files-found: error
          retention-days: 30
