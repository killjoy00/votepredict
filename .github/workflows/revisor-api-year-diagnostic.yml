name: Revisor API year diagnostic

on:
  push:
    branches: [quick/revisor-year-diagnostic]
    paths:
      - scripts/diagnose-revisor-api-years.ts
      - .github/workflows/revisor-api-year-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: node --import tsx scripts/diagnose-revisor-api-years.ts
