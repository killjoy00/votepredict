name: Export recovered Evidence Quality Session Daily review cohort

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  actions: read

concurrency:
  group: >-
    ${{ startsWith(github.event.comment.body, '[evidence-quality-session-daily-recovered-review-cohort]')
        && 'evidence-quality-session-daily-recovered-review-cohort'
        || format('evidence-quality-session-daily-recovered-review-cohort-skip-{0}', github.event.comment.id) }}
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.event.issue.number == 579 &&
      github.event.comment.user.login == 'killjoy00' &&
      startsWith(github.event.comment.body, '[evidence-quality-session-daily-recovered-review-cohort]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Materialize canonical archive proof artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11314884404/zip > "$RUNNER_TEMP/evidence-quality-pre-vote-archive-proof-canonical-v1.zip"
          echo "075f0f4a9fbc113747164bbeeec1a2847de08c9d44a08d249a4410e8a83667a1  $RUNNER_TEMP/evidence-quality-pre-vote-archive-proof-canonical-v1.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/evidence-quality-pre-vote-archive-proof-canonical-v1"
          unzip -q "$RUNNER_TEMP/evidence-quality-pre-vote-archive-proof-canonical-v1.zip" -d "$RUNNER_TEMP/evidence-quality-pre-vote-archive-proof-canonical-v1"

      - name: Materialize positive-proof availability fallback artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11315014442/zip > "$RUNNER_TEMP/evidence-quality-pre-vote-archive-availability-fallback-v1.zip"
          echo "bee02801a8eedbc060ef3fe5d48ba140022283a270db24cbd07fcc9f08a4ac9b  $RUNNER_TEMP/evidence-quality-pre-vote-archive-availability-fallback-v1.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/evidence-quality-pre-vote-archive-availability-fallback-v1"
          unzip -q "$RUNNER_TEMP/evidence-quality-pre-vote-archive-availability-fallback-v1.zip" -d "$RUNNER_TEMP/evidence-quality-pre-vote-archive-availability-fallback-v1"

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Export read-only recovered semantic review cohort
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_EQ_ARCHIVE_PROOF_PATH: ${{ runner.temp }}/evidence-quality-pre-vote-archive-proof-canonical-v1/evidence-quality-pre-vote-archive-proof-canonical-v1.json
          VOTEPREDICT_EQ_ARCHIVE_PROOF_ARTIFACT_ID: "11314884404"
          VOTEPREDICT_EQ_ARCHIVE_PROOF_ARTIFACT_DIGEST: "sha256:075f0f4a9fbc113747164bbeeec1a2847de08c9d44a08d249a4410e8a83667a1"
          VOTEPREDICT_EQ_ARCHIVE_PROOF_RUN_ID: "37235551185"
          VOTEPREDICT_EQ_ARCHIVE_FALLBACK_PATH: ${{ runner.temp }}/evidence-quality-pre-vote-archive-availability-fallback-v1/evidence-quality-pre-vote-archive-availability-fallback-v1.json
          VOTEPREDICT_EQ_ARCHIVE_FALLBACK_ARTIFACT_ID: "11315014442"
          VOTEPREDICT_EQ_ARCHIVE_FALLBACK_ARTIFACT_DIGEST: "sha256:bee02801a8eedbc060ef3fe5d48ba140022283a270db24cbd07fcc9f08a4ac9b"
          VOTEPREDICT_EQ_ARCHIVE_FALLBACK_RUN_ID: "37235904868"
          VOTEPREDICT_EQ_SESSION_DAILY_REVIEW_DIR: ${{ runner.temp }}/evidence-quality-session-daily-recovered-review-cohort
        run: node --import tsx scripts/export-evidence-quality-session-daily-recovered-review-cohort.ts

      - name: Upload frozen recovered review cohort
        uses: actions/upload-artifact@v7
        with:
          name: evidence-quality-session-daily-recovered-review-cohort-v1
          path: ${{ runner.temp }}/evidence-quality-session-daily-recovered-review-cohort/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary credentials and proof artifact
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/votepredict-production.env" "$RUNNER_TEMP/vercel-pull.log" "$RUNNER_TEMP/evidence-quality-pre-vote-archive-proof-canonical-v1.zip" "$RUNNER_TEMP/evidence-quality-pre-vote-archive-availability-fallback-v1.zip"
