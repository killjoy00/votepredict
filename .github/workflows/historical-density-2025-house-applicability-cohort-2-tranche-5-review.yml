name: Freeze reviewed 2025 House cohort 2 applicability tranche 4

on:
  pull_request:
    paths:
      - data/evaluation/evidence-quality/historical-density-2025-house-applicability-cohort-2-tranche-5-decisions-v1.json
      - scripts/freeze-historical-density-2025-house-applicability-cohort-2-tranche-5-review.ts
      - tests/historical-density-2025-house-applicability-cohort-2-tranche-5-review.test.ts
      - .github/workflows/historical-density-2025-house-applicability-cohort-2-tranche-5-review.yml
  push:
    branches: [main]
    paths:
      - data/evaluation/evidence-quality/historical-density-2025-house-applicability-cohort-2-tranche-5-decisions-v1.json
      - scripts/freeze-historical-density-2025-house-applicability-cohort-2-tranche-5-review.ts
      - tests/historical-density-2025-house-applicability-cohort-2-tranche-5-review.test.ts
      - .github/workflows/historical-density-2025-house-applicability-cohort-2-tranche-5-review.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-2025-house-applicability-cohort-2-tranche-5-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Test checked-in tranche-5 applicability decisions
        run: node --import tsx --test tests/historical-density-2025-house-applicability-cohort-2-tranche-5-review.test.ts

      - name: Materialize immutable tranche-5 candidate audit
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11563311998/zip > "$RUNNER_TEMP/tranche5-audit.zip"
          echo "1b06113f1bd71925444e5a1d6e1f5ec6b7b24de43ec7a7da0ab81b4693b72b96  $RUNNER_TEMP/tranche5-audit.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tranche5-audit"
          unzip -q "$RUNNER_TEMP/tranche5-audit.zip" applicability-audit/historical-density-2025-house-applicability-candidate-audit-cohort-2-tranche-5-v1.json -d "$RUNNER_TEMP/tranche5-audit"

      - name: Freeze reviewed tranche-5 applicability gate
        env:
          VOTEPREDICT_2025_HOUSE_COHORT_2_TRANCHE5_APPLICABILITY_AUDIT_PATH: ${{ runner.temp }}/tranche5-audit/applicability-audit/historical-density-2025-house-applicability-candidate-audit-cohort-2-tranche-5-v1.json
          VOTEPREDICT_2025_HOUSE_COHORT_2_TRANCHE5_APPLICABILITY_DECISIONS_PATH: data/evaluation/evidence-quality/historical-density-2025-house-applicability-cohort-2-tranche-5-decisions-v1.json
          VOTEPREDICT_2025_HOUSE_COHORT_2_TRANCHE5_APPLICABILITY_REVIEW_OUTPUT: ${{ runner.temp }}/tranche5-review/historical-density-2025-house-applicability-review-cohort-2-tranche-5-v1.json
        run: node --import tsx scripts/freeze-historical-density-2025-house-applicability-cohort-2-tranche-5-review.ts

      - name: Verify reviewed tranche-5 boundary
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/tranche5-review/historical-density-2025-house-applicability-review-cohort-2-tranche-5-v1.json"
          test "$(jq -r '.schemaVersion' "$f")" = historical-density-2025-house-applicability-review-cohort-2-tranche-5-v1
          test "$(jq -r '.issue' "$f")" = 718
          test "$(jq -r '.session' "$f")" = 2025-2026
          test "$(jq -r '.review.candidatePairs' "$f")" = 72
          test "$(jq -r '.review.candidateBills' "$f")" = 15
          test "$(jq -r '.review.candidatePublicMembers' "$f")" = 25
          test "$(jq -r '.review.candidateSemanticGroups' "$f")" = 25
          test "$(jq -r '.review.decisions.applicable' "$f")" = 2
          test "$(jq -r '.review.decisions.ambiguous_fail_closed' "$f")" = 0
          test "$(jq -r '.review.decisions.not_applicable' "$f")" = 70
          test "$(jq -r '.review.decisions.pending_review' "$f")" = 0
          test "$(jq -r '.review.alignmentCounts.aligns' "$f")" = 2
          test "$(jq -r '.review.alignmentCounts.conflicts' "$f")" = 0
          test "$(jq -r '.review.finalPairStatusCounts.applicable' "$f")" = 2
          test "$(jq -r '.review.finalPairStatusCounts.ambiguous_fail_closed' "$f")" = 126
          test "$(jq -r '.review.finalPairStatusCounts.not_applicable' "$f")" = 922
          test "$(jq -r '.review.finalPairStatusCounts.pending_review' "$f")" = 0
          test "$(jq -r '.review.applicableRows' "$f")" = 2
          test "$(jq -r '.review.integrationReadyRows' "$f")" = 0
          test "$(jq -r '.frozenInput.targetEventKeySha256' "$f")" = 75b0435e0b61b4a356e82c3017caa400cf67a21778a41158f032679151067862
          test "$(jq -r '.frozenInput.reviewKeySha256' "$f")" = f466e126ea4d06b139356a78fa22e1ef2067727ccf4576d98cb9747989a3c4a8
          jq -e '[.review.reviewedCandidates[] | select(.decision == "applicable") | .internalMembershipIdentityResolved] | all(. == false)' "$f" >/dev/null
          jq -e '[.review.reviewedCandidates[] | select(.decision == "applicable") | .integrationReady] | all(. == false)' "$f" >/dev/null
          test "$(jq -r '.policy.outcomeUse' "$f")" = none
          test "$(jq -r '.policy.targetVoteOutcomesRead' "$f")" = false
          test "$(jq -r '.policy.productionDatabaseQueried' "$f")" = false
          test "$(jq -r '.policy.productionWrites' "$f")" = false
          test "$(jq -r '.policy.vercelUsed' "$f")" = false
          test "$(jq -r '.policy.internalMembershipIdentityResolved' "$f")" = false
          test "$(jq -r '.policy.internalIdentityRequiredBeforeFeatureIntegration' "$f")" = true
          test "$(jq -r '.policy.contextOnly' "$f")" = true
          test "$(jq -r '.policy.mechanicallyActionable' "$f")" = false
          test "$(jq -r '.policy.modelWeight' "$f")" = 0
          test "$(jq -r '.policy.featureRowsWritten' "$f")" = false
          test "$(jq -r '.policy.modelFitting' "$f")" = none
          test "$(jq -r '.policy.servingChanged' "$f")" = false
          {
            echo '## 2025-26 House reviewed applicability — tranche 4'
            echo
            echo '- Candidate pairs reviewed: **72**'
            echo '- Applicable: **2**'
            echo '- Reviewed ambiguous/fail-closed: **0**'
            echo '- Reviewed not applicable: **70**'
            echo '- Full eligible-pair accounting: **2 applicable / 126 fail-closed / 922 not-applicable / 0 pending**'
            echo '- Alignment: **2 align / 0 conflict**'
            echo '- Integration-ready rows: **0** (internal identity unresolved)'
            echo '- Outcomes used: **none**'
            echo '- Production DB queried: **no**'
            echo '- Vercel used: **no**'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: historical-density-2025-house-applicability-review-cohort-2-tranche-5-v1
          path: ${{ runner.temp }}/tranche5-review/*
          if-no-files-found: error
          retention-days: 90
