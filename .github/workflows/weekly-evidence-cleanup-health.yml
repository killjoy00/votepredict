name: Weekly evidence cleanup health

on:
  workflow_dispatch:
    inputs:
      run_vercel:
        description: Explicitly allow this workflow to contact Vercel
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-evidence-cleanup-health
  cancel-in-progress: false

jobs:\n  audit:\n    if: inputs.run_vercel == true && github.ref == 'refs/heads/main'\n    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Audit Senate publication gaps
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: |
          node --import tsx scripts/audit-senate-2021-publication-recovery.ts \
            --output artifacts/senate-2021-publication-recovery-audit-v1.json

      - name: Audit CFB availability debt
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: |
          node --import tsx scripts/audit-cfb-availability-debt.ts \
            --output artifacts/cfb-availability-debt-audit-v1.json

      - name: Write evidence-cleanup summary
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path

          senate = json.loads(Path('artifacts/senate-2021-publication-recovery-audit-v1.json').read_text())['senate2021PublicationRecoveryAudit']
          cfb = json.loads(Path('artifacts/cfb-availability-debt-audit-v1.json').read_text())['cfbAvailabilityDebtAudit']

          senate_cov = senate['coverage']['substantivePublicationDefinition']
          cf = cfb['candidateFinance']
          ie = cfb['independentExpenditures']

          lines = [
              '# Weekly evidence cleanup health',
              '',
              '## 2021-22 Senate substantive member-publication coverage',
              f"- Zero: **{senate_cov['zero']}**",
              f"- Low (1-4): **{senate_cov['low']}**",
              f"- 5+: **{senate_cov['fivePlus']}**",
              f"- Zero with verified profile anchor: **{senate['coverage']['zeroSubstantiveWithProfileAnchor']}**",
              '',
              '## CFB candidate-finance availability debt',
              f"- Timing-unproven row keys: **{cf['summary']['timingUnprovenRowKeys']}**",
              f"- Groups without prior proof checkpoint: **{cf['groupsWithoutProofCheckpoint']}**",
              f"- Debt rows without prior proof checkpoint: **{cf['timingDebtRowsWithoutProofCheckpoint']}**",
              '',
              '## CFB independent-expenditure availability debt',
              f"- Timing-unproven row keys: **{ie['summary']['timingUnprovenRowKeys']}**",
              f"- Registration/segment groups not previously targeted: **{ie['groupsNotPreviouslyTargeted']}**",
              f"- Debt rows not previously targeted: **{ie['timingDebtRowsNotPreviouslyTargeted']}**",
              '',
              'Read-only audit only. No evidence writes, model fitting, feature freezing, probability/weight changes, or serving changes.',
          ]

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          PYTHON

      - name: Upload weekly evidence-cleanup artifacts
        uses: actions/upload-artifact@v6
        with:
          name: weekly-evidence-cleanup-health-${{ github.run_id }}
          path: |
            artifacts/senate-2021-publication-recovery-audit-v1.json
            artifacts/cfb-availability-debt-audit-v1.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary credentials and logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env','vercel-pull.log']:
              Path(os.environ['RUNNER_TEMP'], name).unlink(missing_ok=True)
          PYTHON
