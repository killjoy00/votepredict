name: Evidence Quality v1 source snapshots

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum source documents to attempt
        required: false
        default: '25'
      source_kinds:
        description: Optional comma-separated source kinds; blank uses archival/historical defaults
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: evidence-quality-v1-source-snapshots
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 579 &&
        github.event.comment.user.login == 'killjoy00' &&
        (
          startsWith(github.event.comment.body, '[evidence-quality-snapshot]') ||
          startsWith(github.event.comment.body, '[evidence-quality-audit]')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Require exact Evidence Quality migration state
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/apply-evidence-quality-migration.ts

      - name: Snapshot exact hash-matched source text
        if: >-
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.event.comment.body, '[evidence-quality-snapshot]')
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_EVIDENCE_QUALITY_SNAPSHOT_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '25' }}
          VOTEPREDICT_EVIDENCE_QUALITY_SOURCE_KINDS: ${{ github.event_name == 'workflow_dispatch' && inputs.source_kinds || 'wayback_local_trade_news,wayback_campaign_site,wayback_member_primary,house_member_primary_historical_article,senate_member_primary_historical_article,wayback_organization_publication' }}
        run: node --import tsx scripts/snapshot-evidence-quality-source-text.ts

      - name: Audit Evidence Quality coverage
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/audit-evidence-quality-coverage.ts

      - name: Audit Evidence Quality annotation priority
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/audit-evidence-quality-priority.ts

      - name: Remove temporary credentials and logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env','vercel-pull.log']:
              Path(os.environ['RUNNER_TEMP'],name).unlink(missing_ok=True)
          PYTHON
