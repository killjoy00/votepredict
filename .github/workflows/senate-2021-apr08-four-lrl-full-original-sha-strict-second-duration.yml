name: Strict second complete original 2021 Apr 8 Senate LRL four MP3 SHA and duration proof

# Only full original MP3 bytes identical to the 4 independently first-authenticated
# 2021 Senate April 8 whole recordings qualify. ffprobe required/installed here.
# GitHub runner ephemeral files deleted; only source SHA+duration metadata uploaded.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2021-apr08-four-lrl-full-original-sha-strict-second-duration.yml

permissions:
  contents: read

jobs:
  strict-second-four-whole-senate-2021-original-audio-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Explicitly install ffprobe for original audio duration proof
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffprobe
          ffprobe -version | head -n 1
      - name: Strict independent second full-source acquisition, SHA equality, playable duration, caption offset range
        run: |
          node --import tsx scripts/audit-senate-2021-apr08-four-original-lrl-audio-full-binaries.ts \
            --output artifacts/2021-apr08-four-senate-mp3-strict-second-source/source.json \
            --strict-original-full-sha
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2021-apr08-four-original-whole-mp3-strict-second-sha-durations
          path: artifacts/2021-apr08-four-senate-mp3-strict-second-source/source.json
          retention-days: 30
          if-no-files-found: error
