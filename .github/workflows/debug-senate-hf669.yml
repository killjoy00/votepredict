name: Validate Senate HF669 fix

on:
  push:
    branches: [fix/senate-hf669-boundary]
    paths:
      - '.github/workflows/debug-senate-hf669.yml'
      - 'src/sources/minnesota/senate-journals.ts'
      - 'tests/senate-journals.test.ts'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-fund --no-audit
      - run: npm run check
      - name: Verify live HF669 passage layout contains expected failed-passage boundary
        run: |
          npx tsx -e "import { fetchSenateJournal } from './src/sources/minnesota/senate-journals.ts'; void (async()=>{ const url='https://www.senate.mn/journals/2023-2024/20230316037.pdf'; const doc=await fetchSenateJournal(url); if(!doc.text.includes('So, not having received a three-fifths vote')) throw new Error('HF669 failed-passage boundary not found'); if(!doc.text.includes('Those who voted in the negative were:')) throw new Error('HF669 negative-vote header not found'); console.log('HF669 live boundary verified'); })();"
