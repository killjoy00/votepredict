name: Debug Senate HF669 extraction

on:
  push:
    branches: [build/minnesota-history]
    paths:
      - '.github/workflows/debug-senate-hf669.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-fund --no-audit
      - name: Print HF669 roll extraction context
        run: |
          npx tsx -e "import { fetchSenateJournal } from './src/sources/minnesota/senate-journals.ts'; void (async()=>{ const url='https://www.senate.mn/journals/2023-2024/20230316037.pdf'; const doc=await fetchSenateJournal(url); const t=doc.text.replace(/\\r/g,''); const needle='The question was taken on the passage of the bill'; const i=t.indexOf(needle); if(i<0) throw new Error('passage text not found'); const start=Math.max(0,i-1400), end=Math.min(t.length,i+7000); console.log(t.slice(start,end)); })();"
