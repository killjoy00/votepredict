name: Four historical original publisher candidate position Q&A provenance checks
on:
  pull_request:
    paths:
      - data/evaluation/senate-864-four-high-value-original-publisher-interview-targets-v1.json
      - scripts/probe-senate-864-four-historical-publisher-candidate-qa-originals.mjs
      - .github/workflows/acquire-senate-864-four-original-publisher-candidate-qa.yml
permissions:
  contents: read
  actions: read
jobs:
  independent-original-publisher:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict' &&
      github.event.pull_request.head.ref == 'research/864-pre-election-candidate-interview-originals-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        track: [bakk, doron, tomassoni, wiger]
    name: Historical original first-person Q&A proof — ${{ matrix.track }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: node --check scripts/probe-senate-864-four-historical-publisher-candidate-qa-originals.mjs
      - name: Reopen independently source-verified entire actual-serving Senate directory
        uses: actions/download-artifact@v4
        with:
          run-id: 38094976711
          name: senate-2021-25-ever-served-only-source-coverage-v2
          github-token: ${{ github.token }}
          path: original/official
      - name: Reopen source-verified 92/95 website-only historic census
        uses: actions/download-artifact@v4
        with:
          run-id: 38197279787
          name: senate-95-serving-92-original-sites-1194-short-excerpts-v1
          github-token: ${{ github.token }}
          path: original/statewide
      - name: Independently prove full historical publisher originals against CDX
        shell: bash
        run: |
          set -euo pipefail
          gov="$(find original/official -type f -name mn-lrl-official-senate-service-directory.html -print -quit)"
          receipt="$(find original/official -type f -name mn-lrl-official-senate-service-directory-audit.json -print -quit)"
          swear="$(find original/official -type f -name mn-lrl-official-senate-special-swearing-history.html -print -quit)"
          covered="$(find original/statewide -type f -name 95-senators-public-campaign-coverage.json -print -quit)"
          test -n "$gov" && test -n "$receipt" && test -n "$swear" && test -n "$covered"
          node --import tsx scripts/probe-senate-864-four-historical-publisher-candidate-qa-originals.mjs \
            --track "${{ matrix.track }}" \
            --official-html "$gov" \
            --official-receipt "$receipt" \
            --official-special-swearing-html "$swear" \
            --coverage-json "$covered" \
            --out-dir original/new-direct-speech/
      - name: Preserve pre-election original index and SHA1-matched complete HTML for quote audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: senate-864-historic-publisher-interview-${{ matrix.track }}-v1
          path: original/new-direct-speech/
          if-no-files-found: warn
          retention-days: 30
