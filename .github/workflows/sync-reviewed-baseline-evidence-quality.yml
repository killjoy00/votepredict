name: Sync reviewed baseline Evidence Quality v1

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ startsWith(github.event.comment.body, '[evidence-quality-baseline-review-sync]')
        && 'evidence-quality-baseline-review-sync'
        || format('evidence-quality-baseline-review-sync-skip-{0}', github.event.comment.id) }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event.issue.number == 579 &&
      github.event.comment.user.login == 'killjoy00' &&
      startsWith(github.event.comment.body, '[evidence-quality-baseline-review-sync]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Require exact Evidence Quality migration state
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/apply-evidence-quality-migration.ts

      - name: Validate exact reviewed baseline diff
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/sync-reviewed-baseline-evidence-quality.ts

      - name: Apply reviewed baseline corrections atomically
        if: >-
          startsWith(github.event.comment.body, '[evidence-quality-baseline-review-sync] apply')
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/sync-reviewed-baseline-evidence-quality.ts --apply

      - name: Verify reviewed baseline idempotently
        if: >-
          startsWith(github.event.comment.body, '[evidence-quality-baseline-review-sync] apply')
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/sync-reviewed-baseline-evidence-quality.ts

      - name: Remove temporary credentials and logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env','vercel-pull.log']:
              Path(os.environ['RUNNER_TEMP'],name).unlink(missing_ok=True)
          PYTHON
