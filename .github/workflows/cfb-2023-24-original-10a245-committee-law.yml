name: Original 2023-24 MN CFB principal committee administrative termination law
on:
  pull_request:
    paths:
      - .github/workflows/cfb-2023-24-original-10a245-committee-law.yml
      - src/evidence/cfb-2023-24-original-10a245-committee-termination.ts
      - scripts/acquire-cfb-2023-24-original-10a245-termination-law.ts
      - tests/cfb-2023-24-original-10a245-committee-termination.test.ts
permissions:
  contents: read
jobs:
  original-2023-24-mn-revisor-10a245:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: node --import tsx --test tests/cfb-2023-24-original-10a245-committee-termination.test.ts
      - run: node --import tsx scripts/acquire-cfb-2023-24-original-10a245-termination-law.ts --output artifacts/cfb-2023-24-original-10a245-law-source.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-2023-24-10a245-state-legal-committee-termination-source-metadata
          path: artifacts/cfb-2023-24-original-10a245-law-source.json
          if-no-files-found: warn
          retention-days: 30
