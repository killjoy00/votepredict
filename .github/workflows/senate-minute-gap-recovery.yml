name: Recover eight missing official Senate minutes as raw evidence

on:
  pull_request:
    paths:
      - .github/workflows/senate-minute-gap-recovery.yml
      - data/collections/senate-minute-gap-recovery-20261016.json
      - src/operations/senate-minute-gap-recovery.ts
      - src/evidence/minnesota-senate-committee-source.ts
      - scripts/recover-senate-minute-gaps.ts
      - tests/senate-minute-gap-recovery.test.ts
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-minute-gap-recovery.yml
      - data/collections/senate-minute-gap-recovery-20261016.json
      - src/operations/senate-minute-gap-recovery.ts
      - src/evidence/minnesota-senate-committee-source.ts
      - scripts/recover-senate-minute-gaps.ts
      - tests/senate-minute-gap-recovery.test.ts

permissions:
  contents: read
concurrency:
  group: senate-minute-gap-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  independent:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
        github.event.after == github.sha && github.event.head_commit.id == github.sha &&
        github.event.deleted != true && github.event.forced != true &&
        contains(github.event.head_commit.message, 'SENATE_MINUTE_GAP_RAW_20261016')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: votepredict
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d votepredict"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
      VOTEPREDICT_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/votepredict
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run db:migrate
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Independently fetch eight linked government PDFs and match exact reviewed SHA fingerprints
        run: node --import tsx scripts/recover-senate-minute-gaps.ts --verify-sources

  protected-raw-import:
    needs: [independent]
    if: >-
      needs.independent.result == 'success' && github.event_name == 'push' &&
      github.repository == 'killjoy00/votepredict' && github.event.repository.full_name == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      github.event.after == github.sha && github.event.head_commit.id == github.sha &&
      github.event.deleted != true && github.event.forced != true &&
      contains(github.event.head_commit.message, 'SENATE_MINUTE_GAP_RAW_20261016')
    environment: evidence-readonly-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VOTEPREDICT_NEON_PROJECT_ID: ${{ vars.VOTEPREDICT_NEON_PROJECT_ID }}
      VOTEPREDICT_MEDIA_EXISTING_DATABASE: ${{ vars.VOTEPREDICT_MEDIA_EXISTING_DATABASE }}
      VOTEPREDICT_MINUTES_INDEPENDENT_CI: ${{ needs.independent.result == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed commit
        env:
          REVIEWED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Import full raw text, preserve existing captures, verify exact readback
        run: node --import tsx scripts/recover-senate-minute-gaps.ts --protected
