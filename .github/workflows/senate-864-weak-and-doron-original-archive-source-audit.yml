name: Probe weak campaign issue depth and Doron historic original sources
on:
  pull_request:
    paths:
      - data/evaluation/senate-864-weak-and-unresolved-issue-source-research-queue-v1.json
      - scripts/probe-senate-864-weak-issue-and-last-three-original-sources.mjs
      - .github/workflows/senate-864-weak-and-doron-original-archive-source-audit.yml
permissions:
  contents: read
  actions: read
jobs:
  original-source-pre-election-depth-recovery:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict' &&
      github.event.pull_request.head.ref == 'research/864-depth-matrix-weak-coverage-source-probes-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [low2022, clark2025, lastthree2020]
    name: CDX SHA1 indexed full historical original only — ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: node --check scripts/probe-senate-864-weak-issue-and-last-three-original-sources.mjs
      - name: Reopen entire government original Senate service and swearing history
        uses: actions/download-artifact@v4
        with:
          run-id: 38094976711
          name: senate-2021-25-ever-served-only-source-coverage-v2
          github-token: ${{ github.token }}
          path: original/official
      - name: Reopen complete independently audited 95-person campaign source coverage
        uses: actions/download-artifact@v4
        with:
          run-id: 38197279787
          name: senate-95-serving-92-original-sites-1194-short-excerpts-v1
          github-token: ${{ github.token }}
          path: original/statewide
      - name: Validate official original government and only request pre-election indexed complete original archive bytes
        shell: bash
        run: |
          set -euo pipefail
          gov="$(find original/official -type f -name mn-lrl-official-senate-service-directory.html -print -quit)"
          receipt="$(find original/official -type f -name mn-lrl-official-senate-service-directory-audit.json -print -quit)"
          swear="$(find original/official -type f -name mn-lrl-official-senate-special-swearing-history.html -print -quit)"
          covered="$(find original/statewide -type f -name 95-senators-public-campaign-coverage.json -print -quit)"
          test -n "$gov" && test -n "$receipt" && test -n "$swear" && test -n "$covered"
          node --import tsx scripts/probe-senate-864-weak-issue-and-last-three-original-sources.mjs \
            --group "${{ matrix.group }}" \
            --official-html "$gov" \
            --official-receipt "$receipt" \
            --official-special-swearing-html "$swear" \
            --coverage-json "$covered" \
            --out-dir original/research
      - name: Retain original source CDX SHA1, matching full raw HTML and conservative report for independent source-specific review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: senate-864-weak-campaign-original-source-research-${{ matrix.group }}-v1
          path: original/research/
          if-no-files-found: warn
          retention-days: 30
