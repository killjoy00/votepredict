name: Member history decay-180 exact holdout replay

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: member-history-decay180-holdout-replay-v1
  cancel-in-progress: false

jobs:
  replay:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      VOTEPREDICT_DECAY180_HOLDOUT_COHORT: artifacts/frozen/cohort/historical-deep-house-journal-holdout-cohort-v1.json
      VOTEPREDICT_DECAY180_HOLDOUT_SCORE: artifacts/frozen/score/historical-deep-house-journal-holdout-score-v1.json
      VOTEPREDICT_DECAY180_HOLDOUT_REPLAY_OUTPUT: artifacts/member-history-decay180-holdout-replay-v1.json
    steps:
      - uses: actions/checkout@v7
      - name: Verify frozen replay lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plan='data/evaluation/member-history-decay180-holdout-replay-plan-v1.json'
          test "$(jq -r '.schemaVersion' "$plan")" = 'member-history-decay180-holdout-replay-plan-v1'
          test "$(jq -r '.decayEvaluationArtifact.selectedCandidate' "$plan")" = 'member-180'
          test "$(jq -r '.decayEvaluationArtifact.memberHistoryHalfLifeDays' "$plan")" = '180'
          test "$(jq -r '.replayPolicy.modelVersion' "$plan")" = 'member-eb-v1.1'
          test "$(jq -r '.replayPolicy.memberHistoryHalfLifeDays' "$plan")" = '180'
          test "$(jq -r '.replayPolicy.partyHistoryDecay' "$plan")" = 'none'
          test "$(jq -r '.replayPolicy.globalHistoryDecay' "$plan")" = 'none'
          test "$(jq -r '.guardrails.probabilityAction' "$plan")" = 'none'
          test "$(jq -r '.guardrails.productionAction' "$plan")" = 'none'
          test "$(jq -r '.guardrails.frozenCap20ProspectiveExperimentChanged' "$plan")" = 'false'

          for key in decayEvaluationArtifact holdoutCohortArtifact uncappedHoldoutScoreArtifact; do
            artifact_id="$(jq -r ".${key}.artifactId" "$plan")"
            expected="sha256:$(jq -r ".${key}.artifactSha256" "$plan")"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" > "$RUNNER_TEMP/${key}.json"
            test "$(jq -r '.expired' "$RUNNER_TEMP/${key}.json")" = 'false'
            test "$(jq -r '.digest' "$RUNNER_TEMP/${key}.json")" = "$expected"
            echo "${key}_run_id=$(jq -r ".${key}.workflowRunId" "$plan")" >> "$GITHUB_ENV"
            echo "${key}_name=$(jq -r ".${key}.artifactName" "$plan")" >> "$GITHUB_ENV"
          done
      - name: Download immutable decay evaluation
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.decayEvaluationArtifact_run_id }}
          name: ${{ env.decayEvaluationArtifact_name }}
          path: artifacts/frozen/decay-evaluation
      - name: Download immutable holdout cohort
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.holdoutCohortArtifact_run_id }}
          name: ${{ env.holdoutCohortArtifact_name }}
          path: artifacts/frozen/cohort
      - name: Download immutable uncapped holdout score
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.uncappedHoldoutScoreArtifact_run_id }}
          name: ${{ env.uncappedHoldoutScoreArtifact_name }}
          path: artifacts/frozen/score
      - name: Verify selected decay candidate and exact holdout
        shell: bash
        run: |
          set -euo pipefail
          decay='artifacts/frozen/decay-evaluation/member-history-decay-evaluation-v1.json'
          cohort="$VOTEPREDICT_DECAY180_HOLDOUT_COHORT"
          score="$VOTEPREDICT_DECAY180_HOLDOUT_SCORE"
          test "$(jq -r '.decision.status' "$decay")" = 'shadow_candidate_nominated'
          test "$(jq -r '.decision.selectedCandidate' "$decay")" = 'member-180'
          test "$(jq -r '.decision.productionAction' "$decay")" = 'none'
          test "$(jq -r '.schemaVersion' "$cohort")" = 'historical-deep-house-journal-holdout-cohort-v1'
          test "$(jq '.cases | length' "$cohort")" = '24'
          test "$(jq -r '.schemaVersion' "$score")" = 'historical-deep-house-journal-holdout-score-v1'
          test "$(jq '.cases | length' "$score")" = '24'
          test "$(jq -r '.input.decisiveMemberOutcomes' "$score")" = '3193'
      - name: Require production environment access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Wait for this exact main SHA to be live in production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            http_code="$(curl --silent --show-error --output "$RUNNER_TEMP/vercel-deployments.json" --write-out '%{http_code}' --header "Authorization: Bearer ${VERCEL_TOKEN}" "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=20&teamId=${VERCEL_ORG_ID}")"
            test "$http_code" = '200'
            match="$(jq -c --arg sha "$GITHUB_SHA" '[.deployments[]? | select(.target == "production" and .meta.githubCommitSha == $sha)] | first // empty' "$RUNNER_TEMP/vercel-deployments.json")"
            if [ -n "$match" ]; then
              state="$(printf '%s' "$match" | jq -r '.state // "UNKNOWN"')"
              if [ "$state" = 'READY' ]; then exit 0; fi
              if [ "$state" = 'ERROR' ] || [ "$state" = 'CANCELED' ]; then exit 1; fi
            fi
            sleep 5
          done
          echo 'Exact main SHA did not become READY before replay deadline.'
          exit 1
      - name: Read production operation secret privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1
      - name: Replay decay 180 on the exact frozen holdout
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/run-production-member-history-decay180-holdout-replay.ts
      - name: Verify descriptive-only decay replay
        shell: bash
        run: |
          set -euo pipefail
          file="$VOTEPREDICT_DECAY180_HOLDOUT_REPLAY_OUTPUT"
          test "$(jq -r '.schemaVersion' "$file")" = 'member-history-decay180-holdout-replay-v1'
          test "$(jq -r '.metadata.runtimeCodeSha' "$file")" = "$GITHUB_SHA"
          test "$(jq -r '.metadata.modelVersion' "$file")" = 'member-eb-v1.1'
          test "$(jq -r '.metadata.memberHistoryHalfLifeDays' "$file")" = '180'
          test "$(jq -r '.metadata.partyHistoryHalfLifeDays' "$file")" = 'null'
          test "$(jq -r '.metadata.globalHistoryHalfLifeDays' "$file")" = 'null'
          test "$(jq -r '.metadata.analysisStatus' "$file")" = 'post-selection-descriptive-shadow-only'
          test "$(jq -r '.metadata.probabilityAction' "$file")" = 'none'
          test "$(jq -r '.metadata.runtimeDefaultChange' "$file")" = 'false'
          test "$(jq -r '.metadata.modelVersionChange' "$file")" = 'false'
          test "$(jq -r '.metadata.baselineValidation.decisiveMemberProbabilitiesChecked' "$file")" = '3193'
          jq -e '.metadata.baselineValidation.maximumAbsoluteProbabilityDifference <= 1e-12' "$file" >/dev/null
          test "$(jq -r '.input.frozenCases' "$file")" = '24'
          test "$(jq -r '.input.decisiveMemberOutcomes' "$file")" = '3193'
          test "$(jq '.cases | length' "$file")" = '24'
          test "$(jq -r '.conclusion.productionAction' "$file")" = 'none'
          test "$(jq -r '.conclusion.prospectiveValidationRequired' "$file")" = 'true'
          if jq -e '.. | objects | select(has("probabilityAfter") or has("productionWeight") or has("mechanicallyActionable") or has("runtimeDefaultApplied"))' "$file" >/dev/null; then
            echo 'Decay-180 replay artifact contains a forbidden production-action field.'
            exit 1
          fi
      - name: Upload immutable decay-180 holdout replay
        uses: actions/upload-artifact@v4
        with:
          name: member-history-decay180-holdout-replay-v1-${{ github.sha }}
          path: artifacts/member-history-decay180-holdout-replay-v1.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary production files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/votepredict-production.env" "$RUNNER_TEMP/vercel-pull.log" "$RUNNER_TEMP/vercel-deployments.json" "$RUNNER_TEMP"/*Artifact.json
