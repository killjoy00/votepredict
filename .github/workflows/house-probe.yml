name: House raw probe

on:
  push:
    branches: [build/minnesota-history]
    paths:
      - '.github/workflows/house-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect raw House vote summary markup
        run: |
          set -euo pipefail
          curl -L --fail --show-error --silent 'https://www.house.mn.gov/Votes/Summary/302' > /tmp/house.html
          echo '--- detail/bill references ---'
          grep -inE 'Votes/Details|BillNumber|option value|Select a Bill|ddlBill|BillList' /tmp/house.html | head -n 80 || true
