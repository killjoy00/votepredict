name: Evidence Quality v1 manual frozen batch export

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-quality-v1-manual-frozen-export
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.number == 579 &&
        github.event.comment.user.login == 'killjoy00' &&
        startsWith(github.event.comment.body, '[evidence-quality-manual-export]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Export frozen Batch 1 read-only
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_EVIDENCE_QUALITY_MANUAL_EXPORT_OUTPUT: ${{ runner.temp }}/evidence-quality-manual-batch1-frozen.json
        run: node --import tsx scripts/export-evidence-quality-manual-batch1.ts

      - name: Upload frozen Batch 1
        uses: actions/upload-artifact@v7
        with:
          name: evidence-quality-manual-batch1-frozen
          path: ${{ runner.temp }}/evidence-quality-manual-batch1-frozen.json
          retention-days: 7

      - name: Remove temporary credentials and logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env','vercel-pull.log']:
              Path(os.environ['RUNNER_TEMP'],name).unlink(missing_ok=True)
          PYTHON
