name: "#514 lobbying summary upper-bound salvage"

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      write:
        description: Promote exact rows proven by archived official summaries
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cfb-lobbying-summary-upper-bound-salvage
  cancel-in-progress: false

jobs:
  salvage:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 514 &&
        github.event.comment.user.login == 'killjoy00' &&
        startsWith(github.event.comment.body, '[cfb-lobbying-summary-upper-bound]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Audit or promote exact lobbying-summary upper bounds
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          COMMENT_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          DISPATCH_WRITE: ${{ github.event_name == 'workflow_dispatch' && inputs.write || false }}
        shell: bash
        run: |
          set -euo pipefail
          write=false
          if [[ "$COMMENT_BODY" == *"write=1"* || "$DISPATCH_WRITE" == "true" ]]; then
            write=true
          fi
          if [[ "$write" == "true" ]]; then
            node --import tsx scripts/salvage-cfb-lobbying-summary-upper-bounds.ts --write
          else
            node --import tsx scripts/salvage-cfb-lobbying-summary-upper-bounds.ts
          fi

      - name: Remove temporary credentials and logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env','vercel-pull.log']:
              Path(os.environ['RUNNER_TEMP'],name).unlink(missing_ok=True)
          PYTHON
