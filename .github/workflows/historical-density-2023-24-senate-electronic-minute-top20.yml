name: Freeze 2023-24 Senate top-20 electronic minutes

on:
  pull_request:
    paths:
      - scripts/freeze-historical-density-2023-24-senate-electronic-minute-top20.ts
      - .github/workflows/historical-density-2023-24-senate-electronic-minute-top20.yml
  push:
    branches: [main]
    paths:
      - scripts/freeze-historical-density-2023-24-senate-electronic-minute-top20.ts
      - .github/workflows/historical-density-2023-24-senate-electronic-minute-top20.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-2023-24-senate-electronic-minute-top20-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Materialize canonical overlap artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11501649286/zip > "$RUNNER_TEMP/overlap.zip"
          echo "c5ed67e03a2aabb7b41df147beb2d4e814b6db834055387efaf716e3b6ac3f42  $RUNNER_TEMP/overlap.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/overlap"
          unzip -q "$RUNNER_TEMP/overlap.zip" \
            historical-density-2023-24-senate-electronic-minute-target-overlap-v1.json \
            -d "$RUNNER_TEMP/overlap"

      - name: Freeze top-20 official minute PDFs
        env:
          VOTEPREDICT_SENATE_2023_24_OVERLAP_PATH: ${{ runner.temp }}/overlap/historical-density-2023-24-senate-electronic-minute-target-overlap-v1.json
          VOTEPREDICT_SENATE_2023_24_TOP20_OUTPUT_DIR: ${{ runner.temp }}/freeze
        run: node --import tsx scripts/freeze-historical-density-2023-24-senate-electronic-minute-top20.ts

      - name: Verify source-freeze boundary
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/freeze/historical-density-2023-24-senate-electronic-minute-top20-freeze-v1.json"
          test "$(jq -r '.schemaVersion' "$f")" = historical-density-2023-24-senate-electronic-minute-top20-freeze-v1
          test "$(jq -r '.sourceOverlap.artifactId' "$f")" = 11501649286
          test "$(jq -r '.selection.selectedDocuments' "$f")" = 20
          test "$(jq -r '.selection.selectedTargetEvents' "$f")" = 97
          test "$(jq -r '.selection.selectedUncoveredRows' "$f")" = 6498
          test "$(jq -r '.selection.selectionProofSha256' "$f")" = 1a6bc27b8b8bb433b060abfe213f1db7ad3463902536be5f741ed166b9b84e0f
          test "$(jq -r '.sourceFreeze.documentCount' "$f")" = 20
          test "$(find "$RUNNER_TEMP/freeze/pdfs" -type f -name '*.pdf' | wc -l)" = 20
          test "$(jq -r '[.sourceFreeze.documents[].contentSha256 | length] | all(. == 64)' "$f")" = true
          test "$(jq -r '.interpretation.exactOfficialPdfBytesFrozen' "$f")" = true
          test "$(jq -r '.interpretation.pdfTextExtracted' "$f")" = false
          test "$(jq -r '.policy.productionDatabaseQueried' "$f")" = false
          test "$(jq -r '.policy.productionWrites' "$f")" = false
          test "$(jq -r '.policy.targetVoteOutcomesRead' "$f")" = false
          test "$(jq -r '.policy.memberStanceInferred' "$f")" = false
          test "$(jq -r '.policy.featureRowsWritten' "$f")" = false
          test "$(jq -r '.policy.modelFitting' "$f")" = none
          test "$(jq -r '.policy.servingChanged' "$f")" = false

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: historical-density-2023-24-senate-electronic-minute-top20-freeze-v1
          path: ${{ runner.temp }}/freeze/*
          if-no-files-found: warn
          retention-days: 90
