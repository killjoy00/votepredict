name: One-time original 2025 Elections remaining 8 named-roll motion contexts

# Only 2025-02-11, 2025-03-25, 2025-04-08 original official LRL PDFs
# and immutable prior PDF/text SHA+offset ledger. Never member-vote import.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2025-elections-eight-original-motion-contexts.yml

permissions:
  contents: read

jobs:
  original-pdf-motion-source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Reopen exactly 3 original PDFs, verify PDFs/text and eight source roll context offsets
        run: |
          node --import tsx scripts/review-senate-2025-elections-eight-original-motion-contexts.ts \
            --output artifacts/eight-source-contexts/senate-2025-elections-feb11-mar25-apr08-eight-motion-contexts.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2025-elections-eight-original-motion-contexts
          path: artifacts/eight-source-contexts/senate-2025-elections-feb11-mar25-apr08-eight-motion-contexts.json
          retention-days: 30
          if-no-files-found: error
