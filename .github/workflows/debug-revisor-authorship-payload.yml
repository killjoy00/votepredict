name: Debug Revisor authorship payload

on:
  push:
    branches:
      - ops/revisor-authorship-backfill-20260919
    paths:
      - .github/workflows/debug-revisor-authorship-payload.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sample live Revisor author-action grammar
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const bills = [
            ['92','2021','HF','39'],
            ['92','2021','HF','1064'],
            ['92','2021','SF','1'],
            ['92','2021','SF','1018'],
            ['93','2023','HF','1'],
            ['93','2023','HF','100'],
            ['93','2023','SF','10'],
            ['93','2023','SF','13'],
            ['94','2025','HF','1014'],
            ['94','2025','HF','1027'],
            ['94','2025','SF','1075'],
            ['94','2025','SF','1251'],
          ];
          const tag = (block, name) => {
            const m = block.match(new RegExp('<' + name + '\\b[^>]*>([\\s\\S]*?)<\\/' + name + '>', 'i'));
            return (m?.[1] ?? '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
          };
          for (const [leg,year,type,num] of bills) {
            const id = type + num;
            const url = `https://api.revisor.mn.gov/bills/v1/${leg}/${year}/0/${type}/${num}/`;
            const r = await fetch(url, {
              headers: {
                'User-Agent': 'VotePredict/2.0 official Minnesota authorship diagnostic',
                Accept: 'application/xml,text/xml;q=0.9,*/*;q=0.1',
              },
            });
            const xml = await r.text();
            if (!r.ok) {
              console.log(id + '|HTTP ' + r.status);
              continue;
            }
            const actionsRoot = xml.match(/<ACTIONS\b[^>]*>([\s\S]*?)<\/ACTIONS>/i)?.[1] ?? '';
            for (const m of actionsRoot.matchAll(/<ACTION\b[^>]*>([\s\S]*?)<\/ACTION>/gi)) {
              const actionText = tag(m[1], 'ACTION_TEXT');
              const actionDescription = tag(m[1], 'ACTION_DESCRIPTION');
              if (/\bauthors?\s+(?:added|stricken)\b/i.test(actionText)) {
                console.log(id + '|' + actionText + '|' + actionDescription);
              }
            }
          }
          NODE
