name: Debug Revisor authorship payload

on:
  push:
    branches:
      - ops/revisor-authorship-backfill-20260919
    paths:
      - .github/workflows/debug-revisor-authorship-payload.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch and inspect official Revisor sample with Node
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url = 'https://api.revisor.mn.gov/bills/v1/92/2021/0/HF/39/';
          const response = await fetch(url, {
            headers: {
              'User-Agent': 'VotePredict/2.0 official Minnesota authorship diagnostic',
              Accept: 'application/xml,text/xml;q=0.9,*/*;q=0.1',
            },
            redirect: 'follow',
          });
          console.log('status=' + response.status);
          console.log('content-type=' + (response.headers.get('content-type') ?? ''));
          const xml = await response.text();
          console.log('bytes=' + xml.length);
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const names = [...xml.matchAll(/<\/?(?:[A-Z0-9_.-]+:)?([A-Z][A-Z0-9_.-]*)\b[^>]*>/gi)]
            .map((m) => m[1].toUpperCase());
          console.log('unique-tags=' + [...new Set(names)].join(','));
          const structural = xml
            .replace(/>[\s\S]*?</g, '><')
            .match(/<[^>]*(?:AUTHOR|ACTION)[^>]*>/gi) ?? [];
          console.log('author-action-tags=' + structural.slice(0, 160).join(' '));
          for (const token of ['<AUTHORS', '<ACTIONS']) {
            const index = xml.toUpperCase().indexOf(token);
            console.log('index-' + token.slice(1).toLowerCase() + '=' + index);
            if (index >= 0) {
              console.log('snippet-' + token.slice(1).toLowerCase() + '=' +
                xml.slice(index, Math.min(xml.length, index + 5000)).replace(/\s+/g, ' ').slice(0, 5000));
            }
          }
          NODE
