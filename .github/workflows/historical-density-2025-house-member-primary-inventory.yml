name: Historical density 2025 House member-primary inventory

on:
  pull_request:
    paths:
      - scripts/audit-historical-density-2025-house-member-primary-inventory.ts
      - .github/workflows/historical-density-2025-house-member-primary-inventory.yml
  push:
    branches: [main]
    paths:
      - scripts/audit-historical-density-2025-house-member-primary-inventory.ts
      - .github/workflows/historical-density-2025-house-member-primary-inventory.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-2025-house-member-primary-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    name: Inventory strict-pre-vote House member-primary indexes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Materialize immutable cross-session gap artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11438825044/zip > "$RUNNER_TEMP/cross-session-gap.zip"
          echo "d240cb90db62b1c1f86e81a36d09e4cf766186d0ba3570d83eeb6c6eaee8c8c2  $RUNNER_TEMP/cross-session-gap.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cross-session-gap"
          unzip -q "$RUNNER_TEMP/cross-session-gap.zip" historical-density-cross-session-gap-inventory-v1.json -d "$RUNNER_TEMP/cross-session-gap"

      - name: Build read-only 2025-26 House member-primary index inventory
        env:
          VOTEPREDICT_HISTORICAL_DENSITY_CROSS_SESSION_GAP_PATH: ${{ runner.temp }}/cross-session-gap/historical-density-cross-session-gap-inventory-v1.json
          VOTEPREDICT_HISTORICAL_DENSITY_2025_HOUSE_INVENTORY_OUTPUT_DIR: ${{ runner.temp }}/house-member-primary-inventory
        run: node --import tsx scripts/audit-historical-density-2025-house-member-primary-inventory.ts

      - name: Verify inventory safety and scope
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/house-member-primary-inventory/historical-density-2025-house-member-primary-inventory-v1.json"
          test "$(jq -r '.schemaVersion' "$f")" = historical-density-2025-house-member-primary-inventory-v1
          test "$(jq -r '.issue' "$f")" = 718
          test "$(jq -r '.session' "$f")" = 2025-2026
          test "$(jq -r '.target.events | length' "$f")" = 25
          test "$(jq -r '.target.sameDayEligible' "$f")" = false
          test "$(jq -r '.publicRoster.relevantHouseMembers >= 130' "$f")" = true
          test "$(jq -r '.archiveInventory.membersAttempted' "$f")" = "$(jq -r '.archiveInventory.membersSucceeded' "$f")"
          test "$(jq -r '.archiveInventory.strictPreVoteSourceEntries > 0' "$f")" = true
          test "$(jq -r '.policy.productionDatabaseQueried' "$f")" = false
          test "$(jq -r '.policy.productionWrites' "$f")" = false
          test "$(jq -r '.policy.vercelUsed' "$f")" = false
          test "$(jq -r '.policy.targetVoteOutcomesRead' "$f")" = false
          test "$(jq -r '.policy.outcomeUse' "$f")" = none
          test "$(jq -r '.policy.articleBodiesFetched' "$f")" = false
          test "$(jq -r '.policy.exactBillLinkageInferredFromMemberIssueEvidence' "$f")" = false
          test "$(jq -r '.policy.applicabilityInferred' "$f")" = false
          test "$(jq -r '.policy.sameDayEligible' "$f")" = false
          test "$(jq -r '.policy.contextOnly' "$f")" = true
          test "$(jq -r '.policy.mechanicallyActionable' "$f")" = false
          test "$(jq -r '.policy.modelWeight' "$f")" = 0
          test "$(jq -r '.policy.modelFitting' "$f")" = none
          test "$(jq -r '.policy.servingChanged' "$f")" = false
          {
            echo '## 2025-26 House member-primary index inventory'
            echo
            echo "- Frozen uncovered House events: **$(jq -r '.target.events | length' "$f")**"
            echo "- Relevant public LRL House members: **$(jq -r '.publicRoster.relevantHouseMembers' "$f")**"
            echo "- Official House archive entries: **$(jq -r '.archiveInventory.archiveEntries' "$f")**"
            echo "- Strict-pre-vote source entries: **$(jq -r '.archiveInventory.strictPreVoteSourceEntries' "$f")**"
            echo "- Members with strict-pre-vote source entries: **$(jq -r '.archiveInventory.membersWithStrictPreVoteSourceEntries' "$f")**"
            echo "- Exact target-bill mentions in archive titles: **$(jq -r '.archiveInventory.titleMatchedTargetEntries' "$f")**"
            echo "- Article bodies fetched: **no**"
            echo "- Outcomes used: **none**"
            echo "- Production DB queried: **no**"
            echo "- Vercel used: **no**"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: historical-density-2025-house-member-primary-inventory-v1
          path: ${{ runner.temp }}/house-member-primary-inventory/*
          if-no-files-found: error
          retention-days: 90
