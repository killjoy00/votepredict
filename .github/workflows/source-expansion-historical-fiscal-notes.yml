name: Source expansion historical fiscal notes

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      continuation:
        description: Internal bounded historical fiscal-note continuation number
        required: false
        default: '0'
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.event_name == 'issue_comment' && (github.event.issue.number != 355 || github.event.comment.user.login != 'killjoy00' || !startsWith(github.event.comment.body, '[source-expansion-historical-fiscal-notes]')) && format('source-expansion-historical-fiscal-notes-skip-{0}', github.run_id) || 'source-expansion-historical-fiscal-notes' }}
  cancel-in-progress: true

jobs:
  backfill:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 355 &&
        github.event.comment.user.login == 'killjoy00' &&
        startsWith(github.event.comment.body, '[source-expansion-historical-fiscal-notes]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      VOTEPREDICT_HISTORICAL_FISCAL_NOTE_BATCH_SIZE: '20'
      VOTEPREDICT_HISTORICAL_FISCAL_NOTE_DELAY_MS: '4000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit
      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1
      - name: Backfill paced historical fiscal-note bills
        id: backfill
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/backfill-historical-fiscal-notes.ts
      - name: Continue historical fiscal-note tail
        if: >-
          success() &&
          steps.backfill.outputs.selected_bills != '' &&
          steps.backfill.outputs.selected_bills != '0' &&
          steps.backfill.outputs.remaining_bills != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CONTINUATION: ${{ github.event_name == 'workflow_dispatch' && inputs.continuation || '0' }}
          REMAINING_BILLS: ${{ steps.backfill.outputs.remaining_bills }}
        run: |
          set -euo pipefail
          current="${CURRENT_CONTINUATION:-0}"
          if ! [[ "$current" =~ ^[0-9]+$ ]]; then
            current=0
          fi
          if (( current >= 39 )); then
            echo "Historical fiscal-note continuation cap reached with ${REMAINING_BILLS} bills still reported."
            exit 0
          fi
          next=$((current + 1))
          gh workflow run source-expansion-historical-fiscal-notes.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f continuation="$next"
      - name: Remove temporary credentials and logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env','vercel-pull.log']:
              Path(os.environ['RUNNER_TEMP'],name).unlink(missing_ok=True)
          PYTHON
