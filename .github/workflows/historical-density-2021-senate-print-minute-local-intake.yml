name: Test 2021 Senate print minute local intake

on:
  pull_request:
    paths:
      - scripts/intake-historical-density-2021-senate-print-minutes.ts
      - .github/workflows/historical-density-2021-senate-print-minute-local-intake.yml
      - src/evaluation/historical-density-2021-senate-print-minute-intake.ts
  push:
    branches: [main]
    paths:
      - scripts/intake-historical-density-2021-senate-print-minutes.ts
      - .github/workflows/historical-density-2021-senate-print-minute-local-intake.yml
      - src/evaluation/historical-density-2021-senate-print-minute-intake.ts
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-2021-senate-print-minute-local-intake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-local-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Materialize canonical request package
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11496898656/zip > "$RUNNER_TEMP/request.zip"
          echo "c7d6d274dd734878efbb830a1c8c17a35afb1503e30ca4917cefc8e1d39fb26e  $RUNNER_TEMP/request.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/request"
          unzip -q "$RUNNER_TEMP/request.zip" \
            historical-density-2021-senate-print-minute-request-package-v1.json \
            -d "$RUNNER_TEMP/request"

      - name: Generate canonical local-intake template
        run: |
          node --import tsx scripts/intake-historical-density-2021-senate-print-minutes.ts \
            --request-package "$RUNNER_TEMP/request/historical-density-2021-senate-print-minute-request-package-v1.json" \
            --write-template "$RUNNER_TEMP/template/historical-density-2021-senate-print-minute-local-intake-template-v1.json"

      - name: Build synthetic authoritative-file fixture
        shell: bash
        run: |
          set -euo pipefail
          template="$RUNNER_TEMP/template/historical-density-2021-senate-print-minute-local-intake-template-v1.json"
          test "$(jq -r '.allowedCommittees | length' "$template")" = 10
          test "$(jq -r '.allowedCommittees[0].committeeEventId' "$template")" = 23837-0-s
          test "$(jq -r '.allowedCommittees[0].committeeName' "$template")" = Finance
          test "$(sha256sum "$template" | awk '{print $1}')" = 8cbac5bc679cbf53ac9a3374786c131f75d7df2d1726f20b390dd46b200cdc19

          mkdir -p "$RUNNER_TEMP/source"
          printf '%s' '%PDF-1.4 synthetic LRL fixture only' > "$RUNNER_TEMP/source/finance-2021-02-20.pdf"
          source_sha="$(sha256sum "$RUNNER_TEMP/source/finance-2021-02-20.pdf" | awk '{print $1}')"
          cat > "$RUNNER_TEMP/intake.json" <<JSON
          {
            "schemaVersion": "historical-density-2021-senate-print-minute-local-intake-manifest-v1",
            "requestPackage": {
              "artifactId": 11496898656,
              "artifactDigest": "sha256:c7d6d274dd734878efbb830a1c8c17a35afb1503e30ca4917cefc8e1d39fb26e",
              "sourceCommitSha": "39360a45fa9f8856e26001e4b005246c51467bcf",
              "requestAssociationProofSha256": "6d3ecfa7d433e8a3f3c835ecc9934a0b68cab53f213501b333e873d32d29a1d0"
            },
            "documents": [{
              "relativePath": "finance-2021-02-20.pdf",
              "committeeEventId": "23837-0-s",
              "committeeName": "Finance",
              "documentDate": "2021-02-20",
              "mimeType": "application/pdf",
              "pageCount": 1,
              "acquisitionMethod": "lrl_supplied_copy",
              "lrlReference": "synthetic-ci-fixture-not-authoritative",
              "acquiredOn": "2026-10-07",
              "expectedSha256": "$source_sha"
            }]
          }
          JSON

      - name: Run local intake fixture
        run: |
          node --import tsx scripts/intake-historical-density-2021-senate-print-minutes.ts \
            --request-package "$RUNNER_TEMP/request/historical-density-2021-senate-print-minute-request-package-v1.json" \
            --manifest "$RUNNER_TEMP/intake.json" \
            --source-root "$RUNNER_TEMP/source" \
            --output-dir "$RUNNER_TEMP/output" \
            --generated-at "2026-10-07T00:00:00.000Z"

      - name: Verify archived-byte and non-evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          b="$RUNNER_TEMP/output/historical-density-2021-senate-print-minute-intake-bundle-v1.json"
          l="$RUNNER_TEMP/output/historical-density-2021-senate-print-minute-local-source-ledger-v1.json"
          test "$(jq -r '.summary.documents' "$b")" = 1
          test "$(jq -r '.summary.committees' "$b")" = 1
          test "$(jq -r '.summary.candidateTargetEvents > 0' "$b")" = true
          test "$(jq -r '.summary.candidateBills > 0' "$b")" = true
          test "$(jq -r '.documents[0].semanticStatus' "$b")" = unreviewed
          test "$(jq -r '.documents[0].evidenceStatus' "$b")" = not_evidence
          test "$(jq -r '.documents[0].mechanicallyActionable' "$b")" = false
          test "$(jq -r '.documents[0].modelWeight' "$b")" = 0
          test "$(jq -r '.policy.targetVoteOutcomesRead' "$b")" = false
          test "$(jq -r '.policy.featureRowsWritten' "$b")" = false

          test "$(jq -r '.summary.documents' "$l")" = 1
          test "$(jq -r '.policy.sourcePathsMustRemainInsideSourceRoot' "$l")" = true
          test "$(jq -r '.policy.exactSourceBytesArchived' "$l")" = true
          test "$(jq -r '.policy.successfulIntakeCreatesEvidence' "$l")" = false
          test "$(jq -r '.sourceLedgerProofSha256' "$l")" = 701467a4cfe7ad7a2e79a6753b52d444ff802d72490d311b757a2f876f6f8994
          test "$(sha256sum "$b" | awk '{print $1}')" = dc7318e5bea18adae041eccc4c1cea1d234c91e9719a618f784c08fb6875e3dc
          test "$(sha256sum "$l" | awk '{print $1}')" = 84796fcbeeaa97d16d8918c031416afd36432d2d513614093a3c5f9afc1f0803
          archived="$(jq -r '.sources[0].archivedRelativePath' "$l")"
          test -s "$RUNNER_TEMP/output/$archived"
          test "$(jq -r '.sources[0].contentSha256' "$l")" = ab8a84192fa1ea47014511e5585fd3777fb266c3c6761fa8922b2354635f1b0f
          test "$(sha256sum "$RUNNER_TEMP/output/$archived" | awk '{print $1}')" = ab8a84192fa1ea47014511e5585fd3777fb266c3c6761fa8922b2354635f1b0f

      - name: Verify path traversal fails closed
        shell: bash
        run: |
          set -euo pipefail
          jq '.documents[0].relativePath = "../escape.pdf"' "$RUNNER_TEMP/intake.json" > "$RUNNER_TEMP/bad-intake.json"
          if node --import tsx scripts/intake-historical-density-2021-senate-print-minutes.ts \
            --request-package "$RUNNER_TEMP/request/historical-density-2021-senate-print-minute-request-package-v1.json" \
            --manifest "$RUNNER_TEMP/bad-intake.json" \
            --source-root "$RUNNER_TEMP/source" \
            --output-dir "$RUNNER_TEMP/bad-output"; then
            echo 'expected path traversal intake to fail' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: historical-density-2021-senate-print-minute-local-intake-fixture-v1
          path: |
            ${{ runner.temp }}/template/*
            ${{ runner.temp }}/output/*
          if-no-files-found: error
          retention-days: 30
