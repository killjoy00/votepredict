name: Historical Deep discovery score

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/historical-deep-discovery-score.yml
      - scripts/run-production-historical-deep-discovery-score.ts
      - src/app/api/operations/historical-deep-discovery-score/route.ts
      - src/evaluation/historical-deep-discovery-score.ts
      - src/evaluation/historical-deep-discovery-extractor.ts
      - src/evaluation/historical-deep-pilot.ts
      - src/evaluation/historical-deep-targets.ts
      - src/evaluation/historical-quick-runtime.ts
      - src/evaluation/historical-quick-replay.ts
      - data/evaluation/historical-deep-artifact-lineage-v1.json
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: historical-deep-discovery-score
  cancel-in-progress: false

jobs:
  score:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      VOTEPREDICT_DEEP_DISCOVERY_SCORE_OUTPUT: artifacts/historical-deep-discovery-score.json
    steps:
      - uses: actions/checkout@v7
      - name: Require the existing Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'VERCEL_TOKEN is unavailable to this repository. No historical discovery score was attempted.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Wait for this exact main SHA to be live in production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            http_code="$(curl \
              --silent \
              --show-error \
              --output "$RUNNER_TEMP/vercel-deployments.json" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=20&teamId=${VERCEL_ORG_ID}")"
            if [ "$http_code" != "200" ]; then
              echo "Vercel deployment lookup returned HTTP ${http_code}."
              exit 1
            fi
            match="$(jq -c --arg sha "$GITHUB_SHA" '[.deployments[]? | select(.target == "production" and .meta.githubCommitSha == $sha)] | first // empty' "$RUNNER_TEMP/vercel-deployments.json")"
            if [ -n "$match" ]; then
              state="$(printf '%s' "$match" | jq -r '.state // "UNKNOWN"')"
              if [ "$state" = "READY" ]; then
                echo "Exact main SHA ${GITHUB_SHA} is READY in production."
                exit 0
              fi
              if [ "$state" = "ERROR" ] || [ "$state" = "CANCELED" ]; then
                echo "Production deployment for ${GITHUB_SHA} entered ${state}."
                exit 1
              fi
            fi
            sleep 5
          done
          echo "Exact main SHA ${GITHUB_SHA} did not become READY before the score deadline."
          exit 1
      - name: Read frozen candidate lineage
        id: lineage
        shell: bash
        run: |
          set -euo pipefail
          lineage='data/evaluation/historical-deep-artifact-lineage-v1.json'
          echo "candidate_run_id=$(jq -r '.discoveryCandidates.workflowRunId' "$lineage")" >> "$GITHUB_OUTPUT"
          echo "candidate_artifact_id=$(jq -r '.discoveryCandidates.artifactId' "$lineage")" >> "$GITHUB_OUTPUT"
          echo "candidate_name=$(jq -r '.discoveryCandidates.artifactName' "$lineage")" >> "$GITHUB_OUTPUT"
      - name: Verify pinned candidate artifact digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lineage='data/evaluation/historical-deep-artifact-lineage-v1.json'
          id="$(jq -r '.discoveryCandidates.artifactId' "$lineage")"
          expected="sha256:$(jq -r '.discoveryCandidates.artifactSha256' "$lineage")"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" > "$RUNNER_TEMP/candidate-artifact.json"
          actual="$(jq -r '.digest // empty' "$RUNNER_TEMP/candidate-artifact.json")"
          expired="$(jq -r '.expired' "$RUNNER_TEMP/candidate-artifact.json")"
          if [ "$expired" != "false" ]; then
            echo "Pinned candidate artifact ${id} is expired."
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "Pinned candidate artifact ${id} digest mismatch. Expected ${expected}; got ${actual}."
            exit 1
          fi
      - name: Download frozen discovery candidates
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.lineage.outputs.candidate_run_id }}
          name: ${{ steps.lineage.outputs.candidate_name }}
          path: artifacts/frozen/candidates
      - name: Read production operation secret privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1; then
            echo 'Could not read the VotePredict production environment. No historical discovery score was run.'
            exit 1
          fi
      - name: Score frozen discovery candidates against historical outcomes
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: |
          node --import tsx scripts/run-production-historical-deep-discovery-score.ts \
            --candidates artifacts/frozen/candidates/historical-deep-discovery-candidates.json
      - name: Upload historical discovery score
        uses: actions/upload-artifact@v4
        with:
          name: historical-deep-discovery-score-${{ github.sha }}
          path: artifacts/historical-deep-discovery-score.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary credentials and lookup files
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env', 'vercel-pull.log', 'vercel-deployments.json', 'candidate-artifact.json']:
              Path(os.environ['RUNNER_TEMP'], name).unlink(missing_ok=True)
          PYTHON
