name: Freeze reviewed 2025 House applicability tranche 2

on:
  pull_request:
    paths:
      - data/evaluation/evidence-quality/historical-density-2025-house-applicability-tranche-3-decisions-v1.json
      - scripts/freeze-historical-density-2025-house-applicability-tranche-3-review.ts
      - tests/historical-density-2025-house-applicability-tranche-3-review.test.ts
      - .github/workflows/historical-density-2025-house-applicability-tranche-3-review.yml
  push:
    branches: [main]
    paths:
      - data/evaluation/evidence-quality/historical-density-2025-house-applicability-tranche-3-decisions-v1.json
      - scripts/freeze-historical-density-2025-house-applicability-tranche-3-review.ts
      - tests/historical-density-2025-house-applicability-tranche-3-review.test.ts
      - .github/workflows/historical-density-2025-house-applicability-tranche-3-review.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-2025-house-applicability-tranche-3-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Test checked-in tranche-3 applicability decisions
        run: node --import tsx --test tests/historical-density-2025-house-applicability-tranche-3-review.test.ts

      - name: Materialize immutable tranche-3 candidate audit
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11452236668/zip > "$RUNNER_TEMP/tranche3-audit.zip"
          echo "0c78a9af4ca9cb87d660424a607151c24f295be5c95bd719d803fe7dd184a52f  $RUNNER_TEMP/tranche3-audit.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tranche3-audit"
          unzip -q "$RUNNER_TEMP/tranche3-audit.zip" applicability-audit/historical-density-2025-house-applicability-candidate-audit-tranche-3-v1.json -d "$RUNNER_TEMP/tranche3-audit"

      - name: Freeze reviewed tranche-3 applicability gate
        env:
          VOTEPREDICT_2025_HOUSE_TRANCHE2_APPLICABILITY_AUDIT_PATH: ${{ runner.temp }}/tranche3-audit/applicability-audit/historical-density-2025-house-applicability-candidate-audit-tranche-3-v1.json
          VOTEPREDICT_2025_HOUSE_TRANCHE2_APPLICABILITY_DECISIONS_PATH: data/evaluation/evidence-quality/historical-density-2025-house-applicability-tranche-3-decisions-v1.json
          VOTEPREDICT_2025_HOUSE_TRANCHE2_APPLICABILITY_REVIEW_OUTPUT: ${{ runner.temp }}/tranche3-review/historical-density-2025-house-applicability-tranche-3-review-v1.json
        run: node --import tsx scripts/freeze-historical-density-2025-house-applicability-tranche-3-review.ts

      - name: Verify reviewed tranche-3 boundary
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/tranche3-review/historical-density-2025-house-applicability-tranche-3-review-v1.json"
          test "$(jq -r '.schemaVersion' "$f")" = historical-density-2025-house-applicability-tranche-3-review-v1
          test "$(jq -r '.issue' "$f")" = 718
          test "$(jq -r '.session' "$f")" = 2025-2026
          test "$(jq -r '.review.candidatePairs' "$f")" = 325
          test "$(jq -r '.review.candidateBills' "$f")" = 17
          test "$(jq -r '.review.candidatePublicMembers' "$f")" = 39
          test "$(jq -r '.review.candidateSemanticGroups' "$f")" = 39
          test "$(jq -r '.review.decisions.applicable' "$f")" = 8
          test "$(jq -r '.review.decisions.ambiguous_fail_closed' "$f")" = 1
          test "$(jq -r '.review.decisions.not_applicable' "$f")" = 316
          test "$(jq -r '.review.decisions.pending_review' "$f")" = 0
          test "$(jq -r '.review.alignmentCounts.aligns' "$f")" = 8
          test "$(jq -r '.review.alignmentCounts.conflicts' "$f")" = 0
          test "$(jq -r '.review.finalPairStatusCounts.applicable' "$f")" = 8
          test "$(jq -r '.review.finalPairStatusCounts.ambiguous_fail_closed' "$f")" = 139
          test "$(jq -r '.review.finalPairStatusCounts.not_applicable' "$f")" = 1003
          test "$(jq -r '.review.finalPairStatusCounts.pending_review' "$f")" = 0
          test "$(jq -r '.review.applicableRows' "$f")" = 8
          test "$(jq -r '.review.integrationReadyRows' "$f")" = 0
          test "$(jq -r '.frozenInput.targetEventKeySha256' "$f")" = e5df92e5d1074edae44bc376ba85a041c3107dde1c84cddc3c8a471c132822f0
          test "$(jq -r '.frozenInput.reviewKeySha256' "$f")" = ce074d71b2d6fed1c4ec0f9836aca73c873875d607775c24e4731af56a882f2b
          jq -e '[.review.reviewedCandidates[] | select(.decision == "applicable") | .internalMembershipIdentityResolved] | all(. == false)' "$f" >/dev/null
          jq -e '[.review.reviewedCandidates[] | select(.decision == "applicable") | .integrationReady] | all(. == false)' "$f" >/dev/null
          test "$(jq -r '.policy.outcomeUse' "$f")" = none
          test "$(jq -r '.policy.targetVoteOutcomesRead' "$f")" = false
          test "$(jq -r '.policy.productionDatabaseQueried' "$f")" = false
          test "$(jq -r '.policy.productionWrites' "$f")" = false
          test "$(jq -r '.policy.vercelUsed' "$f")" = false
          test "$(jq -r '.policy.internalMembershipIdentityResolved' "$f")" = false
          test "$(jq -r '.policy.internalIdentityRequiredBeforeFeatureIntegration' "$f")" = true
          test "$(jq -r '.policy.featureRowsWritten' "$f")" = false
          test "$(jq -r '.policy.modelFitting' "$f")" = none
          test "$(jq -r '.policy.servingChanged' "$f")" = false
          {
            echo '## 2025-26 House reviewed applicability — tranche 2'
            echo
            echo '- Candidate pairs reviewed: **325**'
            echo '- Applicable: **8**'
            echo '- Reviewed ambiguous/fail-closed: **1**'
            echo '- Reviewed not applicable: **316**'
            echo '- Full eligible-pair accounting: **8 applicable / 139 fail-closed / 1,003 not-applicable / 0 pending**'
            echo '- Alignment: **8 align / 0 conflict**'
            echo '- Integration-ready rows: **0** (internal identity unresolved)'
            echo '- Outcomes used: **none**'
            echo '- Production DB queried: **no**'
            echo '- Vercel used: **no**'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: historical-density-2025-house-applicability-tranche-3-review-v1
          path: ${{ runner.temp }}/tranche3-review/*
          if-no-files-found: error
          retention-days: 90
