name: Revisor introduction direct production backfill

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/revisor-introduction-direct-backfill.yml
      - scripts/run-direct-production-revisor-introduction-backfill.ts
      - src/operations/revisor-introduction-backfill.ts
      - src/sources/minnesota/revisor-introduction.ts
      - src/sources/minnesota/revisor-introduction-html.ts
      - src/sources/minnesota/revisor-actions.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revisor-introduction-production-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
    steps:
      - uses: actions/checkout@v7
      - name: Require the existing Vercel credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN is unavailable. No production action was taken.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Read production database environment privately
        shell: bash
        run: |
          umask 077
          if ! npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1; then
            echo 'Could not read the VotePredict production database environment. No introduction backfill was invoked.'
            exit 1
          fi
      - name: Backfill introduction metadata directly from exact main
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/run-direct-production-revisor-introduction-backfill.ts
      - name: Remove temporary credentials and Vercel logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env', 'vercel-pull.log']:
              Path(os.environ['RUNNER_TEMP'], name).unlink(missing_ok=True)
          PYTHON
