name: Freeze reviewed 2025 House cohort 2 applicability tranche 4

on:
  pull_request:
    paths:
      - data/evaluation/evidence-quality/historical-density-2025-house-applicability-cohort-2-tranche-4-decisions-v1.json
      - scripts/freeze-historical-density-2025-house-applicability-cohort-2-tranche-4-review.ts
      - tests/historical-density-2025-house-applicability-cohort-2-tranche-4-review.test.ts
      - .github/workflows/historical-density-2025-house-applicability-cohort-2-tranche-4-review.yml
  push:
    branches: [main]
    paths:
      - data/evaluation/evidence-quality/historical-density-2025-house-applicability-cohort-2-tranche-4-decisions-v1.json
      - scripts/freeze-historical-density-2025-house-applicability-cohort-2-tranche-4-review.ts
      - tests/historical-density-2025-house-applicability-cohort-2-tranche-4-review.test.ts
      - .github/workflows/historical-density-2025-house-applicability-cohort-2-tranche-4-review.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-2025-house-applicability-cohort-2-tranche-4-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Test checked-in tranche-4 applicability decisions
        run: node --import tsx --test tests/historical-density-2025-house-applicability-cohort-2-tranche-4-review.test.ts

      - name: Materialize immutable tranche-4 candidate audit
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11560497316/zip > "$RUNNER_TEMP/tranche4-audit.zip"
          echo "5d098afd1283d0402965bdf2590c8c6f69666cbb02a5f1c6567a324c41f9fee8  $RUNNER_TEMP/tranche4-audit.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tranche4-audit"
          unzip -q "$RUNNER_TEMP/tranche4-audit.zip" applicability-audit/historical-density-2025-house-applicability-candidate-audit-cohort-2-tranche-4-v1.json -d "$RUNNER_TEMP/tranche4-audit"

      - name: Freeze reviewed tranche-4 applicability gate
        env:
          VOTEPREDICT_2025_HOUSE_COHORT_2_TRANCHE4_APPLICABILITY_AUDIT_PATH: ${{ runner.temp }}/tranche4-audit/applicability-audit/historical-density-2025-house-applicability-candidate-audit-cohort-2-tranche-4-v1.json
          VOTEPREDICT_2025_HOUSE_COHORT_2_TRANCHE4_APPLICABILITY_DECISIONS_PATH: data/evaluation/evidence-quality/historical-density-2025-house-applicability-cohort-2-tranche-4-decisions-v1.json
          VOTEPREDICT_2025_HOUSE_COHORT_2_TRANCHE4_APPLICABILITY_REVIEW_OUTPUT: ${{ runner.temp }}/tranche4-review/historical-density-2025-house-applicability-review-cohort-2-tranche-4-v1.json
        run: node --import tsx scripts/freeze-historical-density-2025-house-applicability-cohort-2-tranche-4-review.ts

      - name: Verify reviewed tranche-4 boundary
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/tranche4-review/historical-density-2025-house-applicability-review-cohort-2-tranche-4-v1.json"
          test "$(jq -r '.schemaVersion' "$f")" = historical-density-2025-house-applicability-tranche-4-review-v1
          test "$(jq -r '.issue' "$f")" = 718
          test "$(jq -r '.session' "$f")" = 2025-2026
          test "$(jq -r '.review.candidatePairs' "$f")" = 230
          test "$(jq -r '.review.candidateBills' "$f")" = 15
          test "$(jq -r '.review.candidatePublicMembers' "$f")" = 41
          test "$(jq -r '.review.candidateSemanticGroups' "$f")" = 41
          test "$(jq -r '.review.decisions.applicable' "$f")" = 7
          test "$(jq -r '.review.decisions.ambiguous_fail_closed' "$f")" = 0
          test "$(jq -r '.review.decisions.not_applicable' "$f")" = 223
          test "$(jq -r '.review.decisions.pending_review' "$f")" = 0
          test "$(jq -r '.review.alignmentCounts.aligns' "$f")" = 7
          test "$(jq -r '.review.alignmentCounts.conflicts' "$f")" = 0
          test "$(jq -r '.review.finalPairStatusCounts.applicable' "$f")" = 7
          test "$(jq -r '.review.finalPairStatusCounts.ambiguous_fail_closed' "$f")" = 0
          test "$(jq -r '.review.finalPairStatusCounts.not_applicable' "$f")" = 1043
          test "$(jq -r '.review.finalPairStatusCounts.pending_review' "$f")" = 0
          test "$(jq -r '.review.applicableRows' "$f")" = 7
          test "$(jq -r '.review.integrationReadyRows' "$f")" = 0
          test "$(jq -r '.frozenInput.targetEventKeySha256' "$f")" = b30043dfcb57fd7d5cb10b489b9d42ca1ea4476e5c4ee1bec512277fe7aa4339
          test "$(jq -r '.frozenInput.reviewKeySha256' "$f")" = 24e756bb9dd6206dfee8f9404d6f0d294aef97343162d82aa10f504c3e48aeaf
          jq -e '[.review.reviewedCandidates[] | select(.decision == "applicable") | .internalMembershipIdentityResolved] | all(. == false)' "$f" >/dev/null
          jq -e '[.review.reviewedCandidates[] | select(.decision == "applicable") | .integrationReady] | all(. == false)' "$f" >/dev/null
          test "$(jq -r '.policy.outcomeUse' "$f")" = none
          test "$(jq -r '.policy.targetVoteOutcomesRead' "$f")" = false
          test "$(jq -r '.policy.productionDatabaseQueried' "$f")" = false
          test "$(jq -r '.policy.productionWrites' "$f")" = false
          test "$(jq -r '.policy.vercelUsed' "$f")" = false
          test "$(jq -r '.policy.internalMembershipIdentityResolved' "$f")" = false
          test "$(jq -r '.policy.internalIdentityRequiredBeforeFeatureIntegration' "$f")" = true
          test "$(jq -r '.policy.contextOnly' "$f")" = true
          test "$(jq -r '.policy.mechanicallyActionable' "$f")" = false
          test "$(jq -r '.policy.modelWeight' "$f")" = 0
          test "$(jq -r '.policy.featureRowsWritten' "$f")" = false
          test "$(jq -r '.policy.modelFitting' "$f")" = none
          test "$(jq -r '.policy.servingChanged' "$f")" = false
          {
            echo '## 2025-26 House reviewed applicability — tranche 4'
            echo
            echo '- Candidate pairs reviewed: **230**'
            echo '- Applicable: **7**'
            echo '- Reviewed ambiguous/fail-closed: **0**'
            echo '- Reviewed not applicable: **223**'
            echo '- Full eligible-pair accounting: **7 applicable / 0 fail-closed / 1,043 not-applicable / 0 pending**'
            echo '- Alignment: **7 align / 0 conflict**'
            echo '- Integration-ready rows: **0** (internal identity unresolved)'
            echo '- Outcomes used: **none**'
            echo '- Production DB queried: **no**'
            echo '- Vercel used: **no**'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: historical-density-2025-house-applicability-review-cohort-2-tranche-4-v1
          path: ${{ runner.temp }}/tranche4-review/*
          if-no-files-found: error
          retention-days: 90
