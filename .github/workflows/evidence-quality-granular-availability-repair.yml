name: Repair Evidence Quality granular availability

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  actions: read

concurrency:
  group: >-
    ${{
      (startsWith(github.event.comment.body, '[evidence-quality-granular-availability-repair-dry-run]')
       || startsWith(github.event.comment.body, '[evidence-quality-granular-availability-repair-apply]'))
      && 'evidence-quality-granular-availability-repair'
      || format('evidence-quality-granular-availability-repair-skip-{0}', github.event.comment.id)
    }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.issue.number == 579 &&
      github.event.comment.user.login == 'killjoy00' &&
      (
        startsWith(github.event.comment.body, '[evidence-quality-granular-availability-repair-dry-run]') ||
        startsWith(github.event.comment.body, '[evidence-quality-granular-availability-repair-apply]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Materialize pinned granular availability repair plan
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11315632754/zip > "$RUNNER_TEMP/granular-availability-plan.zip"
          echo "6b1f7bfb91cdfe79994cdc87314c3efd505610a1effe81cec8630341860da5e6  $RUNNER_TEMP/granular-availability-plan.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/granular-availability-plan"
          unzip -q "$RUNNER_TEMP/granular-availability-plan.zip" -d "$RUNNER_TEMP/granular-availability-plan"

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Run guarded granular availability repair
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_EQ_GRANULAR_AVAILABILITY_PLAN_PATH: ${{ runner.temp }}/granular-availability-plan/evidence-quality-granular-availability-repair-plan-v1.json
          VOTEPREDICT_EQ_GRANULAR_AVAILABILITY_PLAN_RUN_ID: "37237103992"
          VOTEPREDICT_EQ_GRANULAR_AVAILABILITY_APPLY_DIR: ${{ runner.temp }}/evidence-quality-granular-availability-repair
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ startsWith(github.event.comment.body, '[evidence-quality-granular-availability-repair-apply]') }}" == "true" ]]; then
            node --import tsx scripts/apply-evidence-quality-granular-availability-repair.ts --apply
          else
            node --import tsx scripts/apply-evidence-quality-granular-availability-repair.ts
          fi

      - name: Upload repair audit
        uses: actions/upload-artifact@v7
        with:
          name: ${{ startsWith(github.event.comment.body, '[evidence-quality-granular-availability-repair-apply]') && 'evidence-quality-granular-availability-repair-apply-v1' || 'evidence-quality-granular-availability-repair-dry-run-v1' }}
          path: ${{ runner.temp }}/evidence-quality-granular-availability-repair/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary credentials and input artifact
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/votepredict-production.env" "$RUNNER_TEMP/vercel-pull.log" "$RUNNER_TEMP/granular-availability-plan.zip"
