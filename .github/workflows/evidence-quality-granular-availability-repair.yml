name: Repair Evidence Quality granular availability

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  actions: read

concurrency:
  group: >-
    ${{ startsWith(github.event.comment.body, '[evidence-quality-granular-availability-repair]')
        && 'evidence-quality-granular-availability-repair'
        || format('evidence-quality-granular-availability-repair-skip-{0}', github.event.comment.id) }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.issue.number == 579 &&
      github.event.comment.user.login == 'killjoy00' &&
      startsWith(github.event.comment.body, '[evidence-quality-granular-availability-repair]') &&
      contains(github.event.comment.body, 'APPLY_FROZEN_PLAN_11315632754')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Materialize frozen granular repair plan
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11315632754/zip > "$RUNNER_TEMP/granular-plan.zip"
          echo "6b1f7bfb91cdfe79994cdc87314c3efd505610a1effe81cec8630341860da5e6  $RUNNER_TEMP/granular-plan.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/granular-plan"
          unzip -q "$RUNNER_TEMP/granular-plan.zip" -d "$RUNNER_TEMP/granular-plan"

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Apply exact evidence-item metadata repair
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_EQ_GRANULAR_AVAILABILITY_PLAN_PATH: ${{ runner.temp }}/granular-plan/evidence-quality-granular-availability-repair-plan-v1.json
          VOTEPREDICT_EQ_GRANULAR_AVAILABILITY_PLAN_RUN_ID: "37237103992"
          VOTEPREDICT_EQ_GRANULAR_AVAILABILITY_PLAN_ARTIFACT_ID: "11315632754"
          VOTEPREDICT_EQ_GRANULAR_AVAILABILITY_PLAN_ARTIFACT_DIGEST: "sha256:6b1f7bfb91cdfe79994cdc87314c3efd505610a1effe81cec8630341860da5e6"
          VOTEPREDICT_EQ_GRANULAR_AVAILABILITY_REPAIR_MODE: "apply"
          VOTEPREDICT_EQ_GRANULAR_AVAILABILITY_REPAIR_DIR: ${{ runner.temp }}/evidence-quality-granular-availability-repair
        run: node --import tsx scripts/repair-evidence-quality-granular-availability.ts

      - name: Upload repair audit
        uses: actions/upload-artifact@v7
        with:
          name: evidence-quality-granular-availability-repair-v1
          path: ${{ runner.temp }}/evidence-quality-granular-availability-repair/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary credentials and input artifact
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/votepredict-production.env" "$RUNNER_TEMP/vercel-pull.log" "$RUNNER_TEMP/granular-plan.zip"
