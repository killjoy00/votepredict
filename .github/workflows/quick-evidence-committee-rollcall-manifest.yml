name: Quick Evidence committee roll-call manifest

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/quick-evidence-committee-rollcall-manifest.yml
      - scripts/run-production-quick-evidence-committee-rollcall-manifest.ts
      - src/app/api/operations/quick-evidence-committee-rollcall-manifest/route.ts
      - src/evaluation/quick-evidence-committee-rollcall-manifest.ts
      - src/evaluation/historical-quick-runtime.ts
      - src/evaluation/historical-quick-replay.ts
      - src/evaluation/historical-deep-targets.ts
      - data/evaluation/quick-evidence-committee-rollcall-screen-plan-v1.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-evidence-committee-rollcall-manifest
  cancel-in-progress: false

jobs:
  manifest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      VOTEPREDICT_COMMITTEE_ROLLCALL_MANIFEST_OUTPUT: artifacts/quick-evidence-committee-rollcall-manifest-v1.json
    steps:
      - uses: actions/checkout@v7
      - name: Verify frozen plan
        shell: bash
        run: |
          set -euo pipefail
          plan='data/evaluation/quick-evidence-committee-rollcall-screen-plan-v1.json'
          test "$(jq -r '.schemaVersion' "$plan")" = 'quick-evidence-committee-rollcall-screen-plan-v1'
          test "$(jq -r '.features.activeWeightBeforeTest' "$plan")" = '0'
          test "$(jq -r '.interpretation.productionAction' "$plan")" = 'none'
          test "$(jq -r '.interpretation.automaticPromotion' "$plan")" = 'false'
      - name: Require the existing Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'VERCEL_TOKEN is unavailable. No committee-rollcall manifest was attempted.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Wait for this exact main SHA to be live in production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            http_code="$(curl --silent --show-error --output "$RUNNER_TEMP/vercel-deployments.json" --write-out '%{http_code}' --header "Authorization: Bearer ${VERCEL_TOKEN}" "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=20&teamId=${VERCEL_ORG_ID}")"
            if [ "$http_code" != "200" ]; then
              echo "Vercel deployment lookup returned HTTP ${http_code}."
              exit 1
            fi
            match="$(jq -c --arg sha "$GITHUB_SHA" '[.deployments[]? | select(.target == "production" and .meta.githubCommitSha == $sha)] | first // empty' "$RUNNER_TEMP/vercel-deployments.json")"
            if [ -n "$match" ]; then
              state="$(printf '%s' "$match" | jq -r '.state // "UNKNOWN"')"
              if [ "$state" = "READY" ]; then
                echo "Exact main SHA ${GITHUB_SHA} is READY in production."
                exit 0
              fi
              if [ "$state" = "ERROR" ] || [ "$state" = "CANCELED" ]; then
                echo "Production deployment for ${GITHUB_SHA} entered ${state}."
                exit 1
              fi
            fi
            sleep 5
          done
          echo "Exact main SHA ${GITHUB_SHA} did not become READY before the manifest deadline."
          exit 1
      - name: Read production operation secret privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1; then
            echo 'Could not read the VotePredict production environment. No committee-rollcall manifest was run.'
            exit 1
          fi
      - name: Freeze outcome-blind broad House target manifest
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/run-production-quick-evidence-committee-rollcall-manifest.ts
      - name: Verify outcome boundary
        shell: bash
        run: |
          set -euo pipefail
          file="$VOTEPREDICT_COMMITTEE_ROLLCALL_MANIFEST_OUTPUT"
          test "$(jq -r '.schemaVersion' "$file")" = 'quick-evidence-committee-rollcall-manifest-v1'
          test "$(jq -r '.metadata.sourcePlan' "$file")" = 'quick-evidence-committee-rollcall-screen-plan-v1'
          if grep -Eq '"(actualOutcome|passed|yeaCount|nayCount|choice)"' "$file"; then
            echo 'Outcome field leaked into committee-rollcall manifest.'
            exit 1
          fi
      - name: Upload broad House target manifest
        uses: actions/upload-artifact@v4
        with:
          name: quick-evidence-committee-rollcall-manifest-${{ github.sha }}
          path: artifacts/quick-evidence-committee-rollcall-manifest-v1.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary credentials and lookup files
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env', 'vercel-pull.log', 'vercel-deployments.json']:
              Path(os.environ['RUNNER_TEMP'], name).unlink(missing_ok=True)
          PYTHON
