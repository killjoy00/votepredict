name: Historical Deep expansion discovery score

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: historical-deep-expansion-discovery-score
  cancel-in-progress: false

jobs:
  score:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      VOTEPREDICT_DEEP_EXPANSION_OUTCOME_OUTPUT: artifacts/historical-deep-expansion-outcome-snapshot.json
    steps:
      - uses: actions/checkout@v7
      - name: Require the existing Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'VERCEL_TOKEN is unavailable. No post-discovery outcome snapshot was attempted.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Verify post-discovery frozen artifacts before reading outcomes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lineage='data/evaluation/historical-deep-expansion-scoring-lineage-v1.json'
          verify_artifact() {
            local section="$1"
            local id expected actual expired
            id="$(jq -r ".${section}.artifactId" "$lineage")"
            expected="sha256:$(jq -r ".${section}.artifactSha256" "$lineage")"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" > "$RUNNER_TEMP/${section}.json"
            actual="$(jq -r '.digest // empty' "$RUNNER_TEMP/${section}.json")"
            expired="$(jq -r '.expired' "$RUNNER_TEMP/${section}.json")"
            test "$expired" = 'false'
            test "$actual" = "$expected"
            echo "${section}_run_id=$(jq -r ".${section}.workflowRunId" "$lineage")" >> "$GITHUB_ENV"
            echo "${section}_name=$(jq -r ".${section}.artifactName" "$lineage")" >> "$GITHUB_ENV"
          }
          verify_artifact candidateArtifact
          verify_artifact discoveryManifest
      - name: Download frozen candidate artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.candidateArtifact_run_id }}
          name: ${{ env.candidateArtifact_name }}
          path: artifacts/frozen/candidates
      - name: Download frozen discovery manifest
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.discoveryManifest_run_id }}
          name: ${{ env.discoveryManifest_name }}
          path: artifacts/frozen/discovery
      - name: Verify frozen discovery/candidate boundary
        shell: bash
        run: |
          set -euo pipefail
          candidate='artifacts/frozen/candidates/historical-deep-expansion-discovery-candidates.json'
          discovery='artifacts/frozen/discovery/historical-deep-expansion-discovery-manifest.json'
          test "$(jq -r '.schemaVersion' "$candidate")" = 'historical-deep-expansion-discovery-candidates-v1'
          test "$(jq -r '.metadata.outcomeUse' "$candidate")" = 'none'
          test "$(jq -r '.schemaVersion' "$discovery")" = 'historical-deep-expansion-discovery-manifest-v1'
          test "$(jq -r '.metadata.cases' "$discovery")" = '24'
          test "$(jq '[.. | objects | select(has("actualOutcome") or has("actualYes") or has("passed") or has("yeaCount") or has("nayCount"))] | length' "$candidate")" = '0'
          test "$(jq '[.. | objects | select(has("actualOutcome") or has("actualYes") or has("passed") or has("yeaCount") or has("nayCount"))] | length' "$discovery")" = '0'
      - name: Wait for this exact main SHA to be live in production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            http_code="$(curl \
              --silent \
              --show-error \
              --output "$RUNNER_TEMP/vercel-deployments.json" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=20&teamId=${VERCEL_ORG_ID}")"
            if [ "$http_code" != '200' ]; then
              echo "Vercel deployment lookup returned HTTP ${http_code}."
              exit 1
            fi
            match="$(jq -c --arg sha "$GITHUB_SHA" '[.deployments[]? | select(.target == "production" and .meta.githubCommitSha == $sha)] | first // empty' "$RUNNER_TEMP/vercel-deployments.json")"
            if [ -n "$match" ]; then
              state="$(printf '%s' "$match" | jq -r '.state // "UNKNOWN"')"
              if [ "$state" = 'READY' ]; then
                echo "Exact main SHA ${GITHUB_SHA} is READY in production."
                exit 0
              fi
              if [ "$state" = 'ERROR' ] || [ "$state" = 'CANCELED' ]; then
                echo "Production deployment for ${GITHUB_SHA} entered ${state}."
                exit 1
              fi
            fi
            sleep 5
          done
          echo "Exact main SHA ${GITHUB_SHA} did not become READY before the outcome deadline."
          exit 1
      - name: Read production operation secret privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1; then
            echo 'Could not read the VotePredict production environment. No outcome snapshot was run.'
            exit 1
          fi
      - name: Freeze official floor outcomes after candidate discovery
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: |
          node --import tsx scripts/run-production-historical-deep-expansion-outcome-snapshot.ts \
            artifacts/frozen/discovery/historical-deep-expansion-discovery-manifest.json \
            data/evaluation/historical-deep-expansion-scoring-lineage-v1.json
      - name: Verify outcome snapshot lineage
        shell: bash
        run: |
          set -euo pipefail
          file='artifacts/historical-deep-expansion-outcome-snapshot.json'
          lineage='data/evaluation/historical-deep-expansion-scoring-lineage-v1.json'
          test "$(jq -r '.schemaVersion' "$file")" = 'historical-deep-expansion-outcome-snapshot-v1'
          test "$(jq '.cases | length' "$file")" = '24'
          test "$(jq -r '.candidateArtifact.artifactId' "$file")" = "$(jq -r '.candidateArtifact.artifactId' "$lineage")"
          test "$(jq -r '.candidateArtifact.artifactSha256' "$file")" = "$(jq -r '.candidateArtifact.artifactSha256' "$lineage")"
          test "$(jq '[.cases[] | select((.members | length) == 0)] | length' "$file")" = '0'
      - name: Score immutable candidates against frozen official outcomes
        run: |
          node --import tsx scripts/score-historical-deep-expansion-discovery.ts \
            artifacts/frozen/candidates/historical-deep-expansion-discovery-candidates.json \
            artifacts/historical-deep-expansion-outcome-snapshot.json \
            artifacts/historical-deep-expansion-discovery-score.json
      - name: Upload frozen outcomes and score
        uses: actions/upload-artifact@v4
        with:
          name: historical-deep-expansion-discovery-score-${{ github.sha }}
          path: |
            artifacts/historical-deep-expansion-outcome-snapshot.json
            artifacts/historical-deep-expansion-discovery-score.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary credentials and lookup files
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in [
              'votepredict-production.env',
              'vercel-pull.log',
              'vercel-deployments.json',
              'candidateArtifact.json',
              'discoveryManifest.json',
          ]:
              Path(os.environ['RUNNER_TEMP'], name).unlink(missing_ok=True)
          PYTHON
