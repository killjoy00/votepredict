name: CFB original 2023-24 proof for 8 serving senators
on:
  pull_request:
    paths:
      - .github/workflows/cfb-2023-24-16-sources.yml
      - src/evidence/cfb-2023-24-eight-recovered-16-yearend-originals.ts
      - scripts/capture-cfb-2023-24-eight-recovered-16-original-pdfs.ts
      - tests/cfb-2023-24-eight-recovered-16-yearend-originals.test.ts
permissions:
  contents: read
jobs:
  original-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: node --import tsx --test tests/cfb-2023-24-eight-recovered-16-yearend-originals.test.ts
      - run: node --import tsx scripts/capture-cfb-2023-24-eight-recovered-16-original-pdfs.ts --output artifacts/cfb-2023-24-eight-16-original-pdf-sources.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-2023-24-eight-senators-sixteen-original-ye-metadata
          path: artifacts/cfb-2023-24-eight-16-original-pdf-sources.json
          if-no-files-found: warn
          retention-days: 30
