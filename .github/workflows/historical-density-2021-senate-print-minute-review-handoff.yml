name: Test 2021 Senate print minute review handoff

on:
  pull_request:
    paths:
      - src/evaluation/historical-density-2021-senate-print-minute-review-handoff.ts
      - scripts/finalize-historical-density-2021-senate-print-minute-review.ts
      - tests/historical-density-2021-senate-print-minute-review-handoff.test.ts
      - .github/workflows/historical-density-2021-senate-print-minute-review-handoff.yml
      - src/evaluation/historical-density-2021-senate-print-minute-semantic-review.ts
      - src/evaluation/historical-density-2021-senate-print-minute-intake.ts
  push:
    branches: [main]
    paths:
      - src/evaluation/historical-density-2021-senate-print-minute-review-handoff.ts
      - scripts/finalize-historical-density-2021-senate-print-minute-review.ts
      - tests/historical-density-2021-senate-print-minute-review-handoff.test.ts
      - .github/workflows/historical-density-2021-senate-print-minute-review-handoff.yml
      - src/evaluation/historical-density-2021-senate-print-minute-semantic-review.ts
      - src/evaluation/historical-density-2021-senate-print-minute-intake.ts
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-2021-senate-print-minute-review-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-review-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Materialize canonical synthetic local intake
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11499462793/zip > "$RUNNER_TEMP/intake.zip"
          echo "befde23007d609f7ca754a708b865e4754bcc4ef48f7844e47d212dc32eb3582  $RUNNER_TEMP/intake.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/intake"
          unzip -q "$RUNNER_TEMP/intake.zip" \
            output/historical-density-2021-senate-print-minute-intake-bundle-v1.json \
            -d "$RUNNER_TEMP/intake"
          test "$(sha256sum "$RUNNER_TEMP/intake/output/historical-density-2021-senate-print-minute-intake-bundle-v1.json" | awk '{print $1}')" = dc7318e5bea18adae041eccc4c1cea1d234c91e9719a618f784c08fb6875e3dc

      - name: Materialize canonical blank review packet
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11501725138/zip > "$RUNNER_TEMP/packet.zip"
          echo "fc7517ac6d1ca0896b3c5b93f3902f6073d377c75375930653b0fadfb8ca0583  $RUNNER_TEMP/packet.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/packet"
          unzip -q "$RUNNER_TEMP/packet.zip" \
            historical-density-2021-senate-print-minute-semantic-review-packet-v1.json \
            -d "$RUNNER_TEMP/packet"
          packet="$RUNNER_TEMP/packet/historical-density-2021-senate-print-minute-semantic-review-packet-v1.json"
          test "$(jq -r '.summary.reviewRows' "$packet")" = 5
          test "$(jq -r '.reviewKeySha256' "$packet")" = 03f49db508eaa3ea2413cc410d1b22f23a5a4abd0641d24ea9cb14b39477997c
          test "$(jq -r '.reviewPacketProofSha256' "$packet")" = 87f93dfe6fd349a074998b05f1309b0c944fbc0bfad85d0c4144686d56514933
          test "$(jq -r '.sourceIntake.sourceLedgerProofSha256' "$packet")" = 701467a4cfe7ad7a2e79a6753b52d444ff802d72490d311b757a2f876f6f8994

      - name: Test review handoff validator
        run: node --import tsx --test tests/historical-density-2021-senate-print-minute-review-handoff.test.ts

      - name: Generate completion template
        run: |
          node --import tsx scripts/finalize-historical-density-2021-senate-print-minute-review.ts \
            --review-packet "$RUNNER_TEMP/packet/historical-density-2021-senate-print-minute-semantic-review-packet-v1.json" \
            --intake-bundle "$RUNNER_TEMP/intake/output/historical-density-2021-senate-print-minute-intake-bundle-v1.json" \
            --write-template "$RUNNER_TEMP/completion-template.json"

      - name: Build synthetic completed packet review
        shell: bash
        run: |
          set -euo pipefail
          jq '
            .manifestSkeleton
            | .batchId = "SENATE-MINUTE-SYNTHETIC-CI-001"
            | .reviewedOn = "2026-10-07"
            | .documentAttestations |= map(
                .fullDocumentReviewed = true
                | .notes = ["Synthetic CI semantic-review fixture; not authoritative evidence."]
              )
            | .decisions |= map(
                if .candidateBillIdentifier == "SF694" then
                  .decision = "directional_member_statement"
                  | .billMentionExcerpt = "Sen. Jane Doe said, \"I support SF694.\""
                  | .billMentionPage = 1
                  | .memberName = "Jane Doe"
                  | .attributedMemberText = "Sen. Jane Doe"
                  | .memberStance = "supports"
                  | .claimType = "quoted_position"
                  | .explicitness = "direct_quote"
                  | .scope = "whole_bill"
                  | .normalizedClaim = "Jane Doe supports SF694 as a whole."
                  | .supportingExcerpt = "Sen. Jane Doe said, \"I support SF694.\""
                  | .supportingPage = 1
                  | .extractionConfidence = 0.95
                  | .transcriptionVerifiedAgainstSourcePage = true
                else
                  .decision = "not_applicable_to_candidate_bill"
                  | .reasonCode = "synthetic_not_present"
                end
              )
          ' "$RUNNER_TEMP/completion-template.json" > "$RUNNER_TEMP/completion.json"

      - name: Finalize completed packet review
        run: |
          node --import tsx scripts/finalize-historical-density-2021-senate-print-minute-review.ts \
            --review-packet "$RUNNER_TEMP/packet/historical-density-2021-senate-print-minute-semantic-review-packet-v1.json" \
            --intake-bundle "$RUNNER_TEMP/intake/output/historical-density-2021-senate-print-minute-intake-bundle-v1.json" \
            --completion-manifest "$RUNNER_TEMP/completion.json" \
            --output-dir "$RUNNER_TEMP/final" \
            --generated-at "2026-10-07T00:00:00.000Z"

      - name: Verify handoff and canonical semantic boundary
        shell: bash
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/completion-template.json"
          f="$RUNNER_TEMP/final/historical-density-2021-senate-print-minute-review-finalization-v1.json"
          s="$RUNNER_TEMP/final/historical-density-2021-senate-print-minute-semantic-review-bundle-v1.json"

          test "$(jq -r '.manifestSkeleton.decisions | length' "$t")" = 5
          test "$(jq -r '.manifestSkeleton.documentAttestations | length' "$t")" = 1
          test "$(sha256sum "$t" | awk '{print $1}')" = bf2b39ccdea8caeb82f77a51d3d396ed5323a9b4752eda17ce5c2b81f8c1d9a2
          test "$(sha256sum "$RUNNER_TEMP/completion.json" | awk '{print $1}')" = 47681875eca1f61a1ca9797b546e03d81146f0b78b396dda89b74fac13abaa1e
          test "$(jq -r '.frozenReviewPacket.reviewKeySha256' "$f")" = 03f49db508eaa3ea2413cc410d1b22f23a5a4abd0641d24ea9cb14b39477997c
          test "$(jq -r '.summary.reviewRows' "$f")" = 5
          test "$(jq -r '.summary.directionalRows' "$f")" = 1
          test "$(jq -r '.summary.notApplicableRows' "$f")" = 4
          test "$(jq -r '.summary.billContextRows' "$f")" = 0
          test "$(jq -r '.summary.ambiguousRows' "$f")" = 0
          test "$(jq -r '.summary.documentsReviewed' "$f")" = 1
          test "$(jq -r '.summary.semanticClaims' "$f")" = 1
          test "$(jq -r '.policy.packetRowsFullyAdjudicated' "$f")" = true
          test "$(jq -r '.policy.fullDocumentReviewAttested' "$f")" = true
          test "$(jq -r '.policy.nonDirectionalRowsPreservedInAudit' "$f")" = true
          test "$(jq -r '.policy.mechanicallyActionable' "$f")" = false
          test "$(jq -r '.policy.modelWeight' "$f")" = 0
          test "$(jq -r '.documentAttestationProofSha256' "$f")" = 8900d587c7900f66d2c686e3ea2fdb3ea946ed9080c469bf05311bfe5172beb1
          test "$(jq -r '.rowDecisionProofSha256' "$f")" = 26fccad2c3a3327837b348c1b65fc6a26a9910dfdd2df07a525b2347eb9ef4ab
          test "$(sha256sum "$f" | awk '{print $1}')" = e2b0a745b4a57527c879782a0d4fb43ada8bb78031cf536800d199ee1bfe579d

          test "$(jq -r '.summary.semanticClaims' "$s")" = 1
          test "$(jq -r '.semanticClaims[0].billIdentifier' "$s")" = SF694
          test "$(jq -r '.semanticClaims[0].memberName' "$s")" = "Jane Doe"
          test "$(jq -r '.semanticClaims[0].internalMembershipIdentityResolved' "$s")" = false
          test "$(jq -r '.semanticClaims[0].mechanicallyActionable' "$s")" = false
          test "$(jq -r '.policy.targetVoteOutcomesConsulted' "$s")" = false
          test "$(jq -r '.policy.featureRowsWritten' "$s")" = false
          test "$(jq -r '.reviewProofSha256' "$s")" = 0504411738be6e353925653a8dd68cbe40878253133dcb11b4fdb1a38a4e54dd
          test "$(sha256sum "$s" | awk '{print $1}')" = 14988e6be3f890ddbc9ac315cd1525730eae7d939f1d3f10e44c46ab71cf9957

      - name: Verify incomplete full-document review fails closed
        shell: bash
        run: |
          set -euo pipefail
          jq '.documentAttestations[0].fullDocumentReviewed = false' \
            "$RUNNER_TEMP/completion.json" > "$RUNNER_TEMP/incomplete.json"
          if node --import tsx scripts/finalize-historical-density-2021-senate-print-minute-review.ts \
            --review-packet "$RUNNER_TEMP/packet/historical-density-2021-senate-print-minute-semantic-review-packet-v1.json" \
            --intake-bundle "$RUNNER_TEMP/intake/output/historical-density-2021-senate-print-minute-intake-bundle-v1.json" \
            --completion-manifest "$RUNNER_TEMP/incomplete.json" \
            --output-dir "$RUNNER_TEMP/invalid"; then
            echo 'expected incomplete full-document review to fail' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: historical-density-2021-senate-print-minute-review-handoff-fixture-v1
          path: |
            ${{ runner.temp }}/completion-template.json
            ${{ runner.temp }}/completion.json
            ${{ runner.temp }}/final/*
          if-no-files-found: error
          retention-days: 30
