name: Freeze reviewed 2025 House cohort 2 applicability tranche 6

on:
  pull_request:
    paths:
      - data/evaluation/evidence-quality/historical-density-2025-house-applicability-cohort-2-tranche-6-decisions-v1.json
      - scripts/freeze-historical-density-2025-house-applicability-cohort-2-tranche-6-review.ts
      - tests/historical-density-2025-house-applicability-cohort-2-tranche-6-review.test.ts
      - .github/workflows/historical-density-2025-house-applicability-cohort-2-tranche-6-review.yml
  push:
    branches: [main]
    paths:
      - data/evaluation/evidence-quality/historical-density-2025-house-applicability-cohort-2-tranche-6-decisions-v1.json
      - scripts/freeze-historical-density-2025-house-applicability-cohort-2-tranche-6-review.ts
      - tests/historical-density-2025-house-applicability-cohort-2-tranche-6-review.test.ts
      - .github/workflows/historical-density-2025-house-applicability-cohort-2-tranche-6-review.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-2025-house-applicability-cohort-2-tranche-6-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Test checked-in tranche-6 applicability decisions
        run: node --import tsx --test tests/historical-density-2025-house-applicability-cohort-2-tranche-6-review.test.ts

      - name: Materialize immutable tranche-6 candidate audit
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11564384052/zip > "$RUNNER_TEMP/tranche6-audit.zip"
          echo "5229e7cea919d127de0ded4e229d60ec7dcd6f3e0daa45f9c81758a4ac0cf3cf  $RUNNER_TEMP/tranche6-audit.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tranche6-audit"
          unzip -q "$RUNNER_TEMP/tranche6-audit.zip" applicability-audit/historical-density-2025-house-applicability-candidate-audit-cohort-2-tranche-6-v1.json -d "$RUNNER_TEMP/tranche6-audit"

      - name: Freeze reviewed tranche-6 applicability gate
        env:
          VOTEPREDICT_2025_HOUSE_COHORT_2_TRANCHE6_APPLICABILITY_AUDIT_PATH: ${{ runner.temp }}/tranche6-audit/applicability-audit/historical-density-2025-house-applicability-candidate-audit-cohort-2-tranche-6-v1.json
          VOTEPREDICT_2025_HOUSE_COHORT_2_TRANCHE6_APPLICABILITY_DECISIONS_PATH: data/evaluation/evidence-quality/historical-density-2025-house-applicability-cohort-2-tranche-6-decisions-v1.json
          VOTEPREDICT_2025_HOUSE_COHORT_2_TRANCHE6_APPLICABILITY_REVIEW_OUTPUT: ${{ runner.temp }}/tranche6-review/historical-density-2025-house-applicability-review-cohort-2-tranche-6-v1.json
        run: node --import tsx scripts/freeze-historical-density-2025-house-applicability-cohort-2-tranche-6-review.ts

      - name: Verify reviewed tranche-6 boundary
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/tranche6-review/historical-density-2025-house-applicability-review-cohort-2-tranche-6-v1.json"
          test "$(jq -r '.schemaVersion' "$f")" = historical-density-2025-house-applicability-review-cohort-2-tranche-6-v1
          test "$(jq -r '.issue' "$f")" = 718
          test "$(jq -r '.session' "$f")" = 2025-2026
          test "$(jq -r '.review.candidatePairs' "$f")" = 148
          test "$(jq -r '.review.candidateBills' "$f")" = 16
          test "$(jq -r '.review.candidatePublicMembers' "$f")" = 37
          test "$(jq -r '.review.candidateSemanticGroups' "$f")" = 37
          test "$(jq -r '.review.decisions.applicable' "$f")" = 3
          test "$(jq -r '.review.decisions.ambiguous_fail_closed' "$f")" = 1
          test "$(jq -r '.review.decisions.not_applicable' "$f")" = 144
          test "$(jq -r '.review.decisions.pending_review' "$f")" = 0
          test "$(jq -r '.review.alignmentCounts.aligns' "$f")" = 3
          test "$(jq -r '.review.alignmentCounts.conflicts' "$f")" = 0
          test "$(jq -r '.review.finalPairStatusCounts.applicable' "$f")" = 3
          test "$(jq -r '.review.finalPairStatusCounts.ambiguous_fail_closed' "$f")" = 85
          test "$(jq -r '.review.finalPairStatusCounts.not_applicable' "$f")" = 962
          test "$(jq -r '.review.finalPairStatusCounts.pending_review' "$f")" = 0
          test "$(jq -r '.review.applicableRows' "$f")" = 3
          test "$(jq -r '.review.integrationReadyRows' "$f")" = 0
          test "$(jq -r '.frozenInput.targetTrancheIndex' "$f")" = 6
          test "$(jq -r '.frozenInput.targetEventKeySha256' "$f")" = eafb3980bdbe20a94da1150e673e8d9218753bcea7f696863fc598f9b4abc072
          test "$(jq -r '.frozenInput.reviewKeySha256' "$f")" = a4b50b76692e36d6e8e15af11eeb832ae7d8329b819220a008670be21fb412b2
          jq -e '[.review.reviewedCandidates[] | select(.decision == "applicable") | .internalMembershipIdentityResolved] | all(. == false)' "$f" >/dev/null
          jq -e '[.review.reviewedCandidates[] | select(.decision == "applicable") | .integrationReady] | all(. == false)' "$f" >/dev/null
          test "$(jq -r '.policy.outcomeUse' "$f")" = none
          test "$(jq -r '.policy.targetVoteOutcomesRead' "$f")" = false
          test "$(jq -r '.policy.productionDatabaseQueried' "$f")" = false
          test "$(jq -r '.policy.productionWrites' "$f")" = false
          test "$(jq -r '.policy.vercelUsed' "$f")" = false
          test "$(jq -r '.policy.internalMembershipIdentityResolved' "$f")" = false
          test "$(jq -r '.policy.internalIdentityRequiredBeforeFeatureIntegration' "$f")" = true
          test "$(jq -r '.policy.contextOnly' "$f")" = true
          test "$(jq -r '.policy.mechanicallyActionable' "$f")" = false
          test "$(jq -r '.policy.modelWeight' "$f")" = 0
          test "$(jq -r '.policy.featureRowsWritten' "$f")" = false
          test "$(jq -r '.policy.modelFitting' "$f")" = none
          test "$(jq -r '.policy.servingChanged' "$f")" = false
          {
            echo '## 2025-26 House reviewed applicability — tranche 6'
            echo
            echo '- Candidate pairs reviewed: **148**'
            echo '- Applicable: **3**'
            echo '- Reviewed ambiguous/fail-closed: **1**'
            echo '- Reviewed not applicable: **144**'
            echo '- Full eligible-pair accounting: **3 applicable / 85 fail-closed / 962 not-applicable / 0 pending**'
            echo '- Alignment: **3 align / 0 conflict**'
            echo '- Integration-ready rows: **0** (internal identity unresolved)'
            echo '- Outcomes used: **none**'
            echo '- Production DB queried: **no**'
            echo '- Vercel used: **no**'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: historical-density-2025-house-applicability-review-cohort-2-tranche-6-v1
          path: ${{ runner.temp }}/tranche6-review/*
          if-no-files-found: error
          retention-days: 90
