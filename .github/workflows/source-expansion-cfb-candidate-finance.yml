name: Source expansion CFB candidate finance

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      batch:
        description: Candidate-finance batch name
        required: false
        default: core
        type: string
      continuation:
        description: Internal bounded membership-tail continuation number
        required: false
        default: '0'
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.event_name == 'issue_comment' && (github.event.issue.number != 355 || github.event.comment.user.login != 'killjoy00' || !startsWith(github.event.comment.body, '[source-expansion-cfb-candidate-finance]')) && format('source-expansion-cfb-candidate-finance-skip-{0}', github.run_id) || 'source-expansion-cfb-candidate-finance' }}
  cancel-in-progress: false

jobs:
  backfill:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 355 &&
        github.event.comment.user.login == 'killjoy00' &&
        startsWith(github.event.comment.body, '[source-expansion-cfb-candidate-finance]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      VOTEPREDICT_CFB_CANDIDATE_FINANCE_BATCH_SIZE: '100'
      VOTEPREDICT_CFB_CANDIDATE_FINANCE_TAIL_GROUPS: '24'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit
      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1
      - name: Backfill bounded CFB candidate finance rows
        id: backfill
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_CFB_CANDIDATE_FINANCE_BATCH_REQUEST: ${{ github.event_name == 'issue_comment' && github.event.comment.body || format('batch={0}', inputs.batch) }}
        run: node --import tsx scripts/backfill-cfb-candidate-finance.ts
      - name: Continue membership-prioritized tail
        if: >-
          success() &&
          steps.backfill.outputs.tail_selected_groups != '' &&
          steps.backfill.outputs.tail_selected_groups != '0' &&
          steps.backfill.outputs.tail_remaining_groups != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CONTINUATION: ${{ github.event_name == 'workflow_dispatch' && inputs.continuation || '0' }}
          TAIL_REMAINING_GROUPS: ${{ steps.backfill.outputs.tail_remaining_groups }}
        run: |
          set -euo pipefail
          current="${CURRENT_CONTINUATION:-0}"
          if ! [[ "$current" =~ ^[0-9]+$ ]]; then
            current=0
          fi
          if (( current >= 29 )); then
            echo "Membership-tail continuation cap reached with ${TAIL_REMAINING_GROUPS} groups still reported."
            exit 0
          fi
          next=$((current + 1))
          gh workflow run source-expansion-cfb-candidate-finance.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f batch=membership-tail \
            -f continuation="$next"
      - name: Remove temporary credentials and logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env','vercel-pull.log']:
              Path(os.environ['RUNNER_TEMP'],name).unlink(missing_ok=True)
          PYTHON
