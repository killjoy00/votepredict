name: Live production smoke

on:
  push:
    branches:
      - ops/live-production-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production auth sign-in
        shell: bash
        run: |
          set -eu
          payload='{"email":"nobody-votepredict-smoke@example.com","password":"definitely-not-valid"}'
          for url in \
            "https://votepredict.vercel.app/api/auth/sign-in/email" \
            "https://ep-odd-haze-aebm7w42.neonauth.c-2.us-east-2.aws.neon.tech/votepredict/auth/sign-in/email"; do
            echo "===== ${url} ====="
            body="$(mktemp)"
            start="$(date +%s)"
            code="$(curl -sS --max-time 20 -o "$body" -w '%{http_code}' \
              -H 'content-type: application/json' \
              -H 'origin: https://votepredict.vercel.app' \
              --data "$payload" "$url" || true)"
            end="$(date +%s)"
            echo "HTTP ${code} elapsed=$((end-start))s"
            cat "$body" || true
            echo
            rm -f "$body"
          done
