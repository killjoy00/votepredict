name: Live production smoke

on:
  push:
    branches:
      - ops/live-production-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production owner setup
        shell: bash
        run: |
          set -eu
          health="$(mktemp)"
          setup="$(mktemp)"
          health_code="$(curl -sS -L --max-time 20 -o "$health" -w '%{http_code}' "https://votepredict.vercel.app/api/health")"
          setup_code="$(curl -sS -L --max-time 20 -o "$setup" -w '%{http_code}' "https://votepredict.vercel.app/auth/setup")"
          echo "health HTTP ${health_code}"
          cat "$health"
          echo
          echo "setup HTTP ${setup_code}"
          grep -o 'Create the VotePredict owner account' "$setup" | head -1 || true
          test "$health_code" = "200"
          grep -q '"database":"ok"' "$health"
          grep -q '"neonAuthBaseUrl":"configured"' "$health"
          grep -q '"neonAuthCookieSecret":"configured"' "$health"
          test "$setup_code" = "200"
          grep -q 'Create the VotePredict owner account' "$setup"
          rm -f "$health" "$setup"
