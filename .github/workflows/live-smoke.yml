name: Live production smoke

on:
  push:
    branches:
      - ops/live-production-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production bootstrap redirect
        shell: bash
        run: |
          set -eu
          headers="$(mktemp)"
          setup="$(mktemp)"
          sign_in_code="$(curl -sS --max-time 20 -D "$headers" -o /dev/null -w '%{http_code}' 'https://votepredict.vercel.app/auth/sign-in')"
          echo "sign-in HTTP ${sign_in_code}"
          cat "$headers"
          setup_code="$(curl -sS -L --max-time 20 -o "$setup" -w '%{http_code}' 'https://votepredict.vercel.app/auth/sign-in')"
          echo "followed HTTP ${setup_code}"
          grep -o 'Create the VotePredict owner account' "$setup" | head -1 || true
          test "$sign_in_code" = "307" -o "$sign_in_code" = "303" -o "$sign_in_code" = "302"
          grep -qi '^location: /auth/setup' "$headers"
          test "$setup_code" = "200"
          grep -q 'Create the VotePredict owner account' "$setup"
          rm -f "$headers" "$setup"
