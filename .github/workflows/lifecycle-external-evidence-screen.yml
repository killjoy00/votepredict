name: Lifecycle external evidence screen

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lifecycle-external-evidence-screen
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 310 &&
        github.event.comment.user.login == 'killjoy00' &&
        startsWith(github.event.comment.body, '[lifecycle-external-screen]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Materialize frozen external availability artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10777594276/zip > "$RUNNER_TEMP/lifecycle-external-availability.zip"
          unzip -p "$RUNNER_TEMP/lifecycle-external-availability.zip" accepted.ndjson > "$RUNNER_TEMP/lifecycle-external-availability-v1.ndjson"
          test "$(wc -l < "$RUNNER_TEMP/lifecycle-external-availability-v1.ndjson")" -eq 3525
      - name: Read production database environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1
      - name: Evaluate lifecycle external evidence
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_EXTERNAL_AVAILABILITY_FILE: ${{ runner.temp }}/lifecycle-external-availability-v1.ndjson
          VOTEPREDICT_EXTERNAL_SCREEN_OUTPUT_DIR: artifacts/lifecycle-external-evidence-screen-v1
        run: node --import tsx scripts/evaluate-lifecycle-external-evidence-screen.ts
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-external-evidence-screen-v1-${{ github.sha }}
          path: artifacts/lifecycle-external-evidence-screen-v1
          if-no-files-found: warn
      - name: Remove temporary credentials and logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env','vercel-pull.log','lifecycle-external-availability.zip','lifecycle-external-availability-v1.ndjson']:
              Path(os.environ['RUNNER_TEMP'],name).unlink(missing_ok=True)
          PYTHON
