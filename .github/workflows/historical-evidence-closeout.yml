name: Historical evidence closeout

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: historical-evidence-closeout-459
  cancel-in-progress: false

jobs:
  closeout:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 459 && contains(github.event.comment.body, '[historical-evidence-closeout]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j

    steps:
      - uses: actions/checkout@v7

      - name: Verify frozen #459 closeout contracts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          freeze='data/evaluation/historical-evidence-source-family-freeze-v1.json'
          plan='data/evaluation/quick-evidence-finance-enriched-historical-plan-v1.json'
          lineage='data/evaluation/quick-evidence-committee-rollcall-candidate-lineage-v1.json'

          test "$(jq -r '.schemaVersion' "$freeze")" = 'historical-evidence-source-family-freeze-v1'
          test "$(jq -r '.availabilityContract.strictlyPreCutoff' "$freeze")" = 'true'
          test "$(jq -r '.availabilityContract.transactionDatesAreAvailability' "$freeze")" = 'false'
          test "$(jq -r '.availabilityContract.productionAction' "$freeze")" = 'none'
          test "$(jq '.families | length' "$freeze")" = '8'

          test "$(jq -r '.schemaVersion' "$plan")" = 'quick-evidence-finance-enriched-historical-plan-v1'
          test "$(jq -r '.fit.lambda' "$plan")" = '20'
          test "$(jq -r '.fit.retuningAfterValidation' "$plan")" = 'false'
          test "$(jq -r '.financeAvailability.strictPreVoteOnly' "$plan")" = 'true'
          test "$(jq -r '.financeAvailability.transactionDateNeverAvailability' "$plan")" = 'true'
          test "$(jq -r '.interpretation.productionAction' "$plan")" = 'none'

          test "$(jq -r '.schemaVersion' "$lineage")" = 'quick-evidence-committee-rollcall-candidate-lineage-v1'
          run_id="$(jq -r '.extractionRunId' "$lineage")"
          artifact_id="$(jq -r '.candidateArtifact.id' "$lineage")"
          artifact_name="$(jq -r '.candidateArtifact.name' "$lineage")"
          expected_digest="$(jq -r '.candidateArtifact.digest' "$lineage")"
          expected_sha="$(jq -r '.extractionHeadSha' "$lineage")"
          test "$(jq -r '.policy.outcomeUseBeforeThisStage' "$lineage")" = 'none'
          test "$(jq -r '.policy.productionAction' "$lineage")" = 'none'

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "$RUNNER_TEMP/committee-run.json"
          test "$(jq -r '.head_sha' "$RUNNER_TEMP/committee-run.json")" = "$expected_sha"
          test "$(jq -r '.conclusion' "$RUNNER_TEMP/committee-run.json")" = 'success'
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > "$RUNNER_TEMP/committee-artifacts.json"
          actual="$(jq -c --argjson id "$artifact_id" '.artifacts[] | select(.id == $id)' "$RUNNER_TEMP/committee-artifacts.json")"
          test -n "$actual"
          test "$(printf '%s' "$actual" | jq -r '.name')" = "$artifact_name"
          test "$(printf '%s' "$actual" | jq -r '.digest')" = "$expected_digest"
          test "$(printf '%s' "$actual" | jq -r '.expired')" = 'false'

          echo "committee_run_id=$run_id" >> "$GITHUB_ENV"
          echo "committee_artifact_name=$artifact_name" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-fund --no-audit

      - name: Download frozen committee feature corpus
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.committee_artifact_name }}
          path: inputs/committee
          github-token: ${{ github.token }}
          run-id: ${{ env.committee_run_id }}

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          umask 077
          for attempt in 1 2 3; do
            if npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1; then
              exit 0
            fi
            if [ "$attempt" != 3 ]; then sleep 5; fi
          done
          echo 'Could not read the VotePredict production environment. No closeout diagnostic was run.'
          exit 1

      - name: Build canonical historical matrix and fixed finance diagnostic
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/closeout-historical-evidence.ts \
            --committee-candidates inputs/committee/quick-evidence-committee-rollcall-candidates-v1.json \
            --committee-lineage data/evaluation/quick-evidence-committee-rollcall-candidate-lineage-v1.json \
            --output-dir artifacts/historical-evidence-closeout

      - name: Verify closeout artifacts
        shell: bash
        run: |
          set -euo pipefail
          dir='artifacts/historical-evidence-closeout'
          manifest="$dir/historical-as-of-matrix-v1-manifest.json"
          diagnostic="$dir/quick-evidence-finance-enriched-historical-diagnostic-v1.json"
          test -s "$dir/historical-as-of-matrix-v1.ndjson.gz"
          test "$(jq -r '.schemaVersion' "$manifest")" = 'historical-as-of-matrix-v1-manifest'
          test "$(jq -r '.featureCount' "$manifest")" = '37'
          test "$(jq -r '.baseFeatureCount' "$manifest")" = '32'
          test "$(jq -r '.financeFeatureCount' "$manifest")" = '5'
          test "$(jq -r '.strictPreCutoffEvidenceOnly' "$manifest")" = 'true'
          test "$(jq -r '.sameDayFinanceExcluded' "$manifest")" = 'true'
          test "$(jq -r '.transactionDateIsAvailability' "$manifest")" = 'false'
          test "$(jq -r '.productionAction' "$manifest")" = 'none'

          test "$(jq -r '.schemaVersion' "$diagnostic")" = 'quick-evidence-finance-enriched-historical-diagnostic-v1'
          test "$(jq -r '.fixedProtocol.lambda' "$diagnostic")" = '20'
          test "$(jq -r '.fixedProtocol.lambdaRetunedAfterValidation' "$diagnostic")" = 'false'
          test "$(jq -r '.financeSourceCoverage.transactionDateUsedAsAvailability' "$diagnostic")" = 'false'
          test "$(jq -r '.financeSourceCoverage.strictPreVoteOnly' "$diagnostic")" = 'true'
          test "$(jq -r '.productionAction' "$diagnostic")" = 'none'
          test "$(jq -r '.servingQuickChanged' "$diagnostic")" = 'false'
          test "$(jq -r '.automaticPromotion' "$diagnostic")" = 'false'

      - name: Upload immutable #459 closeout artifacts
        uses: actions/upload-artifact@v7
        with:
          name: historical-evidence-closeout-${{ github.sha }}
          path: |
            artifacts/historical-evidence-closeout/historical-as-of-matrix-v1.ndjson.gz
            artifacts/historical-evidence-closeout/historical-as-of-matrix-v1-manifest.json
            artifacts/historical-evidence-closeout/quick-evidence-finance-enriched-historical-diagnostic-v1.json
          if-no-files-found: error
          retention-days: 90

      - name: Post completion marker
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 459 --repo "$GITHUB_REPOSITORY" --body "[historical-evidence-closeout-complete] Canonical historical as-of matrix and fixed finance-enriched diagnostic completed successfully on \`$GITHUB_SHA\`. Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Remove temporary credentials and lookups
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/votepredict-production.env" \
            "$RUNNER_TEMP/vercel-pull.log" \
            "$RUNNER_TEMP/committee-run.json" \
            "$RUNNER_TEMP/committee-artifacts.json"
