name: Patch probability display guard (temporary)

on:
  push:
    branches:
      - fix/no-false-100-display

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/no-false-100-display
      - name: Replace false-certainty formatting
        shell: bash
        run: |
          set -eu
          perl -0pi -e 's/function formatProbability\(value: number \| undefined\): string \{\n  if \(value === undefined\) return .—.;\n  return `\$\{Math\.round\(value \* 100\)\}%`;\n\}/function formatProbability(value: number | undefined): string {\n  if (value === undefined) return '\''—'\'';\n  if (value >= 0.995) return '\''>99%'\'';\n  if (value <= 0.005) return '\''<1%'\'';\n  return `\${Math.round(value * 100)}%`;\n}/' src/app/dashboard/forecast-workspace.tsx
          perl -0pi -e 's/function probability\(value: number \| undefined\) \{\n  return value === undefined \? .—. : `\$\{Math\.round\(value \* 100\)\}%`;\n\}/function probability(value: number | undefined) {\n  if (value === undefined) return '\''—'\'';\n  if (value >= 0.995) return '\''>99%'\'';\n  if (value <= 0.005) return '\''<1%'\'';\n  return `\${Math.round(value * 100)}%`;\n}/' 'src/app/share/[token]/page.tsx'
          grep -A5 'function formatProbability' src/app/dashboard/forecast-workspace.tsx
          grep -A5 'function probability' 'src/app/share/[token]/page.tsx'
      - name: Commit patch
        shell: bash
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/dashboard/forecast-workspace.tsx 'src/app/share/[token]/page.tsx'
          git diff --cached --exit-code && { echo 'Patch made no changes'; exit 1; } || true
          git commit -m 'fix: never display model estimates as literal certainty [skip patch]'
          git push origin HEAD:fix/no-false-100-display
