name: Historical Deep House Journal holdout cohort

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/historical-deep-house-journal-holdout-cohort.yml
      - data/evaluation/historical-deep-house-journal-holdout-plan-v1.json
      - scripts/run-production-historical-deep-house-journal-holdout-cohort.ts
      - src/app/api/operations/historical-deep-house-journal-holdout-cohort/route.ts
      - src/evaluation/historical-deep-house-journal-holdout-cohort.ts
      - src/evaluation/historical-deep-expansion-cohort.ts
      - src/evaluation/historical-deep-target-strategies.ts
      - src/evaluation/historical-deep-targets.ts
      - src/evaluation/historical-quick-runtime.ts
      - src/evaluation/historical-quick-replay.ts
      - src/evidence/targeting.ts
      - tests/historical-deep-house-journal-holdout-cohort.test.ts
      - docs/evaluation/historical-deep-house-journal-holdout-validation-v1.md
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: historical-deep-house-journal-holdout-cohort
  cancel-in-progress: false

jobs:
  cohort:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      VOTEPREDICT_HOUSE_JOURNAL_HOLDOUT_COHORT_OUTPUT: artifacts/historical-deep-house-journal-holdout-cohort-v1.json
    steps:
      - uses: actions/checkout@v7
      - name: Verify predeclared development-score lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plan='data/evaluation/historical-deep-house-journal-holdout-plan-v1.json'
          test "$(jq -r '.schemaVersion' "$plan")" = 'historical-deep-house-journal-holdout-plan-v1'
          test "$(jq -r '.cohort.sessions | join(",")' "$plan")" = '2025-2026'
          test "$(jq -r '.cohort.chamber' "$plan")" = 'house'
          test "$(jq -r '.cohort.perSessionPerTranche' "$plan")" = '12'
          test "$(jq -r '.cohort.expectedSelectedCases' "$plan")" = '24'
          test "$(jq -r '.primaryHypotheses | length' "$plan")" = '3'
          artifact_id="$(jq -r '.developmentScoreArtifact.artifactId' "$plan")"
          expected="sha256:$(jq -r '.developmentScoreArtifact.artifactSha256' "$plan")"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" > "$RUNNER_TEMP/development-score-artifact.json"
          test "$(jq -r '.expired' "$RUNNER_TEMP/development-score-artifact.json")" = 'false'
          test "$(jq -r '.digest' "$RUNNER_TEMP/development-score-artifact.json")" = "$expected"
      - name: Require the existing Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'VERCEL_TOKEN is unavailable. No House Journal holdout cohort was attempted.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Wait for this exact main SHA to be live in production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            http_code="$(curl \
              --silent \
              --show-error \
              --output "$RUNNER_TEMP/vercel-deployments.json" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=20&teamId=${VERCEL_ORG_ID}")"
            if [ "$http_code" != "200" ]; then
              echo "Vercel deployment lookup returned HTTP ${http_code}."
              exit 1
            fi
            match="$(jq -c --arg sha "$GITHUB_SHA" '[.deployments[]? | select(.target == "production" and .meta.githubCommitSha == $sha)] | first // empty' "$RUNNER_TEMP/vercel-deployments.json")"
            if [ -n "$match" ]; then
              state="$(printf '%s' "$match" | jq -r '.state // "UNKNOWN"')"
              if [ "$state" = "READY" ]; then
                echo "Exact main SHA ${GITHUB_SHA} is READY in production."
                exit 0
              fi
              if [ "$state" = "ERROR" ] || [ "$state" = "CANCELED" ]; then
                echo "Production deployment for ${GITHUB_SHA} entered ${state}."
                exit 1
              fi
            fi
            sleep 5
          done
          echo "Exact main SHA ${GITHUB_SHA} did not become READY before the holdout-cohort deadline."
          exit 1
      - name: Read production operation secret privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1; then
            echo 'Could not read the VotePredict production environment. No holdout cohort was run.'
            exit 1
          fi
      - name: Freeze outcome-blind 2025-2026 House holdout cohort
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/run-production-historical-deep-house-journal-holdout-cohort.ts
      - name: Verify holdout freeze guardrails
        shell: bash
        run: |
          set -euo pipefail
          file='artifacts/historical-deep-house-journal-holdout-cohort-v1.json'
          test "$(jq -r '.schemaVersion' "$file")" = 'historical-deep-house-journal-holdout-cohort-v1'
          test "$(jq -r '.metadata.sessions | join(",")' "$file")" = '2025-2026'
          test "$(jq -r '.metadata.chamber' "$file")" = 'house'
          test "$(jq -r '.metadata.perSessionPerTranche' "$file")" = '12'
          test "$(jq -r '.metadata.totalSelected' "$file")" = '24'
          test "$(jq '.cases | length' "$file")" = '24'
          test "$(jq '[.cases[] | select(.session != "2025-2026" or .chamber != "house")] | length' "$file")" = '0'
          test "$(jq '[.cases[] | select(.tranche == "deterministic-uniform")] | length' "$file")" = '12'
          test "$(jq '[.cases[] | select(.tranche == "selector-disagreement")] | length' "$file")" = '12'
          test "$(jq '[.cases[].stableKey] | unique | length' "$file")" = '24'
          test "$(jq -r '.metadata.poolBySession["2025-2026"]' "$file")" -ge 24
          if jq -e '.. | objects | select(has("actualOutcome") or has("actualYes") or has("actualNo") or has("passed") or has("mechanic") or has("journalDate") or has("finalPassageInference") or has("mechanicallyActionable"))' "$file" >/dev/null; then
            echo 'Holdout cohort leaked outcome or Journal-mechanic fields.'
            exit 1
          fi
      - name: Upload frozen House Journal holdout cohort
        uses: actions/upload-artifact@v4
        with:
          name: historical-deep-house-journal-holdout-cohort-v1-${{ github.sha }}
          path: artifacts/historical-deep-house-journal-holdout-cohort-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary credentials and lookup files
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env', 'vercel-pull.log', 'vercel-deployments.json', 'development-score-artifact.json']:
              Path(os.environ['RUNNER_TEMP'], name).unlink(missing_ok=True)
          PYTHON
