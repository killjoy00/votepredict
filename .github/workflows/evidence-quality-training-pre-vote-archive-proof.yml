name: Audit Evidence Quality 2021-22 training archive proof

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  actions: read

concurrency:
  group: >-
    ${{ startsWith(github.event.comment.body, '[evidence-quality-training-pre-vote-archive-proof]')
        && 'evidence-quality-training-pre-vote-archive-proof'
        || format('evidence-quality-training-pre-vote-archive-proof-skip-{0}', github.event.comment.id) }}
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event.issue.number == 579 &&
      github.event.comment.user.login == 'killjoy00' &&
      startsWith(github.event.comment.body, '[evidence-quality-training-pre-vote-archive-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Materialize frozen v1.4 training-gap inventory
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11317004477/zip > "$RUNNER_TEMP/evidence-quality-pre-vote-candidate-inventory-v1-4.zip"
          echo "f3ec4d6038ecb677c9b460a62a8d6aedba5cc2c80e15b83e8d85d0d7483a3da6  $RUNNER_TEMP/evidence-quality-pre-vote-candidate-inventory-v1-4.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/evidence-quality-pre-vote-candidate-inventory-v1-4"
          unzip -q "$RUNNER_TEMP/evidence-quality-pre-vote-candidate-inventory-v1-4.zip" -d "$RUNNER_TEMP/evidence-quality-pre-vote-candidate-inventory-v1-4"

      - name: Run read-only 2021-22 training archive proof audit
        env:
          VOTEPREDICT_EQ_PRE_VOTE_INVENTORY_PATH: ${{ runner.temp }}/evidence-quality-pre-vote-candidate-inventory-v1-4/evidence-quality-pre-vote-candidate-inventory-v1.4.json
          VOTEPREDICT_EQ_PRE_VOTE_INVENTORY_ARTIFACT_ID: "11317004477"
          VOTEPREDICT_EQ_PRE_VOTE_INVENTORY_ARTIFACT_DIGEST: "sha256:f3ec4d6038ecb677c9b460a62a8d6aedba5cc2c80e15b83e8d85d0d7483a3da6"
          VOTEPREDICT_EQ_ARCHIVE_AUDIT_MODE: "training_2021_2022"
          VOTEPREDICT_EQ_ARCHIVE_PROOF_DIR: ${{ runner.temp }}/evidence-quality-training-pre-vote-archive-proof
          VOTEPREDICT_EQ_ARCHIVE_CDX_LIMIT: "500"
          VOTEPREDICT_EQ_ARCHIVE_FETCH_LIMIT_PER_SOURCE: "16"
          VOTEPREDICT_EQ_ARCHIVE_CONCURRENCY: "3"
        run: node --import tsx scripts/audit-evidence-quality-pre-vote-archive-proof.ts

      - name: Upload training archive proof audit
        uses: actions/upload-artifact@v7
        with:
          name: evidence-quality-training-pre-vote-archive-proof-v1
          path: ${{ runner.temp }}/evidence-quality-training-pre-vote-archive-proof/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove frozen input artifact
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/evidence-quality-pre-vote-candidate-inventory-v1-4.zip"
