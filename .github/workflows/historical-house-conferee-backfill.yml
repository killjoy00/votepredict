name: Historical House conferee backfill

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/historical-house-conferee-backfill.yml
      - scripts/backfill-historical-house-conferees.ts
      - src/evidence/minnesota-floor-conference.ts
      - tests/structured-public-evidence.test.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-house-conferee-backfill-v1
  cancel-in-progress: false

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-fund --no-audit

      - name: Require Vercel credential
        shell: bash
        run: test -n "${VERCEL_TOKEN:-}"

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Backfill dated House conferee appointments
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/backfill-historical-house-conferees.ts

      - name: Remove temporary production files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/votepredict-production.env" "$RUNNER_TEMP/vercel-pull.log"
