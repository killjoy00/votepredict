name: Compact CFB snapshot (temporary)

on:
  push:
    branches:
      - feat/cfb-snapshot-cache

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip snapshot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cfb-snapshot-cache
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build snapshot
        run: node scripts/build-cfb-snapshot.mjs
      - name: Commit snapshot
        shell: bash
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cfb-2025-2026-snapshot.json
          git commit -m 'data: compact CFB 2025-2026 snapshot [skip snapshot]'
          git push origin HEAD:feat/cfb-snapshot-cache
