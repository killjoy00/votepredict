name: One-shot recovery of exactly 41 official raw bill authorship failures

on:
  pull_request:
    paths:
      - src/operations/senate-bill-authors-html-recovery.ts
      - scripts/recover-senate-bill-authors-41-neon.ts
      - tests/senate-bill-authors-41-recovery.test.ts
      - .github/workflows/senate-bill-authors-41-recovery.yml
  push:
    branches: [main]
    paths:
      - src/operations/senate-bill-authors-html-recovery.ts
      - scripts/recover-senate-bill-authors-41-neon.ts
      - tests/senate-bill-authors-41-recovery.test.ts
      - .github/workflows/senate-bill-authors-41-recovery.yml

permissions:
  contents: read

# Share the old collector's concurrency group so recovery can never overlap it.
concurrency:
  group: senate-bill-authors-production
  cancel-in-progress: false

jobs:
  pr-keyless:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run check
      - run: npm test

  independent-main:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.repository.full_name == 'killjoy00/votepredict' &&
      github.event.repository.default_branch == 'main' &&
      github.event.after == github.sha &&
      github.event.head_commit.id == github.sha &&
      github.event.deleted != true &&
      github.event.forced != true &&
      contains(github.event.head_commit.message, 'SENATE_BILL_AUTHORS_41_HTML_RECOVERY')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  protected-neon-recover-41:
    needs: [independent-main]
    if: >-
      needs.independent-main.result == 'success' &&
      github.event_name == 'push' &&
      github.repository == 'killjoy00/votepredict' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.repository.default_branch == 'main' &&
      github.event.after == github.sha &&
      github.event.head_commit.id == github.sha &&
      github.event.deleted != true &&
      github.event.forced != true &&
      contains(github.event.head_commit.message, 'SENATE_BILL_AUTHORS_41_HTML_RECOVERY')
    environment: evidence-readonly-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VOTEPREDICT_NEON_PROJECT_ID: ${{ vars.VOTEPREDICT_NEON_PROJECT_ID }}
      VOTEPREDICT_MEDIA_EXISTING_DATABASE: ${{ vars.VOTEPREDICT_MEDIA_EXISTING_DATABASE }}
      VOTEPREDICT_AUTHORS_41_RECOVERY_INDEPENDENT_CI: ${{ needs.independent-main.result == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Validate exactly 41 official HTML captures then atomically recover only the failed authorship scans
        run: node --import tsx scripts/recover-senate-bill-authors-41-neon.ts
