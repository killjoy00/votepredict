name: Original Minnesota Revenue 2023-24 PCR report senator committee identities
on:
  pull_request:
    paths:
      - .github/workflows/cfb-original-2023-24-revenue-pcr-committee-identity.yml
      - src/evidence/cfb-2023-24-original-revenue-pcr-proof.ts
      - scripts/acquire-cfb-2023-24-original-revenue-pcr-committee-proof.ts
      - tests/cfb-2023-24-original-revenue-pcr-proof.test.ts
      - docs/evaluation/cfb-2023-24-original-revenue-pcr-committee-evidence.md
      - docs/evaluation/source-proof/cfb-2023-24-original-revenue-pcr-committee-*.json
      - docs/evaluation/source-proof/cfb-2023-24-original-revenue-pcr-committee-*.psv
permissions:
  contents: read
jobs:
  verify-original-dated-department-of-revenue-pcr-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: node --import tsx --test tests/cfb-2023-24-original-revenue-pcr-proof.test.ts
      - run: node --import tsx scripts/acquire-cfb-2023-24-original-revenue-pcr-committee-proof.ts --output artifacts/cfb-2023-24-original-revenue-pcr-committee-proof.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-2023-24-mn-revenue-pcr-two-pdf-hashes-and-22-senator-identities
          path: artifacts/cfb-2023-24-original-revenue-pcr-committee-proof.json
          if-no-files-found: warn
          retention-days: 30
