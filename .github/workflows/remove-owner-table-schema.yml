name: Remove owner table schema

on:
  push:
    branches:
      - fix/database-owner-claim

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove obsolete schema line
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = 'src/lib/db/schema.ts';
          let value = fs.readFileSync(path, 'utf8');
          value = value.replace("\nexport const ownerIdentity = pgTable('votepredict_owner_identity', { singleton: boolean('singleton').primaryKey().default(true), userId: text('user_id').notNull().unique(), email: text('email').notNull().unique(), createdAt: createdAt() });\n", "\n");
          fs.writeFileSync(path, value);
          JS
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/db/schema.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "db: remove obsolete owner table schema"
          git push origin HEAD:fix/database-owner-claim
