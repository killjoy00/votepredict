name: Source expansion CFB current report validation

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'issue_comment' && (github.event.issue.number != 355 || github.event.comment.user.login != 'killjoy00' || !startsWith(github.event.comment.body, '[source-expansion-cfb-current-report-validation]')) && format('source-expansion-cfb-current-report-validation-skip-{0}', github.run_id) || 'source-expansion-cfb-current-report-validation' }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 355 &&
        github.event.comment.user.login == 'killjoy00' &&
        startsWith(github.event.comment.body, '[source-expansion-cfb-current-report-validation]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VOTEPREDICT_CFB_CURRENT_REPORT_VALIDATION_REPORTS: '6'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit
      - name: Validate official CFB current-report availability proofs
        run: node --import tsx scripts/validate-cfb-current-report-proofs.ts
