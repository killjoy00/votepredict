name: Generate Next 16.4.0 lockfile

on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/generate-next-16-4-lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve package lock
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Show resolved Next version
        run: node -e "const l=require('./package-lock.json'); console.log(l.packages['node_modules/next'].version)"
      - uses: actions/upload-artifact@v7
        with:
          name: next-16-4-lockfile
          path: package-lock.json
          if-no-files-found: error
