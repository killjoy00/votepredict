name: Generate Next 16.4.0 lockfile

on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/generate-next-16-4-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve package lock
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Verify resolved Next version
        run: |
          test "$(node -e "console.log(require('./package-lock.json').packages['node_modules/next'].version)")" = "16.4.0"
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update lockfile for Next.js 16.4.0"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
