name: Plan Evidence Quality granular availability repair

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  actions: read

concurrency:
  group: >-
    ${{ startsWith(github.event.comment.body, '[evidence-quality-granular-availability-plan]')
        && 'evidence-quality-granular-availability-plan'
        || format('evidence-quality-granular-availability-plan-skip-{0}', github.event.comment.id) }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event.issue.number == 579 &&
      github.event.comment.user.login == 'killjoy00' &&
      startsWith(github.event.comment.body, '[evidence-quality-granular-availability-plan]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit

      - name: Materialize final canonical archive proof
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11316021651/zip > "$RUNNER_TEMP/evidence-quality-pre-vote-archive-proof-canonical-v2.zip"
          echo "05aaeca085fa1d48a85a3226565eaad627bce8d33c248c055ac4e9963fffdc44  $RUNNER_TEMP/evidence-quality-pre-vote-archive-proof-canonical-v2.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/evidence-quality-pre-vote-archive-proof-canonical-v2"
          unzip -q "$RUNNER_TEMP/evidence-quality-pre-vote-archive-proof-canonical-v2.zip" -d "$RUNNER_TEMP/evidence-quality-pre-vote-archive-proof-canonical-v2"

      - name: Read production environment privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1

      - name: Build read-only granular repair plan
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
          VOTEPREDICT_EQ_CANONICAL_PROOF_V2_PATH: ${{ runner.temp }}/evidence-quality-pre-vote-archive-proof-canonical-v2/evidence-quality-pre-vote-archive-proof-canonical-v2.json
          VOTEPREDICT_EQ_CANONICAL_PROOF_V2_RUN_ID: "37236630590"
          VOTEPREDICT_EQ_CANONICAL_PROOF_V2_ARTIFACT_ID: "11316021651"
          VOTEPREDICT_EQ_CANONICAL_PROOF_V2_ARTIFACT_DIGEST: "sha256:05aaeca085fa1d48a85a3226565eaad627bce8d33c248c055ac4e9963fffdc44"
          VOTEPREDICT_EQ_GRANULAR_AVAILABILITY_PLAN_DIR: ${{ runner.temp }}/evidence-quality-granular-availability-repair-plan
        run: node --import tsx scripts/plan-evidence-quality-granular-availability-repair.ts

      - name: Upload granular availability repair plan
        uses: actions/upload-artifact@v7
        with:
          name: evidence-quality-granular-availability-repair-plan-v1
          path: ${{ runner.temp }}/evidence-quality-granular-availability-repair-plan/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary credentials and proof artifact
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/votepredict-production.env" "$RUNNER_TEMP/vercel-pull.log" "$RUNNER_TEMP/evidence-quality-pre-vote-archive-proof-canonical-v2.zip"
