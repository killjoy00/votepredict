name: Production evidence refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/evidence-refresh.yml
      - scripts/run-production-evidence-refresh.ts
      - src/app/api/operations/evidence-refresh/route.ts
      - src/evidence/production-refresh.ts
      - src/evidence/live-campaign-finance-refresh.ts
      - src/evidence/durable-ingestion.ts
      - src/evidence/campaign-finance-snapshot.ts
      - src/evidence/campaign-finance-live.ts
      - src/operations/environment-file.ts
      - src/sources/minnesota/revisor.ts
      - src/sources/minnesota/sessions.ts
      - data/cfb-2025-2026-snapshot.json
      - data/evidence/**
      - package.json
permissions:
  contents: read
concurrency:
  group: production-evidence-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
    steps:
      - uses: actions/checkout@v7
      - name: Require the existing Vercel credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN is unavailable to this repository. No production evidence was changed.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Deploy main before runtime evidence refresh
        shell: bash
        run: |
          if ! npx --yes vercel@59.13.1 deploy --prod --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-deploy.log" 2>&1; then
            echo 'Production deployment failed; no evidence refresh was invoked.'
            exit 1
          fi
          echo 'Production deployment completed before evidence refresh.'
      - name: Read production authentication privately
        shell: bash
        run: |
          umask 077
          if ! npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1; then
            echo 'Could not read the VotePredict production authentication environment. No evidence refresh was invoked.'
            exit 1
          fi
      - name: Invoke authenticated production evidence refresh
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: node --import tsx scripts/run-production-evidence-refresh.ts
      - name: Remove temporary credentials and deployment logs
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env', 'vercel-pull.log', 'vercel-deploy.log']:
              Path(os.environ['RUNNER_TEMP'], name).unlink(missing_ok=True)
          PYTHON
