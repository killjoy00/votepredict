name: Production evidence refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/evidence-refresh.yml
      - scripts/build-cfb-snapshot.mjs
      - scripts/ingest-cfb-evidence.ts
      - scripts/ingest-evidence-manifest.ts
      - scripts/seed-evidence-bills.ts
      - src/evidence/durable-ingestion.ts
      - src/operations/environment-file.ts
      - src/sources/minnesota/revisor.ts
      - data/evidence/**
      - package.json
permissions:
  contents: read
concurrency:
  group: production-evidence-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_ahLcbRLMMwZD6LzyuO61aOTnnb8j
    steps:
      - uses: actions/checkout@v7
      - name: Require the existing Vercel credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN is unavailable to this repository. No production evidence was changed.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Read production environment privately
        shell: bash
        run: |
          umask 077
          if ! npx --yes vercel@59.13.1 env pull "$RUNNER_TEMP/votepredict-production.env" --environment=production --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-pull.log" 2>&1; then
            echo 'Could not read the VotePredict production environment using VERCEL_TOKEN. No production evidence was changed.'
            exit 1
          fi
      - name: Build current official campaign-finance snapshot
        run: node scripts/build-cfb-snapshot.mjs "$RUNNER_TEMP/cfb-evidence.json"
      - name: Persist official campaign-finance evidence
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: npm run data:cfb:evidence -- --snapshot="$RUNNER_TEMP/cfb-evidence.json"
      - name: Seed canonical bills referenced by official evidence
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: npm run data:evidence:bills -- --manifest=data/evidence/gambling-curated-v1.json
      - name: Persist curated sourced gambling evidence
        env:
          VOTEPREDICT_PRODUCTION_ENV_FILE: ${{ runner.temp }}/votepredict-production.env
        run: npm run data:evidence:curated -- --manifest=data/evidence/gambling-curated-v1.json
      - name: Remove temporary source and credential files
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          for name in ['votepredict-production.env', 'vercel-pull.log', 'cfb-evidence.json']:
              Path(os.environ['RUNNER_TEMP'], name).unlink(missing_ok=True)
          PYTHON
