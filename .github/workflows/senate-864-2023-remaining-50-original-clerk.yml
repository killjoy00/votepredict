name: '#864 remaining 50 original 2023 Senate Clerk minutes (2022-25 scope)'
on:
  pull_request:
    paths:
      - src/evidence/senate-864-2023-remaining-clerk-original-source.ts
      - scripts/audit-senate-864-remaining-2023-fifty-original-clerk-minutes.ts
      - tests/senate-864-2023-remaining-fifty-original-clerk.test.ts
      - docs/evaluation/source-proof/senate-864-2023-remaining-fifty-original-source-receipts.json
      - docs/evaluation/senate-864-2022-25-remaining-written-minute-recovery.md
      - .github/workflows/senate-864-2023-remaining-50-original-clerk.yml
permissions:
  contents: read
  actions: read
jobs:
  original-state-2023-fifty-no-pdf:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: TypeScript source-only and synthetic original Clerk date/motion proofs
        run: |
          npx tsc --noEmit
          node --import tsx --test tests/senate-864-2023-remaining-fifty-original-clerk.test.ts
      - name: Download original immutable 2022-25 LRL meeting-index census
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '11674762938'
          repository: killjoy00/votepredict
          run-id: 38065594898
          github-token: ${{ github.token }}
          path: artifacts
          merge-multiple: true
      - name: Strict 141-source-census original SHA crosswalk and fresh 50 original state Clerk/combined-calendar bodies
        run: |
          node --import tsx scripts/audit-senate-864-remaining-2023-fifty-original-clerk-minutes.ts \
            --source-index artifacts/senate-2021-25-official-meeting-census.json \
            --output artifacts/senate-864-2023-50-original-government-Clerk-source-reconciliation.json
      - name: Preserve source-original SHA and held-source rows without raw HTML or member names
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senate-864-2023-fifty-original-government-clerk-2022-25-scope
          path: artifacts/senate-864-2023-50-original-government-Clerk-source-reconciliation.json
          if-no-files-found: ignore
          retention-days: 30
