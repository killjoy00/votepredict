name: One-time original 2021 Senate Journal Rule12.10 SF910 committee roll

# Real March8 2021 Senate Journal COMMITTEE report; NOT Senate floor
# or private VotePredict stored individual vote ingestion.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2021-rule1210-sf910-original-journal.yml

permissions:
  contents: read

jobs:
  verify-2021-original-sf910-committee:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Fetch exact 2021 March 8 Senate Journal PDF and verify original SF910 Rule12.10 motion
        run: |
          node --import tsx scripts/review-senate-2021-rule1210-sf910-original-journal-committee.ts \
            --output artifacts/2021-senate-sf910-rule1210/original-sf910-committee-named-roll.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2021-original-sf910-rule1210-committee-roll
          path: artifacts/2021-senate-sf910-rule1210/original-sf910-committee-named-roll.json
          retention-days: 30
          if-no-files-found: error
