name: One-time retry original 2025 Elections April08 SF2384 A11 scoped 10-0-1 source

# Previously FAILED #38148643214 is preserved. A new source run must not
# overwrite/replace its artifact or silently reinterpret its conclusion.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2025-elections-apr08-a11-scoped-retry.yml

permissions:
  contents: read

jobs:
  inspect-original-apr08-a11-scoped-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Reverify one exact original April08 PDF and scope A11 motion-tally partition
        run: |
          node --import tsx scripts/review-senate-2025-elections-apr08-a11-original.ts \
            --output artifacts/apr08-a11-scoped-retry/senate-2025-apr08-sf2384-a11-10-0-1-scoped-retry-source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2025-apr08-original-sf2384-a11-scoped-retry-source
          path: artifacts/apr08-a11-scoped-retry/senate-2025-apr08-sf2384-a11-10-0-1-scoped-retry-source.json
          retention-days: 30
          if-no-files-found: error
