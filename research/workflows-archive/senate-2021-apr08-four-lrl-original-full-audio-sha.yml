name: Original 2021 April 8 Senate four historical LRL MP3 complete-binary SHA proof

# Four exact, authentic original public LRL Senate 2021 Apr 8 audio files.
# 160MiB/file hard cap, exact 64KiB original-source SHA prefix gate, local
# ffprobe duration, private temporary download removed before artifact upload.
# No transcribed speech, named member votes, production databases, or 2027.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2021-apr08-four-lrl-original-full-audio-sha.yml

permissions:
  contents: read

jobs:
  independently-authenticate-four-whole-original-apr08-senate-audio-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Acquire exact original complete MP3s, verify independent first original SHA, hash and probe time locally
        run: |
          node --import tsx scripts/audit-senate-2021-apr08-four-original-lrl-audio-full-binaries.ts \
            --output artifacts/2021-senate-apr08-four-original-complete-mp3-source-proof/source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2021-apr08-four-whole-original-audio-source-only-metadata
          path: artifacts/2021-senate-apr08-four-original-complete-mp3-source-proof/source.json
          retention-days: 30
          if-no-files-found: error
