name: Recover two further actual 2021-serving State Senators 2020 original campaign websites

# One-shot verified public historical pages, not 2026 live website stances.
# No secrets, DB, model, forecast, scheduler or public office contact.
on:
  pull_request:
    paths:
      - .github/workflows/acquire-two-more-2021-senators-2020-original-campaign-html.yml
      - data/evaluation/senate-two-more-2021-senators-2020-first-party-original-domain-leads-v1.json
      - scripts/acquire-two-more-2021-senators-2020-candidate-html.ts
      - scripts/run-two-more-2021-senators-2020-candidate-html.ts
      - tests/senate-two-more-2021-senators-2020-candidate-originals.test.ts
      - docs/SENATE_KENT_EKEN_BILL_INGEBRIGTSEN_2020_ORIGINAL_SITES.md
permissions:
  contents: read
  actions: read
jobs:
  original-2020-archive-two-new-2021-serving-senators:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict' &&
      github.event.pull_request.head.ref == 'audit/864-two-further-2021-senators-2020-original-campaign-domains-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Obtain original authenticated official Minnesota Senate service directory and UTC/SHA receipt
        uses: actions/download-artifact@v4
        with:
          run-id: 38094976711
          name: senate-2021-25-ever-served-only-source-coverage-v2
          github-token: ${{ github.token }}
          path: originals/official-senate-directory
      - name: Rehash entire ACTUAL served-senator LRL original before two candidate campaign archival queries
        shell: bash
        timeout-minutes: 19
        run: |
          set -euo pipefail
          original="$(find originals/official-senate-directory -type f -name mn-lrl-official-senate-service-directory.html -print -quit)"
          receipt="$(find originals/official-senate-directory -type f -name mn-lrl-official-senate-service-directory-audit.json -print -quit)"
          test -n "$original" && test -n "$receipt"
          test "$(dirname "$original")" = "$(dirname "$receipt")"
          node --import tsx scripts/run-two-more-2021-senators-2020-candidate-html.ts \
            --lrl-directory-html "$original" \
            --lrl-original-source-receipt "$receipt" \
            --output-dir originals/two-more-2021-senators-2020-original-archive
      - name: Retain dated original archive requests, genuine CDX source indices and hash-reconciled HTML originals
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: senate-two-more-2021-senators-2020-original-candidate-html-v1
          path: originals/two-more-2021-senators-2020-original-archive/
          if-no-files-found: warn
          retention-days: 30
