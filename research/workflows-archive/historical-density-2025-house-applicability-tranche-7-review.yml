name: Freeze reviewed 2025 House applicability tranche 7

on:
  pull_request:
    paths:
      - data/evaluation/evidence-quality/historical-density-2025-house-applicability-tranche-7-decisions-v1.json
      - scripts/freeze-historical-density-2025-house-applicability-tranche-7-review.ts
      - tests/historical-density-2025-house-applicability-tranche-7-review.test.ts
      - .github/workflows/historical-density-2025-house-applicability-tranche-7-review.yml
  push:
    branches: [main]
    paths:
      - data/evaluation/evidence-quality/historical-density-2025-house-applicability-tranche-7-decisions-v1.json
      - scripts/freeze-historical-density-2025-house-applicability-tranche-7-review.ts
      - tests/historical-density-2025-house-applicability-tranche-7-review.test.ts
      - .github/workflows/historical-density-2025-house-applicability-tranche-7-review.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-2025-house-applicability-tranche-7-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Test checked-in tranche-7 applicability decisions
        run: node --import tsx --test tests/historical-density-2025-house-applicability-tranche-7-review.test.ts

      - name: Materialize immutable tranche-7 candidate audit
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11455338397/zip > "$RUNNER_TEMP/tranche7-audit.zip"
          echo "8b66755abcc579e3832b068b72b6c050b63352f0650f4050bfd09630a12dfd84  $RUNNER_TEMP/tranche7-audit.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tranche7-audit"
          unzip -q "$RUNNER_TEMP/tranche7-audit.zip" applicability-audit/historical-density-2025-house-applicability-candidate-audit-tranche-7-v1.json -d "$RUNNER_TEMP/tranche7-audit"

      - name: Freeze reviewed tranche-7 applicability gate
        env:
          VOTEPREDICT_2025_HOUSE_TRANCHE7_APPLICABILITY_AUDIT_PATH: ${{ runner.temp }}/tranche7-audit/applicability-audit/historical-density-2025-house-applicability-candidate-audit-tranche-7-v1.json
          VOTEPREDICT_2025_HOUSE_TRANCHE7_APPLICABILITY_DECISIONS_PATH: data/evaluation/evidence-quality/historical-density-2025-house-applicability-tranche-7-decisions-v1.json
          VOTEPREDICT_2025_HOUSE_TRANCHE7_APPLICABILITY_REVIEW_OUTPUT: ${{ runner.temp }}/tranche7-review/historical-density-2025-house-applicability-tranche-7-review-v1.json
        run: node --import tsx scripts/freeze-historical-density-2025-house-applicability-tranche-7-review.ts

      - name: Verify reviewed tranche-7 boundary
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/tranche7-review/historical-density-2025-house-applicability-tranche-7-review-v1.json"
          test "$(jq -r '.schemaVersion' "$f")" = historical-density-2025-house-applicability-tranche-7-review-v1
          test "$(jq -r '.issue' "$f")" = 718
          test "$(jq -r '.session' "$f")" = 2025-2026
          test "$(jq -r '.review.candidatePairs' "$f")" = 133
          test "$(jq -r '.review.candidateBills' "$f")" = 14
          test "$(jq -r '.review.candidatePublicMembers' "$f")" = 33
          test "$(jq -r '.review.candidateSemanticGroups' "$f")" = 33
          test "$(jq -r '.review.decisions.applicable' "$f")" = 3
          test "$(jq -r '.review.decisions.ambiguous_fail_closed' "$f")" = 1
          test "$(jq -r '.review.decisions.not_applicable' "$f")" = 129
          test "$(jq -r '.review.decisions.pending_review' "$f")" = 0
          test "$(jq -r '.review.alignmentCounts.aligns' "$f")" = 3
          test "$(jq -r '.review.alignmentCounts.conflicts' "$f")" = 0
          test "$(jq -r '.review.finalPairStatusCounts.applicable' "$f")" = 3
          test "$(jq -r '.review.finalPairStatusCounts.ambiguous_fail_closed' "$f")" = 185
          test "$(jq -r '.review.finalPairStatusCounts.not_applicable' "$f")" = 962
          test "$(jq -r '.review.finalPairStatusCounts.pending_review' "$f")" = 0
          test "$(jq -r '.review.applicableRows' "$f")" = 3
          test "$(jq -r '.review.integrationReadyRows' "$f")" = 0
          test "$(jq -r '.frozenInput.targetEventKeySha256' "$f")" = 3d994198b510f648867bb0804b25ff201328c6dd0628d901ff33579b43f1378f
          test "$(jq -r '.frozenInput.reviewKeySha256' "$f")" = 7bdd75e8965ecba1025ec3c66a2b5aa60747ea9628be0f4dfa53c7d55cb7408f
          jq -e '[.review.reviewedCandidates[] | select(.decision == "applicable") | .internalMembershipIdentityResolved] | all(. == false)' "$f" >/dev/null
          jq -e '[.review.reviewedCandidates[] | select(.decision == "applicable") | .integrationReady] | all(. == false)' "$f" >/dev/null
          test "$(jq -r '.policy.outcomeUse' "$f")" = none
          test "$(jq -r '.policy.targetVoteOutcomesRead' "$f")" = false
          test "$(jq -r '.policy.productionDatabaseQueried' "$f")" = false
          test "$(jq -r '.policy.productionWrites' "$f")" = false
          test "$(jq -r '.policy.vercelUsed' "$f")" = false
          test "$(jq -r '.policy.internalMembershipIdentityResolved' "$f")" = false
          test "$(jq -r '.policy.internalIdentityRequiredBeforeFeatureIntegration' "$f")" = true
          test "$(jq -r '.policy.featureRowsWritten' "$f")" = false
          test "$(jq -r '.policy.modelFitting' "$f")" = none
          test "$(jq -r '.policy.servingChanged' "$f")" = false
          {
            echo '## 2025-26 House reviewed applicability — tranche 7'
            echo
            echo '- Candidate pairs reviewed: **133**'
            echo '- Applicable: **3**'
            echo '- Reviewed ambiguous/fail-closed: **1**'
            echo '- Reviewed not applicable: **129**'
            echo '- Full eligible-pair accounting: **3 applicable / 185 fail-closed / 962 not-applicable / 0 pending**'
            echo '- Alignment: **3 align / 0 conflict**'
            echo '- Integration-ready rows: **0** (internal identity unresolved)'
            echo '- Outcomes used: **none**'
            echo '- Production DB queried: **no**'
            echo '- Vercel used: **no**'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: historical-density-2025-house-applicability-tranche-7-review-v1
          path: ${{ runner.temp }}/tranche7-review/*
          if-no-files-found: error
          retention-days: 90
