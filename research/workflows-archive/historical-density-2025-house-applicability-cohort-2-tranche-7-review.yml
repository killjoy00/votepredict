name: Freeze reviewed 2025 House cohort 2 applicability tranche 7

on:
  pull_request:
    paths:
      - data/evaluation/evidence-quality/historical-density-2025-house-applicability-cohort-2-tranche-7-decisions-v1.json
      - scripts/freeze-historical-density-2025-house-applicability-cohort-2-tranche-7-review.ts
      - tests/historical-density-2025-house-applicability-cohort-2-tranche-7-review.test.ts
      - .github/workflows/historical-density-2025-house-applicability-cohort-2-tranche-7-review.yml
  push:
    branches: [main]
    paths:
      - data/evaluation/evidence-quality/historical-density-2025-house-applicability-cohort-2-tranche-7-decisions-v1.json
      - scripts/freeze-historical-density-2025-house-applicability-cohort-2-tranche-7-review.ts
      - tests/historical-density-2025-house-applicability-cohort-2-tranche-7-review.test.ts
      - .github/workflows/historical-density-2025-house-applicability-cohort-2-tranche-7-review.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-2025-house-applicability-cohort-2-tranche-7-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Test checked-in tranche-7 applicability decisions
        run: node --import tsx --test tests/historical-density-2025-house-applicability-cohort-2-tranche-7-review.test.ts

      - name: Materialize immutable tranche-7 candidate audit
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11569180060/zip > "$RUNNER_TEMP/tranche7-audit.zip"
          echo "1a80f0d5fabe6526a8b34e1dfc3ca01cab5236439ac02019499d0d1c82d5986d  $RUNNER_TEMP/tranche7-audit.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tranche7-audit"
          unzip -q "$RUNNER_TEMP/tranche7-audit.zip" applicability-audit/historical-density-2025-house-applicability-candidate-audit-cohort-2-tranche-7-v1.json -d "$RUNNER_TEMP/tranche7-audit"

      - name: Materialize canonical cohort-2 semantic source with frozen excerpts
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11555527900/zip > "$RUNNER_TEMP/cohort2-semantic.zip"
          echo "fbd0cc191039eb478aa25fe8d34f289b8906d5f4ac728225e183c8da37956e2b  $RUNNER_TEMP/cohort2-semantic.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cohort2-semantic"
          unzip -q "$RUNNER_TEMP/cohort2-semantic.zip" historical-density-2025-house-semantic-review-cohort-2-aggregate-v1.json -d "$RUNNER_TEMP/cohort2-semantic"
      - name: Freeze reviewed tranche-7 applicability gate
        env:
          VOTEPREDICT_2025_HOUSE_COHORT_2_TRANCHE7_SEMANTIC_AGGREGATE_PATH: ${{ runner.temp }}/cohort2-semantic/historical-density-2025-house-semantic-review-cohort-2-aggregate-v1.json
          VOTEPREDICT_2025_HOUSE_COHORT_2_TRANCHE7_APPLICABILITY_AUDIT_PATH: ${{ runner.temp }}/tranche7-audit/applicability-audit/historical-density-2025-house-applicability-candidate-audit-cohort-2-tranche-7-v1.json
          VOTEPREDICT_2025_HOUSE_COHORT_2_TRANCHE7_APPLICABILITY_DECISIONS_PATH: data/evaluation/evidence-quality/historical-density-2025-house-applicability-cohort-2-tranche-7-decisions-v1.json
          VOTEPREDICT_2025_HOUSE_COHORT_2_TRANCHE7_APPLICABILITY_REVIEW_OUTPUT: ${{ runner.temp }}/tranche7-review/historical-density-2025-house-applicability-review-cohort-2-tranche-7-v1.json
        run: node --import tsx scripts/freeze-historical-density-2025-house-applicability-cohort-2-tranche-7-review.ts

      - name: Verify reviewed tranche-7 boundary
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/tranche7-review/historical-density-2025-house-applicability-review-cohort-2-tranche-7-v1.json"
          test "$(jq -r '.schemaVersion' "$f")" = historical-density-2025-house-applicability-review-cohort-2-tranche-7-v1
          test "$(jq -r '.issue' "$f")" = 718
          test "$(jq -r '.session' "$f")" = 2025-2026
          test "$(jq -r '.review.candidatePairs' "$f")" = 169
          test "$(jq -r '.review.candidateBills' "$f")" = 17
          test "$(jq -r '.review.candidatePublicMembers' "$f")" = 39
          test "$(jq -r '.review.candidateSemanticGroups' "$f")" = 39
          test "$(jq -r '.review.decisions.applicable' "$f")" = 5
          test "$(jq -r '.review.decisions.ambiguous_fail_closed' "$f")" = 2
          test "$(jq -r '.review.decisions.not_applicable' "$f")" = 162
          test "$(jq -r '.review.decisions.pending_review' "$f")" = 0
          test "$(jq -r '.review.alignmentCounts.aligns' "$f")" = 5
          test "$(jq -r '.review.alignmentCounts.conflicts' "$f")" = 0
          test "$(jq -r '.review.finalPairStatusCounts.applicable' "$f")" = 5
          test "$(jq -r '.review.finalPairStatusCounts.ambiguous_fail_closed' "$f")" = 170
          test "$(jq -r '.review.finalPairStatusCounts.not_applicable' "$f")" = 875
          test "$(jq -r '.review.finalPairStatusCounts.pending_review' "$f")" = 0
          test "$(jq -r '.review.applicableRows' "$f")" = 5
          test "$(jq -r '.review.integrationReadyRows' "$f")" = 0
          test "$(jq -r '.frozenInput.targetTrancheIndex' "$f")" = 7
          test "$(jq -r '.frozenInput.targetEventKeySha256' "$f")" = 3d994198b510f648867bb0804b25ff201328c6dd0628d901ff33579b43f1378f
          test "$(jq -r '.frozenInput.reviewKeySha256' "$f")" = 795b2caffcc871bde906213ca2557b62a49d84def52d4ce7e2c5d112a9ef526c
          test "$(jq -r '.frozenInput.semanticAggregateArtifactId' "$f")" = 11555527900
          test "$(jq -r '.frozenInput.semanticAggregateContentProof' "$f")" = fdbcb6061ad1f8fe79db1525345627f638a450227d68c5e72890d7e82dfc4cb1
          jq -e '[.review.reviewedCandidates[] | (.immutableSemanticGroup.supportingExcerpt | type == "string" and length > 0)] | all' "$f" >/dev/null
          jq -e '[.review.reviewedCandidates[] | .versionProof.textSha256 == .frozenCandidate.versionProof.textSha256] | all' "$f" >/dev/null
          jq -e '[.review.reviewedCandidates[] | select(.decision == "applicable") | .internalMembershipIdentityResolved] | all(. == false)' "$f" >/dev/null
          jq -e '[.review.reviewedCandidates[] | select(.decision == "applicable") | .integrationReady] | all(. == false)' "$f" >/dev/null
          test "$(jq -r '.policy.outcomeUse' "$f")" = none
          test "$(jq -r '.policy.targetVoteOutcomesRead' "$f")" = false
          test "$(jq -r '.policy.productionDatabaseQueried' "$f")" = false
          test "$(jq -r '.policy.productionWrites' "$f")" = false
          test "$(jq -r '.policy.vercelUsed' "$f")" = false
          test "$(jq -r '.policy.internalMembershipIdentityResolved' "$f")" = false
          test "$(jq -r '.policy.internalIdentityRequiredBeforeFeatureIntegration' "$f")" = true
          test "$(jq -r '.policy.contextOnly' "$f")" = true
          test "$(jq -r '.policy.mechanicallyActionable' "$f")" = false
          test "$(jq -r '.policy.modelWeight' "$f")" = 0
          test "$(jq -r '.policy.featureRowsWritten' "$f")" = false
          test "$(jq -r '.policy.modelFitting' "$f")" = none
          test "$(jq -r '.policy.servingChanged' "$f")" = false
          {
            echo '## 2025-26 House reviewed applicability — tranche 7'
            echo
            echo '- Candidate pairs reviewed: **169**'
            echo '- Applicable: **5**'
            echo '- Reviewed ambiguous/fail-closed: **2**'
            echo '- Reviewed not applicable: **162**'
            echo '- Full eligible-pair accounting: **5 applicable / 170 fail-closed / 875 not-applicable / 0 pending**'
            echo '- Alignment: **5 align / 0 conflict**'
            echo '- Integration-ready rows: **0** (internal identity unresolved)'
            echo '- Outcomes used: **none**'
            echo '- Production DB queried: **no**'
            echo '- Vercel used: **no**'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: historical-density-2025-house-applicability-review-cohort-2-tranche-7-v1
          path: ${{ runner.temp }}/tranche7-review/*
          if-no-files-found: error
          retention-days: 90
