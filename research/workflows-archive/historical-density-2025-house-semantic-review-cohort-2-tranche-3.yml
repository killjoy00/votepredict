name: Freeze 2025 House cohort 2 semantic review tranche 3

on:
  pull_request:
    paths:
      - data/evaluation/evidence-quality/historical-density-2025-house-semantic-decisions-cohort-2-tranche-3-v1.json
      - scripts/freeze-historical-density-2025-house-semantic-review-cohort-2-tranche-3.ts
      - tests/historical-density-2025-house-semantic-review-cohort-2-tranche-3.test.ts
      - .github/workflows/historical-density-2025-house-semantic-review-cohort-2-tranche-3.yml
  push:
    branches: [main]
    paths:
      - data/evaluation/evidence-quality/historical-density-2025-house-semantic-decisions-cohort-2-tranche-3-v1.json
      - scripts/freeze-historical-density-2025-house-semantic-review-cohort-2-tranche-3.ts
      - tests/historical-density-2025-house-semantic-review-cohort-2-tranche-3.test.ts
      - .github/workflows/historical-density-2025-house-semantic-review-cohort-2-tranche-3.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-2025-house-semantic-review-cohort-2-tranche-3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    name: Freeze third cohort-2 House semantic tranche
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Test checked-in semantic decision gate
        run: node --import tsx --test tests/historical-density-2025-house-semantic-review-cohort-2-tranche-3.test.ts

      - name: Materialize immutable 2025 House semantic cohort 2
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11525006690/zip > "$RUNNER_TEMP/semantic-cohort-2.zip"
          echo "384e0f7856b051f621af0f9f7f55ec517068d093100d47edb12746911410d17c  $RUNNER_TEMP/semantic-cohort-2.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/semantic-cohort-2"
          unzip -q "$RUNNER_TEMP/semantic-cohort-2.zip" historical-density-2025-house-semantic-review-cohort-2-v1.json -d "$RUNNER_TEMP/semantic-cohort-2"

      - name: Freeze reviewed member-issue semantics
        env:
          VOTEPREDICT_2025_HOUSE_SEMANTIC_COHORT_2_PATH: ${{ runner.temp }}/semantic-cohort-2/historical-density-2025-house-semantic-review-cohort-2-v1.json
          VOTEPREDICT_2025_HOUSE_SEMANTIC_COHORT_2_TRANCHE_3_DECISIONS_PATH: data/evaluation/evidence-quality/historical-density-2025-house-semantic-decisions-cohort-2-tranche-3-v1.json
          VOTEPREDICT_2025_HOUSE_SEMANTIC_COHORT_2_TRANCHE_3_OUTPUT: ${{ runner.temp }}/historical-density-2025-house-semantic-review-cohort-2-tranche-3-v1.json
        run: node --import tsx scripts/freeze-historical-density-2025-house-semantic-review-cohort-2-tranche-3.ts

      - name: Verify semantic-review boundary
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/historical-density-2025-house-semantic-review-cohort-2-tranche-3-v1.json"
          test "$(jq -r '.schemaVersion' "$f")" = historical-density-2025-house-semantic-review-cohort-2-tranche-3-v1
          test "$(jq -r '.batchId' "$f")" = EQV1-HISTORICAL-DENSITY-2025-HOUSE-002-T03
          test "$(jq -r '.reviewedRows[0]' "$f")" = 21
          test "$(jq -r '.reviewedRows[1]' "$f")" = 30
          test "$(jq -r '.summary.documents' "$f")" = 10
          test "$(jq -r '.summary.directionalDocuments' "$f")" = 9
          test "$(jq -r '.summary.nonDirectionalDocuments' "$f")" = 1
          test "$(jq -r '.summary.uniqueSemanticGroups' "$f")" = 9
          test "$(jq -r '.summary.novelSemanticGroups' "$f")" = 9
          test "$(jq -r '.summary.crossBatchDuplicateSemanticGroups' "$f")" = 0
          test "$(jq -r '.summary.candidateBillIdentifiers' "$f")" = 0
          test "$(jq -r '.summary.internalMembershipIdentitiesResolved' "$f")" = 0
          jq -e '[.semanticGroups[].candidateBillIdentifiers | length] | add == 0' "$f" >/dev/null
          jq -e '[.semanticGroups[].novelForApplicabilityScreen] | all(. == true)' "$f" >/dev/null
          jq -e '[.semanticGroups[].internalMembershipIdentityResolved] | all(. == false)' "$f" >/dev/null
          test "$(jq -r '.policy.outcomeUse' "$f")" = none
          test "$(jq -r '.policy.billInference' "$f")" = false
          test "$(jq -r '.policy.targetBillApplicabilityInferred' "$f")" = false
          test "$(jq -r '.policy.internalMembershipIdentityResolved' "$f")" = false
          test "$(jq -r '.policy.contextOnly' "$f")" = true
          test "$(jq -r '.policy.mechanicallyActionable' "$f")" = false
          test "$(jq -r '.policy.modelWeight' "$f")" = 0
          test "$(jq -r '.policy.productionDatabaseQueried' "$f")" = false
          test "$(jq -r '.policy.productionWrites' "$f")" = false
          test "$(jq -r '.policy.vercelUsed' "$f")" = false
          test "$(jq -r '.policy.featureRowsWritten' "$f")" = false
          test "$(jq -r '.policy.modelFitting' "$f")" = none
          test "$(jq -r '.policy.servingChanged' "$f")" = false
          {
            echo '## 2025-26 House cohort-2 semantic review tranche 3'
            echo
            echo '- Frozen rows: **21-30**'
            echo '- Directional: **9**'
            echo '- Non-directional/fail-closed: **1**'
            echo '- Novel semantic groups: **8**'
            echo '- Candidate bill identifiers: **0**'
            echo '- Internal membership IDs resolved: **0**'
            echo '- Outcomes used: **none**'
            echo '- Production DB queried: **no**'
            echo '- Vercel used: **no**'
            echo '- Model fitting: **none**'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: historical-density-2025-house-semantic-review-cohort-2-tranche-3-v1
          path: ${{ runner.temp }}/historical-density-2025-house-semantic-review-cohort-2-tranche-3-v1.json
          if-no-files-found: error
          retention-days: 90
