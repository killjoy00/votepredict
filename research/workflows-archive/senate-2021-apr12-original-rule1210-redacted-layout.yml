name: Original April12 Senate Journal committee two-lead redacted layout forensics

# Genuine separate PDF acquisition. This is NOT named-roll certification.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2021-apr12-original-rule1210-redacted-layout.yml

permissions:
  contents: read

jobs:
  original-april12-rule1210-redacted-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Independently reacquire large official PDF and inspect name-redacted SF1159 and SF970 committee motion layout
        run: |
          node --import tsx scripts/probe-senate-2021-apr12-original-redacted-layout.ts \
            --output artifacts/apr12-2021-senate-redacted-source-layout/shape.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2021-apr12-original-rule1210-redacted-layout
          path: artifacts/apr12-2021-senate-redacted-source-layout/shape.json
          retention-days: 30
          if-no-files-found: error
