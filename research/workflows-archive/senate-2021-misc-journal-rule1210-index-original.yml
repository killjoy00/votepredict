name: One-time original 2021 Senate Journal Misc Rule12.10 index source

# PUBLIC original 2021 Senate Journal INDEX publication references only:
# no Senate floor roll claims, no private or production data.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2021-misc-journal-rule1210-index-original.yml

permissions:
  contents: read

jobs:
  inspect-actual-official-2021-senate-misc-index-original:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Fetch and verify actual official 2021 Senate Journal Miscellaneous Index
        run: |
          node --import tsx scripts/review-senate-2021-misc-journal-rule1210-original-index.ts \
            --output artifacts/2021-senate-journal-misc-rule1210/2021-misc-original-index-rule1210-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2021-journal-misc-original-rule1210-index-probe
          path: artifacts/2021-senate-journal-misc-rule1210/2021-misc-original-index-rule1210-probe.json
          retention-days: 30
          if-no-files-found: error
