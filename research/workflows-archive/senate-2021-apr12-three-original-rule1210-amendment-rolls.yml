name: Original 2021 April12 Senate Journal three distinct committee amendment vote SHA probe

# First-pass member-side commitments only. Not independently certified originals yet.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2021-apr12-three-original-rule1210-amendment-rolls.yml

permissions:
  contents: read

jobs:
  original-2021-april12-three-distinct-committee-amendment-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Fetch original 11MB April12 PDF and derive provisional SHA-only sides for three distinct committee amendments
        run: |
          node --import tsx scripts/probe-senate-2021-apr12-original-three-committee-amendment-rolls.ts \
            --output artifacts/2021-apr12-three-committee-original-amendments/provisional.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2021-apr12-three-committee-rule1210-provisional-shas
          path: artifacts/2021-apr12-three-committee-original-amendments/provisional.json
          retention-days: 30
          if-no-files-found: error
