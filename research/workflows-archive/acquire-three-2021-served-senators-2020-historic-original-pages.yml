name: Recover original 2020 campaigns for three actual 2021 Minnesota Senate-serving people

# One-shot verified public historical pages, not 2026 live website stances.
# No secrets, DB, model, forecast, scheduler or public office contact.
on:
  pull_request:
    paths:
      - .github/workflows/acquire-three-2021-served-senators-2020-historic-original-pages.yml
      - data/evaluation/senate-three-former-serving-2020-original-campaign-domain-targets-v1.json
      - scripts/acquire-three-2021-served-senator-2020-original-campaign-pages.ts
      - scripts/run-three-actual-2021-senators-2020-original-campaign-sites.ts
      - tests/senate-three-actual-2021-servers-2020-original-campaign-site-acquisition.test.ts
      - docs/SENATE_THREE_TRUE_2021_SENATORS_2020_ORIGINAL_CANDIDATE_SITE_ARCHIVES.md
permissions:
  contents: read
  actions: read
jobs:
  original-2020-campaigns-three-2021-actual-senators:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict' &&
      github.event.pull_request.head.ref == 'audit/864-three-2021-served-senators-genuine-2020-campaign-originals-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Obtain original authenticated official Minnesota Senate service directory and UTC/SHA receipt
        uses: actions/download-artifact@v4
        with:
          run-id: 38094976711
          name: senate-2021-25-ever-served-only-source-coverage-v2
          github-token: ${{ github.token }}
          path: originals/official-senate-directory
      - name: Rehash entire ACTUAL served-senator LRL original before three historical 2020 candidate original domain queries
        shell: bash
        timeout-minutes: 13
        run: |
          set -euo pipefail
          original="$(find originals/official-senate-directory -type f -name mn-lrl-official-senate-service-directory.html -print -quit)"
          receipt="$(find originals/official-senate-directory -type f -name mn-lrl-official-senate-service-directory-audit.json -print -quit)"
          test -n "$original" && test -n "$receipt"
          test "$(dirname "$original")" = "$(dirname "$receipt")"
          node --import tsx scripts/run-three-actual-2021-senators-2020-original-campaign-sites.ts \
            --lrl-directory-html "$original" \
            --lrl-original-source-receipt "$receipt" \
            --output-dir originals/three-actual-2021-senators-2020-original-campaigns
      - name: Retain dated original archive requests, genuine CDX source indices and hash-reconciled HTML originals
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: senate-three-2021-served-2020-original-candidate-HTML-and-CDX-v1
          path: originals/three-actual-2021-senators-2020-original-campaigns/
          if-no-files-found: warn
          retention-days: 30
