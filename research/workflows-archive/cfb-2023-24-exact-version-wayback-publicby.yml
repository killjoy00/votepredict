name: Archive CFB 2023-24 exact original PDF version public-by checks
on:
  pull_request:
    paths:
      - .github/workflows/cfb-2023-24-exact-version-wayback-publicby.yml
      - src/evidence/cfb-2023-24-archived-pdf-publicby-proof.ts
      - scripts/audit-cfb-2023-24-exact-archived-publication.ts
      - tests/cfb-2023-24-archived-pdf-publicby-proof.test.ts
      - docs/evaluation/source-proof/cfb-2023-24-exact-original-pdf-archive-publicby*.json
      - docs/evaluation/cfb-2023-24-exact-original-pdf-version-archive-publicby-research.md
permissions:
  contents: read
jobs:
  four-original-CFB-report-version-archival-source-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: node --import tsx --test tests/cfb-2023-24-archived-pdf-publicby-proof.test.ts
      - run: node --import tsx scripts/audit-cfb-2023-24-exact-archived-publication.ts --output artifacts/cfb-2023-24-exact-pdf-archive-publicby-source-pilot.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archival-original-CFB-PDF-exact-sha-4-source-probes
          path: artifacts/cfb-2023-24-exact-pdf-archive-publicby-source-pilot.json
          if-no-files-found: warn
          retention-days: 30
