name: One-time verify second Apr 8 2025 Elections original 10-0-1 motion

# SOURCE-ONLY. Trigger exactly once on merge of this previously absent workflow
# to main; do not write original PDFs or named individual vote sides to Git.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2025-elections-apr08-other-10-0-1-source.yml

permissions:
  contents: read

jobs:
  verify-second-apr08-ten-zero-one:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Reverify original PDF SHA and separate its two 10-0-1 results
        run: |
          node --import tsx scripts/review-senate-2025-elections-apr08-second-ten-zero-one-original.ts \
            --output artifacts/apr08-second-ten-zero-one/senate-2025-apr08-original-second-10-0-1-source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2025-apr08-original-second-ten-zero-one
          path: artifacts/apr08-second-ten-zero-one/senate-2025-apr08-original-second-10-0-1-source.json
          retention-days: 30
          if-no-files-found: error
