name: MN SOS original 2020 and 2022 candidate results and filed website form POST verification
on:
  pull_request:
    paths:
      - scripts/probe-senate-864-sos-aspnet-postback-and-historic-results.mjs
      - .github/workflows/senate-864-sos-original-results-page-postback-audit.yml
permissions:
  contents: read
  actions: read
jobs:
  original-official-senate-candidate-file-transport-and-archives:
    if: >-
      github.repository == 'killjoy00/votepredict' &&
      github.event.pull_request.head.repo.full_name == 'killjoy00/votepredict' &&
      github.event.pull_request.head.ref == 'research/864-historical-sos-candidate-website-originals-20261012'
    name: SOS original federal-state-county filing export transport and verified historic Senate results — ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2020, 2022]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify source syntax without remote calls
        run: node --check scripts/probe-senate-864-sos-aspnet-postback-and-historic-results.mjs
      - run: npm ci --no-fund --no-audit
      - name: Acquire independently pinned original Secretary of State election tables, not filing export
        uses: actions/download-artifact@v4
        with:
          run-id: 38089571113
          name: senate-2020-22-public-candidate-original-source-acquisition
          github-token: ${{ github.token }}
          path: proof/sos
      - name: Recover same-row historical original official candidate website as separate original proof only
        shell: bash
        run: |
          set -euo pipefail
          sos2020="$(find proof/sos -type f -name 2020-sos-general-stsenate.response -print -quit)"
          test -n "$sos2020"
          node --import tsx scripts/probe-senate-864-sos-aspnet-postback-and-historic-results.mjs \
            --year "${{ matrix.year }}" \
            --sos-original-dir "$(dirname "$sos2020")" \
            --out-dir research/sanitized
      - name: Save only public candidate name, district, website, sanitized index hashes; never full addresses, phone, email, cookie or viewstate
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: senate-864-sos-original-websites-postback-results-${{ matrix.year }}-sanitized-v1
          path: research/sanitized/
          if-no-files-found: warn
          retention-days: 30
