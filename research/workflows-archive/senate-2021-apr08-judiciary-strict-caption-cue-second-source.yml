name: 2021 Apr 8 Judiciary strict second original caption and Pappas review cues

# SHA-pinned exact second genuine acquisition of 436144B original LRL auto caption
# with anonymous digest/timecode-only result; exactly two optional first-pass retries.
# NO original speech or individual vote-side extraction, no database, no forecasts.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2021-apr08-judiciary-strict-caption-cue-second-source.yml

permissions:
  contents: read

jobs:
  second-original-apr08-judiciary-caption-and-two-media-cue-retries:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Independently re-acquire SHA-pinned Judiciary captions and try two missing public captions once
        run: |
          node --import tsx scripts/probe-senate-2021-apr08-second-original-caption-cues.ts \
            --output artifacts/2021-apr08-judiciary-strict-original-caption-review/source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2021-apr08-judiciary-strict-original-caption-review-metadata
          path: artifacts/2021-apr08-judiciary-strict-original-caption-review/source.json
          retention-days: 30
          if-no-files-found: error
