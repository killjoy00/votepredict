name: One-time original SF910 committee PDF redacted structure diagnostics

# This source-shape probe DOES NOT certify the historical named roll.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2021-rule1210-sf910-original-redacted-forensics.yml

permissions:
  contents: read

jobs:
  original-sf910-redacted-source-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Fetch original official PDF and redact all senator identity tokens in source shape trace
        run: |
          node --import tsx scripts/probe-senate-2021-rule1210-sf910-original-structure.ts \
            --output artifacts/2021-senate-sf910-original-redacted-trace/shape.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2021-sf910-original-redacted-structure-probe
          path: artifacts/2021-senate-sf910-original-redacted-trace/shape.json
          retention-days: 30
          if-no-files-found: error
