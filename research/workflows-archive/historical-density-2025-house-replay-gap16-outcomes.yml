name: Freeze 2025 House replay gap outcomes

on:
  pull_request:
    paths:
      - scripts/freeze-historical-density-2025-house-replay-gap16-outcomes.ts
      - .github/workflows/historical-density-2025-house-replay-gap16-outcomes.yml
  push:
    branches: [main]
    paths:
      - scripts/freeze-historical-density-2025-house-replay-gap16-outcomes.ts
      - .github/workflows/historical-density-2025-house-replay-gap16-outcomes.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-density-2025-house-replay-gap16-outcomes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit

      - name: Materialize canonical gap16 member-vote reconstruction
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/11482176035/zip > "$RUNNER_TEMP/member-votes.zip"
          echo "d87fe9e1d51ae9bacebe94e3c1b065675db42da011a72273cbb74a9e5d52e450  $RUNNER_TEMP/member-votes.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/member-votes"
          unzip -q "$RUNNER_TEMP/member-votes.zip"             historical-density-2025-house-replay-gap16-member-votes-v1.json             -d "$RUNNER_TEMP/member-votes"

      - name: Recover explicit House Journal outcomes
        env:
          VOTEPREDICT_GAP16_MEMBER_VOTES_PATH: ${{ runner.temp }}/member-votes/historical-density-2025-house-replay-gap16-member-votes-v1.json
          VOTEPREDICT_GAP16_OUTCOMES_OUTPUT: ${{ runner.temp }}/outcomes/historical-density-2025-house-replay-gap16-outcomes-v1.json
        run: node --import tsx scripts/freeze-historical-density-2025-house-replay-gap16-outcomes.ts

      - name: Verify outcome boundary
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/outcomes/historical-density-2025-house-replay-gap16-outcomes-v1.json"

          test "$(jq -r '.schemaVersion' "$f")" = historical-density-2025-house-replay-gap16-outcomes-v1
          test "$(jq -r '.issue' "$f")" = 718
          test "$(jq -r '.session' "$f")" = 2025-2026
          test "$(jq -r '.chamber' "$f")" = house
          test "$(jq -r '.frozenInput.memberVotes.runId' "$f")" = 37620464346
          test "$(jq -r '.frozenInput.memberVotes.artifactId' "$f")" = 11482176035
          test "$(jq -r '.frozenInput.memberVotes.events' "$f")" = 16
          test "$(jq -r '.frozenInput.memberVotes.memberVotes' "$f")" = 2125
          test "$(jq -r '.frozenInput.memberVotes.memberships' "$f")" = 137

          test "$(jq -r '.journalSource.sessionMatched' "$f")" = true
          test "$(jq -r '.journalSource.indexLinksDiscovered' "$f")" = 78
          test "$(jq -r '.journalSource.exactDateJournalPagesFetched' "$f")" = 14
          test "$(jq -r '.journalSource.sourceProofSha256' "$f")" = e1a0abcc2970e7888021946dbe915aebf27077dafc4dfc7249b023339aad92d0
          test "$(jq -r '.outcomeRecovery.events' "$f")" = 16
          test "$(jq -r '.outcomeRecovery.recovered' "$f")" = 15
          test "$(jq -r '.outcomeRecovery.unresolved' "$f")" = 1
          test "$(jq -r '.outcomeRecovery.passed' "$f")" = 15
          test "$(jq -r '.outcomeRecovery.failed' "$f")" = 0
          test "$(jq -r '.outcomeRecovery.outcomeProofSha256' "$f")" = b7490e53daeff266d8c5d450ee428c018b1070dcf0e4ca8b91234b24bbb616db
          test "$(jq -r '[.outcomeRecovery.eventsData[] | select(.status == "unresolved")][0].compositeKey' "$f")" = 'HF2354|2026-05-17'
          test "$(jq -r '[.outcomeRecovery.eventsData[] | select(.status == "unresolved")][0].unresolvedReason' "$f")" = no_exact_bill_tally_result_match
          jq -e '[.outcomeRecovery.eventsData[] | select(.status == "recovered") | (.passed == true or .passed == false)] | all' "$f" >/dev/null
          jq -e '[.outcomeRecovery.eventsData[] | select(.status == "unresolved") | .passed == null] | all' "$f" >/dev/null
          jq -e '[.outcomeRecovery.eventsData[] | select(.status == "recovered") | (.sourceUrl | startswith("https://www.house.mn.gov/cco/journals/2025-26/J"))] | all' "$f" >/dev/null
          jq -e '[.outcomeRecovery.eventsData[] | select(.status == "recovered") | (.contentSha256 | test("^[a-f0-9]{64}$"))] | all' "$f" >/dev/null

          test "$(jq -r '.policy.productionDatabaseQueried' "$f")" = false
          test "$(jq -r '.policy.productionWrites' "$f")" = false
          test "$(jq -r '.policy.vercelUsed' "$f")" = false
          test "$(jq -r '.policy.candidateSelectionFrozenBeforeOutcomeRead' "$f")" = true
          test "$(jq -r '.policy.identityMapFrozenBeforeOutcomeRead' "$f")" = true
          test "$(jq -r '.policy.memberVoteRowsFrozenBeforeOutcomeRead' "$f")" = true
          test "$(jq -r '.policy.passFailOutcomeRead' "$f")" = true
          test "$(jq -r '.policy.outcomeSource' "$f")" = official_minnesota_house_journal_explicit_result_text
          test "$(jq -r '.policy.outcomeUse' "$f")" = replay_extension_reconstruction_only
          test "$(jq -r '.policy.tallyInferenceAllowed' "$f")" = false
          test "$(jq -r '.policy.targetSelectionUsesOutcomes' "$f")" = false
          test "$(jq -r '.policy.semanticDecisionsUseOutcomes' "$f")" = false
          test "$(jq -r '.policy.featureRowsWritten' "$f")" = false
          test "$(jq -r '.policy.modelFitting' "$f")" = none
          test "$(jq -r '.policy.servingChanged' "$f")" = false

          {
            echo '## 2025-26 House replay-gap explicit outcomes'
            echo
            echo '- Frozen events: **16**'
            echo '- House Journal outcomes recovered: **15 / 16**'
            echo '- Unresolved: **1 — HF2354 on 2026-05-17**'
            echo '- Explicit passes: **15**'
            echo '- Explicit failures: **0**'
            echo '- Exact-date Journal pages fetched: **14**'
            echo '- Journal source proof SHA: `e1a0abcc2970e7888021946dbe915aebf27077dafc4dfc7249b023339aad92d0`'
            echo '- Outcome proof SHA: `b7490e53daeff266d8c5d450ee428c018b1070dcf0e4ca8b91234b24bbb616db`'
            echo '- Tally inference allowed: **no**'
            echo '- Production DB queried: **no**'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: historical-density-2025-house-replay-gap16-outcomes-v1
          path: ${{ runner.temp }}/outcomes/*
          if-no-files-found: error
          retention-days: 90
