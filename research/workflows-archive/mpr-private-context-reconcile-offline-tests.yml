name: MPR private reconciliation synthetic offline regression

on:
  pull_request:
    paths:
      - .github/workflows/mpr-private-context-reconcile-offline-tests.yml
      - scripts/reconcile-mpr-interviews-private-context.mjs
      - tests/reconcile-mpr-interviews-private-context.test.mjs
      - docs/evaluation/senate-media-mpr-six-interviews-public-reconciliation-20261011.json

permissions:
  contents: read

jobs:
  synthetic-private-shape-only:
    if: github.repository == 'killjoy00/votepredict'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: No network, no DB, synthetic only
        run: node --test tests/reconcile-mpr-interviews-private-context.test.mjs
