name: Third original SF910 Rule12.10 committee PDF authentication (reversed header repair)

# Prior genuine #38168065141 / #38168488738 failures remain failures.
# On-merge third-run workflow at commit 10b5d715 had no recorded push Actions run.
# This separate source invocation is deliberately triggered through a path-changing PR;
# it must receive its own genuine Actions run/artifact and may still fail. No success assumed.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2021-rule1210-sf910-original-retry-reversed-header.yml

permissions:
  contents: read

jobs:
  original-sf910-committee-verify-third-run:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Reacquire actual March8 journal and strictly certify exact SF910 committee roll
        run: |
          node --import tsx scripts/review-senate-2021-rule1210-sf910-original-journal-committee.ts \
            --output artifacts/sf910-original-reversed-header-third-run/source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2021-sf910-original-reversed-header-third-run
          path: artifacts/sf910-original-reversed-header-third-run/source.json
          retention-days: 30
          if-no-files-found: error
