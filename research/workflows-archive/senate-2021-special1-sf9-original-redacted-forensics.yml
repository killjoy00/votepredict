name: One-time original special session SF9 divided amendment redacted structure diagnostics

# Source-shape forensic only. NEVER count as a verified named-roll vote.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/senate-2021-special1-sf9-original-redacted-forensics.yml

permissions:
  contents: read

jobs:
  original-special-sf9-redacted-source-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Acquire official First Special Session PDF and only emit redacted passage structure
        run: |
          node --import tsx scripts/probe-senate-2021-special1-sf9-original-structure.ts \
            --output artifacts/2021-senate-special-sf9-redacted/shape.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senate-2021-special1-sf9-original-redacted-structure-probe
          path: artifacts/2021-senate-special-sf9-redacted/shape.json
          retention-days: 30
          if-no-files-found: error
